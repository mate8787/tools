<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>판매량 추출기</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #000; --card: #0d0f13; --text: #e8ebf1; --muted: #98a0b2;
    --line: #2a2f3a; --accent: #5b8cff; --accent-text: #0e1220; --head: #171b23;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px 16px; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
  main { max-width: 900px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 12px; }
  .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
  @media (max-width: 560px) { .tabs { grid-template-columns: 1fr; } }
  /* button = the picture (full, uncropped, same 3.6:1 shape as the files) + a label strip underneath */
  .tab { display: flex; flex-direction: column; width: 100%; padding: 0; overflow: hidden;
         border: 3px solid transparent; border-radius: 12px; background: #12151c;
         transition: border-color .15s, box-shadow .15s; }
  .tab .pic { flex: none; width: 100%; aspect-ratio: 3.6 / 1; background-size: 100% 100%; background-repeat: no-repeat;
              filter: grayscale(.6) brightness(.65); transition: filter .15s; }
  .tab:hover .pic { filter: grayscale(.2) brightness(.9); }
  .tab.active { border-color: var(--accent); box-shadow: 0 4px 16px rgba(0, 0, 0, .3); }
  .tab.active .pic { filter: none; }
  /* the pictures in img/ are the same 3.6:1 shape as the buttons */
  .tab[data-mode="row"] .pic { background-image: url(img/base-game.png); }
  /* the DLC picture has transparent edges: white behind it so they don't show as black bars */
  .tab[data-mode="col"] .pic { background-image: url(img/dlc.png); background-color: #fff; }
  /* label: a full-width strip under the picture with a horizontal gradient and a glowing line on top */
  .tab .tag { position: relative; display: block; padding: 5px 0 6px; text-align: center;
              font-size: 17px; font-weight: 800; letter-spacing: .1em; line-height: 1.3; color: #fff;
              background: linear-gradient(90deg, #12151c 0%, #2c3447 50%, #12151c 100%); }
  .tab .tag::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 2px;
                      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .8), transparent); }
  .tab.active .tag { background: linear-gradient(90deg, #14307a 0%, #3c69eb 50%, #14307a 100%); }
  .tab.active .tag::before { background: linear-gradient(90deg, transparent, #fff, transparent); }
  p.hint { margin: 0 0 14px; color: var(--muted); }
  textarea { width: 100%; height: 170px; padding: 10px; border: 1px solid var(--line);
             border-radius: 8px; background: var(--card); color: var(--text);
             font: 13px/1.4 ui-monospace, Consolas, monospace; resize: vertical; }
  .row { display: flex; gap: 8px; margin: 10px 0 18px; }
  button { padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line);
           background: var(--card); color: var(--text); font: inherit; cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  button[hidden] { display: none; }
  .wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--line); }
  th, td { padding: 8px 12px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  th { font-size: 13px; background: var(--head); font-weight: 700; }
  tr:last-child td { border-bottom: 0; }
  td.zero { color: var(--muted); }
  td.gap { background: rgba(192, 57, 43, .12); }
  td.tot, th.tot { border-left: 2px solid var(--line); color: var(--muted); }
  th button.col { padding: 3px 9px; font-size: 12px; font-weight: 700; background: var(--accent);
                  color: var(--accent-text); border-color: var(--accent); border-radius: 6px; }
  .msg { margin-top: 10px; color: var(--muted); font-size: 13px; }
  .msg.warn { color: #c0392b; }
</style>
</head>
<body>
<main>
  <h1>판매량 추출기</h1>
  <div class="tabs">
    <button class="tab" data-mode="row" aria-label="본편 (Crimson Desert Enhanced)"><span class="pic"></span><span class="tag">본편</span></button>
    <button class="tab" data-mode="col" aria-label="DLC (Charting the Unknown)"><span class="pic"></span><span class="tag">DLC</span></button>
  </div>
  <p class="hint" id="hint"></p>

  <textarea id="input" placeholder="여기에 Slack 텍스트를 붙여넣으세요…" spellcheck="false"></textarea>
  <div class="row">
    <button class="primary" id="copy">합계 복사 (STEAM → APPLE)</button>
    <button class="primary" id="copygap" hidden>빈 열 포함 복사 (공백 무시용)</button>
    <button id="clear">지우기</button>
  </div>

  <div class="wrap" id="out"></div>
  <div class="msg" id="msg"></div>
</main>

<script>
const PLATFORMS = ['STEAM', 'PS', 'XBOX', 'EPIC', 'APPLE'];
const num = s => parseInt(s.replace(/,/g, '').replace(/^\+/, ''), 10);

/* PARSE-START */
// One block of text -> { STEAM: {today, prev, cum}, PS: {...}, ... }
//   today = first number in the bracket after 판매량
//   prev  = number in the bracket after 전일 판매량
function parsePlatforms(text) {
  // Split on "-NAME:" so it still works if two lines got glued together.
  const parts = text.split(/-\s*(STEAM|PS|XBOX|EPIC|APPLE)\s*:/);
  const found = {};
  for (let i = 1; i < parts.length; i += 2) {
    // 판매량: 193개(+9개, 전일 판매량: 308개(0개))
    const m = parts[i + 1].match(/판매량:\s*[\d,]+개\(\s*([+-]?[\d,]+)개\s*,\s*전일\s*판매량:\s*[\d,]+개\(\s*([+-]?[\d,]+)개\s*\)/);
    if (m) found[parts[i]] = { today: num(m[1]), prev: num(m[2]) };
  }
  return found;
}

// Whole paste -> [{ label, platforms }] — one entry per "[date ... N시 기준]" header.
function parseBatches(text) {
  const heads = [...text.matchAll(/\[(\d{4})-(\d{2})-(\d{2})[^\]]*?(\d{1,2})시\s*기준\]/g)];
  if (!heads.length) return [{ label: '—', platforms: parsePlatforms(text) }];
  return heads.map((h, i) => {
    const end = i + 1 < heads.length ? heads[i + 1].index : text.length;
    return {
      label: `${+h[2]}/${+h[3]} ${h[4]}시`,
      platforms: parsePlatforms(text.slice(h.index + h[0].length, end)),
    };
  });
}
/* PARSE-END */

const $ = id => document.getElementById(id);
const fmt = n => n.toLocaleString('en-US');

// Same numbers on both tabs; only the copy pattern differs.
// mode 'row' = Base Game (platform columns side by side -> one line per block)
// mode 'col' = DLC (formula columns in between -> one copy button per platform column)
let mode = 'row';
try { mode = localStorage.getItem('sales-extractor-tab') === 'col' ? 'col' : 'row'; } catch {}

const DLC_SKIP = ['APPLE'];   // platforms left out of the DLC tab for now (remove from this list to bring back)
let shown = PLATFORMS;         // platforms shown on the current tab

let rowsSums = [];  // one array of sums per batch
let cols = [];      // one array of sums per platform

const HINTS = {
  row: '본편: 각 "N시 기준" 블록마다, 플랫폼별로 판매량 뒤 괄호의 첫 번째 숫자와 전일 판매량 뒤 괄호의 숫자를 더합니다. 복사하면 블록당 한 줄(STEAM → APPLE)이 복사됩니다.',
  col: 'DLC: 숫자는 본편과 같고 복사 방식만 다릅니다. 시트의 플랫폼 열 사이에 증감 수식 열이 있으므로, 플랫폼마다 복사 버튼이 있어 해당 열만 복사됩니다 — 수식 열은 건드리지 않습니다.',
};

function render() {
  const text = $('input').value;
  const batches = text.trim() ? parseBatches(text).filter(b => Object.keys(b.platforms).length) : [];
  const warnings = [];
  rowsSums = [];
  shown = mode === 'col' ? PLATFORMS.filter(p => !DLC_SKIP.includes(p)) : PLATFORMS;
  cols = shown.map(() => []);
  let body = '';

  for (const b of batches) {
    const sums = [];
    let total = 0;
    let cells = '';
    shown.forEach((p, i) => {
      const f = b.platforms[p];
      const v = f ? f.today + f.prev : undefined;
      if (v === undefined) {
        sums.push('');
        cols[i].push('');
        cells += '<td class="gap">?</td>';
        warnings.push(`${b.label}: ${p} 없음`);
        return;
      }
      sums.push(v);
      cols[i].push(v);
      total += v;
      cells += `<td class="${v === 0 ? 'zero' : ''}" title="${f.today} + ${f.prev}">${v === 0 ? '-' : fmt(v)}</td>`;
    });
    rowsSums.push(sums);
    body += `<tr><td>${b.label}</td>${cells}<td class="tot">${fmt(total)}</td></tr>`;
  }

  const head = '<th></th>' + shown.map((p, i) =>
    mode === 'col' ? `<th><button class="col" data-col="${i}">${p} 복사</button></th>` : `<th>${p}</th>`).join('')
    + '<th class="tot">합계</th>';
  $('out').innerHTML = body ? `<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>` : '';

  const msg = $('msg');
  if (text.trim() && !body) { msg.className = 'msg warn'; msg.textContent = '붙여넣은 텍스트에서 플랫폼 데이터를 찾지 못했습니다.'; }
  else if (warnings.length) { msg.className = 'msg warn'; msg.textContent = '찾지 못함 — ' + warnings.join(' · '); }
  else { msg.className = 'msg'; msg.textContent = ''; }
}

function setMode(m) {
  mode = m;
  try { localStorage.setItem('sales-extractor-tab', m); } catch {}
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.mode === m));
  $('hint').textContent = HINTS[m];
  $('copy').hidden = m === 'col';
  $('copygap').hidden = m !== 'col';
  render();
}

function legacyCopy(text) {
  // Works where navigator.clipboard is blocked (e.g. some file:// setups).
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
  document.body.appendChild(ta);
  ta.focus(); ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch {}
  document.body.removeChild(ta);
  return ok;
}

async function copyText(text, okMessage) {
  const msg = $('msg');
  // Synchronous copy first (runs inside the click, works in every browser and in embedded
  // previews); the async clipboard API is only the fallback — it can "succeed" without copying.
  let ok = legacyCopy(text);
  if (!ok) { try { await navigator.clipboard.writeText(text); ok = true; } catch {} }
  msg.className = ok ? 'msg' : 'msg warn';
  msg.textContent = ok ? okMessage : '브라우저에서 복사가 차단되었습니다. 표를 직접 선택해서 복사하세요.';
}

document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => setMode(t.dataset.mode)));
$('input').addEventListener('input', render);
$('clear').addEventListener('click', () => { $('input').value = ''; render(); $('input').focus(); });

const NOTHING = '복사할 내용이 없습니다 — 먼저 Slack 텍스트를 붙여넣으세요.';

// Base Game: one line per block, sums only, in sheet order STEAM, PS, XBOX, EPIC, APPLE.
$('copy').addEventListener('click', () => {
  if (!rowsSums.length) { $('msg').className = 'msg warn'; $('msg').textContent = NOTHING; return; }
  const n = rowsSums.length;
  copyText(rowsSums.map(l => l.join('\t')).join('\n'), `${n}줄을 복사했습니다 — 첫 행의 STEAM 셀에 붙여넣으세요.`);
});

// DLC, whole lines: value, empty gap column, value, empty gap column, ... — paste into a spare area of the
// sheet, copy that range, then Paste Special -> Skip blanks onto the real rows so formulas stay untouched.
$('copygap').addEventListener('click', () => {
  if (!rowsSums.length) { $('msg').className = 'msg warn'; $('msg').textContent = NOTHING; return; }
  const n = rowsSums.length;
  copyText(rowsSums.map(l => l.join('\t\t')).join('\n'),
    `${n}줄을 빈 열과 함께 복사했습니다 — 여유 공간에 붙여넣고, 그 범위를 다시 복사한 뒤 STEAM 셀에서 선택하여 붙여넣기(Ctrl+Alt+V) → '공백 무시'를 체크하세요.`);
});

// DLC: copy one platform's column (one value per line, top to bottom).
$('out').addEventListener('click', e => {
  const b = e.target.closest('button[data-col]');
  if (!b) return;
  const i = +b.dataset.col;
  const n = cols[i].length;
  copyText(cols[i].join('\n'), `${shown[i]} ${n}개 값을 복사했습니다 — ${shown[i]} 열의 첫 셀에 붙여넣으세요.`);
});

setMode(mode);
</script>
</body>
</html>
