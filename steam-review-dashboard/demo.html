lleno de cosas por descubrir.\n- **El combate y la progresión.** La cantidad de habilidades y posibilidades hace que jugar sea dinámico y divertido.\n- **El apartado gráfico.** Es uno de los juegos más impresionantes visualmente que he jugado.\n\n### Lo peor\n\n- **La repetición de actividades.** Puede hacer que algunas partes de la aventura se sientan menos frescas.\n- **La historia y los personajes secundarios.** Kliff destaca muchísimo, pero los otros dos protagonistas no están a su altura.\n\n## 🏁 7. Veredicto final\n\nCrimson Desert es un juego inmenso que destaca, por encima de todo, por la libertad que ofrece. Su mundo abierto es espectacular, la exploración es una auténtica maravilla y cuenta con un sistema de combate y progresión que te permite experimentar constantemente.\n\nNo es perfecto. La repetición de actividades y una historia que, sin estar mal, no llega al nivel de su mundo y su jugabilidad hacen que no destaque por igual en todos sus apartados. Sin embargo, lo que consigue hacer bien lo hace a un nivel altísimo.\n\nEs un juego que recomendaría especialmente a quienes buscan acción, progresión y un mundo abierto en el que perderse durante decenas de horas. Si lo que buscas es una historia que te mantenga constantemente enganchado, quizá no sea su punto más fuerte. Pero si disfrutas explorando, descubriendo cosas y decidiendo por tu cuenta qué hacer, Crimson Desert tiene muchísimo que ofrecer.\n\n**¿Lo volvería a jugar?** Sí.\n\n**¿Lo recomendaría?** Sí.\n\n**¿Me ha dejado huella?** En parte.\n\n### Nota final: 8/10","c":1791667477,"u":1,"b":1,"r":0},{"i":"237409248","s":"76561199059611834","g":0,"n":32,"p":11181,"f":11593,"l":"turkish","t":"[h2] Ayıya kadar herşey normaldi[/h2] ama sonrasında beynim yandı. Neden, niçin ve hangi sebeple olduğunu anlamadan gördüğüm her canlıyı nedensizce katlettim.Daha önce hikayesini anlamadan oynadığım oyun varmı hatırlamıyorum Müge anlı gelsin çözsün ama yinede bu kereta beni çekti. Harita hala yan görevlerle dolu çünkü bitmiyor denedim hemde defalarca ama biraz gezeyim diyorum hoop birden ikon ve yeni yan görev....200 saati devirecez gibi görünüyor Assassin's den kalma alışkanlık haritada görev kalırsa fıttırırım.Neyse toparlamak gerekirse alınır oynanır ama kendinide yırtsan hikaye bir süre sonra kaçıyor akışa bırakarak oynarsan sıkılmazsın baktın sıkıldın mı bin atına gir bi meydana otur yoldan geçen NPC leri seyret ya da bi dağdan manzarayı seyret keyfine kalmış. [u] Kendine has bir dünya kurmuş Pearl ı hem bu dünya içi çeşitliliğinden hem de Türkçe dil desteğinden dolayı tebrik ederim.[/u]\n\nBirde DLC duyrulmuş takipteyim ama umarım biraz duygu, hikaye, ve sonuç eklerler.","c":1791667245,"u":1,"b":1,"r":0},{"i":"237407719","s":"76561198973524886","g":0,"n":4,"p":7865,"f":8497,"l":"english","t":"good game\r\n","c":1791666020,"u":1,"b":1,"r":0},{"i":"237407192","s":"76561198132591402","g":568,"n":31,"p":4335,"f":4335,"l":"english","t":"good","c":1791665578,"u":1,"b":1,"r":0},{"i":"237405931","s":"76561199012851114","g":59,"n":3,"p":15360,"f":15631,"l":"schinese","t":"好玩，开放世界答案","c":1791664514,"u":1,"b":0,"r":0},{"i":"237404942","s":"76561198728876095","g":21,"n":1,"p":7610,"f":7778,"l":"schinese","t":"非常牛逼呀，dlc也是拿下了好吧，很期待呢","c":1791663711,"u":1,"b":0,"r":1},{"i":"237404532","s":"76561198039754941","g":512,"n":30,"p":1465,"f":1743,"l":"polish","t":"♥♥♥♥♥ to jest jedna z najlepszych gier w jakie grałem w życiu","c":1791663430,"u":1,"b":0,"r":0},{"i":"237404521","s":"76561198025333946","g":0,"n":8,"p":9377,"f":10151,"l":"english","t":"I know this game isn't for everyone. Some people find the game play clunky. I will just say that I've got 156 hours into it and feel like I've just scratched the surface. So many things to do, and if you like RPGs like skyrim where you can go deep into rabbit holes, this game has that in spades. Very fun, I would wholeheartedly recommend this game.","c":1791663421,"u":1,"b":1,"r":0},{"i":"237402938","s":"76561198297277548","g":0,"n":4,"p":160,"f":160,"l":"english","t":"Buggy and super slow. Not good combat. Not good controls.","c":1791662171,"u":0,"b":1,"r":0},{"i":"237402057","s":"76561198073340335","g":191,"n":6,"p":12844,"f":12844,"l":"english","t":"If you are on the fence about picking up Crimson Desert, stop hesitating and just get it. This is quite literally the exact game I always dreamed of playing when I was a kid because it has pretty much everything you could ever want packed into one place. The main story is honestly a little lackluster and won't win any writing awards, but you will completely forget about that the second you start playing. The actual gameplay is nothing short of amazing, with a combat system that feels incredibly fluid, brutal, and satisfying every single time you jump into a fight.\n\nPearl Abyss really outdid themselves with this one, especially with how they have handled things after launch. Dropping massive content updates and releasing a full new expansion so close to when the game first came out is wild, and it shows how much they care about keeping the world alive. It has easily earned my spot as Game of the Year. If you love massive open worlds where you can just get lost doing a million different things, I cannot recommend this enough.","c":1791661463,"u":1,"b":1,"r":0},{"i":"237400306","s":"76561198129167961","g":1169,"n":60,"p":2502,"f":2502,"l":"czech","t":"[h1] Crimson Desert Enhanced [/h1]\nhttps://steamcommunity.com/sharedfiles/filedetails/?id=3817301835\n[h1]V tomhle pekle nedostaneš nic zadarmo[/h1]\n\nUž dávno jsem přestal počítat dny i padlé kamarády. Crimson Desert není hra, na kterou se díváš z pohodlí křesla – je to nekompromisní bahno, krev a pot, kde si každý metr země musíš tvrdě vybojovat. Tenhle svět ti nedá vůbec nic zadarmo. Každý krok bolí a Pywel tě sežere zaživa, pokud na vteřinu polevíš v ostražitosti.\n\nKdyž se jako Kliff chopíš meče, cítíš každou ránu do štítu, každý suplex do zmrzlé hlíny a každou jizvu, kterou ti nepřátelé vlepí do tváře. Tady neexistuje snadná cesta. Brodění se po kolena ve sněhu v ledových horách, toulání se divočinou jen s umírajícím plamínkem lucerny, kdy kolem tebe v naprosté tmě krouží monstra – to tě psychicky zlomí a vyždímá. Jsem zmlácenej, unavenej a ztracenej v tomhle nekonečném válečném šílenství, ale tělo prostě odmítá padnout.\n\nSouboje jsou čisté, syrové utrpení a každé vítězství nad bossem je vykoupené tím, že meleš z posledního. Příroda tě chce zabít, lidé tě chtějí okrást a mapa tě pohltí na stovky hodin, dokud úplně nezapomeneš, kým jsi byl v reálném světě. Zbyly jenom mozoly na rukou a nekončící pochod vpřed.\n\nZapomeň na medaile a poplácání po zádech, v tomhle světě tě čeká jenom tvrdá dřina a zmar. Crimson Desert tě semele, rozkouše a udělá z tebe cynického veterána, který už nevěří v dobré konce. A přesto se každé ráno znovu zvedám z bláta a tasím meč.\n\n𝘗𝘰𝘬𝘶𝘥 𝘴𝘦 𝘷á𝘮 𝘳𝘦𝘤𝘦𝘯𝘻𝘦 𝘭í𝘣𝘪𝘭𝘢, 𝘴𝘭𝘦𝘥𝘶𝘫𝘵𝘦 𝘬𝘶𝘳á𝘵𝘰𝘳𝘢 [url=https://store.steampowered.com/curator/46290435/]𝘋𝘦𝘯𝘥𝘳𝘰𝘣𝘢𝘵𝘦𝘴 𝘛𝘳𝘪𝘣𝘦[/url].","c":1791660158,"u":1,"b":0,"r":0},{"i":"237399972","s":"76561199070484639","g":0,"n":2,"p":9821,"f":10041,"l":"brazilian","t":"Cinema.","c":1791659910,"u":1,"b":0,"r":0},{"i":"237398829","s":"76561198085988341","g":297,"n":53,"p":817,"f":1205,"l":"spanish","t":"Crimson Desert: lento al inicio, pero vivo de verdad\r\n\r\nEs cierto que al principio se puede sentir lento, pero también se siente vivo y muy interactivo. Puedes resolver las situaciones como te salga la gana, al estilo de Breath of the Wild.\r\n\r\nOtra cosa que se agradece: el juego no te obliga a cambiar de arma cada dos segundos solo porque la nueva tiene +2 de daño. Si prefieres quedarte con el equipamiento inicial de Kliff, puedes hacerlo y simplemente mejorarlo hasta volverlo competente.\r\n\r\nLa optimización podría ser mejor, pero para la calidad gráfica que tiene, tampoco se le puede pedir mucho más.\r\n\r\nLlevo 13 horas y recién estoy empezando a alejarme del pueblo inicial. No es porque el juego me frene, sino porque había tantas cositas para ver y explorar que no sentí la necesidad de agarrar el caballo e irme a la otra punta del mapa.\r\n\r\n20/10. Súper recomendado, no te vas a arrepentir de la compra.","c":1791658986,"u":1,"b":0,"r":0},{"i":"237398494","s":"76561199433586957","g":28,"n":2,"p":9874,"f":9874,"l":"english","t":"GOTY","c":1791658706,"u":1,"b":0,"r":0},{"i":"237397872","s":"76561199441661178","g":0,"n":6,"p":1646,"f":1782,"l":"russian","t":"не прошел игру еще может даже на процентов 20 но могу сказать что в этой игре хочется выполнять все доп квесты а уже потом идти сюжетку проходить.\r\nдвижение персонажа по карте топ, боевка норм ( самая обычная по факту, но в ней есть своя изюменка)\r\nкарта большая, персонажей нпс дохера, изучение мира прикольное, взаимодействие с предметами тоже неплохо\r\nкороче игру бы поставил в игру года, пока что","c":1791658228,"u":1,"b":0,"r":0},{"i":"237397537","s":"76561199221170950","g":123,"n":1,"p":7247,"f":7247,"l":"english","t":"Absolute videogame","c":1791657992,"u":1,"b":0,"r":0},{"i":"237397332","s":"76561198037812224","g":0,"n":8,"p":1346,"f":1346,"l":"english","t":"I tried to like this game. The puzzles are cool. Combat is fluid and feels nice. \n\nThe story is boring as hell, characters arent compelling at all, and the world feels empty as hell","c":1791657858,"u":0,"b":1,"r":0},{"i":"237395905","s":"76561198257363741","g":0,"n":7,"p":4703,"f":4703,"l":"spanish","t":"me encanta , tiene cierta dificultad con los puzzles pero esta muy entretenido , no me suelen gustar los juegos con puzzles pero este juego mezcla una gran variedad , lo recomiendo","c":1791656836,"u":1,"b":0,"r":0},{"i":"237395223","s":"76561199883990260","g":0,"n":1,"p":15800,"f":16023,"l":"latam","t":"Es un  mundo abierto impresionante, la distancia de dibujado es increíble, el combate y la personalización del personaje te dan horas y horas de juego, la cantidad de misiones es absurda, no faltan las misiones de recadero de las secundarías pero diría que son tolerables ya que el mundo que ofrece es muy rico y vivo. Puede llegar a ser abrumador por la gran cantidad de contenido y de información que el juego te da, la historia no es la mejor del mundo pero cumple con lo mínimo esperado. En mi caso sufro de bastante Poping ya que mi pc es de gama media baja, pero aún así se deja jugar y se ve muy bien. Al ser un mundo tan grande con tantas misiones es  verdad que a veces te pierdes en el hilo de la historia o de algunas misiones secundarias ya que hay tanto por hacer que a veces no recuerdas en que orden vas, te pierdes fácilmente ya que siempre hay algo llamando tu atención y es normal que te desvíes para ver que hay allí o que tesoro me encontraré, cosas por el estilo, es un juego muy recomendable para los que gustan de perderse en los paisajes y todas las posibilidades de progresión y descubrimiento que el juego ofrece. Viendo como esta la industria en los últimos años donde cada vez más juegos salen capados y faltos de contenido, se agradece que con este juego se tenga un sin fin de posibilidades y de buen contenido para disfrutar.","c":1791656312,"u":1,"b":0,"r":0},{"i":"237394809","s":"76561198227268356","g":0,"n":9,"p":5555,"f":5825,"l":"brazilian","t":"O jogo não te pega no começo, provavelmente muitos irão parar nas primeiras horas e talvez esse seja seu maior defeito, porém se você insistir pelo menos umas 15 horas ele vai clicar e vai virar um dos melhores jogos que você já jogou, estou chegando nas 100h e sinto que ainda falta chão para a campanha principal terminar, mas o resto que tem para fazer é muito rico e toda hora você aprende mais. Esse jogo não é para ansiosos, mas ele é muito bom!","c":1791656000,"u":1,"b":1,"r":0},{"i":"237394360","s":"76561198203881251","g":0,"n":1,"p":24992,"f":25665,"l":"english","t":"very fun game and addictive","c":1791655633,"u":1,"b":1,"r":0},{"i":"237393905","s":"76561199145471224","g":0,"n":2,"p":1867,"f":5612,"l":"spanish","t":"es mentira que sea un juego de mundo libre como tal todas las horas de juego que llevo son haciendo misiones chorras .Tiene 12 capitulos mas todas las misiones de faccion mas de 600 es decir todo el juego haciendo recados yo no aconsejo comprar","c":1791655296,"u":0,"b":0,"r":0},{"i":"237392102","s":"76561198989607568","g":87,"n":5,"p":5288,"f":5304,"l":"turkish","t":"kanser edıyor ama guzel oyun","c":1791653950,"u":1,"b":1,"r":0},{"i":"237392011","s":"76561198855519120","g":219,"n":17,"p":5870,"f":5870,"l":"english","t":"I mean its alright","c":1791653881,"u":1,"b":1,"r":0},{"i":"237391798","s":"76561198350070736","g":354,"n":30,"p":6636,"f":6825,"l":"english","t":"CRIMSON DESERT ENHANCED !!!!!","c":1791653722,"u":1,"b":1,"r":0},{"i":"237391472","s":"76561198822334092","g":83,"n":20,"p":2312,"f":2312,"l":"english","t":"The game's story is all over the place, i can't seem to connect with the main characters at all. The gameplay is 8/10 though","c":1791653484,"u":0,"b":1,"r":0},{"i":"237390456","s":"76561198173521861","g":159,"n":15,"p":6527,"f":6527,"l":"english","t":"After the update game crashing","c":1791652780,"u":0,"b":1,"r":0},{"i":"237389400","s":"76561198111019172","g":0,"n":2,"p":9092,"f":11965,"l":"french","t":"Tout bien que la maniabilité du personnage ne soit pas au top.","c":1791652033,"u":1,"b":0,"r":0},{"i":"237387569","s":"76561198516641610","g":55,"n":5,"p":4648,"f":4711,"l":"english","t":"🎮 Game Review\n\n👁️ Graphics\n[ ] Bad (It hurts my eyes)\n[ ] Normal / Average\n[ ] Good\n[ ] Beautiful / Breathtaking\n[X] Don't look at it too long or your GPU will explode\n\n🕹️ Gameplay\n[ ] Better to just stare at a blank wall\n[ ] Very repetitive and boring\n[ ] Just an average game\n[ ] Very fun and engaging\n[X] I have completely forgotten what real life looks like\n\n🎵 Audio / Music\n[ ] Better to play on mute\n[ ] Nothing special\n[X] Good / High quality\n[ ] A masterpiece (I listen to the soundtrack daily)\n\n💻 PC Requirements\n[ ] Will run on a potato or a calculator\n[ ] Low requirements\n[ ] Medium (Needs a decent computer)\n[X] High requirements\n[ ] You need a computer borrowed from NASA\n\n💰 Price\n[ ] Free-to-play\n[X] Worth every single penny\n[ ] Wait for a sale (Steam Sale)\n[ ] Overpriced / Don't waste your money\n\n🐞 Bugs\n[ ] The game doesn't even launch\n[ ] Filled with game-breaking bugs\n[ ] A few minor bugs, but nothing serious\n[X] Perfectly polished, absolutely no bugs","c":1791650828,"u":1,"b":0,"r":0},{"i":"237385446","s":"76561198213041721","g":0,"n":33,"p":1556,"f":2845,"l":"brazilian","t":"um dos melhores se não o melhor jogo de mundo aberto que tem, tudo nele é incrível, as missões não são chatas e repetitivas, mundo vivo com muita exploração, combate muito bom ala BD.\r\nNão sei porque demorei a jogar esse game, não consigo parar de jogar kk.","c":1791649409,"u":1,"b":0,"r":0},{"i":"237385245","s":"76561198442495558","g":12,"n":3,"p":220,"f":418,"l":"french","t":"Un jeu ambitieux, spectaculaire et immersif, qui offre une aventure particulièrement prenante. Si vous aimez les mondes ouverts riches, les combats intenses et les univers fantastiques, Crimson Desert mérite clairement sa place dans votre bibliothèque Steam.","c":1791649294,"u":1,"b":0,"r":0},{"i":"237383234","s":"76561199500496865","g":0,"n":1,"p":22235,"f":24046,"l":"koreana","t":"인핸스드로 시작했고 건설퀘랑 기계일꾼좀 더 만들고싶고 해서 좀켜둔거 감안해서 300시간정도 한거같음 어비스퍼즐은 유튜브에디션으로 막히는건 거의 보고했음 없었으면 반은 못풀었을듯 뭘해라고 명확하게 알려주지 않기땜에 그게 가장 어려웠음 파악하는거 확실히 모두를 위한 겜아님<-\n메인스토리 고쳤다곤했지만 위처급 문과력 발더스급 자유도,세키로급 보스러쉬액션겜을 바라면 그래도 실망할거임 애당초 저 갓겜3개가 하나로 뭉친 마스터피스겜 보지도못했고 앞으로도 존재안할거같음 저3대장겜이랑 비교해서 시애미질에 살아남을겜 없을꺼임 그 기준점을 붉은사막에게 바래서도 안될것같음..\n\n막상할때는 몰랐지만 붉사하다 다른겜하니 이겜만의 킥이 있고 특히 심리스 원경이 저멀리 보이는 곳을 이동하다 착지잘못해서 구덩이에 빠졌던니 보물상자 발견적있는데 이런게 이겜 재미구나 생각함 템들도 성능치가 풀강시 초보템이랑 공격수치가 거의 같아서 파밍하는맛이 별로라는 사람도 있지만 그냥 외형맘에드는거 픽해서 고민없이쓰던게 나에겐 장점이었음 반대로 적당히좀하지 짜증났던 조트구간도 있었음 젤 기억나는건 사막쪽 토벌퀘중에 늑대인가 타고다는놈잡는건데 사막회오리땜에 시야는 안것도 보이고 찾다가 특정범위 넘어가면 리셋되고 다시생각해도 넘 짜증났음 그런 병주고 약주고가 이겜인거같음 그렇타고 근래나온겜중에 이정도 오픈월드퀄보여준겜이 있을까?생각하면 진짜 없음 다 10년전명작 리메이크겜들이지 \n\n발길따라 여기저기 싸댕기고 캠프확장해서 회색갈기영향력을 여기저기 남기는 그런겜임 특히 마을재건보내면 진짜 일꾼들이 빌드업해서 재건하는 모습보고 월드깔론 못깔듯 정성느껴짐 반대로 넓은 오픈월드 사이사이를  많이 뺑뺑이도는 심부름퀘로 채워서 아쉽긴함 이걸 줄이고 마을사람과 회색갈기와의 티키타카 드라마를 좀더 많았으면 좀더 살아있는 오픈월드가 될거같음 콘솔첫작이라 아쉬운것도 있겠지만 이런 넓은맵을 누비겜을 좋아했었구나라고 붉사하면서 첨알았고 DLC도 기대됨","c":1791648014,"u":1,"b":0,"r":0},{"i":"237381310","s":"76561198111162516","g":0,"n":2,"p":2423,"f":3483,"l":"schinese","t":"二十年前玩激战的激情又来了，我就喜欢景色画面好，又不需要太多操作的游戏。","c":1791646749,"u":1,"b":1,"r":0},{"i":"237381165","s":"76561199061482071","g":101,"n":1,"p":1202,"f":1202,"l":"schinese","t":"好玩","c":1791646660,"u":1,"b":0,"r":0},{"i":"237380290","s":"76561198373443806","g":0,"n":3,"p":10066,"f":10873,"l":"koreana","t":"단점 : 키 익숙하지않는거 근데하다보면 아무렇지않음\r\n장점 : 단점 한가지빼고 모든것!! 그냥 내기준 고티","c":1791646059,"u":1,"b":1,"r":0},{"i":"237379755","s":"76561198421744073","g":0,"n":1,"p":5127,"f":5230,"l":"koreana","t":"굉장히 할게 다양하고 나름 이것 저것 준비를 많이 한게 느껴짐. 다만 플레이 타임의 반은 퍼즐 풀고 어비스 맞추는데 시간 다 씀. 시간이 남아도는 사람만 플레이 가능한 불친전한 퍼즐 요소와 불편한 조작감으로 인해 dlc까지는 구매할 생각이 없네요. 내 시간은 소중해요.","c":1791645684,"u":0,"b":0,"r":0},{"i":"237379687","s":"76561198660825097","g":0,"n":1,"p":4020,"f":5017,"l":"english","t":"good game def need to fix certain bugs and add a new horse taming mech ts is ahh","c":1791645635,"u":1,"b":0,"r":0},{"i":"237379493","s":"76561198793492682","g":0,"n":8,"p":6943,"f":6958,"l":"schinese","t":"《红色沙漠》115小时，10个成就，我还在“玩”而不是“刷”\r\n我玩了115个小时。成就完成了10个。\r\n主线？可能推了一半。但我一点都不焦虑，因为《红色沙漠》的乐趣从来不在那个百分比条上。34个成就，32个是挑战任务——武器精通、迷你游戏全胜、马匹挑战、深渊全收集。这些东西需要你有意识地去刷，去肝，去对着攻略一条条勾。\r\n上百小时全成就的人很厉害，但我不羡慕。\r\n我115小时干了什么？\r\n我在埃尔南德帮NPC找走丢的羊。在港口钓了半小时鱼。骑着马从雪山跑到沙漠，就为了看日落。跟路边围观我打架的村民大眼瞪小眼。晚上黑到必须提灯摸索，马掉河里溺水了我还得去救它。\r\n这些事不给成就。，但它们给“这个游戏真好玩”的感觉。\r\n数据不会骗人，发售近两个月，只有6.7%的玩家通关了主线。6.7%不是缺陷，是证据，评测会告诉你这游戏“主线通关率只有6.7%”，把它当成一个缺陷。但对我来说，6.7%不是问题，是证据——证明这个世界大到、密到、有趣到，让人舍不得推主线。我买的不是“红色沙漠通关体验”，我买的是“帕卫尔大陆居住权”。\r\n最后，10个成就，115小时。\r\n我可能永远拿不到白金，但我确定我比那些200小时全成就的人，更懂什么叫“住在红色沙漠里”。\r\n别人在通关，我在过日子。\r\n这就是我的评测。","c":1791645499,"u":1,"b":1,"r":0},{"i":"237379421","s":"76561198762423123","g":0,"n":1,"p":2714,"f":2888,"l":"english","t":"yes","c":1791645450,"u":1,"b":1,"r":0},{"i":"237379167","s":"76561198275524773","g":0,"n":12,"p":177,"f":528,"l":"turkish","t":"Oyunu almadan önce bir çok yorum okudum. Hem evet hem hayır diyenleri. Eleştirilerin hemen hemen hepsini de okudum. Oyunda 100 saati devirdim. Ve çok beğendim. Şurası şöyle olsaydı, burası böyle olsaydı yorumlarının bir sonu gelmez. Her zaman daha iyisi mümkündür. Ancak bu oyun için yapılan eleştirilerin pek çoğunun haksız olduğunu görüyorum. Oyun performans olarak fevkalade. Dünya bir harika. Görevler son derece tatmin edici. Oyun sürprizlerle dolu. PC'de klavye/fare ile oynuyorum, hiç zorluk çekmedim. Tuş atamaları ile ilgili bütün eleştirileri reddediyorum, gayet kolay ve oyun zaten gerekli açıklamayı yapıyor. Unuttuysan yardım bölümünden bakarsın. Kısacası, bu oyun son derece güzel, kötü yorumlara aldanmayın, parasını da sonuna kadar hak ediyor. Yapımcıyı tebrik ediyorum ve sonraki projelerinde biz PC oyuncularını unutmamalarını diliyorum. Ayrıca Türkçe dil desteği için de teşekkürler. Oyun mod desteğine de açık, envanter vb. konularda mod desteği ile o küçük pürüzler de ortadan kalkıyor. Tanrı aşkına Skyrim modlar olmadan ne kadar eksikti hatırlayalım. Ama onu bu yüzden yerin dibine sokmamıştık. Bu oyun hakkındaki eleştirilerin çoğunu taraflı bulduğumu söylemek durumundayım. Ve bu kadar büyük ve güzel bir dünyayı geçiş ekranı olmadan izlemek harika bir duygu. Yer yer oyunu bırakıp manzara seyrediyorum. Bu oyunu alın ve oynayın, pişman olmazsınız. Ayrıca bir Elder Scrolls hayranı olarak da, Elder Scrolls 6 için bir yorum yapayım. Bu oyundan sonra işleri zor !!","c":1791645251,"u":1,"b":1,"r":0},{"i":"237378008","s":"76561198872653230","g":80,"n":1,"p":3689,"f":3880,"l":"schinese","t":"把boss血条清空，然后自己败了,还有比这更神的剧情吗","c":1791644457,"u":0,"b":0,"r":0},{"i":"237377707","s":"76561199070669906","g":153,"n":4,"p":913,"f":913,"l":"polish","t":"Terrible tutorials and inventory management. When I tried to explore some of the side content, the game wouldn’t let me solve most of the puzzles I came across. I also think the controls could have been much better.\n\nI just don’t feel motivated to keep playing. Whenever I see cool clips of the game online, I feel the urge to give it another shot, but every time I do, I lose interest pretty quickly and end up uninstalling it.\nI really like the atmosphere, traversal, and the scale. I was genuinely looking forward to this game and tried to enjoy it, but I just can’t seem to get into it.\nI’m not sure how to explain it, but the game feels as if it were made by AI. Something about it feels soulless.","c":1791644256,"u":0,"b":0,"r":0},{"i":"237375356","s":"76561198009277377","g":0,"n":2,"p":17562,"f":19915,"l":"koreana","t":"할게 너무 많다. 메인시나리오는 맞보기에 불과하다. 아직도 못 가본곳이 많다. 퍼즐은 왜이리 많은거야?","c":1791642579,"u":1,"b":1,"r":0},{"i":"237375162","s":"76561199079397035","g":47,"n":5,"p":139,"f":139,"l":"schinese","t":"就三个字 不好玩","c":1791642448,"u":0,"b":1,"r":0},{"i":"237374107","s":"76561199570396723","g":0,"n":1,"p":4996,"f":5258,"l":"english","t":"best game i've ever played\r\n","c":1791641653,"u":1,"b":1,"r":0},{"i":"237374004","s":"76561199735652846","g":0,"n":16,"p":251,"f":251,"l":"english","t":"Awesome game!","c":1791641562,"u":1,"b":1,"r":0},{"i":"237373964","s":"76561199783123323","g":0,"n":2,"p":3366,"f":3751,"l":"koreana","t":"이렇게재밌는게넘쳐나는데세상을어떻게구하라는거야이렇게재밌는게넘쳐나는데세상을어떻게구하라는거야이렇게재밌는게넘쳐나는데세상을어떻게구하라는거야이렇게재밌는게넘쳐나는데세상을어떻게구하라는거야이렇게재밌는게넘쳐나는데세상을어떻게구하라는거야이렇게재밌는게넘쳐나는데세상을어떻게구하라는거야이렇게재밌는게넘쳐나는데세상을어떻게구하라는거야이렇게재밌는게넘쳐나는데세상을어떻게구하라는거야이렇게재밌는게넘쳐나는데세상을어떻게구하라는거야이렇게재밌는게넘쳐나는데세상을어떻게구하라는거야이렇게재밌는게넘쳐나는데세상을어떻게구하라는거야이렇게재밌는게넘쳐나는데세상을어떻게구하라는거야이렇게재밌는게넘쳐나는데세상을어떻게구하라는거야이렇게재밌는게넘쳐나는데세상을어떻게구하라는거야이렇게재밌는게넘쳐나는데세상을어떻게구하라는거야이렇게재밌는게넘쳐나는데세상을어떻게구하라는거야이렇게재밌는게넘쳐나는데세상을어떻게구하라는거야이렇게재밌는게넘쳐나는데세상을어떻게구하라는거야이렇게재밌는게넘쳐나는데세상을어떻게구하라는거야이렇게재밌는게넘쳐나는데세상을어떻게구하라는거야이렇게재밌는게넘쳐나는데세상을어떻게구하라는거야이렇게재밌는게넘쳐나는데세상을어떻게구하라는거야이렇게재밌는게넘쳐나는데세상을어떻게구하라는거야이렇게재밌는게넘쳐나는데세상을어떻게구하라는거야이렇게재밌는게넘쳐나는데세상을어떻게구하라는거야이렇
