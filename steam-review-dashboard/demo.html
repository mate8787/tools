t unlocked the dragon mount after 73.8 hrs of playing time and i still havent even scratched the surface.\r\nhighly recomend to anyone who has no social life lol","c":1791350208,"u":1,"b":0,"r":1},{"i":"237105521","s":"76561198855732630","g":0,"n":7,"p":2503,"f":4993,"l":"koreana","t":"장점\r\n기본 베이스는 레데리2\r\n+\r\n젤다의 수수께기와 퍼즐\r\n+\r\n검은사막의 액션\r\n\r\n단점\r\n조작감이 JOAT OF JOAT\r\n불친절 끝판왕(퍼즐, 보스기믹 등 힌트라도 좀 줘야되는거 아님??? 이걸 어케알아)\r\n","c":1791349813,"u":1,"b":0,"r":0},{"i":"237105293","s":"76561198364503036","g":132,"n":5,"p":1355,"f":2594,"l":"english","t":"23 hours into Crimson Desert and I’m loving it so far.\n\nWhat I really like is that the game doesn’t make everything about combat. There’s a good balance between fighting, exploring, and just wandering around the world doing your own thing. At times it feels just as much like an exploration game as it does an action game, which keeps things from getting repetitive.\n\nThe world is fun to explore, the combat is enjoyable, and overall I’ve had a really good experience with it so far.\n\nIf you’re on the fence, I’d say go for it.","c":1791349449,"u":1,"b":1,"r":0},{"i":"237104912","s":"76561198049247539","g":0,"n":3,"p":9290,"f":9290,"l":"english","t":"TL:DR - This game has everything that should make it a great game, but a number of annoying flaws that get in the way of actually enjoying what it has to offer.\r\n\r\nI would give this a mixed review if I could. When I first started playing this game, I wanted to uncover the whole map and do everything. That's exactly what I did for the first half of my playthrough. The puzzles felt fun, the combat felt flashy and cool, and there seemed like an endless amount of stuff to keep me interested. The world feels like a large, breathing world with more life in it than any other I've seen, and Pearl Abyss did an amazing job rewarding you for being curious and going off the beaten trail.\r\n\r\nAnd then the cracks started to form. I try to play through games without looking at guides so I can enjoy discovering something myself, but I quickly found that impossible. With all the ways to interact with the world, it quickly became difficult to know which one specific thing the game wanted to interact with a puzzle, and I stared at many puzzles seeing exactly what needed to be done, but not knowing how to interact. I looked up guides not to solve the puzzle, but just to tell me the right button presses to even start.\r\n\r\nOther issues began to pile up. Gear was one. I can't speak to end-game gear since I lost patience to look for it, but early game gear all has very similar base game stats, to the point that it didn't feel like my effort to explore was being well rewarded. Information about refinement and abyss gear benefits is frequently hidden behind menus, sometimes multiple levels deep.\r\n\r\nCombat soon lost its appeal with souls-like combat while fighting waves of enemies and a soft-lock that can't be disabled, making your character abruptly change direction after a new target after killing a previous one, regardless of which way your camera was facing - frequently taking you into danger. Forced camera lock on bosses had a similar experience. Though there's an option to turn camera lock off in the menus, it doesn't apply to bosses for some reason, which gets very annoying very quickly when a boss's minions are swarming you and you're trying to interact with things in the arena but you can't control which way the camera is looking. Forced camera lock, plus a spinning light/shadow effect in the penultimate fight, made me feel nauseous and I needed to take a break before getting into the final fight. \r\n\r\nThe more I played, the more I felt frustrated. Movement felt slightly janky, with way too much momentum from just running from place to place. Sometimes it felt like a person couldn't just turn in place and had a turn radius like a small boat. Kliff taking a slight step backwards when reading a piece of paper or winding up his mining pick and falling off an edge. People seem attached to ledges and walls like velcro with how quickly they want to go into a climbing animation. The trade route system intrigued me until I had to start driving a wagon, which felt slightly janky and tedious.\r\n\r\nThere's other factors, from unskippable cutscenes to inconsistencies in the UI, to seemingly needing to find the perfect pixel to interact with things. Combat became grindy and uninteresting, with battles against massive hordes lacking challenge and boss fights being more of a battle against the camera than the enemy. In the end, it's that frustration that makes it a negative review. There's a large part of me that still wants to finish exploring the map and to do the quests that I missed, but the frustration at dozens of minor things has won out against that desire.","c":1791348836,"u":0,"b":1,"r":0},{"i":"237104755","s":"76561198194843597","g":0,"n":2,"p":2259,"f":2381,"l":"english","t":"Best open world game ever made. Finally some developers with talent and not trying to shove gay propaganda down my throat.","c":1791348570,"u":1,"b":0,"r":0},{"i":"237104418","s":"76561198421750780","g":248,"n":31,"p":10348,"f":11488,"l":"english","t":"Like skyrim and devil may cry had a baby","c":1791348035,"u":1,"b":1,"r":0},{"i":"237102979","s":"76561198414597839","g":0,"n":8,"p":9554,"f":12146,"l":"english","t":"This game really good..kena dengan jiwa..\nexplore,aventure,puzzle,treasure and all..so fun..","c":1791346108,"u":1,"b":1,"r":0},{"i":"237102845","s":"76561199764482429","g":34,"n":4,"p":2193,"f":2440,"l":"schinese","t":"dlc上架之后这将是集于沙盒，养成，收集，动作，生存，开放世界探索，各种元素融于一炉的超大一坨的中世纪剑于魔法的震撼美味，这个游戏比较偏养老，开始买的时候是因为电子ed了，一开始由于引导确实差，再加玩着确实像中世纪原神，真的想退款了，但是因为电子ed，后来硬着头皮想着随便玩玩，结果越玩越上瘾，由于我入手的直接就是优化过后的版本都多少觉得引导较差，不敢想老资历们是怎样挺过去的，dlc上架之后我原称它为真神","c":1791345914,"u":1,"b":1,"r":0},{"i":"237102811","s":"76561198340578318","g":66,"n":3,"p":1911,"f":3804,"l":"schinese","t":"有少许谜题容易使人困惑和不知所云，键位有些蹩手之外，总体还是很好玩的，瑕不掩瑜。","c":1791345859,"u":1,"b":0,"r":0},{"i":"237100247","s":"76561198386536448","g":95,"n":24,"p":1063,"f":7830,"l":"schinese","t":"量大管饱官方态度好","c":1791342456,"u":1,"b":1,"r":0},{"i":"237099414","s":"76561198346939954","g":0,"n":2,"p":8220,"f":8368,"l":"schinese","t":"a very good game","c":1791341423,"u":1,"b":1,"r":0},{"i":"237098800","s":"76561198988030090","g":0,"n":7,"p":282,"f":1767,"l":"brazilian","t":"nota 10","c":1791340543,"u":1,"b":0,"r":0},{"i":"237098192","s":"76561198404143471","g":84,"n":13,"p":422,"f":422,"l":"schinese","t":"什么都好就是不好玩。 操作太复杂，战斗并不有趣。\n","c":1791339804,"u":0,"b":1,"r":0},{"i":"237097903","s":"76561199587976860","g":0,"n":1,"p":2878,"f":3006,"l":"english","t":"One of the few games I would pull an all nighter to play.","c":1791339451,"u":1,"b":1,"r":0},{"i":"237097744","s":"76561198093581399","g":0,"n":15,"p":19,"f":19,"l":"english","t":"Trees Move Like theres so much wind but literally nothing else is moving that much, very off putting. trees looking like theres a tornado then all the foliage thats falling from the trees falls as if theres no wind, and the clothes dont move. it was kinda making me dizzy look at it","c":1791339264,"u":0,"b":1,"r":0},{"i":"237097607","s":"76561198892740671","g":149,"n":19,"p":14378,"f":15846,"l":"schinese","t":"1","c":1791339090,"u":1,"b":0,"r":0},{"i":"237097449","s":"76561198453535573","g":0,"n":1,"p":8142,"f":8142,"l":"english","t":"GOTY","c":1791338894,"u":1,"b":0,"r":0},{"i":"237097136","s":"76561198044821143","g":110,"n":10,"p":4146,"f":4146,"l":"english","t":"I don't like Asian games. I really don't. In fact, I pretty much hate them.\n\nThe comically unrealistic armor, the ridiculous weapons, the over-the-top movement, all the stupid flashy effects, the fact that every character looks like a supermodel or a kpop star, those ridiculous humanoid pets, the cheesy stories that barely make any sense... everything in these games feels like it was designed by a 5 year old who just wrote down everything he could think of, regardless of whether any of it actually made sense.\n\nAnd yet, I have 70 hours in this game. Why?\n\nBecause despite all the things I hate about it, there is one thing that keeps me playing: the world.\n\nIt's a gorgeous, massive, living-breathing open world that you can actually explore. I can summon my horse, hop on, and just ride around for no reason other than to enjoy the scenery. I don't have to be doing a quest or chasing some objective. I can just wander through the world, talk to the NPCs, interact with the enviroment and have fun. It's huge, beautiful, incredibly detailed, and genuinely fun to explore.\n\nSo, as much as I dislike almost everything about the game's style and design, I can't deny that the world itself is something special. And apparently, that's enough to keep me playing.","c":1791338517,"u":1,"b":0,"r":0},{"i":"237096741","s":"76561197997919538","g":2467,"n":58,"p":1010,"f":1775,"l":"english","t":"This game is astonishingly huge. Highly recommend if you like open worlds where you can play at your own pace or decide to adventure out and ignore the story.","c":1791337976,"u":1,"b":1,"r":0},{"i":"237093845","s":"76561199187854702","g":64,"n":16,"p":3684,"f":3684,"l":"french","t":"L'une des plus belles maps jamais conçues, et la réactivité des développeurs pour tous les patchs sortis... BRAVO","c":1791334296,"u":1,"b":1,"r":0},{"i":"237091672","s":"76561198998890438","g":34,"n":5,"p":6576,"f":11169,"l":"koreana","t":"좋아요","c":1791331482,"u":1,"b":1,"r":0},{"i":"237091546","s":"76561199090679530","g":0,"n":3,"p":383,"f":383,"l":"english","t":"Game crashes constantly whenever opening the inventory, map or pause menus. Despite the game being beautiful and actually fun to play (when it works) I have had nothing but trouble in trying to get it to work and don't have any more interest in headbutting a wall trying to get it to work. If the developers are able to address these issues the game is incredible however without that happening it would be more fun to stick your hand in a toaster","c":1791331315,"u":0,"b":1,"r":0},{"i":"237090666","s":"76561199334153889","g":0,"n":2,"p":96,"f":96,"l":"brazilian","t":"Simplesmente não consigo entra no jogo sem que meu pc desligue automaticamente, quando eu conseguir jogar do uma melhor avaliação","c":1791330219,"u":0,"b":0,"r":0},{"i":"237089634","s":"76561198050843660","g":487,"n":41,"p":8564,"f":8674,"l":"russian","t":"[h1]Лучший исекай 2026 года, или почему Crimson Desert хорош, но подойдет не всем! [/h1]\r\n\r\nВ общем тут не буду тянуть кота за причинное место - игра классная, но она не для всех. Что я имею в виду под словами не для всех? Да все просто - это игра, которая не спамит тебя ачивками, это игра, которая не дает тебе внятного старта, это игра, которая требует от тебя максимального внимания, иначе рискуешь ничерта не понять и после 100 часов геймплея. В общем эта игра, наверное, один из немногих проявлений нонконформизма в современном геймдеве, при этом всем выполненная на уровне ААА игры. \r\nНа самом деле заметил, что в целом очень сложно писать структурированные отзывы о продукте, который понравился, но еще труднее, когда эта игра необъятно широка. Постараюсь уложить свои мысли в тезисы и обернуть в категории. Если не задушитесь читать, то велком вниз.\r\n[b] А для тех, кому лень читать, то:[/b] игра пушка, но требует от игрока очень много внимания, любознательности и увлеченности. Если ваши предпочтения сводятся к быстрому и комфортному фарму ачивок, закрытию всех знаков вопросиков по интерактивной карте, понятной подаче сюжета и нет желания разбираться с игровыми системами, то предлагаю скип, т.к. игра слишком требовательна, а вознаграждает вообще не часто. [b]От себя 8,5/10[/b]\r\n\r\n[h3]Сюжет без спойлеров[/h3]\r\nДавайте сразу на берегу разберемся со слоном в комнате. Сюжет прикольный, но чтобы это понять, нужно продержаться не один десяток часов. После крупных апдейтов игра стала намного дружелюбнее в этом плане, но все же думаю проблемы с глобальным пониманием останутся. Поверьте, игра намного глубже в плане сюжета чем банальные [b]“ыыы начал игру, убили а потом заставили чистить дымоход”[/b]. Такое скомканное и сумбурное начало очень хорошо объясняется потом, но до этого нужно смириться и стараться ничего не упускать.\r\nПредлагаю стартовать эту игру через призму “попаданца” который не понимает что происходит, и как тут жить. Так, поверьте, будет проще втянуться. Лично я на старте отпустил попытки найти смысл на первых порах, и просто кайфовал от процесса исследования и микро-историй. Таким образом и втянулся.\r\nКстати, давайте закроем сразу слона поменьше, который звучит как “квесты = AI слоп”. Это не так. Задания бывают очень разными. От персональных задач сопартийцев, до крутозавернутых многоступенчатых заданий с неожиданными исходами.\r\n\r\n[h3]Геймплей[/h3]\r\nВторой большой пласт, который очень хочется подсветить. Базово игра кажется простой и незамысловатой: легкая атака, сильная атака, блок, перекат, парирование, стамина, хп, какой-то удар ладошкой и рука крюк-кошка. На старте я совершил ошибку и А) не пользовался всем сразу, играя по старинке аля солс Б) не внимательно относился к обучалкам, из-за чего также упустил много возможностей, которые упростили бы игру и открыли бы новые горизонты сильно раньше. И тут сразу скажу, лучше не запускать это все в долгий ящик, т.к. уже через 20-30 часов, вам придется менеджерить ближний бой без оружия, с оружием, специальные атаки от оружия, атаки при помощи руки-крюка, атаки при помощи ладошки, позиционирование в бою по вертикали и горизонтали, а помимо этого нужно еще не забывать искать лучший шмот, точить его, комбинировать камни с доп. параметрами и способностями, чтобы быть максимально эффективным и гибким. В общем если отдельно говорить про систему боя, то она очень глубокая, очень гибкая, максимально кастомизируемая, и для этого не нужно быть корейским киберспортсменом, чтобы красиво раскладывать пачки врагов и боссов, но для этого нужно быть опять же очень внимательным и своевременным. \r\nНо глубина геймплея не заканчивается на боевке. В игре куча разных возможностей подо все, чем бы вы только не захотели заниматься: охота на легендарных животных, рыбалка (и легендарная рыбалка), крафт, фарм, строительство и развитие собственного лагеря, выполнение контрактов, охота за головами, соревнования во всем в чем только можно, готовка, эксплоринг, чтение книг. В общем список нереально большой и каждый сможет найти для себя занятие по вкусу. Хоть караваны грабь, ведь тут можно это делать, и даже получать неплохие деньги с этого.\r\n\r\n[h3]Эксплоринг открытого мира[/h3]\r\nДаже не пытайтесь сразу с наскока закрыть все знаки вопросиков. А даже если откроете интерактивную карту и пойдете зачищать все по порядку, то выгорите очень быстро. В этой игре 140+ пещер, уйма лагерей и поселений, сотни, если не тысячи, квестов, башни, бездна и … Это можно продолжать бесконечно долго, обзора не хватит. Опять же, просто дам несколько советов: А) исследуйте все по интуиции - если увидели что-то интересное, идите туда. Б) не пытайтесь пользоваться интерактивной картой как гайдлайном по зачистке - задушитесь и дропните В) позвольте себе экспериментировать - в игре очень много механик, которые взаимодействуют с миром, и им можно найти много неочевидных применений ну и мое любимое Г) НЕ ДУМАЙТЕ, ЧТО ВСЕ ИНТЕРАКТИВНЫЕ И ИНТЕРЕСНЫЕ МЕСТА ПОДСВЕЧИВАЮТСЯ МЕЧОМ - очень много интересных мест, лута и приключений никак не выделены в этом мире. Либо вы о чем-то узнаете у НПЦ, либо найдете сами, либо найдете через интерактивную карту, но еще раз повторюсь, позвольте себе быть ребенком, позвольте себе быть исследователем, не нужно играть в эту игру по интерактивной карте без крайней нужды.  \r\n\r\n[h3]Бездна и головоломки[/h3]\r\nОтдельный вид удовольствия, но его нужно контролировать и дозировать. Бездна это верхний мир, если можно так назвать. Он состоит из парящих островов, между которыми нужно перемещаться, и по началу это будет очень непонятное место, “для чего я тут? зачем это делать?” но со временем, когда активности на земле начнут надоедать, или захочется оторваться от выполнения квестов, это место открывает новый срез геймплея с пространственными головоломками и дополнительным эксплорингом, что очень хорошо работает как расслабление и смещение фокуса, чтобы основной геймплей не наскучивал. А еще там открываются классные виды.\r\n\r\n[h3]Боссы[/h3]\r\nЯрко, красиво, визуально интересно, геймплейно прикольно, но не могу сказать, что очень сложно. Самым замороченно-неприятным показался босс “Золотая звезда”, но это видимо мое лично, имхо. В целом игра, как будто, все же не совсем про это, по этой причине и не стоит ожидать от них какого-то челленджа как от Радана до нерфов.\r\n\r\n[h3]Саунд-дизайн и музыка[/h3]\r\nНа удивление саундтрек к игре очень красивый и объемный, но как-будто в самом геймплее он не так сильно запоминается. Тем не менее, музыка достойная, работа со звуком хорошая. Каких-то явных проблем я не заметил.\r\n\r\n[h3]Вывод[/h3]\r\nЗа весь обзор я ни разу не сказал о минусах явно и напрямую, а они есть. Но эти минусы, как мне кажется, субъективны и в какой-то степени незначительны. Хотя! все же есть один минус, который на протяжении всей игры меня раздражал - игра плохо переведена. Смысл и тон диалогов периодически вообще отличается от того, что пишут в ру локализации. Это мерзко и убого со стороны локализаторов. Я не знаю, чем они руководствовались, но они зафакапили тон и смысл не одного десятка реплик.\r\nВ остальном же могу сказать, что эта игра стоила своих денег и времени. И думаю я еще подзадержусь в ней, чтобы добить испытания.\r\nЧто же касается 8,5 из 10, и почему не 9 или 10/10? То тут сыграло:А) локализация Б) не самая дружелюбная раскладка для управления, В) то, что не дали на драконе крепость спалить до тла!\r\nНадеюсь этот обзор поможет вам решиться на покупку, или наоборот убережет от нее!","c":1791328875,"u":1,"b":1,"r":0},{"i":"237088905","s":"76561198034956855","g":58,"n":4,"p":35720,"f":35720,"l":"czech","t":"A great game with plenty to do. Great fighting system, very good story and amazing graphic. This was one of the few games I really enjoy it. Definitely recommend it.","c":1791328009,"u":1,"b":1,"r":0},{"i":"237087854","s":"76561198148973067","g":0,"n":19,"p":1075,"f":1342,"l":"koreana","t":"좆같은 겜","c":1791326720,"u":1,"b":1,"r":0},{"i":"237087489","s":"76561198803141385","g":0,"n":7,"p":3075,"f":3223,"l":"spanish","t":"muy bueno","c":1791326302,"u":1,"b":0,"r":0},{"i":"237086991","s":"76561198377760017","g":300,"n":82,"p":150,"f":150,"l":"russian","t":"Что-то зашел и охренел, что игре чуть больше ПОЛУГОДА с релиза, а на неё уже выкатили бесплатный Enhanced Edition и после этого бахнули гигантское DLC Charting the Unknown с кораблями, морскими боями, подводным миром и романами с девками. А еще строительство своей хаты или замка, найм рабочих для строительства , плавания на акулах, новые боссы роботы. \nВы вообще верите читая этот отзыв. WHAAAAAT??","c":1791325710,"u":1,"b":0,"r":0},{"i":"237086595","s":"76561198177608990","g":0,"n":2,"p":12714,"f":16534,"l":"english","t":"Amazing open-world to explore. CD has crafted a rich and full world for you to explore, there are secrets around every corner. This is where the game shines. If you like picking a direction and just wondering what's out there, this is for you. The game has a solid story now with the enhanced version, it's not going to be memorable or move you by any means but it is solid. The gameplay is the tricky part, there are hundreds of systems to work with in the game, and a lot of them aren't explained to you in a timely manner. You can consider the first 4-5 chapters of main story as your tutorial, but you are always learning stuff as you progress. Combat is typical power fantasy stuff, you will be unstoppable versus masses of basic enemies, but some bosses pose a challenge until you learn the mechanics. I would say combat is easy to learn, but difficult to master. You can make it be as basic or advanced as you want it to be. \r\n\r\nThe game has a very divisive rating around it, you will see words like \"trash\" and \"GOtY\" thrown around regularly. I don't think the game is either. I think it is very good and does a lot of things well and Pearl Abyss is constantly updating it, but it has it's flaws that can be frustrating at times.","c":1791325264,"u":1,"b":1,"r":0},{"i":"237085567","s":"76561198419288760","g":0,"n":1,"p":6108,"f":11684,"l":"english","t":"Game is very addictive. Be warned.","c":1791324086,"u":1,"b":1,"r":0},{"i":"237085484","s":"76561198854031214","g":118,"n":3,"p":1886,"f":1886,"l":"french","t":"dragon","c":1791323993,"u":1,"b":0,"r":0},{"i":"237082896","s":"76561198067178033","g":0,"n":4,"p":9812,"f":9812,"l":"english","t":"I tired to play Crimson Desert of Linux. I ended up uninstalling it around chapter 5. The game crashes a lot. Movement is horrible, when I try to climb right the character moves up, moving forward in a town will change to crouch on its own, trying to use axiom force will switch to the mining drill and the character just moves in a circle until you either die or restart.  If I am  lucky I can play it for a few hours then the game will crash (freeze) and needs to be restarted. I noticed the game became more unstable after releasing the enhanced version.","c":1791321185,"u":0,"b":1,"r":0},{"i":"237082509","s":"76561198089731104","g":0,"n":9,"p":10511,"f":10511,"l":"german","t":"Ein Legendäres Spiel für alle die Cyberpunk, Witcher oder Fallout gespielt haben.\r\n\r\nGameplay technisch eine kleine Herausforderung aber machbar. Ich habe es auf dem PS5 Controller gespielt und hatte bis auf 2 kleine bugs die zwischendurch vorhanden waren keinerlei probleme.\r\n\r\nDie Grafik und die Spielwelt ist Wunderschön es macht eine Menge spaß die Welt zu erkunden, leider ist dass Temperatur design im spiel etwas nervig. Wer in der Roten Wüste oder auf verschneiten Gebirgen unterwegs ist brauch eine passende Ausrüstung die einen vor Kälte oder Hitze schützt.\r\n\r\nAuch die Fehlende Navigation auf der Karte die man heutzutage aus so ziemlich allen Spielen kennt wäre hier Wünschenswert fehlt aber leider komplett. Ledeglich wenn man Handelswaren Transportiert wird einem eine mehr oder weniger praktische Navigation angezeigt dazu Später mehr.\r\n\r\nDer Steuerung ist gewöhnungsbedürftig und leider durch 3 Spielbare Charaktere die alle eine komplett andere Kampfart und kombos haben wirklich sehr Schwierig. Ich habe mir leider nicht alle Kombos gemerkt da man die meiste zeit ohnehin mit Kliff unterwegs ist. \r\n\r\nDie Story ist am anfang etwas sehr Träge und fesselt einem nicht, wird aber gegen Ende doch ziemlich interessant. Es ist nur etwas Schade dass die Rote Wüste und Delysia leider kaum in der Story ist und diese Großen abschnitte werden überwiegend gemieden.\r\n\r\nLeider ist dass Spiel übersät mit nebenquests die allesamt nahezu identisch sind. Bringe mir bitte diese Gegenstände, besiege die Banditen oder bringe was von A nach B. Treibe die Kopfgelder ein. So gehen leider viele der Nebenquests die interessant sind unter. Manche Häuser haben ihre kleinen aber eigenen Geschichten die auch wirklich sehr interessant sind. Aber Nebenquests wie die Forschnungs Missionen sehen auf den Ersten blick genauso aus und gehen dadurch leider in den Hintergrund und werden ignoriert obwohl diese Später ziemlich praktisch sein könnten.\r\n\r\nDie Abyss Rätsel sind für mich sowie bei Fans von Prince of Persia ein Traum. Manche sind total Easy wohingegen andere einem in den Wahnsinn treiben können, aber zum glück gibt es ja dass Internet.\r\n\r\nDass Camp ist auch sehr schön, man hat seine Truhe, und alles was man so im Großen und ganzen brauch. Aber manche inhalte sie so unpraktisch dass ich diese nie gemacht habe. Wie die Lebensmittel farm oder die Viehzucht. Dass Besorgen der dafür nötigen Items ist so Zeitraubend dass die belohnungen sich dafür nicht lohnen. Ist nice to have aber brauche ich nicht,\r\n\r\nGenauso wie die Handelswaren. Items mit denen man im Spiel nix machen kann außer sie von A nach B zu Transportieren und sie dann zu verkaufen. Leider will aber nicht jeder Händler alle Items und Schnellreise, geht mit der Kutsche nicht.\r\n\r\nWohingegen die Boss kämpfe einfach nur Mega sind. Keine kleinen Kämpfe sondern mal richtige Herausforderungen die jederzeit wiederholt werden können. Wobei manche Bosse echt einfach sind und andere hingegen wirklich mit dem bekannten \"Zockerbuckel\" nur zu schaffen sind.\r\n\r\nDass Skill system hat seit dem Enhanced Update keine Großen Schwächen mehr und manche Fähigkeiten können durch beobachten erlernt werden was ich so in der form auch noch nie gesehen habe.\r\nAber es gibt auch ein paar Fähigkeiten die man nur durch zufall in der Spielwelt findet und auch nur dort erlernt werden Können. Diese sind auch für die Story zwingend Notwendig was ziemlich unpraktisch ist.\r\n\r\nIm Großen und ganzen gibt es jede menge inhalte die man ziemlich getrost ignorieren kann da diese eigentlich nix anderes sind außer um die Spielzeit zu verlängern. Leider machen diese aber auch keinen Spaß, zumindest mir nicht.\r\n\r\nAlles in allem ist hier für so ziemlich jeden was zu haben. Aber dieses Spiel ist nix für den \"Ich habe noch 1  stunde bis zum schlafengehen\" Mensch. Hier brauch man Zeit damit man nicht alles wieder vergisst.\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n","c":1791320779,"u":1,"b":1,"r":0},{"i":"237082055","s":"76561198801369896","g":41,"n":1,"p":2728,"f":5215,"l":"russian","t":"Одна из лучших игр всех времен и народов, обожаю и всем советую","c":1791320365,"u":1,"b":0,"r":0},{"i":"237081871","s":"76561198101136418","g":0,"n":1,"p":1927,"f":3738,"l":"german","t":"Für mich das beste Spiel seit Skyrim.\r\nCrimson Desert Enhanced hat mich so begeistert, wie es seit Skyrim kein anderes Spiel mehr geschafft hat. Ich habe wieder richtig Lust, eine Spielwelt in Ruhe zu erkunden, mich ablenken zu lassen und einfach zu schauen, was es noch zu entdecken gibt.\r\nDer Vergleich mit Skyrim bezieht sich für mich vor allem auf dieses Gefühl beim Spielen. Ich möchte weitermachen, weil ich neugierig bin, nicht weil ich noch eine Aufgabenliste abarbeiten muss. Genau das habe ich lange vermisst.\r\nFür mich eine klare Empfehlung und endlich wieder ein Spiel, für das ich mir gerne Zeit nehme.","c":1791320188,"u":1,"b":0,"r":1},{"i":"237080992","s":"76561199190268699","g":84,"n":4,"p":315,"f":558,"l":"english","t":"developer of the year.","c":1791319362,"u":1,"b":1,"r":0},{"i":"237080795","s":"76561198279171467","g":0,"n":3,"p":1087,"f":4311,"l":"brazilian","t":"Este game teve muitos problemas em seu lançamento, porém agora após varias atualizações esta otimo.","c":1791319183,"u":1,"b":0,"r":0},{"i":"237077111","s":"76561198091250330","g":286,"n":2,"p":1603,"f":1636,"l":"english","t":"absolute slop of a game, like someone handing you a big bowl of amalgamated slop, an awful story with  unresponsive controls that either dont work or arent labeled in the menus, cluttered visual mess of an environment where every leaf jitters which leaves you with an epileptic schock","c":1791315983,"u":0,"b":1,"r":0},{"i":"237075840","s":"76561198044308252","g":538,"n":64,"p":5390,"f":5390,"l":"czech","t":"One of the best looking worlds I saw in the games. This game is a little complicated, especially for controls, but the amount of content is so huge - worth the full price. My main con is the combat, it is hard to enjoy it.\r\n\r\nPros:\r\n+ WORLD\r\n+ GRAPHICS (BEST)\r\n+ INTERACTIONS\r\n+ STORY AND MAIN QUESTS\r\n\r\nCons:\r\n- REPETITIVE GAMEPLAY\r\n- BORING PUZZLES\r\n- CONTROLS (GAMEPAD)\r\n- COMBAT !!!\r\n- SOME BOSSES\r\n\r\nBut at the end of a day you will have a bunch of great screenshots.\r\nCinematic 65+ FPS @ 3440x1440 with no DLSS or FSR.","c":1791314886,"u":1,"b":0,"r":0},{"i":"237075756","s":"76561198418267006","g":0,"n":9,"p":530,"f":4812,"l":"english","t":"I did a ton of research before buying this game and below are my points of the good and the bad.\r\n\r\nTLDR: Game is a 9/10, and it's only getting better. Most 'cons' you see other people post are either bugs that have been fixed, or because they don't understand that it's okay to not be efficient.\r\n\r\n*Quick note: I play a lot of video games, and although I don't play a lot of open world games, I am quick to learn things. I would say my points come from someone with good common sense and decent game sense. Not like insane game sense, just decent.\r\n\r\nPros:\r\nGraphics are insane. Look up best video settings for your setup and play around with the POV angles based on your personal preference.\r\n\r\nTons of NPCs, and they interact with each other, the environment, etc. World feels ALIVE and not like most RPGs where there is a big city but like 10 people in it. \r\n\r\nCombat is awesome. There is crazy depth into what combos you can do, but you don't have to master all of them to be good at combat. It's just awesome they are available in case you want to get flashy/good. Tip: Focus on one fighting weapon (sword and shield is a good start) and focus on learning those combos for you first bit of gameplay.\r\n\r\nWorld is in-depth, but not too complicated. You don't need to know everything in this game to enjoy it, but you can read journal entries and really get into the lore if that is the kind of thing you like.\r\n\r\nThe developers are so fast to enhance/fix any issues that come through. Like 90% of the complaints I would see from 6 months ago online I have not encountered because they have all been fixed by now.\r\n\r\nThis game is like medieval-fantasy RDR2 with better graphics and combat, and overall every aspect is just an upgrade EXCEPT don't expect an 'Arthur Morgan' level of story telling. The story is still pretty good. The dev team added a ton of stuff to the story so when I played it, it felt good.\r\n\r\nCons:\r\n*Quick Note (again sorry): I think most of the cons are not cons, but instead preferences of how to play and people not being used to not just following the yellow indicator on the map to each new story point. I am super critical of games too, so the below points are not just biased justifications of shortcomings of the game. Instead, they are points that I was expecting to have to live with that would make the game worse, then I played and realized they are not just 'not that bad' cons, a lot of them were not even cons at all.\r\n\r\n\"The game is confusing and idk what to do at every step\": First, this game is not confusing, and yes it has depth. People I think are confusing the two. This game feels REAL because you don't know everything off the bat, that includes with the story, puzzles, combat, etc. You know enough to play the game and enjoy it, so don't think \"this is going to suck to play until I learn how to get good\" because that's not the case at all. You can play and enjoy this game a ton without doing every little thing efficiently. Part of the fun of this game is figuring things out. If you want to min-max your time to get as strong as possible and complete the game as fast as possible, this game is not for you. Enjoy the game, it's too large to just try and 100% for the sake of completing the game, and you will get frustrated if that is your main goal. Enjoy your time and enjoy learning things. Best advice is to try a puzzle on your own for 15 minutes, and if it doesn't work then look it up. DO NOT look up 'how to make money fast' or 'get the fastest mount' because if you just wanted to get handheld to the best stuff in the game, what's the point of playing in the first place? Have a sense of wonder and whimsy, don't let it be stifled by trying to do everything perfectly right and perfectly fast. If you are stuck for some time, then absolutely look it up, otherwise enjoy the depth and mystery this game has to offer. DO NOT look up tips and tricks at first, or maybe at all, because a lot of them are filled with 'go run this specific route to get lots of iron' or 'go rob this place every day for quick money!'. It genuinely takes the fun out of the game, and it's just better to not know any of those hacky methods because once they are in your mind, they are hard to ignore.\r\n\r\n\"Combat is too complicated, I am just going to hack and slash\": Combat is not too complicated, it's just that there are so many awesome combos available people get frustrated they don't know them all from the start, so they button mash. Instead, you should learn two combos, use them until muscle memory, then incorporate another one, rinse and repeat. If the game had literally hack and slash as the only two moves, people would not complain; but since it has tons of awesome combos that you CAN do but don't HAVE to do, people feel frustrated. Learn and practice as you go in this game, it's very satisfying. Also, the combos are not absolutely necessary, just fun, so you can still enjoy the game just hacking and slashing for quite a while.\r\n\r\n\"Story is boring\": Touched on this before but it is not boring, it's pretty good, just not peak story telling. I don't think it detracts anything from the game, and it adds some good world building.\r\n\r\n\"NPCs are lifeless\": They are not lifeless, they have more life than any other NPCs out there. EXCEPT they have limited voice lines when you 'greet' them on the street. Besides that, you will see them talking, arguing, laughing, working, drinking, etc. Most lived in world I have played in.\r\n\r\nOverall this game is a 9.8/10, and you will not regret playing it. Just don't worry about min-maxing your time, enjoy the world around you, and be comfortable learning things as you play (as opposed to understanding everything after a couple hours). \r\n\r\nAlso, USE CONTROLLER. I am a m&k main, but controller feels really good with combos. Try controller for the first 5 hours and if you don't like it, switch, but trust me you will like controller lol.","c":1791314797,"u":1,"b":1,"r":0},{"i":"237074022","s":"76561198091125640","g":169,"n":8,"p":66,"f":66,"l":"russian","t":"оч плохо для 2026, угловатая графика (при приближении карты я вижу пиксели нарисованные это ваще как), управление максимально неприятно консольное, как будто игра из 2017 или раньше, неприятный перегруженный интерфейс, ужасный перевод на русский (если хоть немного знаете английский, то становится понятно, что половину фраз персонажей просто додумывают, говорят они вообще по-другому)\r\n\r\nя вообще не понял, как эта игра снискала такую популярность, мб раскрывается после какого-то количества часов внутри, но это прям мучение, после современных тайтлов очень неприятно\r\n\r\nполагаю зайдет фанатам каких-то азиатских ММОРПГ, вайб общий имеется","c":1791313276,"u":0,"b":1,"r":0},{"i":"237073827","s":"76561199216588021","g":0,"n":97,"p":939,"f":1194,"l":"english","t":"peak shi","c":1791313095,"u":1,"b":1,"r":0},{"i":"237071617","s":"76561199118727583","g":0,"n":8,"p":13834,"f":14282,"l":"schinese","t":"挺想给推荐的，但实际上玩下来，感觉实在给不出推荐，这游戏就是什么都像，可又什么都不像，做了面但内部感觉挺虚的，有些内容甚至为了表达开发者的严谨而带来无谓操作太多了，不说别的，就说冰箱、衣柜、书籍、元素这些不查攻略、不专注支线的内容，有多少人能知道？当然，这个游戏，也不是那种差得离谱，毕竟游戏的框架结构是可以的，后面通过持续优化的，例如增加引导、提示词、高亮道具等，可打造的空间还是蛮大的。我从2.0版本开玩的，230小时后，剩下的任务居然是跑腿、抓通缉犯这种毫无意义的任务，不知道开发者想表达什么？！所以这游戏目前的状况，只适合一直关注红沙的玩家，目前还达不到吸引路人的程度。等到DLC出了，一些无关要紧的东西去掉了，可能会改测评吧。","c":1791311290,"u":0,"b":1,"r":0},{"i":"237071057","s":"76561198004510980","g":924,"n":12,"p":6668,"f":8184,"l":"spanish","t":"Juegazo, y encima lo doblaron al castellano seis meses después de su lanzamiento. Voy a darle todo mi apoyo a este proyecto","c":1791310859,"u":1,"b":1,"r":0},{"i":"237070081","s":"76561198039145398","g":245,"n":19,"p":24901,"f":24923,"l":"english","t":"One of the best games I ever played.","c":1791310086,"u":1,"b":1,"r":0},{"i":"237070034","s":"76561198762101150","g":0,"n":1,"p":19721,"f":19780,"l":"brazilian","t":"Top","c":1791310051,"u":1,"b":1,"r":0},{"i":"237069318","s":"76561198186922445","g":0,"n":2,"p":39861,"f":48742,"l":"english","t":"Definitely one of the best RPG's that I've ever played. The game is visually incredible and the combat system makes it so much fun and very easy to remember different combos. I really, really have enjoyed playing this game and I still haven't beaten it. I am enjoying it too much and enjoying exploring too much to let it end just yet!","c":1791309518,"u":1,"b":1,"r":1},{"i":"237067198","s":"76561198119959810","g":0,"n":20,"p":1273,"f":4988,"l":"koreana","t":"조작감 처음에만 불편하고 적응 되다 보니 \r\n게임이 재미 있어서 빠져들게 되네...\r\n다시 백수 되고 싶다아~~~~~~~~~~~~~~~~~~","c":1791307865,"u":1,"b":0,"r":0},{"i":"237066637","s":"76561198832978070","g":0,"n":3,"p":4024,"f":4024,"l":"russian","t":"Про саму игру у меня нет никаких претензии. Но вот его техническое состояние... Игру ещё патчить и патчить. Хотя я уже играю в версию Enhanced. Игра просто непростительно часто вылетает или виснет намертво мой комп. Даже Skyrim с модами не так часто вылетает, как Crimson Desert. Пришлось настройки сбавить и выключить трассировку, хотя игра у меня летает на максималках. Но всё равно игра продолжает вылетать, но уже реже. Но это всё равно сильно портит мои впечатления от игры.(((","c":1791307413,"u":0,"b":1,"r":0},{"i":"237065390","s":"76561198663280307","g":0,"n":1,"p":13731,"f":13731,"l":"russian","t":"Игра весьма хороша собой. Конечно проблемы у игры есть , например рыбалка редких видов рыб. Недокрутили скажем так. Можно было бы добавить минимеханик по ловле рыб. О сюжете все уже всё сказали. Дальше что касается скрытых квестов. До многих квестов добраться физически невозможно либо крайне тяжело. Это дерьмо, а не механика. Это нужно сильно упрощать, что бы человек смог легче добраться до квеста который ему нужен. Мне например однажды захотелось найти Босса Кутуна в раскопках. Я выполнил почти все возможные миссии, а маркера нужного квеста так и не появилось. Это просто отвратительно и я расстроен. Так же расстраивает что нет конструктора персонажа. В такой игре это быть должно. Я хочу создать своего собственного персонажа, неповторимого, но эту возможность у меня отняли, это тоже расстраивает. Не только меня это расстраивает на сколько я знаю. Нельзя строить отношения с кем либо, нет романов. Контента 18+ например с ведьмами тоже нет. Ждать чего то такого что было в Ведьмаке не стоит. Конечно очень-очень жаль.  Минусов не много, но они сильно сильно бесят. \nМир тут насыщенный, красивый, анимации обалденные, графика супер. Квесты конечно хотелось бы более разнообразные и необычные. Мини - игры тоже все очень прикольные мне нравятся. Спустя часов 150 кстати есть еще одна проблема, мало ячеек для всякой всячины хотя я расширил их по максимуму. При этом я так и не нашел как сделать свой дом больше , построить второй этаж или хоть как то расширять. Возможно такой механики тоже нет. Денег стало так много что непонятно куда их девать. Денег просто куча и нет таких функций куда их можно потратить. Всё слишком дешёвое. Очень хочется что бы в DLC были возможности тратить огромные кучи денег на что то полезное. Разумеется в этот раз и сюжет должен быть отличным.  \nОчень мало эпических боссов. Сделайте больше. Мир огромен и гигантских боссов можно тоже побольше. В итоге только 4 балла из 5. Добавьте нормальные романы с девушками, боссов и упростите открытие скрытых квестов тогда будет 5 звезд","c":1791306424,"u":1,"b":1,"r":0},{"i":"237063917","s":"76561199390009153","g":0,"n":1,"p":244,"f":1315,"l":"russian","t":"Аху***ная игра,+Rep","c":1791305279,"u":1,"b":0,"r":0},{"i":"237063630","s":"76561198092848524","g":33,"n":10,"p":4375,"f":7629,"l":"german","t":"ganz tolles Spiel, kann ich nur empfehlen :)","c":1791305029,"u":1,"b":1,"r":0},{"i":"237063207","s":"76561198708457528","g":28,"n":1,"p":2052,"f":3342,"l":"schinese","t":"任务太长了","c":1791304663,"u":1,"b":1,"r":0},{"i":"237063206","s":"76561197987749257","g":0,"n":6,"p":1774,"f":4959,"l":"english","t":"10/10","c":1791304662,"u":1,"b":0,"r":0},{"i":"237063065","s":"76561198107691308","g":0,"n":2,"p":1922,"f":10787,"l":"schinese","t":"真的很不错，太开放了。关键是真的耐玩。","c":1791304571,"u":1,"b":1,"r":0},{"i":"237061034","s":"76561197987452106","g":0,"n":17,"p":432,"f":1022,"l":"dutch","t":"Played for a while. Looked good until you gotta find a fellow named elrich. He is suposed to be outside his manor but never appears. apperently a known bug.  Not a good sign for the rest of the game. Not for me. Ill just wait for GTA 6. Apperntly rockstar is the only developer that can deliver bugfree games.","c":1791302975,"u":0,"b":1,"r":0},{"i":"237060171","s":"76561199189362998","g":14,"n":1,"p":542,"f":1709,"l":"schinese","t":"刚买一天就玩了九个小时，真的满足我对冒险的一切幻想，推荐","c":1791302264,"u":1,"b":0,"r":0},{"i":"237059520","s":"76561199710676651","g":150,"n":1,"p":7886,"f":7886,"l":"schinese","t":"红沙，血色加冕——很久以前有无数人在这里流过鲜血，所以才被称为红色沙漠。\n不可否定，这是一款3A开放巨作：一场有关大陆统一与神器战争的剑与魔法的故事......\n故事的开始：\n孵化龙蛋，我踏在龙背上邀游了整片帕维尔大陆。\n过程中，谁不想急头白脸地看着攻略收集传说中的生物，收集装备武器，然后再找女巫老婆们镶上完美的齿轮？\n披着重甲，手拿利器，背着嘟嘟鸟包，骑着A.T.A.G，安全感涌上心头，谁又忍得住不一顿狂轰滥炸？而后是谁在教庭前忏悔？\n在故事的结尾，看着崭新的龙铠，眼下是万米高空，我也无所畏惧不顾一切地从阿比斯纵身而下。\n我们也时常思考：\n佩伦是否重建完毕？\n阿比斯神器是否集齐？\n地区是否解放全？\n十八般武艺是否样样精通？\n图鉴是否齐全？\n灰鬃，我们的故事还远未结束，未知的征程正在等着我们......","c":1791301770,"u":1,"b":0,"r":0},{"i":"237058842","s":"76561199882347528","g":42,"n":4,"p":4335,"f":4383,"l":"schinese","t":"游戏引导真的跟棍木一样 打一半还要查攻略 还有这个b解密玩得很恼火 主线塞了太多解密我打最终boss打一半告诉我要解密给我的激情干没了 但是这游戏战斗还不错 画风太戳我了 制作组也一直在优化更新 总体而言玩了几十个小时给我的体验感还是很不错的 希望dlc能做好","c":1791301220,"u":1,"b":1,"r":0},{"i":"237058451","s":"76561198341527081","g":0,"n":10,"p":4907,"f":7628,"l":"schinese","t":"来到跃升塔，闪退，再进游戏主角就一直往前走，死活不进游戏，查了一下说是autorun bug ,这个BUG没人修吗？","c":1791300904,"u":0,"b":1,"r":0},{"i":"237058316","s":"76561197981443598","g":0,"n":1,"p":7565,"f":7674,"l":"koreana","t":"불편하고 개좆같은 게임, 개발자가 어떤 마인드길래 이따구로 게임 설계했는지\r\n궁금함.\r\n시간을 돌린다면 다시는 안산다.\r\n갈수록 짜증남. 돈 안까워 메인만 쭉 밀고 빨리 삭제하고 싶다.","c":1791300781,"u":0,"b":1,"r":0},{"i":"237057829","s":"76561198247583610","g":0,"n":15,"p":2109,"f":2130,"l":"russian","t":"Куча всего и в то же время ничего, ужасная оптимизация, бесячие тени, куча дёрганой листвы, и прочее прочее прочее. Выглядит как суп из семи залуп, вроде и наваристо, но на вкус ХУETA","c":1791300383,"u":0,"b":1,"r":0},{"i":"237056713","s":"76561199881052439","g":74,"n":1,"p":1490,"f":2503,"l":"schinese","t":"一个游戏好不好就一个标准就是好玩，毫无疑问这是一个足够优秀的游戏","c":1791299499,"u":1,"b":0,"r":0},{"i":"237055115","s":"76561198172940865","g":0,"n":6,"p":2980,"f":5167,"l":"french","t":"Incredible. You feel lost but still advance. missing half or more of what you can find. but everything you find feels so good. I recommend if you feel you miss a good story game. it will take you for a long time","c":1791298296,"u":1,"b":1,"r":0},{"i":"237054940","s":"76561198324934920","g":52,"n":3,"p":7808,"f":8898,"l":"english","t":"probably the best open world game i played recently","c":1791298160,"u":1,"b":1,"r":0},{"i":"237054765","s":"76561199101448879","g":0,"n":1,"p":12075,"f":15914,"l":"schinese","t":"很喜欢探索的感觉","c":1791298024,"u":1,"b":1,"r":0},{"i":"237054147","s":"76561198216362747","g":0,"n":8,"p":6426,"f":6426,"l":"english","t":"Incredible game. Tons of exploration, the map is beautifully crafted, and the story is pretty good. Combat is similar to the Witcher 3 with a little more pzazz. \r\n\r\nOnly complaints would be clunky camera controls and forced horse riding, which also stinks. \r\n\r\nLooking forward to the DLC!","c":1791297527,"u":1,"b":1,"r":0},{"i":"237053530","s":"76561198877112676","g":163,"n":12,"p":5218,"f":5218,"l":"schinese","t":"我的配置不高，这是唯一一款我愿意降低画质和帧率去游玩的游戏。","c":1791297015,"u":1,"b":0,"r":0},{"i":"237052994","s":"76561198119056837","g":0,"n":64,"p":12639,"f":16770,"l":"koreana","t":"[h1]검은 사막을 싱글 플레이 게임으로서 재밌게 했었기 때문에 붉은 사막자체에는 큰 불만은 없음.[/h1]\r\n\r\n아쉬운 점만 몇개 적자면\r\n1. 교역이 좀 더 할만했으면.\r\n1. 컨트롤이 나아졌다고는 하지만 여전히 불편함. 특히 x 두번이 이단 점프인지 비행인지 자기 맘대로임. 지나가다가 괜히 사람 패서 벌금나오는것도 황당함.\r\n1. 대사가.. 판타지라기보다는 사극풍의 대사라 이게 맞나 싶음.\r\n1. 정말 3주인공 체제로 만들고 싶었던거임? 거의 강제로 클리프로 진행하게 만들었는데.\r\n\r\n스토리에 대해서 사견을 적자면.\r\n인간은 아무래도 현재 살고 있는 시대가 사상의 기반이 되어버림. 중세를 잘 재현할수록 줄타기를 정말 잘해야되는데 붉사는 이게 실패한거 같음. 붉은 사막의 등장인물들은 거친 세상을 살고 있는 사람이라는 느낌이 전혀 안듬. 그래서 진행하는 동안 몰입이 거의 안되더라. 레더리나 위쳐의 시스템은 그럭저럭 가져왔지만 이러한 부분은 캐치하지 못한거 같다.\r\n뭐. 스토리 전개는 개취일테니 그냥 넘어감.\r\n\r\n레퍼런스로 레더리2 를 50프로 위쳐3를 30프로, gta 5를 20프로 가져오고 싶었던거 같다. 레퍼런스에 비해 완성도가 높지는 못하지만 이런시도가 많이졌으면 하는 바람이다.","c":1791296570,"u":1,"b":1,"r":0},{"i":"237052948","s":"76561198813416043","g":0,"n":4,"p":9011,"f":10817,"l":"schinese","t":"一般","c":1791296529,"u":0,"b":1,"r":0},{"i":"237052416","s":"76561197979674452","g":163,"n":6,"p":334,"f":354,"l":"tchinese","t":"遊戲持續優化，比剛開放時明顯改善許多","c":1791296077,"u":1,"b":1,"r":0},{"i":"237052403","s":"76561198422924391","g":38,"n":2,"p":5072,"f":5525,"l":"schinese","t":"娇妻德米安嘿嘿嘿~~","c":1791296068,"u":1,"b":0,"r":0},{"i":"237051425","s":"76561198118165147","g":0,"n":17,"p":14355,"f":14355,"l":"english","t":"I really loved this game, does it matter if everytime i want to use my Axiom Force I climb off a cliff.... No. Does it matter if everytime I try to double jump, for some reason it does something different every time?.... No. Does it matter that I have no clue how you are meant to figure out some of the puzzles... No. Does it matter that in fights I feel like my fingers are learning gymnastics.... No. It's honestly some of the most fun I've had in a game for a long time, it gave me a skyrim vibe, only in that I loved every second of it, flaws and all.","c":1791295280,"u":1,"b":1,"r":0},{"i":"237049817","s":"76561199684338912","g":0,"n":1,"p":4455,"f":8470,"l":"koreana","t":"할만한데 아직할게 너무많음.. 렉도안걸리고 쾌적함","c":1791293927,"u":1,"b":1,"r":0},{"i":"237049656","s":"76561199237869018","g":51,"n":4,"p":1386,"f":1386,"l":"schinese","t":"神神神，推荐去玩","c":1791293795,"u":1,"b":0,"r":0},{"i":"237049282","s":"76561199008639654","g":133,"n":9,"p":14391,"f":14391,"l":"english","t":"goty of 2026 for me.","c":1791293462,"u":1,"b":1,"r":0},{"i":"237048827","s":"76561198105390034","g":463,"n":43,"p":10063,"f":13790,"l":"english","t":"I have a platypus as a pet.","c":1791293052,"u":1,"b":0,"r":0},{"i":"237047736","s":"76561199073784784","g":0,"n":1,"p":5240,"f":6978,"l":"english","t":"best game since elden ring!","c":1791292025,"u":1,"b":1,"r":0},{"i":"237047184","s":"76561198176541837","g":252,"n":19,"p":6279,"f":6279,"l":"schinese","t":"整体还行，最后BOSS战整段垮掉。战斗看上去很丰富但是后期打满齿轮也是满屏特效伤害爆炸，我甚至看不到BOSS了。我感觉战斗成长的方向错了。整个解谜引导也是一坨，阿比斯的设计只能说一坨狗屎。前期和中期很有趣，后期就是无限通马桶很乏味了。勉强给个好评吧！","c":1791291510,"u":1,"b":1,"r":0},{"i":"237046305","s":"76561199008358727","g":58,"n":3,"p":175,"f":175,"l":"russian","t":"это дерьмищее","c":1791290669,"u":0,"b":0,"r":0},{"i":"237046148","s":"76561199038694434","g":38,"n":8,"p":5330,"f":5330,"l":"russian","t":"Нейросолоп, добавили всего и получился батин суп-пюре","c":1791290520,"u":0,"b":1,"r":0},{"i":"237046137","s":"76561198051844817","g":0,"n":2,"p":2997,"f":6083,"l":"polish","t":"Ta gra to majstersztyk!","c":1791290513,"u":1,"b":1,"r":0},{"i":"237044096","s":"76561198333283677","g":0,"n":8,"p":9508,"f":9911,"l":"english","t":"endless explorationnnnnns!!! robots & dragons and all sort off things in one game!!","c":1791288346,"u":1,"b":1,"r":0},{"i":"237044042","s":"76561199129104742","g":108,"n":9,"p":247,"f":303,"l":"english","t":"Only played for 4 hours but its really good so far, runs fine enough on RTX 5060 8GB VRAM","c":1791288289,"u":1,"b":0,"r":0},{"i":"237042986","s":"76561198339331306","g":3,"n":1,"p":1770,"f":11416,"l":"russian","t":"интересно и захватывающая игра","c":1791287203,"u":1,"b":1,"r":0},{"i":"237042803","s":"76561198855661473","g":209,"n":81,"p":2414,"f":2414,"l":"schinese","t":" [h1]这是一款什么都好但是割裂混乱的游戏 [/h1]\n技能树很长但大多数技能都是没有用的废物，打起来最后还是一直平a，很多探索所需的关键能力直到主线中期才给你（类比塞尔达相当于开局只给你炸弹，但是神庙照样需要四个能力才能解），导致前期根本没办法探索，只能做他那个又臭又长的主线，主线的任务设计水平完全没有，平均三个任务就有一个“骑马跟随xxx”这种上世纪的傻逼任务，其他的也就是通通马桶。\n战斗方面主角没有对群的能力但是就喜欢疯狂的堆怪，印象最深的是采石场和主线的战场两大关真是屎中之屎，你需要在一片不断刷新怪的区域击杀快1000只才能通过，砍了将近30分钟，同时就如前文所言主角的技能树和没有没什么区别所以全程只能摁那个b平a，重击所耗的耐力和造成的伤害完全不对等导致用不上，翻滚的性能极其诡异我甚至不知道有没有无敌帧，boss的设计水平属于是你打你的我打我的。\n探索方面地图并没有标出传送点同时传送点只有一小块地板导致根本找不到，只能用他那个b武器聚光传送点给的还很少，前期没有飞行坐骑只有马跑路相当折磨\n画面方面游戏同时拥有诡异的高饱和度和到处乱飞的树叶草叶，我玩半个小时我就得休息一会眼睛，设置里甚至没有设置能关闭他的草叶乱飞效果\n整个游戏的体验就是明明有这么多看起来听起来就很有趣的东西，但是玩起来就像催眠一样无聊，这就是只有设计时的灵光一现没有好的游戏流程规划 设计的结果\n————————分割线————————\n游戏通关我决定还是改为好评，中期开始构筑完成之后堆怪变为割草，后面的剧情也开始有一些让人热血沸腾的大场面，拿到飞龙以后跑图都变成一种享受，在中期往后终于体验到了所谓极致的堆料，支线水平我说实话比主线水平高，而且量大管饱，但是前期说的问题依旧存在，中期以前只能给4分，中期以后可以给到8分吧","c":1791287004,"u":1,"b":1,"r":0},{"i":"237039240","s":"76561198372274575","g":21,"n":19,"p":8673,"f":8838,"l":"schinese","t":"游玩过程能看到塞尔达、巫师、大镖客等游戏的影子，任务过程没有明确引导和路线","c":1791282763,"u":1,"b":0,"r":0},{"i":"237038796","s":"76561199069560590","g":49,"n":5,"p":1319,"f":1538,"l":"schinese","t":"非常好开放世界，让我找回了第一次玩老滚5的感觉，但棒子真会做交互和解密吗，简直一坨屎","c":1791282218,"u":1,"b":1,"r":0},{"i":"237038512","s":"76561198121458104","g":85,"n":6,"p":9017,"f":16542,"l":"russian","t":"Кратко : Замечательная песочница с кучей механик, интересными загадками и достаточно хорошо, для таких масштабов, проработанным миром.\n\nНа самом деле, я очень давно не встречала качественных соло-песочниц. Последнее что из этого помню, это Скайрим, но он морально уже устарел) Тут же, у нас огромных масштабов открытый мир, с разными биомами, интересными, то тут, то там, деталями, фракциями и прочим. Переходы между биомами плавные, природа проработана на крепкую 5. Нпс имеют свой распорядок, реагируют на погоду, происходящее, есть эффект жизни. Из того, что не понравилось -ночь, будто слишком светло, при любых настройках, но это уже незначительный минус.\n\nМеханики, их реально много, по началу теряешься. Со временем уже спокойно вспоминаешь комбинации и проблем не возникает. Но, огромное количество механик, так же скорее плюс. Управление, по началу кажется неудобным, потом так же становится вполне привычным. \n\nСамое слабое звено, это сюжет, но не лор. Лор проработан. Сюжет, будто сыроват и проходит фоном. Не могу сказать, что он однозначно плохой, но игра, будто совсем не про него.\n\n\n","c":1791281869,"u":1,"b":1,"r":0},{"i":"237037126","s":"76561198439880558","g":253,"n":27,"p":1576,"f":1576,"l":"french","t":"No.","c":1791280160,"u":0,"b":0,"r":0},{"i":"237036982","s":"76561199387448375","g":30,"n":20,"p":987,"f":1131,"l":"english","t":"GAME IS BAD ASS!","c":1791279986,"u":1,"b":0,"r":1},{"i":"237035085","s":"76561198196609828","g":0,"n":4,"p":3381,"f":3381,"l":"russian","t":"Было бы отличное приключение, если бы не критичный баг - зависание и вылет игры в случайный момент, после чего дальнейшее прохождение становится невозможным. Проблема не единичная, с чем связана - непонятно, как пишут в сети, может впервые проявиться спустя 10 часов игры, а может и через 150. У меня скорее первый вариант. Изменение настроек графики, переустановка игры не помогают. В первые два раза помог откат на раннее сохранение, после чего ещё несколько часов игра оставалась стабильной. При следующем возникновении бага ни откаты на другие сохранение, ни даже начало новой игры не помогли ","c":1791277553,"u":0,"b":1,"r":0},{"i":"237032401","s":"76561197992352044","g":0,"n":295,"p":5260,"f":5260,"l":"english","t":"The game is really good in many points. My issue is more about combats against boss (which is the main part of the game), you are continuously ragdolling and the game doesn't really teach you how to do combat properly. Combat mechanics are really poor and the game do a bad job explaining it to you. \n\nAnd a lot of quest are just fedex with no souls. Some of them are just poping up for no reason.\n\nBlack Desert was better made.","c":1791273826,"u":0,"b":1,"r":0},{"i":"237031692","s":"76561198192738901","g":0,"n":14,"p":1061,"f":1142,"l":"japanese","t":"キーウィをペットにできる素晴らしいゲームです","c":1791272815,"u":1,"b":1,"r":0},{"i":"237031544","s":"76561198058087445","g":144,"n":43,"p":2319,"f":2787,"l":"koreana","t":"인핸스드로 시작했는데도 스토리가 내가 이거 왜하는지 모르겠음\n특히 캐릭터들이 한국 영화에서 유쾌한 척 하는 캐릭터 같아서 그것도 개인적으로 별로\n그리고 회색갈기 동료들이랑 말타고 가면서 얘기하면 왜 말타고 이상한데로 가다가 지들은 빠지는건가요...? 왜 말타고 가면서 대화를 하게 만든지 모르겠음. 퀘스트 쪽으로 가게 하는것도아니고 지도보면 이상한데에 데려다놓고 지는 감;\n또 작은 동물들은 잡을 수 있게 해놓고 죽이는 선택지는 없고..\n\n근데 재미가 없냐? 그건 아니라고 생각함\n사람도 너무 완벽하면 재미가 없듯이 이 게임도 그렇다\n솔직히 불만 드럽게 많은데 장점이 없냐고 하면 없지도 않아서 세일 때 사면 충분히 재밌게 즐길 수 있다고 생각함\n그리고 컨텐츠는 진짜 드럽게 많은거같음\n또 펄어비스가 이런 게임 개발 안해본 티가 나는 대목이 많은듯\n\n솔직히 아쉬운 점 많지만 한국에서 이런 게임이 더 나왔으면 좋겠고 펄어비스도 더 발전했으면 좋겠으니까 추천","c":1791272613,"u":1,"b":1,"r":0},{"i":"237030241","s":"76561199767054889","g":84,"n":3,"p":1601,"f":2781,"l":"schinese","t":"屎一样的解密，一个制作组只会搞解密了，这游戏去除解密能打8分，加上解密只能是5分","c":1791270795,"u":0,"b":0,"r":0},{"i":"237027867","s":"76561198333698414","g":0,"n":2,"p":724,"f":1335,"l":"french","t":"J'hésitais à le prendre car peur de l'immensité, du lore, une config pc (et un portable!) insuffisante pour le faire tourner, etc... \n\nJe ne regrette pas du tout si ce n'est de ne pas l'avoir pris plus tôt !\nMon pc le fait bien tourné presque tout en ultra et en 30fps (quelques réglages à faire encore) alors que ma config est proche du minimum recommandé. \n\nLe jeu est juste énormissime ! Mais vous ne pouvez pas vous en rendre compte tant que vous ne le lancerez pas ! Si on le compare avec d'autres AAA je dirais qu'on à une bonne dizaine de jeu réunis en un ! \nIl y a du contenu de partout, toujours un truc a faire, à ramasser, a fouiner, des combats, des énigmes... ce qui fait prendre 2h pour une quête qui aurait du durer 15min.\n\nC'est inimaginable le boulot qui à été abattu ! Après des années à se faire clairement arnaquer par les plus grands studios là on en à pour notre argent.\n\nLa seule chose que je lui reprocherais ce serait l'histoire, bien que je n'ai pas encore beaucoup d'heure j'ai pas l'impression d'être porté. On est pas vraiment dans le personnage, son histoire, etc... Les débuts sont flous, on à aucune info. Dommage que cela soit un peu secondaire mais peut-être que cela va évolué ! Il reste quelques bugs (poisson hors de l'eau, PNJ, etc...) mais c'est vraiment minime par rapport au reste.\n\n\nConfig PC portable : \nRog Strix G17\nIntelCore i7-10750H\nRTX2070\n32go de ram","c":1791267317,"u":1,"b":0,"r":0},{"i":"237027542","s":"76561198044101322","g":130,"n":15,"p":7535,"f":12085,"l":"english","t":"This game is marvelous. The  world is huge, so much to explore! I am having a blast. Pearl Abyss is doing an outstanding job with their care about this game. Highly recommended.","c":1791266819,"u":1,"b":1,"r":0},{"i":"237027499","s":"76561198404791698","g":1289,"n":25,"p":18261,"f":25526,"l":"english","t":"Absolutely stunning achievement & game. I haven't felt this sense of... wonder in a game in longer than i can actually remember. Not a perfect game, but this checks so many boxes & scratches so many itches i have & it does so VERY well. Been gaming quite some time & feeling this sense of adventure again is priceless. As cheese as it completely does sound, CD has honestly helped to rekindle my love for the hobby. Top 5 goat for me.","c":1791266765,"u":1,"b":1,"r":0},{"i":"237026139","s":"76561198068527726","g":132,"n":4,"p":6520,"f":7094,"l":"english","t":"i think something not pc is better steam ♥♥♥♥♥♥♥ sucks keep having to reinstall game from disc errors and other ♥♥♥♥♥♥♥♥ from steam issues. ♥♥♥♥ steam.","c":1791264766,"u":0,"b":0,"r":0},{"i":"237021263","s":"76561198358896609","g":53,"n":10,"p":2200,"f":2841,"l":"schinese","t":"这游戏现在挺好的,没有网上那些喷子喷得那么差. 已经连续玩了一整个国庆,内容多到玩不完","c":1791257824,"u":1,"b":1,"r":0}]},"analysis":{"app":"3321460","analyzed":"2026-10-16","from":"2026-10-09","to":"2026-10-16","sampleSize":165,"scopes":{"all":{"praise":[{"title":"Huge, explorable open world","detail":"The most common praise in every language: a vast, handcrafted world with endless things to discover, strong immersion, and a feeling of freedom.","quote":"very immersive world with endless exploration"},{"title":"Visuals and scenery","detail":"Graphics and scenery are called some of the best in the genre, mostly by players with capable hardware."},{"title":"Combat and variety of activities","detail":"Fluid, satisfying combat plus a long list of side activities (crafting, trading, hunting, mini-games, housing) that keep players going for hundreds of hours."},{"title":"Post-launch support","detail":"Players notice the 2.0 / Enhanced updates, quick patches and the developer's attitude, and many look forward to the DLC.","quote":"quality of life improvements since launch ... makes this, in my opinion, GOTY"}],"complaints":[{"title":"Puzzles with no guidance","detail":"Abyss and other puzzles are the most repeated complaint among Korean and Chinese reviewers and also come up in English; many say they cannot be solved without a guide.","quote":"Greatest game with the absolute stupidest puzzle system ever."},{"title":"Crashes, launch failures and optimization","detail":"A large share of negative reviews are about crashing on launch, in the map or inventory, freezes, shimmering or blurry graphics and heavy reliance on ray reconstruction."},{"title":"Controls and interaction","detail":"Clunky, unresponsive dodge and interaction, too many key combinations, weak gamepad camera and lock-on."},{"title":"Story, characters and quest design","detail":"Story called weak or confusing even after the update; quests padded with fetch tasks and slow follow-the-NPC sections; unclear objectives."},{"title":"Content feels wide but shallow","detail":"Many mechanics but little depth, and boss fights criticized for stunlocks and one-hit mechanics.","quote":"Wide as an ocean, deep as a puddle."}]},"english":{"praise":[{"title":"Open world and immersion","detail":"Compared to Skyrim, Witcher 3 and Red Dead 2: a populated, immersive world with a huge amount to do.","quote":"I honestly haven't felt this invested in a world since Skyrim."},{"title":"Graphics and combat","detail":"Beautiful visuals and satisfying combat are the other most-named strengths."},{"title":"Value and hours of content","detail":"Many players report 100 to 300+ hours with plenty left; several call it a game of the year candidate."},{"title":"Improved since launch","detail":"Reviewers mention 2.0 and Enhanced as clear improvements, including the story, and look forward to the DLC."}],"complaints":[{"title":"Crashes and failure to launch","detail":"The single biggest English complaint: crashes on the main menu, the map or inventory, GPU hangs, and refund frustration."},{"title":"Clunky controls","detail":"Dodge and interaction feel unreliable, key bindings are limited, and there are too many steps for simple actions."},{"title":"Weak story and tedious quests","detail":"Story and characters described as boring or incoherent; side quests padded with fetching and slow NPC escorts.","quote":"The characters are as deep as a puddle"},{"title":"Puzzles and poor guidance","detail":"Puzzles are called boring or unfair, and the game rarely tells players what to do or how systems work."},{"title":"Boss design and shallow systems","detail":"Bosses criticized for stunlocks and no proper dodge or parry; inventory limits and many shallow mechanics."}]},"korean":{"praise":[{"title":"Exploration and vast world","detail":"Freedom to explore anywhere is the most cited strength; players say there is always more to do."},{"title":"Fun and sheer amount of content","detail":"Described as very fun overall, with strong graphics and a huge amount to do."},{"title":"Developer response","detail":"Quick patching after problems is praised, and several players bought or pre-ordered the DLC."},{"title":"Story improved","detail":"Several say the story is better after Enhanced, though it is not Red Dead 2 level."}],"complaints":[{"title":"Abyss and other puzzles","detail":"The most frequent complaint: puzzles are stressful, give no clear direction and are seen as padding playtime."},{"title":"Controls and combat feel","detail":"Several reviews call the controls and responsiveness poor, on both gamepad and keyboard."},{"title":"Weak story and unfriendly guidance","detail":"Not explaining what to do, a dull story and a protagonist some find hard to connect with."},{"title":"Bugs","detail":"Reports of Kliff's voice disappearing, NPC loading blocking paths, and map loading issues."}]},"chinese":{"praise":[{"title":"Scenery and visuals","detail":"Landscapes, towns and character models are called among the best in current open-world games."},{"title":"Large world and rich content","detail":"A vast map with lots to do and a lot of freedom: combat variety, trading, housing, dyeing and clothing."},{"title":"Combat feel and builds","detail":"Many weapons and skill options and satisfying combat for players who stick with it."},{"title":"Mods and the developer's attitude","detail":"Active mods are said to cover the control weaknesses, and the developer is credited for continued updates."}],"complaints":[{"title":"Puzzles without guidance","detail":"By far the most repeated complaint: players say many puzzles cannot be solved without looking up a guide."},{"title":"Story and quest quality","detail":"The main story is called thin or filler, characters shallow, and side quests repetitive with slow follow-the-NPC sections."},{"title":"Controls and interaction","detail":"Poor response, too many key combinations, awkward gamepad lock-on, and slow climbing or interaction."},{"title":"Optimization and crashes","detail":"Freezes and crashes when opening the map or inventory, rough lighting without ray reconstruction, and performance cost."},{"title":"Boss fights","detail":"Some boss designs are called unfair or built around invincibility and attacks that are hard to avoid."}]}}},"topics":[{"name":"Quest & Story","keywords":["quest","questline","story","storyline","main story","side quest","narrative","plot","kliff quest","oongka quest","oonga quest","damiane quest","ocean quest","퀘스트","스토리","메인퀘","서브퀘","줄거리","클리프 퀘스트","웅카 퀘스트","데미안 퀘스트","任务","剧情","故事","主线","支线"]},{"name":"Ocean","keywords":["ocean","sea","underwater","diving","ship","sailing","sail","boat","naval","pioneering island","pioneer island","ocean combat","sea combat","sea exploration","island","바다","해양","수중","바닷속","잠수","항해","선박","해전","개척 섬","개척섬","海洋","海底","水下","潜水","航海","船","海战","海岛","岛屿","开拓岛","海上"]},{"name":"Housing","keywords":["housing","house","furniture","decorate","decorating","decoration","interior","castle","greymane","base building","homestead","build a house","house customization","home customization","하우징","건축","집짓기","인테리어","가구","그레이메인","거점","房屋","房子","住宅","家具","装饰","建房","城堡"]},{"name":"Romance","keywords":["romance","romantic","wedding","marry","marriage","love interest","dating","courtship","spouse","girlfriend","boyfriend","waifu","npc interaction","로맨스","연애","결혼","웨딩","데이트","호감도","애정","恋爱","浪漫","婚礼","结婚","好感度","约会"]},{"name":"Management","keywords":["management","restaurant","smithy","blacksmith","workshop","tavern","innkeeper","shopkeeping","tycoon","business sim","run a shop","경영","식당","레스토랑","대장간","가게","장사","经营","餐厅","饭店","铁匠","商店"]},{"name":"Garden of Trials","keywords":["garden of trials","trial garden","boss rush","trials","시련의 정원","시련의정원","보스 러쉬","试炼花园","试炼之园"]}]};</script>

<script>
/* ---------- text (all UI strings live here so another language can be added later) ---------- */
const I18N = {

    'ctl.app': 'Steam App ID', 'ctl.load': 'Load', 'ctl.game': 'Loaded game',

    'positive': 'Positive', 'negative': 'Negative', 'reviews': 'reviews',
    'err.noserver': 'Cannot reach the local helper. Start it with run.bat (or "python server.py") and open http://localhost:8765/ instead of opening this file directly.',

    'sync.cached': 'Cached {0} reviews ({1} to {2}) · last updated {3}',

    'card.total': 'Total reviews', 'card.pos': 'Positive', 'card.neg': 'Negative', 'card.score': 'Positive rate',
