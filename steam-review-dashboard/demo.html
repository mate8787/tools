cket in them and your preferrence of look..exploring is fun and rewarding.hated the puzzles, the questline,the grind for resources, taming pets, lack of clues and info and about whats happening above the clouds... i do like mystery and this game does have that im still 50/50, it could be perfected.","c":1792202239,"u":0,"b":1,"r":0},{"i":"237895508","s":"76561198125283412","g":172,"n":9,"p":5140,"f":5140,"l":"english","t":"Cant wait to play the incoming dlc","c":1792201277,"u":1,"b":0,"r":0},{"i":"237895407","s":"76561199445707994","g":0,"n":1,"p":10166,"f":10166,"l":"koreana","t":"169시간 플레이하고 탈출해버렸다. 게임 퀄리티가 이렇게 좋은데 내가 이 게임을 계속하지 못한 이유에 대해 생각해봤다.\n\n누가 볼지 모르는 이 평을 쓰는 이유는 뛰어난 기술력의 발끝에도 못 미치는 재미의 설계가 너무나 아쉽기 때문이다.\n\n나는 회색갈기를 모른다. 애정도 없다. 이 세계관에 정을 붙일 트리거 장치 또한 없다. 동료를 찾아 떠나고 싶지 않았지만 빻아버린 머리를 고쳐보려고 이발소 해금을 위해 미션을 클리어했다. 빠른 이동을 위해, 특이해 보이는 템을 빨리 획득하기 위해 스토리를 밀어내고 드래곤을 얻었다. 확실히 템 획득과 이동이 빨라졌지만 남는 건 성취감 없는 전투만 남을 뿐이었다.\n\n현실에서 경험할 수 없는 초월적 능력의 반복 경험, 검색하면 바로 풀리는 퍼즐, 레어템이라면서 손쉽게 얻을 수 있는 무기 장비들, 미션이랍시고 반복되는 파리 잡기… 결국 잠깐 ‘와, 신기하다’만 느끼고 컴퓨터를 꺼버린다.\n\n분명히 초반엔 재미라는 것을 느꼈기 때문에 100시간 넘는 시간을 투자했지만 결국 어떤 패턴으로 재미를 느끼는지 알고 나니 계속되는 업데이트에도 불구하고 이 게임에서 손을 떼버렸다. 게임 플레이의 전개 패턴이 너무 똑같다는 점이 탈출의 원인인 듯 하다. \n\n게임 캐릭터에 나를 투영해 몰입할 틈이 없었다. 이야기가 나를 움직일 이유를 만들어주거나 내 행동이 이야기를 만들어주거나.. 어느쪽이던 세계와 연결되는 몰입적 감각을 경험하기가 어려웠다. 이 의미는 즉, 압도적인 자유도를 내세우지만 결국 내 캐릭터를 성장시키고 싶은 동기부여가 안됐다는 뜻이다. 불특정 다수에게 하나의 스토리로 깊은 몰입감을 선사해야 하는 RPG 장르의 한계처럼 느껴지기도 한다.\n\n지금 개발자들 현실에서 할 수 있는 모든 것들을 붉은사막이라는 게임에 전부 다 구현할 기세로 업데이트하고 있지만 방향을 잘못 잡은 게 분명하다. 심즈 같은 관계 구축 기능, 다양해질 하우징, 가상 요리로 가게 운영까지 할 수 있게 되는 개발 방향은 도대체 무엇을, 누구를 위한 개발인 걸까? 이는 강한 몰입을 좋아하는 나 같은 유저들을 위한 것은 아니라고 할 수 있겠다.\n\n이런 식으로 가다간 이 게임은 심즈, 중세 GTA 등의 정체성이 확실한 다른 게임들의 기술력을 어설프게 때려 박은 게임으로밖에 남지 않을 것이다. \n\n업데이트하는 내용들을 보아하니 유저들의 불평을 참고하고 개선해나가고 있는 것 같은데…독자(유저) 또는 대중이 어떤 트리거 장치에서 몰입을 시작하는지 드라마 작가한테 분석부터 받아라.","c":1792201142,"u":0,"b":1,"r":0},{"i":"237894558","s":"76561198237250906","g":27,"n":3,"p":6506,"f":6506,"l":"turkish","t":"cillop","c":1792200057,"u":1,"b":1,"r":0},{"i":"237893778","s":"76561199762631333","g":33,"n":9,"p":245,"f":363,"l":"brazilian","t":".","c":1792199027,"u":1,"b":0,"r":0},{"i":"237890826","s":"76561198871689731","g":0,"n":1,"p":1974,"f":4760,"l":"english","t":"The world will be talking about this game for years. 100/100","c":1792195314,"u":1,"b":1,"r":1},{"i":"237890631","s":"76561199119272149","g":0,"n":1,"p":11603,"f":12775,"l":"english","t":"yes","c":1792195072,"u":1,"b":1,"r":0},{"i":"237890620","s":"76561198760104124","g":0,"n":2,"p":247,"f":652,"l":"english","t":"An absolute masterpiece! I don't leave many reviews but this is more of an experience then a game. Stunning environment, excellent gameplay and vibrant world to explore.","c":1792195068,"u":1,"b":1,"r":0},{"i":"237889310","s":"76561198753538279","g":0,"n":1,"p":3169,"f":4073,"l":"english","t":"best game ever.","c":1792193436,"u":1,"b":1,"r":0},{"i":"237887830","s":"76561198709757652","g":0,"n":1,"p":2205,"f":2285,"l":"english","t":"pearl abyss deserves an award for the attention they have given to this game. Easily one the best exploration combat action adventure games i have played in a while.","c":1792191644,"u":1,"b":1,"r":0},{"i":"237885945","s":"76561197989087367","g":0,"n":6,"p":2740,"f":2740,"l":"german","t":"gameplay gut\nstorytelling schlecht","c":1792189509,"u":0,"b":0,"r":0},{"i":"237885197","s":"76561198069820773","g":0,"n":18,"p":652,"f":850,"l":"english","t":"witcher 3 in red dead 2 engine\n\nedit: and so. much. more.","c":1792188672,"u":1,"b":0,"r":0},{"i":"237885097","s":"76561197967693298","g":0,"n":2,"p":12812,"f":13653,"l":"english","t":"GOTY","c":1792188574,"u":1,"b":1,"r":0},{"i":"237883228","s":"76561198085225036","g":0,"n":10,"p":1958,"f":2551,"l":"spanish","t":"Juegazo","c":1792186634,"u":1,"b":1,"r":0},{"i":"237881965","s":"76561198338796279","g":141,"n":26,"p":6575,"f":7580,"l":"english","t":"i've done so many side quests and exploring that i completely forgot what the main story was :)","c":1792185408,"u":1,"b":1,"r":0},{"i":"237881705","s":"76561198798533137","g":0,"n":2,"p":9056,"f":9056,"l":"brazilian","t":"A história é fraca, mas de resto o bagulho é louco. Se tu quer pescar, pesque. Se tu quer voar de dragão, voe. Se tu quer lutar com boss díficil pra caralho, lute. Se tu quer só ficar farmando gold, farme. Se tu quer expandir acampamento, faça.  Se quer ficar só arrumando a casa, arrume. 10/10","c":1792185172,"u":1,"b":1,"r":0},{"i":"237881315","s":"76561198999575438","g":34,"n":2,"p":18757,"f":18757,"l":"polish","t":"Spoko gierka","c":1792184808,"u":1,"b":0,"r":0},{"i":"237881154","s":"76561198963431670","g":0,"n":9,"p":910,"f":910,"l":"english","t":"Probably a great game, but...\r\n\r\nI've got 15 or so hours and 10 of them have probably been me fighting with some glaring visual issues. Don't have ray reconstruction on? Enjoy your terrible rain and water. Have it on? Enjoy your shimmery trees and weird shadows, even running 120fps on cinematic. Too visually distracting for me to ignore, unfortunately.\r\n\r\nThe little bit of gameplay I did manage was fantastic, however. I'll wait out the expansion and see if the devs stop being stubborn about fixing those issues.","c":1792184661,"u":0,"b":1,"r":0},{"i":"237879818","s":"76561198836526455","g":0,"n":2,"p":2462,"f":2529,"l":"english","t":"Great Game 10/10 Better than Skyrim","c":1792183474,"u":1,"b":1,"r":0},{"i":"237878120","s":"76561199158525904","g":80,"n":11,"p":1824,"f":3143,"l":"german","t":"Mega gutes spiel schöne offen Welt zum erkunden wenn jemand nicht weiß was er zocken soll und open World mag empfehle ich es es könnte aber beim Hauptcharakter bissen mehr reden aber sonst super  \r\n10von 10","c":1792181932,"u":1,"b":0,"r":0},{"i":"237877872","s":"76561198121828569","g":0,"n":17,"p":3978,"f":4317,"l":"french","t":"top","c":1792181726,"u":1,"b":0,"r":0},{"i":"237875959","s":"76561198381519509","g":184,"n":21,"p":1759,"f":2050,"l":"ukrainian","t":"я не знаю чи треба рекомендувати чи ні","c":1792180035,"u":1,"b":1,"r":0},{"i":"237875095","s":"76561198173591398","g":41,"n":8,"p":1155,"f":2082,"l":"italian","t":"gigante\r\n","c":1792179298,"u":1,"b":0,"r":0},{"i":"237874126","s":"76561199512954824","g":0,"n":4,"p":1127,"f":2252,"l":"brazilian","t":"Jogo incrível, o mundo é enorme, paisagem fantástica e cheio de mistérios. \r\nSuper recomendo","c":1792178476,"u":1,"b":0,"r":0},{"i":"237873059","s":"76561198429667060","g":67,"n":18,"p":1763,"f":1763,"l":"english","t":"one of the best open world games out there","c":1792177591,"u":1,"b":1,"r":0},{"i":"237871033","s":"76561198013979793","g":328,"n":7,"p":9083,"f":9083,"l":"russian","t":"9|10","c":1792175848,"u":1,"b":0,"r":0},{"i":"237870728","s":"76561197969860269","g":74,"n":8,"p":5355,"f":5560,"l":"english","t":"Found a cave with a puzzle. Had no idea what to do, looked around. Found a worn out map on the wall with 3 red x marks. Marked them on my map, went to those spots. Still couldnt figure it out.\n\n30 hours later while hauling some orc to jail on my horse, moon shining brightly on anvil hill. I saw it!\n\nStory is allright, dialogue is nothing amazing. But its things like this that are keeping me hooked on the game.","c":1792175589,"u":1,"b":0,"r":0},{"i":"237870190","s":"76561199239564862","g":0,"n":1,"p":16612,"f":16898,"l":"schinese","t":"我玩了二百多个小时，主线推到了打完杜大师，回甘的部分已经结束了，剩下的是纯粹的屎。我不爽的点有三，首先主线里塞解密在这个游戏里显得不可接受，其他游戏也有主线解密的但没你这么恶心的，我认为是拉跨的引导使得解密体验相当糟糕，其次元素居然要解密才能获得，想玩点有意思的还必须得去解密，太强行了，最后是剧情说教味太重，韩国压力也不小为什么会有这种剧情，我不想看人物的迷茫和精神崩溃，我要一个坚钢不可夺其志的主角","c":1792175177,"u":0,"b":1,"r":0},{"i":"237869921","s":"76561199531421775","g":0,"n":13,"p":5989,"f":7490,"l":"schinese","t":"[h2]披着单机外衣的网游[/h2]","c":1792175043,"u":1,"b":0,"r":0},{"i":"237869436","s":"76561199278017659","g":0,"n":8,"p":1469,"f":1469,"l":"english","t":"It is so close to being a great game, but for me it just isn't there. The combat amounts to holding down a button and aiming your character at swarms of weak enemies. Combat is an inconvenience in this game. The exploration was pretty fun, but the characters are pretty bad and so is the dialogue. Meh story. I wish it wasn't true but for me, I wish I hadn't wasted my money on it. Skip it if you value combat and storytelling.","c":1792174663,"u":0,"b":0,"r":0},{"i":"237867249","s":"76561198366900423","g":335,"n":53,"p":2508,"f":2537,"l":"thai","t":"ข้อดี\n- เป็นเกม ที่แมพกว้างใหญ่ ถ้าใครชอบเดินสำรวจ ต้องถูกใจแน่\n- ระบบเยอะ คอนเทรนต์เยอะ อัดแน่นดี เล่นได้เรื่อยๆ\n- ปริศนาก้มีให้แก้ เยอะดี \n- เกมเพลย์ ระบบ คอมแบททำมาดี สกิลหลากหลาย แต่เกลียด ตัวใช้โล่มาก บางทีก็มารุมเราหลายๆตัว อยากให้มี สกิลหมู่ มากกว่านี้ หรือโจมตีโดนทหาร ทีละหลายๆเป้าหมายได้ง่ายกว่านี้ คงจะมันส์กว่า นี้ไล่ฆ่ามันทีละตัว ปวดนิ้วกับแขนไปหมด อายุเยอะแ้ว ไม่สนุกกับอะไรแบบนี้แล้วอะ ปวดแขน ปวดนิ้ว ปวดหลัง\n- ภาพสวย \n- ไม่กินสเปคเกินจำเป็น นี่ซื้อมาหลังจากเกมเปิดนานอยุ่ ไม่รู้คนที่ซื้อแรกๆบ่นมั้งไหม แต่สำหรับเรา ตอนนี้โอเคแล้ว optimize มาโอเคอยู่\n\nข้อเสีย\n- อยากให้มีชุด อาวุธ ร้านค้าเยอะมากกว่านี้จัง \n-ไกด์ หรือแนะนำ อธิบายไม่ค่อยเข้าใจเท่าไหร่ แล้วก็หายไปไวมาก ยังไม่ทันอาจจบ ยังไม่รู้ว่าให้ทำไรเลย บางอย่างต้องไปเปิดหายูทูปเอาว่าต้องทำอะไรยังไง  \n- การควบคุมมันยากและดูแปลกมากๆ จะทำไรต้องกด ctrl เอาตะเกียงไปส่องหน้าnpc หรือของ แล้วกด R เพื่อซื้อของโคตรจะแปลก และเพิ่มความยุ่งอยากให้ผู้เล่นมากๆ แทนที่จะเหมือนเกมอื่น กด e ตัวเดียวจบ   \n- เพลงไม่ค่อยเร้าใจ อยากให้ตอนต่อสู้มีเพลงมันส์ๆหน่อย\n- เนื้อเรื่อง เน้น เล่นชิวๆไปเรื่อยๆ ไม่ใช้เกมเน้นเนื้อเรื่อง หนักแน่น กระแทก ดราม่า หรือมีอิมแพคอะไรมากกับเกมเพลย์ที่เราเล่น\n- เนื้อเรื่องหลักกระจุกอยู่ที่ตัวcliff เยอะไปไหมนะ หรือ เรายังเล่นไม่ถึง อยากให้มันกระจายเนื้อเรื่องไปยัง 3 ตัวละครมากกว่านี้ ถ้าแบบนี้ เอาระบบสร้างตัวละครมาเลยดีกว่า ไม่ต้องมีหลอก หลายตัวละครอะ ต้องไปลำบาก หาmodตัวผญ มาใส่เล่นอีก \nอย่าง gta v มี 3 ตัว 3 เนื้อเรื่อง แบบนั้น \n- ไม่รู้เจอบั๊คอยู่คนเดียวไหมนะ เล่น 30 ช.ม.แรก ก็ดีไม่มีปัญหา แต่พอขึ้นไปเมืองท้องฟ้า อยู่ๆเกมก็ค้าง เปิดใหม่ก็ค้างอยู่หน้าโหลด ลบเกมแล้วก็ยังค้าง หาวิธีแก้จาก ai สารพัด ก็ไม่หาย เล่นๆอยู่แล้วเกมมันชอบค้างเอง ทำให้เล่นแล้วเสียอารมณ์หงุดหงุดสุดๆ ต้องคอยsave เกมไว้ตลอดเกม กลัวเกมค้างไปก่อน ตอนนี้ก็ยังไม่หาย จะบ้าตาย ไม่รู้ เพราะไดร์เวอร์การ์ดจอ หรือ วินโด้อัพเดทหรือเปล่า เลยว่าจะไม่เข้าเกมสักพัก จนกว่าเกมมันจะกลับมาเล่นได้ปกติ \nถ้าไม่เจอปัญหา ก็อยากจะแนะนำให้เล่นอยู่ แต่นี้ เจอปัญหาโดยประสบการณ์ส่วนตัว เลยขออนุญาติ ไม่แน่นำก่อน ถ้าปัญหาหายก็ไป เดี๋ยวจะกลับมากด แนะนำให้\n\nปล.ถ้าถามเกมคุ้มราคาไหมก็คุ้มอยู่นะ ราคาเต็มก็คุ้ม","c":1792172833,"u":0,"b":1,"r":0},{"i":"237867030","s":"76561198057115496","g":34,"n":4,"p":2763,"f":3374,"l":"french","t":"Jeu en monde ouvert hyper vaste avec énormément de possibilités d'interaction ...","c":1792172675,"u":1,"b":0,"r":0},{"i":"237866899","s":"76561198195836175","g":0,"n":2,"p":7389,"f":7389,"l":"japanese","t":"グラフィックはとても綺麗です","c":1792172567,"u":0,"b":1,"r":0},{"i":"237865168","s":"76561198757823409","g":0,"n":1,"p":7342,"f":8159,"l":"russian","t":"Нравится путешествовать и исследовать мир попутно развивая персонажа и свой лагерь","c":1792171051,"u":1,"b":0,"r":0},{"i":"237863904","s":"76561198106046813","g":915,"n":281,"p":12164,"f":12413,"l":"english","t":"the thought of you assuming that you know full well the game mechanics by the time you reached hundred of hrs and still get the \"wait, YOU CAN DO THAT?!\" reaction.","c":1792169977,"u":1,"b":1,"r":0},{"i":"237862755","s":"76561199501296472","g":31,"n":8,"p":4950,"f":4950,"l":"french","t":"-beaucoup de contenus\n-beaux jeux\n-Histoire de merde \n-trop cher","c":1792169014,"u":1,"b":0,"r":0},{"i":"237862597","s":"76561199033385811","g":26,"n":1,"p":1033,"f":1312,"l":"schinese","t":"牛逼","c":1792168871,"u":1,"b":1,"r":0},{"i":"237862125","s":"76561199119704089","g":0,"n":8,"p":3615,"f":3615,"l":"turkish","t":"Oyun güzel ama bir yerden sonra mola vermem gerekti ve geri dönemedim. Diyaloglar yapmacık geldi ve her görevden, sandıktan küp atıyor. Sinir bozdu bi tık.","c":1792168478,"u":1,"b":0,"r":0},{"i":"237862060","s":"76561197982817858","g":741,"n":16,"p":7192,"f":7908,"l":"german","t":"TL;DR; Für mich als Witcher 3 und Zelda Fan DAS perfekte Spiel zur Überbrückung bis Witcher 4 da ist.\r\n\r\nLANG:\r\nEs ist quasi ein \"Legend of Zelda: Tears of the Kingdom\" (ohne Untergrund! nur mit Himmel) UND mit der Grafik von \"Witcher 3\". Außerdem gibt es hier noch unendlich viele Elemente, die einfach komplett neu und auch unerwartet sind, was das Spiel so unglaublich fesselnd macht. Die Karte ist riesig, spaltet sich in viele Fraktionen auf, wo quests und vertrauen aufgebaut werden muss um zB neue Ausrüstung oder neue Quests etc. freizuschalten. Dabei helfen die Glocken (quasi die Türme aus Zelda) zum Karten aufdecken. Teleporterieren geht aber nur mit den dafür vorgesehenden Teleportplattformen, die Überall in der welt sind, ähnlich die Strassenschilder in Witcher 3. Außerdem gibt es noch einzelne versteckte und mit Puzzeln versiegelte Teleportpunkte, die man erst finden muss (erinnert mich an die Schreine aus Zelda). Der Himmel wird hier Abyss genannt und dort lassen sich auch Puzzel erledigen und neue Ausrüstung finden. Zudem kann man sich dort jederzeit hinunter auf die Erde fallen lassen ... (wie in Zelda halt) Sicher kommt man auch unten an, alle 3 spielbaren Figuren (grüße an GTA 5) können fliegen bzw gleiten. Die drei Hauptfiguren Kliff, Damiane und Oongka werden im laufe der Geschichte freigespielt und lassen sich dann auch jederzeit wechseln (wie in GTA 5) auch mit coolem raus und rein zoomen. ABER hier können die Charaktere auch als HILFE gerufen werden, sodass diese einem im Kampf unterstützen. NICEEEE. Zudem gibt es auch Housing, also ein Heim welches eingerichtet werden kann, ein eigenes Camp zum Upgraden, viele Charaktere zum einschleimen um bessere Preise/Ausrüstung/Objekte oder so frei zu schalten, viele Tiere und Monster zum jagen und zähmen und reiten, und und und. \r\nLangzeitmotivation: \r\n+ Komplette Map erkunden! (120h und ich kenne vllt 70% der Karte, Abyss hab ich bisher noch gar nicht gemacht >.<) \r\n+ Kämpfen! (echt schön wuchtig!)\r\n+ Grafik (alles ist soooooooo schön!)\r\n+ Quests (gibt viele tolle Belohnungen :D)\r\n\r\nPS: und auch wenn das Spiel mir sagt, ich soll einen Controller benutzen: NOPE ich bleibe meiner Tastatur und Maus treu <3 und es klappt super!","c":1792168425,"u":1,"b":0,"r":0},{"i":"237860702","s":"76561198007817938","g":0,"n":4,"p":11851,"f":13400,"l":"english","t":"I've been gaming for many years now, and I've honestly seen just about everything this medium has to offer: photorealistic graphics, deep and intricate gameplay systems, Oscar-worthy stories, and richly detailed worlds and lore that completely immerse you in fantastic or alternate realities.\n\nWhat I never expected was to find all of that in a single game (with the possible exception of the story, though that's more a matter of narrative flow than actual writing quality).\n\nCrimson Desert is the first game in a very long time that has genuinely surprised me.\n\nIt surprises me with its visual detail. It's been years since I stopped simply to admire the scenery in a game. The world stretches across incredible distances without losing its sense of quality or scale.\n\nIt surprises me with its combat. At first it can feel a little chaotic, but once you get used to it, there's an impressive variety of fighting styles to suit every preference.\n\nIt surprises me with the sheer amount of activities available. Want to farm the land? You can do it. Want to raise animals? You can do it. Want to build your own house? You can do it. Want to become a merchant, travel the world with your wagon, and trade goods? You can do it. Want to go fishing? You can do that too. And that's only scratching the surface.\n\nMost of all, it surprises me because almost every crazy idea that comes to mind while playing is actually possible. You can tame a bear and turn it into a mount, fly around with a jetpack, or launch yourself into a castle during a siege using a tree as a catapult.\n\nI keep coming back to the same word: wonder. Every step of the journey brings a new surprise. I haven't felt that sense of discovery since the days of Morrowind.\n\nThe game's only real weakness is perhaps its storytelling, but, as I mentioned earlier, that's more about the way the narrative is delivered than its actual quality. Some narrative choices seem to be remnants of the game's original MMO-oriented design. In fact, the further I progress and the more books, visions, and lore entries I uncover (and there are a lot of them), the more the pieces start falling into place. A compelling story emerges, one that reminds me of several anime I've enjoyed over the years. The issue is that this narrative often remains in the background, hidden behind a constant stream of events where players may struggle to understand how everything connects, especially during the early stages of the game.\n\nIn conclusion, this game deserves Game of the Year in my opinion. Had it released under different circumstances, there probably wouldn't have been so much confusion surrounding it. Unfortunately, a portion of the player base and some rushed, unprofessional reviews failed to recognize the incredible gift that Pearl Abyss has given to the gaming industry with this title.\n\nAnd perhaps most impressive of all: considering the visual quality it delivers, Crimson Desert is exceptionally well optimized.\n\nRecommended.","c":1792167211,"u":1,"b":1,"r":0},{"i":"237860355","s":"76561198090424851","g":0,"n":1,"p":201,"f":201,"l":"english","t":"The game is overcomplicated for no good reason. The story is shallow and unengaging, and the PC controls feel poorly thought out.","c":1792166935,"u":0,"b":0,"r":0},{"i":"237860233","s":"76561198165729151","g":425,"n":233,"p":630,"f":630,"l":"schinese","t":"像AI出来的游戏","c":1792166852,"u":0,"b":1,"r":0},{"i":"237855800","s":"76561199107846603","g":115,"n":12,"p":517,"f":517,"l":"brazilian","t":"Jogo foda dms mermão, da pra fazer tudo nele","c":1792163172,"u":1,"b":0,"r":0},{"i":"237851557","s":"76561198826954138","g":190,"n":6,"p":6467,"f":7016,"l":"schinese","t":"战斗一百分（对我而言）解密反人类，剧情靠领悟，玩起来很爽，生活化全面。","c":1792159511,"u":1,"b":1,"r":0},{"i":"237851067","s":"76561198053695790","g":847,"n":120,"p":2903,"f":2903,"l":"english","t":"The game is very very slow to tell you what it actually is.\r\n\r\n- No fun loot. Every weapon has the exact same stats as any other weapon, it can just have upgrades slotted in that you can slot in any other weapon. It's all just cosmetic nonsense.\r\n- Same with the armor. Clothes = steel armor. You just upgrade any set to make it better.\r\nFantasy is fantasy, but I prefer it when materials things are made out of feel tactile.\r\n\r\n- 40+ hours in and still tutorial mission after tutorial mission, you try to go explore and find only locked mechanics and empty places prepared for linear missions.\r\n- Annoying inventory limits, expansion rewards and sold extra slots are not enough. Yet there are mods that can partially fix this. And all the small items and ingredients are so needlessly varied.\r\n\r\n- NPC schedules and locked-out areas are genuinely impressive and a tint of fun design, but you bypass being locked-out relatively easily, and traders for some reason don't have schedules. So it still feels artificial.\r\n\r\n- At first you get the impression that every little environmental item is lootable, like in Elder Scrolls games, but it appears not, game is very much filled with statics like many others.\r\n\r\n- The map has this filter of who owns which land, making you think there will be a Mount-and-Blade-like faction war. But there isn't one. It's just either bandits or \"good guys\".","c":1792159053,"u":0,"b":1,"r":0},{"i":"237850974","s":"76561198156683058","g":285,"n":11,"p":4859,"f":5916,"l":"schinese","t":" 难以形容的操作手感，手柄复杂的按键这些都能忍受，为什么要在主线塞那么多你那个屎一样的解密进去。抛开解密这个游戏确实是量大管饱的，但是主线解密抛不开","c":1792158945,"u":0,"b":1,"r":0},{"i":"237850007","s":"76561199552920441","g":0,"n":3,"p":18157,"f":18157,"l":"english","t":"huge world, tons of enemy types, puzzles, boss fights, exploration, and 300 hours in still finding new stuff to do.","c":1792158058,"u":1,"b":0,"r":0},{"i":"237849733","s":"76561198047410647","g":419,"n":25,"p":5305,"f":5305,"l":"russian","t":"Кайфовое обновление до 2.0\nСейв на 88 часов - на помойку.","c":1792157793,"u":0,"b":1,"r":0},{"i":"237849335","s":"76561199095465170","g":0,"n":26,"p":523,"f":3541,"l":"brazilian","t":"top de mas adorei","c":1792157420,"u":1,"b":0,"r":0},{"i":"237847969","s":"76561198205451836","g":50,"n":4,"p":607,"f":991,"l":"english","t":"I avoided this game since launch because I knew it had bad storytelling. Then recently I needed a game I wouldn't get too in to and could just play when i want, put down when i want, and this is it. Its a freaking awesome game. With terrible storytelling","c":1792156054,"u":1,"b":1,"r":0},{"i":"237847221","s":"76561199783127543","g":194,"n":3,"p":38068,"f":38125,"l":"schinese","t":"看时长，打发时间的佳品，静待dlc","c":1792155242,"u":1,"b":0,"r":0},{"i":"237845851","s":"76561199105454127","g":0,"n":2,"p":4355,"f":4816,"l":"french","t":"jeu incroyable, il met une sacrée déculottée à la plus part des jeux AAA chapeau au dev","c":1792153859,"u":1,"b":0,"r":0},{"i":"237838167","s":"76561198342571917","g":0,"n":2,"p":5200,"f":5203,"l":"english","t":"The game crashes every time during the loading screen when I try to launch it!","c":1792144072,"u":0,"b":1,"r":0},{"i":"237836354","s":"76561198705423249","g":0,"n":1,"p":9608,"f":9609,"l":"english","t":"no game has ever touched this standard","c":1792141218,"u":1,"b":1,"r":0},{"i":"237835461","s":"76561198175453318","g":15,"n":5,"p":4432,"f":4492,"l":"spanish","t":"JUEGAZO! hay que tener paciencia al principio porque avanza muy lento y hay cosas que el juego no te explica, pero una vez que investigas y entiendes como funciona cada detalle es un juego de echarle muchisimas horas y disfrutarlo","c":1792139753,"u":1,"b":1,"r":0},{"i":"237835399","s":"76561199646555012","g":23,"n":9,"p":1426,"f":1426,"l":"english","t":"Few titles have carried the weight of expectation quite like Pearl Abyss’s Crimson Desert. What began years ago as a conceptual spin-off to an MMO morphed into one of the most ambitious single-player action RPGs of the decade. The final release doesn't merely meet those expectations—it redefines what a high-fantasy, physics-driven open world can deliver. From its visual fidelity and narrative depth to remarkable technical polish, kinetic combat, and exhilarating traversal, the journey across the continent of Pywel sets a staggering new standard.\r\n\r\nFrom the opening sequence, the presentation is breathtaking. Built on Pearl Abyss’s proprietary BlackSpace Engine, Pywel is one of the most richly detailed environments ever rendered. The lighting engine does monumental heavy lifting: sunbeams pierce dense forest canopies, casting volumetric mist across mossy crags, while dynamic weather systems completely transform terrain. Rain slicks muddy trails, puddles reflect lantern light off cobblestone keeps, and blinding blizzards cake snow onto your armor in real time.\r\n\r\nThe micro-detail is absurd across the board. Layered gambesons, plate mail, and fur collars react naturally to wind, movement, and impacts rather than behaving like static meshes. Environmental interaction is just as meticulous—tall grass parts around sprinting mounts, branches snap during skirmishes, and destruction physics leave combat zones looking like genuine battlefields scarred by sword cuts and blast craters. Facial capture and character models round it out with weathered faces, sweat, and subtle expressions that convey fatigue and grief without needing heavy dialogue. Every vista feels bespoke rather than generated by generic terrain algorithms, rewarding players who stop on a ridge to watch the horizon fade into dusk.\r\n\r\nAmbitious visuals often arrive with catastrophic performance issues, stuttering frame times, and aggressive upscaling artifacts. Remarkably, Crimson Desert dodges the modern curse of poorly optimized launches. The engine leverages modern hardware architecture with surgical precision. Frame pacing remains flat, eliminating micro-stutters even when transitioning seamlessly from sprawling wilderness into bustling trade hubs without loading screens. DirectStorage and background asset decompression keep pop-in nearly invisible, allowing draw distances that stretch across mountain ranges without severe level-of-detail degradation. CPU thread scheduling distributes compute loads evenly across modern multithreaded processors, while VRAM usage remains disciplined even at native 1440p and 4K resolutions with ray tracing dialed to maximum. Whether navigating intense multi-faction brawls or tearing across plains at breakneck speeds, the framerate holds steady with esports-level responsiveness.\r\n\r\nBeyond raw technical wizardry, Crimson Desert anchors its world with a sharp, emotionally grounded story. Following Kliff and the scattered remnants of the Greymanes, the plot discards tired \"chosen one\" tropes in favor of a gritty, politically fraught tale of survival, loyalty, and mercenary life. Pywel is a fractured realm torn between decadent city-states, scheming religious factions, and ruthless warlords exploiting ancient, unstable abyssal power. The narrative succeeds because it keeps the stakes deeply personal. Comrades are not disposable quest dispensers; each companion carries distinct motivations, trauma, and conflicting allegiances that evolve based on your decisions. Quests rarely boil down to pure good-versus-evil choices, as helping one faction inevitably starves another, forcing you to navigate the compromises of an unforgiving war economy. Set pieces hit with jaw-dropping scale, but the quiet moments around campfire encampments give climactic encounters their true emotional resonance.\r\n\r\nCombat is an adrenaline rush bridging precision character-action titles and raw, bone-crunching physics brawlers. Far from repetitive button-mashing, every encounter demands tactical positioning and split-second reflexes. Kliff commands an expansive toolkit blending martial arts, weapon masteries, and supernatural abyssal abilities. You can shatter enemy guard stances with heavy shield-bashes, unleash sweeping elemental blade arcs, grapple armored foes into hazards, or weave rapid shadow-dashes directly through formations to strike vulnerable flanks.\r\n\r\nHits land with staggering tactile weight. Smacking a bandit with a greatsword sends him tumbling into destructible wagons, parrying a charging cavalryman unseats the rider, and landing a clean suplex onto rocky terrain leaves foes open to brutal follow-ups. Enemies don’t politely wait their turn to attack either; they coordinate flanking maneuvers, deploy ranged suppression, and force you to actively switch between defensive parries, crowd-control sweeps, and devastating finishers. Towering mythological bosses demand full mastery of mobility, requiring you to climb massive limbs, target glowing weak points, and time dodges against room-clearing area attacks.\r\n\r\nToo many open-world titles treat space between quest markers as dead air filled with monotonous autorun marathons. Crimson Desert obliterates that fatigue by turning every yard of movement into an engaging mechanic. Traversing terrain on foot feels immediate and acrobatic. Kliff naturally hurdles fallen logs, scales vertical cliff faces with stamina-managed grips, vaults across rooftop gaps in war-torn hamlets, and uses grapple hooks to launch himself over chasms. Running downhill builds forward momentum converted into long sliding tackles, while scaling loose scree or heavy mud forces conscious route planning. Ground mounts are equally deep: riding isn't just holding forward on a stick; mounts feature tactile weight, drift physics around tight bends, stamina management, and spur boosts that smash straight through wooden barriers and barricades.\r\n\r\nWhile grounded movement and combat are exceptional, the crowning jewel of traversal is taking to the sky. Mounting a flying beast is not a glorified fast-travel autopilot; it is an active thrill ride that recontextualizes the world design. Flying conveys genuine momentum and lift as you actively manage dive angles to gain speed, catch thermal updrafts along mountain ridges, and pull back hard on reins to bleed velocity before touching down on narrow perches. The sky is never empty space—floating ruins, sheer canyon spires, towering mountain fortresses, and roaming airborne wildlife make the airspace feel every bit as alive and dangerous as the ground below. Engaging enemy aerial scouts, diving down to unleash ranged barrages onto fortified encampments, or leaping directly off your mount mid-glide to deliver a plunging execution attack creates emergent spectacle that rivals the most intense scripted action scenes in modern gaming. Gliding over cloud breaks at sunset with the wind roaring past transforms simple map travel into one of the most entertaining core mechanics of the experience.\r\n\r\nCrimson Desert is a triumph of vision and execution. By marrying cutting-edge graphical artistry and rock-solid technical optimization with a rich, gritty storyline, deeply satisfying combat mechanics, and exhilarating ground and aerial traversal, Pearl Abyss has delivered an adventure that demands to be played. It respects the player's time with a fluid experience while pushing the boundaries of what open-world exploration should feel like—a definitive masterpiece that will be celebrated for years to come.","c":1792139657,"u":1,"b":0,"r":0},{"i":"237833605","s":"76561199060583536","g":147,"n":22,"p":548,"f":548,"l":"schinese","t":"网游，和韩国一样，不东不西的，文化奇怪。剧情叙述很迷，战斗和生活方面也很莫名其妙","c":1792136734,"u":0,"b":1,"r":0},{"i":"237832331","s":"76561198157960483","g":162,"n":47,"p":1170,"f":1170,"l":"english","t":"played this for 19 hours, went back to witcher 3 remaster to complete some missions that i have left behind a year ago
