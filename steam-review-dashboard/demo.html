<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Steam Review Dashboard</title>
<style>
  :root {
    --bg: #1c1c1e;
    --panel: #242426;
    --panel-alt: #2c2c2f;
    --border: #3a3a3d;
    --text: #e8e8ea;
    --muted: #9a9a9e;
    --accent: #7fb3ff;
    --accent-dim: #3d5a80;
    --ok: #6fcf97;
    --warn: #ffb450;
    --bad: #ff5c5c;
    --mono: 'SF Mono', 'Consolas', 'Menlo', monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', 'Microsoft YaHei', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding-block: 2rem; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); font-size: 14px; line-height: 1.5; }
  .container { max-width: 1200px; margin: 0 auto; }
  h1 { font-size: 22px; font-weight: 600; margin-bottom: 0.25rem; }
  h2 { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
  .subtitle { font-size: 14px; color: var(--muted); margin-bottom: 1.5rem; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 1.25rem; margin-bottom: 1rem; }
  .card .hint { font-size: 12px; color: var(--muted); margin-bottom: 12px; }
  label { font-size: 12px; font-weight: 500; color: var(--muted); display: block; margin-bottom: 4px; }
  button { padding: 8px 16px; border-radius: 7px; font-size: 13px; font-weight: 500; cursor: pointer; border: 1px solid var(--border); background: var(--panel-alt); color: var(--text); font-family: inherit; transition: background 0.15s, border-color 0.15s; }
  button:hover { border-color: var(--accent-dim); }
  .btn-primary { background: var(--accent-dim); color: #fff; border-color: var(--accent-dim); }
  .btn-primary:hover { background: #4a6d94; border-color: #4a6d94; }
  .btn-danger:hover { border-color: var(--bad); color: var(--bad); }
  button:disabled { background: #33383e; border-color: #33383e; color: var(--muted); cursor: default; }
  select, input[type="text"], input[type="date"], input[type="number"] { padding: 8px 10px; border: 1px solid var(--border); border-radius: 7px; font-size: 13px; font-family: inherit; background: var(--panel-alt); color: var(--text); outline: none; color-scheme: dark; }
  select:focus, input:focus { border-color: var(--accent-dim); }
  input:disabled { opacity: 0.45; }
  .row { display: flex; gap: 14px; align-items: flex-end; flex-wrap: wrap; }
  .row + .row { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); }
  .field { display: flex; flex-direction: column; }
  .radio-group { display: flex; gap: 14px; align-items: center; height: 35px; }
  .radio-group label { display: flex; align-items: center; gap: 5px; margin: 0; font-size: 13px; color: var(--text); cursor: pointer; }
  .grow { flex: 1; }
  .appname { height: 35px; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; }
  .appname a { color: var(--accent); text-decoration: none; }
  .appname small { font-weight: 400; font-size: 11px; color: var(--muted); }
  .appname small.warn { color: var(--warn); }
  .status { font-size: 12px; color: var(--muted); }
  .banner { border: 1px solid var(--warn); background: rgba(255,180,80,0.08); color: var(--warn); border-radius: 8px; padding: 10px 14px; margin-bottom: 1rem; font-size: 13px; }
  .banner.err { border-color: var(--bad); background: rgba(255,92,92,0.08); color: var(--bad); }

  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-bottom: 1rem; }
  .stat { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  .stat .v { font-size: 26px; font-weight: 600; line-height: 1.2; }
  .stat .l { font-size: 12px; color: var(--muted); }
  .stat .s { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .pos { color: var(--ok); } .neg { color: var(--bad); }

  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th { text-align: left; font-weight: 600; color: var(--muted); font-size: 12px; padding: 7px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  td { padding: 6px 10px; border-bottom: 1px solid #2f2f32; }
  th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr.total td { font-weight: 600; border-top: 1px solid var(--border); }
  .pt-table { max-width: 520px; }
  .pt-table td.ratio { text-align: center; font-weight: 600; color: #1c1c1e; }
  .pt-table th { background: var(--panel-alt); text-align: center; }
  .pt-table th.neg-h { background: #e8a07a; color: #1c1c1e; } .pt-table th.pos-h { background: #a9d18e; color: #1c1c1e; } .pt-table th.ratio-h { background: #d9d9d9; color: #1c1c1e; }
  .pt-table td:first-child { text-align: center; }
  .pt-table td.cnt { text-align: center; }

  .heat { text-align: right; font-variant-numeric: tabular-nums; min-width: 90px; }
  tr.clickable { cursor: pointer; }
  tr.clickable:hover td { background: rgba(127,179,255,0.06); }
  tr.selected td { box-shadow: inset 0 0 0 9999px rgba(127,179,255,0.10); }
  .split { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 820px) { .split { grid-template-columns: 1fr; } body { padding-block: 1rem; } }
  .bar-cell { position: relative; }
  .bar-cell .bar { position: absolute; left: 0; top: 2px; bottom: 2px; border-radius: 3px; opacity: 0.22; }
  .bar-cell span { position: relative; }
  .kw-pos .bar { background: var(--ok); } .kw-neg .bar { background: var(--bad); }

  .samples { margin-top: 14px; border-top: 1px solid var(--border); padding-top: 12px; }
  .sample { background: var(--panel-alt); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; font-size: 13px; }
  .sample .meta { font-size: 11px; color: var(--muted); margin-bottom: 4px; display: flex; gap: 10px; flex-wrap: wrap; }
  .sample .meta a { color: var(--accent); text-decoration: none; }
  .sample mark { background: rgba(127,179,255,0.28); color: inherit; border-radius: 2px; padding: 0 1px; }
  .badge { display: inline-block; font-size: 10px; font-weight: 600; padding: 1px 6px; border-radius: 4px; }
  .badge.up { background: rgba(111,207,151,0.18); color: var(--ok); } .badge.down { background: rgba(255,92,92,0.18); color: var(--bad); }
  .badge.script { background: var(--panel); color: var(--muted); border: 1px solid var(--border); }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; }

  .summary-list { list-style: none; }
  .summary-list li { padding: 9px 0; border-bottom: 1px solid #2f2f32; }
  .summary-list li:last-child { border-bottom: none; }
  .summary-list b { display: block; margin-bottom: 2px; }
  .summary-list .q { color: var(--muted); font-size: 12px; font-style: italic; margin-top: 3px; }
  h3 { font-size: 14px; margin-bottom: 8px; }

  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; padding: 1.5rem; z-index: 50; }
  .modal-bg.open { display: flex; }
  .modal { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; width: 100%; max-width: 960px; max-height: 90vh; display: flex; flex-direction: column; }
  .modal header { padding: 14px 18px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  .modal .body { display: grid; grid-template-columns: 220px 1fr; flex: 1; overflow: hidden; min-height: 380px; }
  .modal .side { border-right: 1px solid var(--border); padding: 10px; overflow-y: auto; }
  .modal .side button { display: block; width: 100%; text-align: left; margin-bottom: 6px; background: transparent; }
  .modal .side button.active { background: var(--accent-dim); border-color: var(--accent-dim); color: #fff; }
  .modal .main { padding: 16px 18px; overflow-y: auto; }
  .modal footer { padding: 12px 18px; border-top: 1px solid var(--border); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
  .chip { display: inline-flex; align-items: center; gap: 6px; background: var(--panel-alt); border: 1px solid var(--border); border-radius: 14px; padding: 3px 4px 3px 10px; font-size: 13px; }
  .chip .n { font-size: 11px; color: var(--muted); }
  .chip .x { border: none; background: transparent; padding: 0 6px; font-size: 15px; line-height: 1; color: var(--muted); }
  .chip .x:hover { color: var(--bad); }
  @media (max-width: 700px) { .modal .body { grid-template-columns: 1fr; } .modal .side { border-right: none; border-bottom: 1px solid var(--border); } }
</style>
</head>
<body>
<div class="container">
  <h1 data-i18n="title"></h1>
  <p class="subtitle" data-i18n="subtitle"></p>

  <section class="card" id="controls">
    <div class="row">
      <div class="field">
        <label for="appId" data-i18n="ctl.app"></label>
        <input type="text" id="appId" size="12">
      </div>
      <button id="loadBtn" data-i18n="ctl.load"></button>
      <div class="field">
        <label data-i18n="ctl.game"></label>
        <div id="appName" class="appname">&mdash;</div>
      </div>
      <div class="field" id="syncField">
        <label for="syncDays" data-i18n="ctl.download"></label>
        <select id="syncDays"></select>
      </div>
      <button id="syncBtn" class="btn-primary" data-i18n="ctl.update"></button>
      <div class="status grow" id="syncStatus"></div>
    </div>
    <div class="row">
      <div class="field">
        <label for="scope" data-i18n="ctl.language"></label>
        <select id="scope"></select>
      </div>
      <div class="field">
        <label data-i18n="ctl.dates"></label>
        <div class="radio-group">
          <label><input type="radio" name="dateMode" value="all" checked> <span data-i18n="ctl.allTime"></span></label>
          <label><input type="radio" name="dateMode" value="range"> <span data-i18n="ctl.range"></span></label>
        </div>
      </div>
      <div class="field"><label for="dFrom" data-i18n="ctl.from"></label><input type="date" id="dFrom"></div>
      <div class="field"><label for="dTo" data-i18n="ctl.to"></label><input type="date" id="dTo"></div>
      <div class="grow"></div>
      <button id="topicsBtn" data-i18n="ctl.topics"></button>
      <button id="exportBtn" data-i18n="ctl.export"></button>
    </div>
  </section>

  <div id="banner" class="banner" hidden></div>
  <section class="cards" id="cards"></section>

  <section class="card">
    <h2 data-i18n="time.title"></h2>
    <div class="hint" id="timeHint"></div>
    <div class="legend"><span><i style="background:var(--ok)"></i><span data-i18n="positive"></span></span><span><i style="background:var(--bad)"></i><span data-i18n="negative"></span></span></div>
    <div id="timeChart"></div>
  </section>

  <section class="card">
    <h2 data-i18n="pt.title"></h2>
    <div class="hint" data-i18n="pt.hint"></div>
    <table class="pt-table" id="ptTable"></table>
  </section>

  <section class="card">
    <h2 data-i18n="topics.title"></h2>
    <div class="hint" data-i18n="topics.hint"></div>
    <div style="overflow-x:auto"><table id="topicTable"></table></div>
    <div class="samples" id="samples" hidden></div>
  </section>

  <section class="card">
    <div class="row" style="border:none;margin:0;padding:0;align-items:flex-start">
      <div class="grow"><h2 data-i18n="kw.title"></h2><div class="hint" data-i18n="kw.hint"></div></div>
      <div class="field" id="kwLangBox"><label for="kwLang" data-i18n="kw.lang"></label><select id="kwLang"></select></div>
    </div>
    <div class="split" id="kwTables"></div>
  </section>

  <section class="card">
    <h2 data-i18n="sum.title"></h2>
    <div class="hint" id="sumHint"></div>
    <div class="split" id="sumBody"></div>
  </section>
</div>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <header><h2 data-i18n="tm.title"></h2><button id="tmClose" data-i18n="tm.done"></button></header>
    <div class="body">
      <div class="side" id="tmSide"></div>
      <div class="main" id="tmMain"></div>
    </div>
    <footer>
      <button id="tmReset" data-i18n="tm.reset"></button>
      <button id="tmExport" data-i18n="tm.export"></button>
      <button id="tmImport" data-i18n="tm.import"></button>
      <input type="file" id="tmFile" accept=".json" hidden>
      <span class="status" data-i18n="tm.saved"></span>
    </footer>
  </div>
</div>

<script>window.SRD_EMBED = {"app":"3321460","info":{"name":"Crimson Desert Enhanced","type":"game"},"data":{"app":"3321460","summary":{"num_reviews":99,"review_score":8,"review_score_desc":"Very Positive","total_positive":148572,"total_negative":28992,"total_reviews":177564},"covered":1791257824,"updated":1792551417,"reviews":[{"i":"238211551","s":"76561198315127543","g":0,"n":9,"p":3138,"f":3144,"l":"latam","t":"Que mrd eso de domar caballos, a quien se le ocurrió poner ese sistema... vaya kgada, el resto esta bien","c":1792548183,"u":1,"b":0,"r":0},{"i":"238208535","s":"76561198252801430","g":64,"n":13,"p":10671,"f":10671,"l":"english","t":"This game is such a gem. It is not for everyone, but I really enjoyed this as an open world game fan who likes to explore.\n\nGood graphics really enhance this game's charm. I do not recommend playing with poor quality.","c":1792543617,"u":1,"b":0,"r":0},{"i":"238207602","s":"76561198015258422","g":0,"n":1,"p":3885,"f":3885,"l":"english","t":"Really enjoying this game so far, sure it has some jank but it's completely bearable and easily overlooked when you see how much this game has to offer. It has such a wide variety of mechanics, a complex fighting system and the world is just so fleshed out with content and characters to explore that I'm sure I've only just scratched the surface and I embrace it.","c":1792542198,"u":1,"b":1,"r":0},{"i":"238206206","s":"76561199426715131","g":0,"n":5,"p":6638,"f":6638,"l":"english","t":"this was GREAT! \r\nFor me it is on par with Elden Ring, many parallels\r\n\r\nReviews were a bit mixed, so I was expecting it to be a little patchy, but was pleasantly surprised. Very solid, well polished, visually stunning and immersive, incredibly deep and varied game mechanics, and the puzzle solving is a fun element\r\n\r\nquick tip: use Kliff to fight the big bosses and main quests linked to him, but otherwise get the Elegant Carmine armour and have Damiane run around most of it, thank me later ;)","c":1792540176,"u":1,"b":1,"r":0},{"i":"238205779","s":"76561198055493573","g":0,"n":5,"p":72505,"f":72655,"l":"english","t":"Unlike any game I have ever played. \r\nCrimson Desert is for sure in my Top 10 Favorite Games of all time.","c":1792539571,"u":1,"b":1,"r":0},{"i":"238205432","s":"76561198000956544","g":0,"n":253,"p":1683,"f":1683,"l":"english","t":"Absolutely love the game but recent updates have caused major stbility issues regardless of hardware. i'm sure others can attest that no matter what fixes they've done the game will still randomly crash straight to desktop with no error messages. Hopefully they fix this one day.","c":1792539098,"u":1,"b":1,"r":0},{"i":"238205255","s":"76561198176811199","g":0,"n":25,"p":1022,"f":1022,"l":"english","t":"i have been playing for about 10 hours and its still boring. i just unlocked the girl and can see that her abilities are way cooler then kliffs of course. i hate this because i refuse to play as girls in video games.","c":1792538827,"u":0,"b":1,"r":0},{"i":"238204525","s":"76561199815081716","g":0,"n":22,"p":8129,"f":8197,"l":"brazilian","t":"Crimson Desert é uma aventura de mundo aberto que se destaca pela ambição, pelos gráficos impressionantes e pelo combate dinâmico e cinematográfico. O jogo oferece um vasto mundo para explorar, batalhas desafiadoras contra chefes, diversas atividades secundárias e bastante liberdade para o jogador.\r\n\r\nSeus maiores pontos fortes são a variedade de mecânicas, a riqueza dos cenários e a sensação de participar de uma grande aventura de fantasia medieval. Apesar de algumas falhas nos controles, na narrativa e em certas decisões de design, suas qualidades tornam a experiência muito interessante.\r\n\r\nMinha avaliação positiva é que Crimson Desert se destaca sobretudo como uma grande aventura de ação e exploração. Ele não precisa ser perfeito em todos os seus sistemas para oferecer momentos extraordinários. Seu maior trunfo é fazer o jogador sentir que existe um mundo enorme à sua disposição, com lugares para descobrir, batalhas para vencer e experiências que surgem justamente quando ele decide sair do caminho esperado.\r\n\r\nPara quem valoriza mundos abertos, combates elaborados e fantasia em grande escala, é um jogo que tem muito a oferecer e merece ser experimentado com espírito de descoberta.\r\n\r\n(E nem se fala o quanto a Pearl Abyss se decida ao jogo trazendo conteúdos novos todos os meses.)","c":1792537840,"u":1,"b":1,"r":0},{"i":"238203707","s":"76561198761128887","g":0,"n":2,"p":397,"f":397,"l":"latam","t":"muy tosco, trata de ser sobresaliente en el sistema de combate pero solo queda como algo de solo presionar un boton porque las demas formas de combate son obsoletas","c":1792536732,"u":0,"b":0,"r":0},{"i":"238203572","s":"76561199011887506","g":29,"n":3,"p":355,"f":396,"l":"brazilian","t":"ja zerei esse jogo 2x no ps agora estou no pc e pra mim, e o melhor jogo que eu ja joguei em toda a minha vida \r\n","c":1792536541,"u":1,"b":0,"r":0},{"i":"238203192","s":"76561199006774456","g":0,"n":2,"p":208,"f":210,"l":"spanish","t":"\r\n","c":1792536012,"u":1,"b":0,"r":0},{"i":"238202995","s":"76561198028264098","g":0,"n":49,"p":3692,"f":3702,"l":"english","t":"Crimson Desert has a great atmosphere and environment. The puzzle are difficult and engaging. They do not hold your hand through the puzzles. Even combat is complex. Dodging and blocking are easy to use but can be hard to master in the boss fights. Because of the lack of hand holding, this game seemed difficult at first but I appreciate it more and more as I put time into the mechanics. I like the challenge.\r\n\r\nAlso, exploration and crafting is deep and enjoyable for me.\r\n\r\n[b] I punched a guy so hard his shirt and boots came off 10/10 game. [/b]","c":1792535789,"u":1,"b":1,"r":0},{"i":"238202895","s":"76561198253646300","g":0,"n":5,"p":374,"f":374,"l":"english","t":"Such an amazing game!!","c":1792535648,"u":1,"b":0,"r":0},{"i":"238190873","s":"76561198044927992","g":0,"n":1,"p":9088,"f":9228,"l":"english","t":"One of the best games of 2026","c":1792533000,"u":1,"b":1,"r":0},{"i":"238189638","s":"76561198805668532","g":58,"n":2,"p":328,"f":328,"l":"schinese","t":"买了个打不开背包的游戏","c":1792531519,"u":0,"b":0,"r":0},{"i":"238188415","s":"76561197992182889","g":0,"n":8,"p":5813,"f":5879,"l":"german","t":"Astrein!","c":1792530113,"u":1,"b":0,"r":0},{"i":"238187232","s":"76561198064074525","g":0,"n":10,"p":9019,"f":9019,"l":"spanish","t":"Buen juego, es un rpg muy completo.","c":1792528852,"u":1,"b":0,"r":0},{"i":"238186603","s":"76561199527868742","g":0,"n":8,"p":1396,"f":1396,"l":"brazilian","t":"Jogo tesudo!","c":1792528184,"u":1,"b":0,"r":0},{"i":"238185899","s":"76561198412501831","g":0,"n":2,"p":17209,"f":17213,"l":"english","t":"best 286 hours! although now i can't play it because of the constant crashes.","c":1792527467,"u":1,"b":0,"r":0},{"i":"238183518","s":"76561198994746155","g":142,"n":26,"p":203,"f":203,"l":"english","t":"Must play:)","c":1792524960,"u":1,"b":1,"r":0},{"i":"238180795","s":"76561197981338856","g":0,"n":2,"p":33898,"f":34295,"l":"english","t":"Best game ever made to date!","c":1792522394,"u":1,"b":1,"r":0},{"i":"238179269","s":"76561198133919681","g":32,"n":1,"p":15615,"f":15615,"l":"english","t":"Just the GOTY 2026 to me, simple as that.","c":1792520876,"u":1,"b":0,"r":0},{"i":"238178947","s":"76561198151682625","g":0,"n":4,"p":11084,"f":11084,"l":"koreana","t":"씨발 그래픽 더럽게 잡아먹네.","c":1792520560,"u":0,"b":0,"r":0},{"i":"238178338","s":"76561198420245542","g":29,"n":8,"p":13092,"f":13092,"l":"english","t":"This is probably the best sandbox game i ever played. I am 200 hrs in and I still haven't completed 30% of the story. I only have 3 achievement 🤣🤣. The exploration is just insane.","c":1792520001,"u":1,"b":1,"r":0},{"i":"238178229","s":"76561197968655041","g":0,"n":3,"p":3291,"f":3291,"l":"french","t":"Au début, j’étais un peu perdu. Je me contentais de suivre l’histoire principale et j’ai failli lâcher au bout d’une dizaine d’heures. Puis, j’ai regardé quelques guides qui m’ont expliqué ce que le jeu ne prend pas vraiment le temps de nous apprendre. Et c’est là que j’ai découvert toute la richesse du jeu !\r\n\r\nCrimson Desert, ce n’est pas Assassin’s Creed, même si j’aime beaucoup la série. Aujourd’hui, j’en suis à presque 60 heures de jeu et je ne vois pas le temps passer !\r\n\r\nIl y a un peu de tout dans ce jeu. Graphiquement, il est magnifique et, même si ce n’est pas la fête au loot, on prend énormément de plaisir à explorer son monde ouvert.\r\n\r\nIl n’est pas parfait, loin de là, mais dans son genre, il est vraiment excellent !\r\n\r\nPeut-être qu’il aurait mérité de mieux expliquer certaines mécaniques… ou peut-être pas ! 😄","c":1792519905,"u":1,"b":1,"r":0},{"i":"238176627","s":"76561198047290262","g":0,"n":11,"p":7091,"f":7091,"l":"russian","t":"Размах на рубль, удар на копейку","c":1792518352,"u":0,"b":1,"r":0},{"i":"238176459","s":"76561198202244594","g":44,"n":2,"p":14323,"f":14346,"l":"schinese","t":"刚开始玩的时候，好玩。有些内容没有引导（或者说在不知名的角落提示过一次，弱引导），有些解密纯脑电波，对上了就很好解，对过一次脑电波后遇到重复内容会简单很多。有些操作判定严格有点难顶。有崩溃的时候但不至于摔鼠标。\n\n玩到一个阶段就会找到一个游戏的影子，一路都是别的游戏的影子。\n\n量大管饱，风景不错，入坑的时候已经优化好很多了，中后期困难模式也是爽游。需要静下心探索。期待DLC。","c":1792518170,"u":1,"b":1,"r":0},{"i":"238174731","s":"76561198064911198","g":0,"n":9,"p":1114,"f":1585,"l":"english","t":"amazing game but terribly optimised, cant play in native resolution (1080p) \n\nthe upscaling makes everything look blurry no matter the settings and theres a well known bug with the lighting white washing everything in view. \n\ndevs need to work on making this optimised over releasing dlc.","c":1792516436,"u":0,"b":0,"r":0},{"i":"238171989","s":"76561198420620020","g":0,"n":1,"p":6430,"f":6442,"l":"schinese","t":"玩了100多个小时，现在BUG还一堆，谦虚女巫净化完四个圣所回去没办法交任务，无法对话！！！！","c":1792514005,"u":0,"b":1,"r":0},{"i":"238171129","s":"76561198070905908","g":0,"n":8,"p":10638,"f":10891,"l":"italian","t":"LASCIATE PERDERE IL PARKOUR PLS NON è ROBA PER VOI","c":1792513159,"u":0,"b":0,"r":0},{"i":"238170758","s":"76561197972832251","g":0,"n":56,"p":2068,"f":2172,"l":"english","t":"Excellent game. Looks amazing. Combat is solid. Lots of things to do and see.\r\n\r\nEveryone bags on the storyline, but I've enjoyed it and the side quests. Definitely worth a playthrough.","c":1792512814,"u":1,"b":0,"r":0},{"i":"238168466","s":"76561199378942216","g":0,"n":3,"p":2358,"f":2425,"l":"english","t":"this \\game is goated since the update runs stable 160 on all max settings def recommend if you like zelda botw or totk and open world games in general","c":1792510737,"u":1,"b":0,"r":0},{"i":"238168377","s":"76561199631355556","g":0,"n":2,"p":1096,"f":1288,"l":"english","t":"pretty good so far\r\n\r\nbiggest issue for me is the popins and shimmering","c":1792510640,"u":1,"b":1,"r":0},{"i":"238167320","s":"76561199018288700","g":26,"n":4,"p":9421,"f":10065,"l":"brazilian","t":"Se você quer um jogo pra se divertir, esquecer a vida real e entrar num mundo medieval com ficção, você esta no caminho certo...\r\neu ainda não zerei, to aproveitando cada detalhe que o game tem a oferecer...\r\npra mim é GOTY...","c":1792509628,"u":1,"b":0,"r":0},{"i":"238166092","s":"76561198034836097","g":329,"n":11,"p":3658,"f":3875,"l":"russian","t":"Отличная игра, прекрасный открытый мир, мувмент, исследование. \r\nВизуал непривычен сначала, кажется что хочется надеть солнечные очки, но со временем привыкаешь и начинаешь кайфовать от картинки. Это не рпг это буквально песочница + экшен. В ней нет умопомрачительных квестов или серьезной драмы с постановкой. Но в ней есть мир в котором можно идти во все стороны и ты точно что нибудь найдешь. Есть визуал который просто взрывает мозг, а местная дальность прорисовки до сих пор меня поражает. \r\nЯ наиграл 60 часов и думаю потрогал процентов 30-40 от игры.\r\nЕсли вам нравиться исследовать красивый, наполненный открытый мир то берите смело не пожалеете. Большая часть негативных отзывов до патчей поэтому сейчас это буквально другая игра.","c":1792508463,"u":1,"b":0,"r":0},{"i":"238165655","s":"76561199401183936","g":0,"n":2,"p":1449,"f":1449,"l":"english","t":"IMHO, this game fails to pique my interest; the story is nonexistent, the characters are bland and lack any depth. I don't mind the occasional delve into a dungeon to search for a stone tablet that may or may not exist; however, in this game, most quests are \"go somewhere do this\" and oh here is a random puzzle to waste your time.\r\nif you enjoy a story-driven game this is not it\r\nI guess this is what we get for replacing humans with AI","c":1792508044,"u":0,"b":1,"r":0},{"i":"238164717","s":"76561197993476365","g":0,"n":1,"p":25938,"f":25938,"l":"russian","t":"Супер,","c":1792507145,"u":1,"b":1,"r":0},{"i":"238164435","s":"76561198310738211","g":119,"n":33,"p":3906,"f":3906,"l":"schinese","t":"纯纯的sb游戏，我是sb，前期还一直很包容的玩，第十章男主找回自己那个任务设计，老子要被恶心死了，拖沓的遭不住，傻逼游戏，不玩了","c":1792506889,"u":0,"b":1,"r":0},{"i":"238163078","s":"76561198395910875","g":0,"n":3,"p":761,"f":766,"l":"tchinese","t":"戰鬥手感跟引導爛到不行\n劇情無聊\n評論推薦的是平常吃屎吃上癮了嗎?\n這盤屎也吃得下去\n","c":1792505541,"u":0,"b":1,"r":0},{"i":"238162829","s":"76561199790256590","g":0,"n":11,"p":719,"f":1422,"l":"english","t":"game is great! horse taming is lame.","c":1792505307,"u":1,"b":1,"r":0},{"i":"238161366","s":"76561198966683338","g":915,"n":54,"p":240,"f":240,"l":"english","t":"I like it well enough but if I'd have known the devs used AI I wouldn't have bought the game to begin with. I don't want to pay for stolen art, thanks. Screw the devs.","c":1792504009,"u":0,"b":1,"r":0},{"i":"238160532","s":"76561199819198333","g":36,"n":9,"p":520,"f":520,"l":"schinese","t":"good","c":1792503314,"u":1,"b":1,"r":0},{"i":"238158623","s":"76561198052569426","g":15,"n":1,"p":5177,"f":5227,"l":"french","t":"Top Open World","c":1792501336,"u":1,"b":0,"r":0},{"i":"238158494","s":"76561198191171358","g":9,"n":2,"p":2940,"f":2940,"l":"french","t":"frappe","c":1792501205,"u":1,"b":0,"r":0},{"i":"238158217","s":"76561198934113762","g":13,"n":1,"p":4372,"f":4512,"l":"schinese","t":"真正的开放世界，真正的剑与魔法，各方面都很好玩，剧情也没那么不堪，但是也有缺点就是有的解密太恶心，有的任务比较无聊，总体可以说近两年玩到的最好的游戏了。","c":1792500910,"u":1,"b":0,"r":0},{"i":"238157088","s":"76561198078784062","g":903,"n":146,"p":11349,"f":11858,"l":"english","t":"Puzzles are stupid, rest is good.","c":1792499649,"u":0,"b":1,"r":0},{"i":"238156818","s":"76561199047256476","g":0,"n":9,"p":12268,"f":12268,"l":"spanish","t":"Tras más de 200 horas puedo decir claramente que es un juegazo, de los mejores que he jugado.\nNo es que la historia sea la leche, aunque la han mejorado últimamente con más y mejores cinemáticas, pero cumple de sobra. Pero lo verdaderamente bueno del juego es el resto: te puedes perder por el mapa a lo Breath of the Wild, hacer de todo (exploración, lucha, talar árboles, picar minerales, cazar, pescar, invertir en bolsa, cultivo, rancho, gestión de campamento y misiones, crear tu casa...). Literalmente te pierdes por el mapa inmenso haciendo mil cosas que no ibas a hacer inicialmente. Empiezas con una misión y acabas haciendo cosas totalmente diferentes.\nLos controles, a pesar de que los han mejorado, no son los mejores del mundo pero se juega bastante bien. Hay algunos bosses que por los controles que piden se hacen engorrosos, pero es la minoría. El resto cumple bastante bien cuando te adaptas a las combinaciones de botones que piden.\nLos bosses son geniales la mayoría y muy variados. Hay muchísimos repartidos por el mapa.\nEs un juego divertidísimo y se ve de escándalo. Muy bien optimizado, por cierto.\nY lo mejor de todo es que lo han doblado al español en su versión Enhanced. Lo convierte en un juego mil veces mejor.\nRecomendadísimo","c":1792499349,"u":1,"b":0,"r":0},{"i":"238156225","s":"76561199233477287","g":55,"n":1,"p":4949,"f":4949,"l":"schinese","t":"游戏肯定是远远超过及格线的，而且十分量大管饱，但是有些操作到现在还是很反人类，预输入卡手，而且不知道为什么画面总是有颗粒感","c":1792498632,"u":1,"b":0,"r":0},{"i":"238155973","s":"76561197973681277","g":0,"n":1,"p":14149,"f":14337,"l":"english","t":"Stop reading this and go download it.","c":1792498315,"u":1,"b":1,"r":0},{"i":"238155185","s":"76561199763530114","g":0,"n":1,"p":4391,"f":4748,"l":"schinese","t":"好玩爱玩，  风景如画。","c":1792497386,"u":1,"b":1,"r":0},{"i":"238152081","s":"76561198126968382","g":0,"n":11,"p":8108,"f":8108,"l":"russian","t":"Не стал бы советовать кому-то либо данную игру, сюжет вялый, скучный, ничем не впечатляет. Квесты в это игре пустышки, кто играл в БДО тот поймет. В большинстве головоломок нет логики. Ах ну да забыл еще сказать про боссов в этой игре, не впечатляет.","c":1792493289,"u":0,"b":1,"r":0},{"i":"238150680","s":"76561199866915254","g":0,"n":1,"p":673,"f":748,"l":"schinese","t":"能不能把保存给优化优化，我存档号几次做的任务都要重新大一遍","c":1792491225,"u":1,"b":1,"r":0},{"i":"238149740","s":"76561198094243535","g":0,"n":24,"p":2585,"f":2585,"l":"english","t":"This game deserves a thumbs up because despite its flaws, it works for me. With that said, even as someone who enjoys this game, I'll admit it's pretty bizarre. I wouldn't ignore the negative reviews either because a lot of the criticism is valid. There are plenty of good reasons why someone wouldn't like this game. However, if you can overlook certain things and just accept the game for what it is, there's definitely a good time to be had.\r\n\r\nConclusion It's a half baked game, but somehow it works.","c":1792489875,"u":1,"b":1,"r":0},{"i":"238148976","s":"76561198450411789","g":28,"n":1,"p":5668,"f":6013,"l":"koreana","t":"지림","c":1792488695,"u":1,"b":1,"r":0},{"i":"238148828","s":"76561198014185175","g":0,"n":2,"p":3023,"f":3282,"l":"english","t":"fun!","c":1792488461,"u":1,"b":1,"r":0},{"i":"238146928","s":"76561199788141002","g":75,"n":3,"p":2976,"f":2976,"l":"schinese","t":"新版更新后会导致闪退，不知道咋回事","c":1792485229,"u":0,"b":0,"r":0},{"i":"238146601","s":"76561198304011316","g":0,"n":1,"p":1223,"f":1451,"l":"russian","t":"Залип","c":1792484672,"u":1,"b":0,"r":0},{"i":"238146393","s":"76561198650095138","g":0,"n":2,"p":11118,"f":11118,"l":"english","t":"changed my life.","c":1792484292,"u":1,"b":0,"r":0},{"i":"238144937","s":"76561198824732720","g":0,"n":12,"p":3014,"f":3438,"l":"schinese","t":"现在的红色沙漠值得一试","c":1792481631,"u":1,"b":0,"r":0},{"i":"238144234","s":"76561199214946255","g":0,"n":1,"p":596,"f":717,"l":"english","t":"Nice oppen world u can get lost doing whatever u want","c":1792480210,"u":1,"b":1,"r":0},{"i":"238143106","s":"76561197996162792","g":1163,"n":17,"p":4438,"f":4438,"l":"english","t":"I will start by saying that I do not like Pearl Abyss.\nAs a result, I was opposed to this game from the start.\nI didn't know much about it, but it looked like a slop, mashup, cash-grab that I was sure would be riddled with microtransactions.\n\nI had the chance to try the game for free and I figured \"why not?\".\nAfter a little while, I reached the start of the open world and some of the intro/tutorial quests and started to see the systems in place. I was blown away. I ended up buying it myself.\n\nThere does not seem to be a way to skip most dialog, instead you can hold a button to fast forward through it.\nI ended up liking this more than I thought I would. I typically skip cuscenes and dialog because they take too long. I liked that I could get all of the info and story, but without having to wade through hours of people talking at each other.\n\nThe story and characters are OK. Not great, just OK.\nThe boss fights are pretty cool. Not on the difficulty of dark souls, but still quite a challenge.\nThere is a camp you an upgrade and stock, and companion dispatch missions you can do to influence the world.\nThere are so many puzzles. Some can be quite archaic, but not too bad at all. just look one up if you don't want to do it, it's not that deep.\n\nThe controls are kinda bad. \nThey are usable, but there are lots of functions bound to the same buttons, or button combos that are hard to remember in the heat of the moment when you need them.  You get used to them, but I wouldn't say any of them are really intuitive.\n\nThere are no microtransactions. \nThe only additional money you can give is for deluxe edition which includes some cosmetics, or a \"DLC/Expansion\" releasing later this month, which looks to be a sizable content addition. This is in stark contrast to what I expected knowing Pearl Abyss.\n\nThey released an \"enhanced edition\" only a few months after launch which feels odd, but its basically just an upgrade patch to the base game. No additional charge or anything. They added more voicelines for the character, improved a bunch of gameplay, and moves story events to make more sense. All for free, I'm convinced the \"enhanced edition\" title is just a marketing thing, but the changes were welcome additions.\n\nI like this game a lot. Is it objectively the best game of 2026? no. But it is my favourite game of 2026.","c":1792477968,"u":1,"b":1,"r":0},{"i":"238142687","s":"76561198369525884","g":52,"n":1,"p":1245,"f":1262,"l":"english","t":"fire","c":1792477172,"u":1,"b":1,"r":0},{"i":"238142494","s":"76561198022103876","g":0,"n":28,"p":4274,"f":4274,"l":"english","t":"This is the weirdest, worst game I've ever gotten addicted to. It does something correct. I don't know what, but it's something!","c":1792476785,"u":1,"b":1,"r":0},{"i":"238142423","s":"76561198047425240","g":0,"n":6,"p":259,"f":259,"l":"brazilian","t":"Grande conteúdo","c":1792476635,"u":1,"b":0,"r":0},{"i":"238142240","s":"76561198118019220","g":0,"n":5,"p":5511,"f":5511,"l":"german","t":"Puuuh, nach 91 Std. habe ich abgebrochen! Zugegeben, es gab Passagen und Sessions, die mich unterhalten haben aber das Gesamtbild ist m.E. nicht stimmig. Die Story ist lame, die Charaktere nicht überzeugend, das Kampfsystem irgendwie unbefriedigend. Vielleicht werde ich es mal durch spielen aber aktuell fühlt es sich erzwungen an.","c":1792476262,"u":0,"b":0,"r":0},{"i":"238142062","s":"76561198799368841","g":42,"n":4,"p":7432,"f":7591,"l":"schinese","t":"还不错，可玩","c":1792475888,"u":1,"b":0,"r":0},{"i":"238141649","s":"76561198422224384","g":0,"n":1,"p":1379,"f":1379,"l":"spanish","t":"Excelente juego, muy buen combate y exploración, si eres fan de BOTW o TOTK tendrás algo con un gusto similar, todas las misiones son bastante interesantes y hay bastantes cosas por hacer, únicamente agregaría más personalización pero de ahí en más 10/10","c":1792475045,"u":1,"b":0,"r":0},{"i":"238139760","s":"76561198271347569","g":38,"n":4,"p":3259,"f":4562,"l":"english","t":"w","c":1792471415,"u":1,"b":1,"r":0},{"i":"238139388","s":"76561199489321574","g":0,"n":1,"p":36926,"f":37844,"l":"english","t":"It's great, buy it.","c":1792470851,"u":1,"b":1,"r":0},{"i":"238139067","s":"76561198774061904","g":0,"n":4,"p":1538,"f":1717,"l":"koreana","t":"굿굿굿","c":1792470360,"u":1,"b":1,"r":0},{"i":"238139041","s":"76561198112079274","g":0,"n":5,"p":12138,"f":12138,"l":"koreana","t":"내가 한 스팀겜중에 가장 오래한 게임\n재밌다","c":1792470332,"u":1,"b":1,"r":0},{"i":"238138533","s":"76561199201849908","g":47,"n":1,"p":1276,"f":1956,"l":"schinese","t":"可惜模型材质太糊了","c":1792469567,"u":1,"b":1,"r":0},{"i":"238136117","s":"76561198173080185","g":168,"n":5,"p":471,"f":994,"l":"english","t":"Whoever thought it was a great idea to make the interrupt combining the shield and attack buttons should never be allowed to touch another game. So many deaths only because I swing my sword, or raise my shield, instead of interrupting a major attack due to 1ms delay. It should have have a dedicated button. Period.","c":1792465969,"u":0,"b":1,"r":0},{"i":"238135925","s":"76561198112823600","g":0,"n":5,"p":2452,"f":2670,"l":"english","t":"top","c":1792465704,"u":1,"b":1,"r":0},{"i":"238135738","s":"76561197987788277","g":0,"n":9,"p":7907,"f":7907,"l":"english","t":"My Game of the Year 2026. Not without its flaws but so much on offer, tons of fun, and looks amazing to boot. Over 100 hours in so far and still got tons more to go + the upcoming expansion.","c":1792465454,"u":1,"b":1,"r":0},{"i":"238134652","s":"76561199762981383","g":0,"n":4,"p":20044,"f":20044,"l":"english","t":"This game started off strong, and somehow managed to get even better as I progressed. Unfortunately, what began as an enjoyable experience eventually turned into an absolute slog. 6/10. And honestly, the biggest culprit was the ♥♥♥♥♥♥♥ puzzles.\r\n\r\nI'm not exaggerating when I say that roughly 70% of these puzzles had me opening YouTube just to figure out what the hell I was supposed to do. There's a difference between challenging players and making them feel like they need a PhD to progress. A puzzle should reward your ability to think, not force you to abandon the game and consult a walkthrough every five minutes. At some point, the frustration completely outweighs the satisfaction.\r\n\r\nAnd then Chapter 11 happened. Whatever goodwill the game had built up started evaporating as I found myself fighting endless waves of robotic enemies. The experience became repetitive, tedious, and downright boring. It was as if the game had run out of interesting ideas and decided that throwing more enemies at me was an acceptable substitute for engaging gameplay.\r\n\r\nBut the final mission in the Abyss? That was the final nail in the coffin.\r\n\r\nI had to solve yet another ♥♥♥♥♥♥♥ puzzle just to reach Caliburn, the final boss. And how long did I spend on that one puzzle? AN ENTIRE HOUR!. By the time I finally made it to the boss, whatever excitement I might have felt had completely disappeared. I didn't care about the spectacle. I didn't care about the confrontation. I didn't even care about enjoying the final fight.\r\n\r\nI just wanted to kill the Final boss, finish the game, and get the hell out.\r\n\r\nThink about that for a second: the game had worn me down so badly that reaching the final boss felt less like a reward and more like being released from captivity. I wasn't playing because I was having fun anymore; I was playing because I'd already invested so much time that I might as well see it through to the end.\r\n\r\nAnd that's what makes this so disappointing. The game had a strong start, built genuine momentum, and gave me reasons to keep playing. But instead of maintaining that momentum, it buried the experience under obnoxious puzzles which consumed so much time until all I had left was frustration and exhaustion.\r\n\r\nA game can be difficult. It can challenge your patience. It can even piss you off occasionally. But when you reach the final boss and your only thought is, \"Let's get this ♥♥♥♥♥♥♥ over with,\" something has gone seriously wrong.\r\n\r\n6/10. A game that started by making me want to see what came next and ended by making me wish I'd never bothered.","c":1792463846,"u":0,"b":0,"r":0},{"i":"238134154","s":"76561199097900793","g":34,"n":2,"p":1055,"f":1375,"l":"english","t":"zBoss fights are ♥♥♥♥♥♥♥♥","c":1792463098,"u":0,"b":1,"r":0},{"i":"238134092","s":"76561198428455046","g":0,"n":24,"p":88,"f":88,"l":"english","t":"WOAH THIS IS LIKE GAME OF THRONES BUT A VIDEO GAME!!!!!!!!!!!!!!!!!!","c":1792463010,"u":1,"b":1,"r":0},{"i":"238132655","s":"76561199472627152","g":0,"n":11,"p":3935,"f":4205,"l":"english","t":"60 hours in, and I'm still in Hernand","c":1792460992,"u":1,"b":1,"r":0},{"i":"238131077","s":"76561198253016442","g":133,"n":17,"p":6729,"f":6959,"l":"portuguese","t":"A good game where you can get lost for hours. The story may not be the best although its good. The gameplay its really cool in spite of the controls (Which are the worst part, the control to jump is the same to interact and so on). Some bugs aswell such as the witch interaction is bugged and for some reason not interactable, the wyvern can bug out on some cutscenes or in fights, the bosses tend to bug on a corner and when defeated teleport to the center of the fight area (should say its a good feature for at least you can see the boss die etc...). Overall a good game. \nPS: the game can be rushed, but feel its better to go at ease and enjoy the combat, the environment and, overall, the gameplay.","c":1792458879,"u":1,"b":0,"r":0},{"i":"238129598","s":"76561199126920560","g":0,"n":17,"p":1023,"f":1091,"l":"english","t":"very fun","c":1792456785,"u":1,"b":0,"r":0},{"i":"238129560","s":"76561199159644716","g":0,"n":4,"p":698,"f":724,"l":"english","t":"when I first played it everything was fine then all of the sudden can't even load the game it just freezes at the loading screen where all the blocks and stuff are at. I really wanted to enjoy this game and its not even like i got bad specks either \r\n\r\nAMD RYZEN 9 7950x 16 core processor\r\n64 GB Ram\r\nGeforce RYX 5080 16gb\r\nMSI Tamhawk BMag 650 \r\n\r\nI even updated the gpu and so Idk why i cant play it anymore\r\n","c":1792456740,"u":0,"b":1,"r":0},{"i":"238128781","s":"76561198049175035","g":0,"n":1,"p":842,"f":1072,"l":"brazilian","t":"primeiro jogo em anos que me prende assim","c":1792455592,"u":1,"b":1,"r":0},{"i":"238127896","s":"76561199553902358","g":19,"n":5,"p":2250,"f":2326,"l":"russian","t":"...","c":1792454327,"u":1,"b":1,"r":0},{"i":"238127861","s":"76561197986373542","g":0,"n":7,"p":3062,"f":3157,"l":"english","t":"Quite funny game with great combat system and story. Gave me some immersive about living in a fantasy world.","c":1792454275,"u":1,"b":1,"r":0},{"i":"238127507","s":"76561198988225264","g":0,"n":1,"p":2885,"f":2995,"l":"english","t":"The best game in the last 10 years. End of discussion.","c":1792453794,"u":1,"b":1,"r":1},{"i":"238126870","s":"76561198049659892","g":0,"n":29,"p":501,"f":1385,"l":"english","t":"A few hours in.  Big fight.  Oops.  Can't eat food from the quick wheel.  Look it up online.  Developer changed it for some reason.  Several suggestions, none of them work.\r\n\r\nFail.","c":1792452944,"u":0,"b":1,"r":0},{"i":"238126618","s":"76561198042383508","g":0,"n":4,"p":679,"f":1137,"l":"french","t":"Excellent","c":1792452600,"u":1,"b":0,"r":0},{"i":"238126004","s":"76561199104911493","g":322,"n":21,"p":9557,"f":9565,"l":"schinese","t":"游戏玩的越多，对这作评价越高。让老登重振雄风的，焕发第二春的，治疗ED的\n半年前首发玩了60多个小时，剧情没什么驱动力，每天挤不出时间沉浸式体验，制作组狂更新，那以后再玩。\n七个月后的增强版让人一口气80个小时还有新鲜感、探索欲。剧情不再谜语人，首发时碰到的不成熟小问题得到解决，各种开创式操作设计和交互，初见会骂怎么这样做游戏，越深入越发觉得是人有些傲慢了。市面上独一份的投入几十小时，还有一半多boss和地图没体验到。各处谜题花样繁多，完全没有同类型游戏的重复感。和这游戏相比，它们都可以叫做罐头了。有时间一定要玩，再不会有如此体量的作品，毕竟能拆开卖你两三份钱，和利益相比良心算什么","c":1792451776,"u":1,"b":0,"r":0},{"i":"238123829","s":"76561198133048923","g":217,"n":41,"p":10346,"f":10346,"l":"brazilian","t":"Sim","c":1792448844,"u":1,"b":0,"r":0},{"i":"238123674","s":"76561198220102072","g":0,"n":4,"p":19508,"f":19518,"l":"koreana","t":"전투와 더불어 생활을 하려면 진짜 찐하게 디테일만 챙기면 인생 최고의 게임이 될 듯. 공성 MMO 게임도 해봤으니 전쟁 지휘 하면서 공성 수성 하는 컨텐츠 추가하면 진짜...","c":1792448609,"u":1,"b":1,"r":0},{"i":"238123623","s":"76561199881612278","g":0,"n":1,"p":7985,"f":7993,"l":"english","t":"Keeps crashing\r\n","c":1792448536,"u":0,"b":1,"r":0},{"i":"238122147","s":"76561198119500718","g":0,"n":38,"p":2148,"f":2966,"l":"english","t":"It has a slow start but honestly this is the most fun I've had in a game in a while and I'm very much looking forward to the DLC and the future of this game.","c":1792446708,"u":1,"b":0,"r":0},{"i":"238121350","s":"76561199245216013","g":0,"n":3,"p":6936,"f":7080,"l":"english","t":".","c":1792445937,"u":1,"b":1,"r":0},{"i":"238120804","s":"76561198005465280","g":0,"n":5,"p":416,"f":416,"l":"english","t":"Game is buggy and crashy,  Main story quest is not doable.  As soon as I enter the abyss area for the first time the game crashes.  I have tried turring off everything that is optional, and turnind down my settings to minimums, and it still crashs.  Seems to be a programming issue of some kind, or incompatibility with my computer, either way, I got 6 hours into the game, maybe 2 hours into the main story, and cannot progress any further.  Of course I can't refund because it took over 2 hours to get to this point, worst 90$ I have ever spent, and a big disapointment.","c":1792445273,"u":0,"b":1,"r":0},{"i":"238120693","s":"76561199653967824","g":0,"n":4,"p":1633,"f":1751,"l":"german","t":"Wunderschön, einzigartig und wirklich frei. So muss ein Open World RPG sein :)","c":1792445135,"u":1,"b":1,"r":0},{"i":"238120089","s":"76561199218215990","g":0,"n":11,"p":3211,"f":3220,"l":"english","t":"I will never understand why people hated on this game pre-launch. People said it looks like a mobile game and will feel like it. I wonder why you watch streams of this game now. Maybe you've even bought it yourself because you realized this game is better than GTA 6. The story may lack any meaningful moments, the characters may be mediocre, and what ever else you may think depends on your opinion and reading level of course. Still, i recommend it completely","c":1792444466,"u":1,"b":1,"r":0},{"i":"238118082","s":"76561198147744690","g":546,"n":7,"p":6155,"f":6483,"l":"english","t":"This is one of the most polarizing games I have played. It has great exploration, but terrible story execution. It has great combat, but terrible character writing. It has an amazing world and a diverse map, but terrible story pacing.\n\nThis game has so much content to the point it kind of works against it. At some point you kinda have to prioritize what content you want to do because it can be overwhelming. I'm over a hundred hours in and I barely scratched the surface.\n\nCombat wise it is great, dynamic, with a lot of build variety and skill combinations.\n\nOn the other hand, it has some of the worst conventional puzzles I have seen in a game, and terrible default controls where you will most likely tinker with them to make the game playable.\n\nIf you're looking for a game to scratch that itch for good exploration in an amazing looking world and diverse map this game is for you, but if you're looking for a great story and character writing this isn't it. I'm still giving this a recommendation, since I enjoyed the good aspects of the game too much.","c":1792442298,"u":1,"b":1,"r":0},{"i":"238117990","s":"76561198091270553","g":0,"n":7,"p":2493,"f":2513,"l":"brazilian","t":"Um jogo muito envolvente!","c":1792442201,"u":1,"b":1,"r":0},{"i":"238116891","s":"76561198078293702","g":0,"n":4,"p":4781,"f":4781,"l":"spanish","t":"Digal Delux, hasta que sale una nueva UPDATE Y TOCA PAGAR... LADRONES DE MIERDA","c":1792440976,"u":0,"b":1,"r":0},{"i":"238116581","s":"76561198868978689","g":0,"n":3,"p":777,"f":836,"l":"hungarian","t":"Attention span fixing exploration its peak","c":1792440646,"u":1,"b":0,"r":0},{"i":"238116402","s":"76561198075368128","g":0,"n":2,"p":671,"f":960,"l":"german","t":"Great game!","c":1792440449,"u":1,"b":0,"r":0},{"i":"238116374","s":"76561199862838499","g":0,"n":2,"p":4444,"f":4444,"l":"english","t":"An amazing game that I come back to regularly. There’s so much to do and explore, and the grappling abilities are a lot of fun. I also enjoy Spartan-kicking enemies off cliffs.","c":1792440419,"u":1,"b":1,"r":0},{"i":"238115077","s":"76561198121567482","g":0,"n":11,"p":938,"f":938,"l":"polish","t":"♥♥♥♥♥♥♥","c":1792439116,"u":0,"b":1,"r":0},{"i":"238108475","s":"76561198166830688","g":193,"n":3,"p":881,"f":881,"l":"spanish","t":"ta bueno","c":1792432561,"u":1,"b":1,"r":0},{"i":"238106786","s":"76561199078050415","g":130,"n":17,"p":1955,"f":2315,"l":"schinese","t":"目前玩过最好玩得开放世界游戏 玩法很多自由度也高 剧情挺长得就是没那么精彩 战斗打击感十足 个人最关键是画风明亮很喜欢因为不喜欢恐怖暗黑等风格","c":1792430861,"u":1,"b":0,"r":0},{"i":"238106242","s":"76561198757349433","g":0,"n":1,"p":3398,"f":3446,"l":"latam","t":"bueno","c":1792430302,"u":1,"b":0,"r":0},{"i":"238106217","s":"76561198051895027","g":0,"n":51,"p":1318,"f":1335,"l":"schinese","t":"连个跑动 都做不好的游戏 你还玩个屁啊！！\r\nW+ SHIFT 都跑不起来 人 和马都是 按两下也没用 真垃圾 要不是我时间长了 必须退款 操控垃圾到家了","c":1792430277,"u":0,"b":1,"r":0},{"i":"238103271","s":"76561198291148572","g":192,"n":3,"p":5394,"f":5394,"l":"french","t":"LE JEU EST DEVENU INJOUABLE :\ndes microsaccades toutes les 2sec, j'ai mes pilotes à jour, j'ai vider le cache des shaders, j'ai attendu 15mn sur le lobby et en jeu, j'ai changé mes options graphiques en désactivant tout les pb connus à ce jour plusieurs fois rien ne fonctionne (j'ai même désinstallé le jeu/vérifier les fichiers)\n\nJ'avais pas du tout ce problème il y a genre 4 mois, je relance le jeu et direct ça, c'est du foutage de gueule \nAucune communication à ce sujet alors que c'est un bug connu depuis des semaines c'est super","c":1792427366,"u":0,"b":0,"r":0},{"i":"238101003","s":"76561198144862036","g":37,"n":6,"p":9274,"f":9705,"l":"koreana","t":"갓겜입니다.","c":1792425238,"u":1,"b":1,"r":0},{"i":"238100907","s":"76561198104751399","g":0,"n":6,"p":28336,"f":28363,"l":"german","t":"Keine Rezension notwendig, mehr als genug Aussagen bereits hier.","c":1792425149,"u":1,"b":1,"r":0},{"i":"238100497","s":"76561199022217776","g":42,"n":1,"p":8642,"f":8835,"l":"schinese","t":"傻逼游戏操作，难度全都来自于游戏操作的不跟手和迟钝，屎一样的操作手感","c":1792424754,"u":0,"b":1,"r":0},{"i":"238100203","s":"76561198175190561","g":43,"n":12,"p":8358,"f":8358,"l":"schinese","t":"好玩就是好玩，折磨也是真折磨。","c":1792424492,"u":1,"b":0,"r":0},{"i":"238097853","s":"76561199500565415","g":0,"n":11,"p":11331,"f":11697,"l":"brazilian","t":"Fantástico.\nZerei a campanha no sábado com 170h de jogo no total. Ficava intercalando entre secundárias e na exploração do mundo. Acho que é a forma ideal, pelo menos pra mim, de jogar esse game. \nO jogo possuí um dos melhores e maiores mapas no mundo dos games. Em um ponto vc tem ilhas deslumbrantes, no outro florestas escuras e com inimigos espreitando na escuridão, além dos climas de deserto e neve em algumas áreas. Falando em ilhas o jogo possuí um level design tão fantástico que em uma certa missão vc pode modificar estruturas e o ambiente em volta e a mudança permanece. Só que a forma que é feita vc se impressiona pq não é através de cutscene ou cgi, mas as mudanças acontecem em tempo real e as vezes vc consegue ver a alteração sendo feita. Geralmente quando jogamos um game o mapa só tá alí pro seu personagem se mover, mas nesse game o mapa existe pra vc e vc realmente se sente imerso naquele mundo fantástico. \nUm defeito que tenho que ressaltar no game é que tem coisas que o jogo simplesmente não te ensina e nem avisa que existe. Vc só descobre indo atrás literalmente. Mas por mim tudo bem, até pq antigamente a gente fazia isso em alguns jogos mais complexos como no Zelda e etc através de revistas... \nHoje temos o YouTube com canais dedicados que podem e vão te auxiliar com alguma dúvida. E pode ter certeza que vai ter momentos no game que vc precisará de ajuda pra resolver certas coisa. Pra mim esse foi o único defeito até pq eu não tenho muito tempo pra ficar gastando tentando resolver algum puzzle. Mas isso pode ser o de menos pra alguém com tempo livre que tenha gastado um valor alto nesse jogo dependendo do momento em que fez a compra. \nE digo que independente do momento que vc for comprar, pode ter certeza que vai ser um valor bem gasto. Pq conteúdo e qualidade esse jogo tem de sobra.\n","c":1792422293,"u":1,"b":0,"r":0},{"i":"238096020","s":"76561199038280032","g":0,"n":31,"p":656,"f":770,"l":"english","t":"Great gameplay, but ruined by severe ghosting and blurry DLSS/DLAA\r\n\r\nCrimson Desert has amazing core gameplay and world design, but the technical implementation of anti-aliasing makes it very exhausting to play especially on a laptop screen which is smaller and the blur is even more noticeable\r\nMassive ghosting and blur running DLAA, it doesnt look like its native resolution, my native resolution is  1600p\r\nSetting DLSS to Quality makes the game look super low-res, its terrible.\r\n\r\nLeaving a negative review for now, but I will happily change it to Positive as soon as a patch fixes the DLSS/DLAA ghosting and motion vector issues","c":1792420553,"u":0,"b":0,"r":0},{"i":"238093929","s":"76561198222943852","g":27,"n":3,"p":834,"f":908,"l":"schinese","t":"休闲游戏，不要抱太高的期待，用养老的心态去玩就很好玩，到处有事做，到处有收集品，就是光追配置不够亲民，不开光追连火焰都渲染不好，开了光追感觉画面写实了很多，但依然不够顶级，为了德米安入手的游戏，嘿嘿。","c":1792418536,"u":1,"b":1,"r":0},{"i":"238093693","s":"76561198340557201","g":101,"n":10,"p":3825,"f":3982,"l":"schinese","t":"给设计师老冯招魂的做一下骑着狼的盗贼团这个任务","c":1792418302,"u":1,"b":0,"r":0},{"i":"238093165","s":"76561198376417551","g":4,"n":1,"p":26359,"f":26473,"l":"koreana","t":"방대한 오픈월드에 다양한 이벤트까지 그리고 놀라운 그래픽^^ 감동입니다.","c":1792417725,"u":1,"b":1,"r":0},{"i":"238091261","s":"76561197999854199","g":0,"n":27,"p":6572,"f":6857,"l":"english","t":"This game is great but not for everyone who needs 100% polish lol. Play it blind unless you get stuck, I've been so happy with the exploration and floundering my way through. Amazing views, amazing depth and power progression. It can be very aggravating in certain situations. I haven't been able to catch a fish without going full Gollum and jumping in the water. I've gotten stuck and had to make sure I was doing something correct because the fundamental mechanics can be extremely wonky. Once you learn the quirks you're good. I've never pre-ordered DLC, but I did for this game. TURN ON YOUR HDR, THIS GAME IS STUNNING","c":1792415565,"u":1,"b":1,"r":0},{"i":"238090290","s":"76561198884217150","g":45,"n":15,"p":2348,"f":2920,"l":"schinese","t":"神作，画质画面玩法，都是极品，现在增强版的剧情，我感觉也很流畅了。不过很多解谜还是得查攻略，但是我是可以接受的。而且是全配音，不像有些游戏是开始有些配音，后面完全沉默了。还有就是跑图，现在开局就能获得飞龙宠物了，跑图也是爽歪歪","c":1792414418,"u":1,"b":1,"r":0},{"i":"238089498","s":"76561198361040821","g":259,"n":15,"p":1607,"f":1607,"l":"schinese","t":"太多槽点无处说起，被骗进来了，玩起来似曾相识的感觉，但赶某些游戏还差得远。","c":1792413385,"u":0,"b":1,"r":0},{"i":"238088982","s":"76561199809834670","g":0,"n":1,"p":8918,"f":8918,"l":"japanese","t":"","c":1792412731,"u":1,"b":1,"r":0},{"i":"238088841","s":"76561199402561709","g":0,"n":4,"p":97,"f":97,"l":"schinese","t":"是区啊，什么叫我2k高画质盔甲糊成一坨了","c":1792412554,"u":0,"b":0,"r":0},{"i":"238088082","s":"76561199583106371","g":0,"n":1,"p":7283,"f":7283,"l":"russian","t":"GOOD","c":1792411545,"u":1,"b":0,"r":0},{"i":"238087028","s":"76561198818181725","g":0,"n":14,"p":866,"f":1085,"l":"schinese","t":"奔跑是不是有bug  跑不动啊","c":1792410062,"u":0,"b":0,"r":0},{"i":"238083335","s":"76561199147450534","g":0,"n":4,"p":2594,"f":2711,"l":"english","t":"Assassin's Breath of the Red Dead Wild Hunt of Tsushima","c":1792404394,"u":1,"b":1,"r":0},{"i":"238080671","s":"76561198031122196","g":982,"n":18,"p":10286,"f":10286,"l":"english","t":"It's like slop of 10 games, but done good.","c":1792400000,"u":1,"b":0,"r":0},{"i":"238080545","s":"76561198358907701","g":207,"n":16,"p":6153,"f":6282,"l":"russian","t":"Дико огромная и интересная игра","c":1792399774,"u":1,"b":1,"r":0},{"i":"238080188","s":"76561198890840072","g":368,"n":18,"p":2344,"f":2429,"l":"english","t":"[h1] An ALMOST Incredible Open-World Experience – Crimson Desert [/h1]\n\nLet me start of this review with the negatives (because there isnt many) \n- Firstly the combat, more so the auto targeting system, it can just be very jumpy and frustrating at times when you start fighting groups of enemies. \n- Secondly the main characters voicelines are just so...bland! Not saying I need shakepear yapping away but in all honesty the massively reused personalityless voice lines really add a dullness to this amazing game. \n- Finally more of a personal gripe but the in game photo mode is so lackluster and the controls for it are frustrating, you can still manage to take some amazing photos just with some added effort!\n\nEnough about the negatives because I know you want to hear the positives! \n- Firstly, I have to give props to Pearl Abyss because for a gaming market hyper-saturated with multiplayer games, live-service models, and games built around ongoing monetisation, it’s refreshing to see a developer commit to creating a large-scale, story-driven, single-player adventure.\n- Secondly is the combat, with 5 main weapons categories that breaks away into 13 distinct weapon and combat types there is a playstyle for every gamer! Each weapon has their respective unique moves, strenghts and flaws incoorperating a immense amount of replayability.\n- Thirdly how immersive and massive the world is! Not only does it feel alive with npc's everywhere interacting with the world but so rewarding to actually take the time and explore, ontop of the world is the graphics...WOW users might have to tweak some settings dependant of their pc's but I find myself in awe with the scenery.\n- Fourthly going right back to Pearl Aybss, you can tell there is a lot of time and care for this game with the studio constantly pushing patchs and QOL updates.\n- Fifth and final!!! The Bosses & Mini Bosses, not saying every boss is amazing but for the majority of them that I've encountered so far 9/10 the cutscenes are amazing and the bosses have been well voiced with good stories. (At time of writting I just completed the Reed Devil fight and by far my favourite quest & fight) \n\nTo sum this review up honestly, I have to rate this game a good 8.5/10 I have just under 40hrs into the game and I've still barely touched the main storyline and yet I find myself unable to stop playing this game. I look forward to the upcoming DLC \"Charting the Unknown\" and will update the review once I experience the new mechanics and gameplay!","c":1792399190,"u":1,"b":1,"r":0},{"i":"238078823","s":"76561198416785535","g":0,"n":2,"p":853,"f":1373,"l":"english","t":"Slow burn but gets good","c":1792396612,"u":1,"b":1,"r":0},{"i":"238077839","s":"76561197993563964","g":0,"n":48,"p":1209,"f":1209,"l":"english","t":"A hodgepodge of disjointed systems and ideas.\r\nBig open world, with nothing to do. Oh you see something cool? Walk there, welp you can't interact with this yet, sorry.\r\nCities with NPC, that are just there.\r\nThe most uninspired quests/story imaginable.\r\nSomething Pailune, Graymanes whatevs, now go there and murder a few battalion of soldiers and come back. Repeat. There are some witches and some abyss thing and some other factions and characters and ... I can't even remember the name of the people that are in my faction!\r\nSuper boring button mashing combat. No tactics, no skill, just smash smash smash, maybe role, maybe eat a full meal between two roles and that is it.\r\n\r\nI don't think there is a nicer way to put this. As a game, Crimson Dessert Enhanced is garbage.\r\nWhich is rather disappointing as one can clearly see that from the technical aspects the developers/designers/sound designers really outdid themselves.\r\nAnother game goes down the toilet due to incompetent management...","c":1792394747,"u":0,"b":1,"r":0},{"i":"238077290","s":"76561198018707055","g":0,"n":16,"p":621,"f":1233,"l":"koreana","t":"스카이림 1,000시간 위쳐3 500시간 드래곤에이지 인퀴지션 400시간 오디세이 300시간 등 \n오픈월드 rpg게임을 좋아하는 유저로서 최고입니다.\n\n1. 타격감 최고 \n2. 최적화 최고\n3. 여기저기 풍경보며 탐험하기 좋음(탐험요소 최고)\n4. 스토리는 볼 만함\n5. 파밍요소 굿\n6. 주어진 퀘스트를 따라가거나 직선적인 플레이를 하는 분은 사지마세요 비추","c":1792393712,"u":1,"b":1,"r":0},{"i":"238077034","s":"76561198969431470","g":0,"n":5,"p":4611,"f":4895,"l":"schinese","t":"更新那么多次以后，玩起来还是很爽的，就是手柄部分键位有些问题","c":1792393129,"u":1,"b":0,"r":0},{"i":"238075587","s":"76561198064641144","g":0,"n":24,"p":16318,"f":16511,"l":"english","t":"Takes some time to get used to the controls but once you master it, its a fantastic game. The visuals are beautiful, the diversity in animals and plant life is on a different level in this game, the amount of different animals you will see just stopping and looking is amazing and always had me looking closer.","c":1792390275,"u":1,"b":1,"r":0},{"i":"238075241","s":"76561199512545639","g":2,"n":2,"p":217,"f":1090,"l":"spanish","t":"muy bueno el juego","c":1792389647,"u":1,"b":1,"r":0},{"i":"238074493","s":"76561198028365627","g":169,"n":8,"p":796,"f":796,"l":"english","t":"If you want to learn a new useless mechanic every single mission, this is your game. On paper this game looked like so much fun but the over complex mechanics of completing tasks is so frustrating.","c":1792388090,"u":0,"b":0,"r":0},{"i":"238073630","s":"76561198971708842","g":81,"n":12,"p":8979,"f":8979,"l":"schinese","t":"总有能恶心到人的点，能让我跟玩竞技游戏一样红温的单机游戏，红色沙漠还是头一个。","c":1792386566,"u":0,"b":0,"r":0},{"i":"238072593","s":"76561198295039754","g":0,"n":19,"p":4820,"f":4820,"l":"spanish","t":"8/10 un juego maravilloso, historia larga para los gustos, solo la optimizacion debe mejorar, y tambien los glitches en las texturas y reflejos tambien debe mejorar, por todo lo demas un buen 8/10 ;D","c":1792384674,"u":1,"b":0,"r":0},{"i":"238072314","s":"76561199192795914","g":0,"n":4,"p":11273,"f":11578,"l":"english","t":"This game has gone through so much. Off release i didn't initially review this game due to how fast it was evolving! I recently reinstalled and all i can say is, WOW! The new mounts and QOL updates are outstanding, adding an additional flying mount so i can make my way around more easily without using Blackstar is outstanding! This genuinely is one of the greatest games I've played without a doubt! I think performance is pretty good for this game i don't believe it to be anything other-worldly, but it runs smoothly for me! Overall this game is a solid 9/10, and the development team could never receive enough praise for their continuous updates and optimization!","c":1792384194,"u":1,"b":1,"r":0},{"i":"238071562","s":"76561198429721460","g":0,"n":4,"p":1606,"f":2075,"l":"koreana","t":"정말 게임하나사서 오래하고싶은분 강추..\r\n\r\n20시간 아직도 튜토리얼 맵켜보니까 얼마나더해야할지 감도안옴","c":1792382900,"u":1,"b":1,"r":0},{"i":"238071369","s":"76561198068922462","g":222,"n":5,"p":187,"f":324,"l":"schinese","t":"光影做的眼睛都要看瞎了","c":1792382583,"u":0,"b":1,"r":0},{"i":"238071126","s":"76561199573735589","g":92,"n":1,"p":675,"f":1655,"l":"schinese","t":"真的非常豪完，一天干11个小时","c":1792382155,"u":1,"b":1,"r":0},{"i":"238070672","s":"76561199793204219","g":0,"n":6,"p":1120,"f":1120,"l":"english","t":"[h1]An Amazing MMORPG... Without the MMO[/h1]\r\n\r\nThe game is good. I genuinely enjoyed parts of it, but I ended up dropping it after 20 hours.\r\n\r\nThe best way I can describe this game is **an amazing MMORPG without the social element.**\r\n\r\nYou have this enormous, beautiful open world, tons of activities, endless things to explore, and a combat system that feels fantastic.\r\n\r\nBut the more you play, the more you realize that almost everything outside of combat and exploration feels... cheap.\r\n\r\nThe story? Generic.\r\n\r\nThe characters? Generic.\r\n\r\nThe quests? Generic.\r\n\r\nThe puzzles? You guessed it. Generic.\r\n\r\nIt's like the developers spent all their resources building this incredible world and then realized they actually had to fill it with something.\r\n\r\n[h2]A Thousand Things to Do, Almost None Worth Doing[/h2]\r\n\r\nI'm a huge fan of minigames within games. I absolutely loved what The Witcher 3 did with Gwent and tavern fistfights. These little activities can make a fictional world feel alive and give you something genuinely fun to master outside the main adventure.\r\n\r\nCrimson Desert has plenty of these activities too. Unfortunately, most of them feel like they were added just to check a box.\r\n\r\nArm wrestling? Mash a button.\r\n\r\nFistfighting? I was actually super excited when I discovered the fighting arena. I thought there would be some kind of progression, increasingly difficult opponents, maybe even a little depth to the mechanics.\r\n\r\nNope. It's ridiculously easy, repetitive, and there's practically nothing to master. The entire thing feels like a wasted opportunity.\r\n\r\nAnd that's the problem with so many activities in this game. They're technically there, but there's barely any interesting gameplay behind them.\r\n\r\nThe one exception for me was poker. I actually enjoyed it, even though getting used to the whole dice system was a little annoying at first.\r\n\r\n[h2]A Beautiful World That Struggles to Keep You Interested[/h2]\r\n\r\nAnd that's what makes the game so frustrating. **The foundation is genuinely impressive.** The combat is energetic, flashy, and satisfying, and the world is absolutely gorgeous.\r\n\r\nBut after 20 hours, I realized I wasn't really interested in anything the game was trying to tell me. I was just moving from one activity to another in a beautiful world that never gave me much reason to care.\r\n\r\nIt feels like a game obsessed with the quantity of content rather than the quality of it.\r\n\r\n[b]It's a great world to explore, but not a particularly interesting world to experience.[/b]\r\n\r\nI don't think it's a bad game. Far from it. I just wish the content was anywhere near as impressive as the world it takes place in.","c":1792381405,"u":1,"b":1,"r":0},{"i":"238070070","s":"76561197974076056","g":57,"n":2,"p":15018,"f":15782,"l":"english","t":"Awesome game, doesn<t hold your hand, let you play the way  you want with the style you prefer","c":1792380480,"u":1,"b":1,"r":0},{"i":"238069501","s":"76561199090298613","g":0,"n":1,"p":1825,"f":2676,"l":"spanish","t":"De los mejores que he jugado desde skirym","c":1792379591,"u":1,"b":0,"r":0},{"i":"238069374","s":"76561199215456416","g":0,"n":4,"p":2127,"f":2390,"l":"english","t":"Yes","c":1792379397,"u":1,"b":1,"r":0},{"i":"238067986","s":"76561198139784272","g":196,"n":10,"p":1601,"f":1950,"l":"english","t":"Good game","c":1792377405,"u":1,"b":1,"r":0},{"i":"238067394","s":"76561199622804489","g":0,"n":53,"p":838,"f":838,"l":"english","t":"The world that Pearl Abyss managed to construct in Crimson Desert is genuinely a historic achievement. The problem lies in that there is hardly anything meaningful to do in it. \n\nThe main quest is bland and feels more like a constant stream of repetitive, uninspired side quests, rather than what should be carefully tailored story missions. The ACTUAL side quests that you can find throughout the world are also nothing of note. \n\nI would still recommend this game for reasons like the world, exploration, and the sandbox freedom, but don't expect anything grand from the story, characters or quests.","c":1792376526,"u":1,"b":0,"r":0},{"i":"238066818","s":"76561198297419398","g":0,"n":4,"p":1929,"f":3783,"l":"schinese","t":"目前玩起来感觉还可以 有点上头","c":1792375694," nn man auf Fantasie und Erkundung steht.","c":1792353821,"u":1,"b":1,"r":0},{"i":"238048064","s":"76561198017782329","g":0,"n":1,"p":6534,"f":6663,"l":"dutch","t":"game of the year!","c":1792353604,"u":1,"b":1,"r":0},{"i":"238047426","s":"76561199060679114","g":175,"n":36,"p":9980,"f":10366,"l":"english","t":"I think this game is great. it does SOOO many things right like the combat, exploration, open world, gear system and so much more! BUT the things that is does wrong, it does it sooo wrong. the story is not good. i have seen some people say it is \"THE WORST\" but honestly, it isnt THAT bad. The dialogue was another complaint of mine, the main character kliff has some very bland dialogue, mostly just \"yes\" or \"okay\", although they have added more apparently, i havent played since that update. Most of the bossfights are kinda the same, they are very fun though. the combat is awesome, SO many different moves you can do so combat is extremely fun! the map is HUGE as well, i was in complete awe when i first saw the full map (although, outside hernand the amount of content gradually decreases as you go further out).\r\n\r\nOVERALL i give it an 8/10. Definitely worth the price. also can't wait to play the dlc!","c":1792353021,"u":1,"b":1,"r":0},{"i":"238046355","s":"76561198331127445","g":70,"n":74,"p":1587,"f":2003,"l":"turkish","t":"-i cant turn off aim assist\n-controlls are not responsive\n-taming horse is bs\n-unnarmed arena fights are buggy\n-optimisation is horrible","c":1792352050,"u":0,"b":1,"r":0},{"i":"238046337","s":"76561198049603730","g":355,"n":10,"p":3112,"f":3643,"l":"english","t":"What a journey. If you like single player RPG games then this one is a must play. Movement will feel weird at first, the world will be incredibly detailed to a point you almost feel motion sick from all the movement and details around you. You do get adjusted to it all, and once you do you will just be amazed over the beauty in this world.","c":1792352032,"u":1,"b":1,"r":0},{"i":"238044382","s":"76561198059717128","g":0,"n":1,"p":4424,"f":4543,"l":"german","t":"Absolutes Witz Spiel, großen Charaktere nicht zu besiegen, Steuerung am PC absoluter Witz. Das einzig gute sind die Video Sequenzen und die Titel Musik","c":1792350345,"u":0,"b":1,"r":0},{"i":"238044102","s":"76561198198144698","g":0,"n":1,"p":842,"f":842,"l":"english","t":"It's just dull ♥♥♥♥.","c":1792350096,"u":0,"b":1,"r":0},{"i":"238043878","s":"76561199037430435","g":0,"n":1,"p":8913,"f":8955,"l":"brazilian","t":"Jogo com muita liberdade de escolha para oque fazer, mundo grande e bom para se explorar um ponto extremamente negativo é a falta de uma historia cativante","c":1792349923,"u":1,"b":1,"r":0},{"i":"238043459","s":"76561199749192554","g":0,"n":1,"p":7906,"f":7922,"l":"english","t":"pop in problem. its very bad made me hate this game","c":1792349547,"u":1,"b":1,"r":0},{"i":"238043130","s":"76561199644402900","g":0,"n":1,"p":7100,"f":7415,"l":"english","t":"Worth it for sure.","c":1792349274,"u":1,"b":1,"r":0},{"i":"238042662","s":"76561198233606956","g":0,"n":9,"p":378,"f":378,"l":"schinese","t":"无论宣传多好，口碑多好，即使是2.0版本，努力尝试玩个几小时，真的额受不了。键位复杂，动作拖沓不流畅，打击感也就那样，没有惊艳的感觉，当然我肯定是在新手期。但这个游戏的任务太愚蠢了全部通马桶，真的玩不下去。非常无聊！进去1小时就看出来游戏想学超大作，剧情想学巫师3，世界交互学GTA。但可惜都是皮毛，没有一个学的像的。这就是韩国人的游戏典型。","c":1792348889,"u":0,"b":0,"r":0},{"i":"238042449","s":"76561198069266708","g":46,"n":2,"p":772,"f":1549,"l":"english","t":"Bought the game a day ago, played for 8 hours straight, and had an absolute blast just exploring the world. Finished a bunch of faction quests, only to realize I’ve barely scratched the surface of the game. The map alone feels MASSIVE, and now there’s a DLC?! Lol!\n\nThis is giving me The Witcher 3 vibes on a whole other level. I’m not even close to being done, and I’m already overwhelmed by how much this game has to offer.","c":1792348706,"u":1,"b":1,"r":0},{"i":"238042229","s":"76561199525018768","g":0,"n":1,"p":185,"f":185,"l":"italian","t":"molto denso e pieno di cose da fare per il prezzo vale tutto","c":1792348524,"u":1,"b":1,"r":0},{"i":"238042226","s":"76561198162138499","g":143,"n":5,"p":899,"f":1354,"l":"turkish","t":"Harika amk\r\n","c":1792348520,"u":1,"b":1,"r":0},{"i":"238041858","s":"76561198336194698","g":0,"n":1,"p":5664,"f":5689,"l":"brazilian","t":"Jogo muito bom, vale a pena demais. Mas tive problema com o pc crashando e tendo que reiniciar durante o jogo, não sei o porquê.","c":1792348219,"u":1,"b":1,"r":0},{"i":"238041741","s":"76561199488826814","g":18,"n":2,"p":1867,"f":1867,"l":"brazilian","t":"Maravilhoso mundo ! \r\nestou até enrolando pra jogar pra curtir o máximo!","c":1792348114,"u":1,"b":0,"r":0},{"i":"238041675","s":"76561198055659409","g":55,"n":4,"p":1353,"f":1353,"l":"spanish","t":"JUEGO EN UNA PC GAMA ALTA ... TENGO UN RYZEN 9 9950 X3D Y UNA 9070 XT Y USUALMENTE ESTE JUEGO SE ME CONGELA.....","c":1792348057,"u":0,"b":0,"r":0},{"i":"238040970","s":"76561198137087800","g":232,"n":41,"p":9276,"f":9276,"l":"english","t":"If you manage to keep playing the first ten hours, learn controls, you are gonna enjoy this game (or destroy your controller, haha). I really liked exploring the openworld and its interactivness is really glamorous. However, the story feels strange. In the recent hours, I just found myself going from quest to quest in the main story and didn't really understood why. Unfortunately, that brought me to give up and never finish the game as I don't wanna continue in story that I absolutely don't understand. The storytelling is chaotic and incredibelly fast without too much of explanations. \n\nBut in general I can recommend this one.","c":1792347466,"u":1,"b":1,"r":0},{"i":"238040800","s":"76561198341974385","g":0,"n":2,"p":4406,"f":4852,"l":"english","t":"muy gueno","c":1792347322,"u":1,"b":0,"r":0},{"i":"238039652","s":"76561198415041687","g":93,"n":3,"p":6060,"f":6200,"l":"vietnamese","t":"Game siêu hay! Tỷ thứ để làm, chơi đã đời luôn","c":1792346376,"u":1,"b":1,"r":0},{"i":"238038519","s":"76561198256864963","g":46,"n":1,"p":24853,"f":25446,"l":"koreana","t":"아직 얼마 안된 초보자지만 지금까지 해본 게임들 중에선 최상위권이라고 생각합니다","c":1792345505,"u":1,"b":1,"r":0},{"i":"238037184","s":"76561199047610502","g":35,"n":2,"p":9533,"f":9613,"l":"schinese","t":"好玩","c":1792344410,"u":1,"b":0,"r":0},{"i":"238035039","s":"76561199681115436","g":0,"n":2,"p":21059,"f":21219,"l":"brazilian","t":"Jogo do ano pra mim, apenas desfrute.","c":1792342725,"u":1,"b":0,"r":0},{"i":"238032341","s":"76561198131733269","g":88,"n":9,"p":273,"f":294,"l":"brazilian","t":"Jogo otimo, complexo... Mas lindo e um exemplo de como os devs deveriam fazer em um jogo","c":1792340583,"u":1,"b":0,"r":0},{"i":"238030739","s":"76561199096440512","g":154,"n":2,"p":2972,"f":3905,"l":"english","t":"♥♥♥♥♥♥♥♥♥. I can't even begin to describe the chokehold this game has had on me over the last week, for reference i bought it on Tuesday Oct 13th and already have nearly 50 hours sunk into it. I was initially hesitant to buy the game due to some of the reviews I'd seen online but after speaking to a friend about it i decided to pick it up anyways since I had the money to spare. And I can't remember the last time i was this enamored with a game since I picked up Skyrim for my Xbox 360 back in 2016. \r\n\r\nWhere it obviously lacks in cohesive storytelling due to the quests between larger story beats making little to no sense towards the plot I still think it's overarching story is fun and compelling as well as pretty unique despite obvious stereotypes/cliches and tropes when it comes to this genre of game. \r\n\r\nAnother thing that I was worried about was performance, not even necessarily graphical fidelity (honestly I think that's secondary with games but this game is gorgeous even on the lower settings) But I've had no issues so far, a constant 60 fps on the second lowest setting and I can get even higher with frame generation.\r\n\r\nThe combat. Oh how I love the combat in this game, and from what I've seen I've BARELY scratched the surface with what's in store for me. It's smooth, satisfying and utterly mesmerizing with all the particle effects going on which surprisingly isn't annoying. I also can't get over how ♥♥♥♥♥♥♥ fun the unarmed combat and grappling feels in this game. Putting straight belt to ass on a random bandit has never felt so hilariously fun.\r\n\r\nAnd the exploration is top tier, I lost count of how many secrets I accidentally stumbled onto just by simple asking myself \"Can I climb there?\" or \"I wonder what's in that cave.\" \r\n\r\nIt has its quirks such as the camera and leveling seems a bit tedious at times (definitely evened out by side quests and the like) But honestly those are minor. There hasn't been a time since i started playing where I genuinely got bored or frustrated. \r\n\r\n9.5/10 Would recommend to anyone looking for a massive world to explore and fun combat","c":1792339326,"u":1,"b":1,"r":0},{"i":"238029356","s":"76561198984142253","g":0,"n":1,"p":4201,"f":4489,"l":"english","t":"Great game lots of fun, not perfect but a game that really tries to excel at everything it does even if it does not always land- just be prepared to commit a lot of time into this thing- I don't even think i'm halfway through it's offering!","c":1792338230,"u":1,"b":1,"r":0},{"i":"238027773","s":"76561198032721327","g":488,"n":41,"p":89,"f":188,"l":"italian","t":"Se c'è un aspetto in cui Crimson Desert riesce davvero a distinguersi, è l'esplorazione. Più che un semplice open world, il gioco di Pearl Abyss costruisce un mondo che invita continuamente alla scoperta, premiando la curiosità del giocatore a ogni passo. Le vaste terre di Pywel non sono solo uno sfondo spettacolare per l'avventura di Kliff, ma un territorio vivo da attraversare, osservare e conquistare.\nLa sensazione di libertà è costante. Che si tratti di cavalcare attraverso pianure sconfinate, scalare montagne impervie o addentrarsi in foreste dense di segreti, il piacere della scoperta rimane sempre al centro dell'esperienza. La verticalità degli scenari aggiunge ulteriore profondità all'esplorazione, trasformando ogni altura in un punto panoramico e ogni percorso secondario in una possibile sorpresa.\nVisivamente, Crimson Desert regala scorci di grande impatto. Il mondo di gioco cambia continuamente volto grazie alla varietà dei biomi e all'attenzione per i dettagli ambientali, rendendo ogni viaggio interessante anche dopo molte ore. È uno di quei rari titoli in cui spesso si finisce per deviare dalla missione principale semplicemente perché all'orizzonte si intravede qualcosa che merita di essere esplorato.\nAnche il sistema di movimento contribuisce a rendere appagante ogni spostamento. Il viaggio non è un ostacolo tra un obiettivo e l'altro, ma una parte integrante dell'avventura. La soddisfazione di raggiungere una zona remota o di imbattersi casualmente in un punto d'interesse nascosto trasmette un autentico senso di scoperta.\nPur offrendo combattimenti spettacolari e una trama coinvolgente, è proprio l'esplorazione il vero cuore pulsante di Crimson Desert. Per chi ama perdersi in mondi aperti ricchi di panorami, segreti e libertà d'azione, questo titolo rappresenta una delle esperienze più affascinanti degli ultimi anni.\nVoto esplorazione: 9,5/10. Un mondo che non si limita a essere grande, ma che riesce continuamente a stimolare la voglia di scoprire cosa si nasconde oltre la prossima collina.","c":1792337024,"u":1,"b":0,"r":0},{"i":"238026755","s":"76561198134869056","g":0,"n":3,"p":6092,"f":6344,"l":"french","t":"Je vais pas cité tous les points positif du jeu car il y en n'a énormément, mais plutôt partager ce qui sont pour moi les plus gros points noir du jeu.\nLa caméra lors des combats de boss est horrible, il faut suivre le boss avec les touches ou le joystick pendant ce n'est pas agréable surtout avec tout les combos dispo dans le jeu, c'est pas pratique de tout gérer.\nLes effets de particules sont sympa mais rendent les paternes des boss encore pl
