 want to express my deepest gratitude to everyone who gathered the in-game information and created the guides. Without them, I wouldn't have been able to finish the game, as it is quite challenging without a walkthrough.\r\nRight now, I am happily waiting for the DLC. My only concern is that as the game’s graphics continue to improve, I might experience some stuttering or lag in certain scenes. But if that really happens, I am completely willing to invest in a new gaming laptop just to play this game.\r\nLastly, thank you to the development team for creating such a wonderful game. I will definitely keep following and supporting your future work. Thank you!\"","c":1791640625,"u":1,"b":1,"r":0},{"i":"237372313","s":"76561198034456624","g":0,"n":35,"p":6111,"f":7510,"l":"french","t":"GOTY 2026 100% RAS j'ai pas trouvé de point négatif Majeur ... <3","c":1791640302,"u":1,"b":0,"r":0},{"i":"237372092","s":"76561197992923206","g":0,"n":88,"p":4658,"f":5350,"l":"english","t":"this game is not particularly good. its just a mix of fun mechanics in gaming that works. the main story isnt particularly the kicker here neither.\r\nits the world and the world building of pywel. this is an incredibly huge map. and theres no restrictions besides the map borders. youre not being held in the starting area until the story decides to move you on. you can play it like that. but you can also freely explore and go right up to the titular crimson desert. \r\nthe world is lively if not alive. so much care for detail....not to mention the bizarre clash of high tech and medieval fantasy in pywel...fascinating. its what tiny todd would like: IT JUST WORKS!\r\nyou always see the next thing on the horizon that intrigues you, you get tons of side quests, and you can ignore all that for just traveling at your own pace.\r\n\r\nGOTY? i think, once the DLC drops....it will be surely.","c":1791640128,"u":1,"b":0,"r":0},{"i":"237370564","s":"76561199340355790","g":239,"n":4,"p":4822,"f":4822,"l":"schinese","t":"不推荐\r\n\r\n1.剧情方面太差，白开水一样，人物塑造方面也不行，对话很多都是废话要么就是莫名其妙的言语，玩下来很多都没有看明白，而且很多任务都是莫名其妙的，要么就是让你去做一些垃圾事情，垃圾委托，基本都是通马桶的任务，还有很多角色就是没有什么故事线，就是单纯为了存在而存在，叙事这方面从头到尾就看懂个大概，故事性很差，大部分在赤石。\r\n\r\n2.剧情动画。本来一些剧情是有代入感的，但是没有处理好，比如完成一个机关时你的位置是在左边，进入剧情了直接给你瞬移到右边，真的很难绷知道吗，而且最有代入感的跨时间逮捕，就因为引导问题，我并没有站在制作组设想的位置，看得我没什么感觉，我还以为抓的不是主角。剧情里边有时候npc还会和坐骑重叠，导致你看不见npc。还有就是查看回忆录像这个，画面也太闪了，看得眼睛好难受，而且有时候获取录像的判定还不准，得调整好位置才能获取（可能是我的问题）。\r\n\r\n3.设定方面。像埃尔南德这种地方，军事实力说实话算是比其他区域落后一大截，其他地区龙骑兵，飞艇，机器人，火枪手，还有个什么坦克车的，本以为是有什么魔法师平衡力量的，可是剧情里的魔法师看着弱爆了，按理来说早就是天下大乱了，完全没有平衡性可言。而且普遍板甲长枪盾牌的军队居然没有打过佩伦的野人。其次我以为埃尔南德的研究院那边有什么大能呢，因为有研究，有成果肯定就有人来抢，结果里面的军队连偷禁书库的偷书贼都抓不到，还得靠男主。制作组不要为了任务而设计任务，要么就做的合理一点。还有主角的设定，体力条真的难绷，感觉非常的虚，跑图你不开个无限体力我都佩服你。\r\n\r\n4.交互方式。交互很反人类，和我接触过的游戏完全不一样，一堆组合键要记，新的技能又有相同的组合键但是不同的触发方式，长按点按，有时候点多一下就触发不了。战斗操作还有延迟，不跟手。还有瞄准判定，caps瞄准这个有时候很不准，脚底下就是捡不上来。其次就是攀爬判定，滑翔后都撞到岩壁上了，按键容易触发不了攀爬导致直接滑下去摔死；再就是这个爬墙翻窗，很多窗都在屋檐下，为了爬到窗边，常常一次触发按键人物爬好几段直接爬到屋顶去了，真的很气人。再有就是人物移动，一跑起来就不听使唤，停不下来，是要去参加马拉松吗？按键还有延时，总感觉慢一拍，手感粘糊。\r\n\r\n5.坐骑方面。首先是马匹，在npc多的环境下，马匹的乘坐按键竟然会优先给到npc的对话交互去（但实际准星并没有对准npc而是对准马匹），导致乘坐按键直接消失。其次，小飞龙的乘坐判定，只有在面对飞龙时容易显示，在身后，翅膀旁边，亦或是背上都能大概率不能触发，而且触发动画必须是从前面脖子上去，就导致观感非常差，明明在左，右，后面，就是硬把人物模型拱到前面去完成这个动画，就不能多做几套吗；再有是能攻击的坐骑，攻击交互键和武器的攻击键冲突了（虽然说不要紧），用着很难受。\r\n\r\n6.过场动画。上面的乘坐动画说过了，现在来说别的，升级动画，锻造动画，交易动画，能跳过的我就不说了，不能跳过的太恶心人了，比如这个锻造动画，收集够了材料，想去痛痛快快的升级一把，升级一次看一回，恶心人，要么就纯跳过，看个几秒钟又显示个跳过键有鸡毛用，那不等于没跳过吗，如果就第一次锻造有不说啥了，后面需要升级一套装备得花费最少都得十多分钟，就在这按。\r\n\r\n7.npc方面。这个交互键非常容易搞错，威胁，抓住，送礼什么的，很容易看错。和剧情npc一起骑乘的时候，无法超过或者平齐，有空气墙阻挡，稍微快一点直接给你原地刹车急停。还有骑马这个，坐骑撞一下路上的npc没事，撞几下围栏给我通缉了，马车碰一下通缉20银币，疯了吗，杀个人都没有这么多，然后npc还都往路中间走，让路慢慢吞吞的，真的活该被撞。并且npc都很呆，总是重复那几句话，要么你就直接打个招呼得了，非得搞不能跳过的对话。再就是主角阵营的npc塑造都太薄弱了，没有什么存在感，感觉其他人就是混吃等死，只有克里夫一个人在干活。\r\n\r\n8.画质方面，这个是重点。很多人玩游戏非常注重画质，但是这个游戏非常令人失望，你想有好的画质得找攻略调，得有高的配置，噪点严重，全是粒子，白天是很好看，晚上和室内是直接瞎了。在寺院那一章，全是树叶飞舞，树枝摆动的速度还这么大，我眼睛都快看瞎了。配置不好的直接不用考虑了。\r\n\r\n9.解谜方面。开放世界就好好的开放，整这些解谜，不是说不好，看得出来制作组用心做了，基本都不一样的解谜。但是，你做的引导非常非常差，难度不大但是让人看不懂，很多解谜不看攻略你根本无法解决，看完攻略才知道你已经想到了但不懂怎么操作，比如你知道要把剑插进去，但是怎么插没告诉你用什么按键；转盘拼图解谜，必须转的分毫不差才能触发机关，玩的真头疼。\r\n\r\n10.任务设计，我要分开剧情单独来讲。没有路线导航的地图，你要么就分难度来，没有GPS没有导航，有定位没有导航，只有非常近才能看见海拔位置，在任务里面跑图开这个地图看半天，地图不显示海拔，有时候快到了发现是悬崖什么的还得绕路。通马桶的任务，找小猫，通烟囱，给某人跑腿，给某人传达消息递纸条，调查一下蜂蜜产量怎么低了，噢原来没有这回事呀。抓通缉犯真的头疼，有些距离几千米，没有路线引导，通缉犯会不定时出现在任务地点，会到处跑找不到，还等得刷新，有些还不要尸体要活的，你只能重新开始任务。飞龙是不能载通缉犯的，几千米是要骑马的，做抓通缉犯做个任务简直就是在坐牢。\r\n\r\n11.3个主角，其实就克里夫这个角色占主要剧情，其他两个若有若无，其实删了都不影响，米安德女角色我能理解有玩家可能会喜欢，但是你再放个哥布林进来是何意味。感觉像在整GTA5的故事模式，但是又没有故事线剧情在支撑，总之就是很薄弱。\r\n\r\n12.优点。开放世界是我喜欢的类型，并且满足异世界剑与魔法城堡龙，部分设定我很喜欢，战斗打击感还不错（仅打击感），画面（高画质下调整后）和美术很好，很多地方真的很美丽，喜欢探索开放世界的沉浸感，制作组的勤奋更新。\r\n\r\n总之，就目前来看，我并不是很推荐花两百多去玩这款游戏，因为奖励机制差，剧情和任务设计差，交互方式差，bug多，战斗设计差，加上游戏节奏很慢，很容易劝退，五六十小时才出新手村。如果你不缺钱，又特别喜欢这个题材和开放世界的，可以尝试玩。","c":1791638945,"u":0,"b":0,"r":0},{"i":"237370530","s":"76561199741060552","g":0,"n":2,"p":453,"f":5476,"l":"english","t":"I have not left the first town yet but its amazing already worth playing right up there with Elden Ring and Where Winds Meet","c":1791638924,"u":1,"b":1,"r":0},{"i":"237370228","s":"76561199138215841","g":0,"n":6,"p":3621,"f":4557,"l":"french","t":"","c":1791638700,"u":1,"b":0,"r":0},{"i":"237370105","s":"76561198189479466","g":0,"n":3,"p":9210,"f":9597,"l":"english","t":"Mantap jiwa","c":1791638597,"u":1,"b":1,"r":0},{"i":"237369948","s":"76561199764903293","g":106,"n":9,"p":2976,"f":2976,"l":"schinese","t":" 优化 挺不错的","c":1791638460,"u":1,"b":0,"r":0},{"i":"237369316","s":"76561198167379300","g":0,"n":5,"p":11103,"f":11121,"l":"koreana","t":"이정도면","c":1791637927,"u":1,"b":1,"r":0},{"i":"237367690","s":"76561199562822293","g":0,"n":4,"p":5665,"f":8517,"l":"schinese","t":"虽然有不少缺点，但大世界什么都能互动确实不错","c":1791636610,"u":1,"b":1,"r":0},{"i":"237367520","s":"76561198113072604","g":291,"n":4,"p":9650,"f":11433,"l":"russian","t":"Crimson Desert - это увлекательное приключение на сотни часов. Скажу сразу: я однозначно рекомендую этот проект, особенно тем, кто любит достаточно глубокую боёвку и открытые миры. В плане геймплея в открытом мире, боёвки и общего разнообразия игровых ситуаций этот проект уверенно даёт за щеку таким прекрасным играм как RDR2 и The Witcher 3.","c":1791636472,"u":1,"b":0,"r":0},{"i":"237367384","s":"76561198263132732","g":0,"n":11,"p":13176,"f":13176,"l":"english","t":"The Best RPG, I have ever played. \n\nI dreamed of such a game since childhood.\n","c":1791636353,"u":1,"b":0,"r":0},{"i":"237362972","s":"76561198297704772","g":0,"n":12,"p":6214,"f":9185,"l":"brazilian","t":"muito bom :)","c":1791632393,"u":1,"b":0,"r":0},{"i":"237362393","s":"76561198782949313","g":0,"n":4,"p":1381,"f":1904,"l":"schinese","t":"我很喜欢玩这一类的游戏，但是时间不多，之前就玩过旷野之息和王泪，当个代餐还是可以，但是！！！为什么剧情里要加如此冗长的跟随场景，跟着npc骑马跟着npc走路，到底有什么意义在，一路上还得听他们bb，然后偶尔剧情结束了又会跟着npc移到出发点，那我跑这么久过去都没开传送点呢，下次去那个地点附近又要跑！我又不想走捷近早早的拿龙，真吐了，还有你那个解密，没引导谁想得到？主线有一个场景是什么学者做实验，你tm引导写的是启动地下机关，我tm去下面找了半天实在不行了搜攻略发现是先在地面把四个零件放进缺口，我真服了，负责做解密的你太牛逼了，你去解你老妈乃罩吧","c":1791631841,"u":1,"b":0,"r":0},{"i":"237360960","s":"76561198056236612","g":205,"n":43,"p":2862,"f":4901,"l":"english","t":"Aye","c":1791630504,"u":1,"b":1,"r":0},{"i":"237359070","s":"76561198296416721","g":668,"n":21,"p":2244,"f":2496,"l":"russian","t":"Игра — просто супер!\r\nКонтента в игре примерно на 100500 часов 10/10.\r\nГрафика 10/10.\r\nНаполненность мира -— 10/10.\r\nСюжет хромает, но в целом норм 7/10.\r\nНо есть один ОГРОМНЫЙ МИНУС, из-за которого я и ставлю дизлайк игре.\r\nЭто постоянные вылеты в моменты загрузки в игру или во время самой игры, без какой какой-либо ошибки и предупреждения. Я очень долго мучался с тем что бы, просто начать играть в неё, и наиграв почти 40 ч, у меня появилась та же проблема со входом в игру, при том что я ничего такого на компе не обновлял и не менял.\r\nЯ очень надеюсь, что это исправят.","c":1791628637,"u":0,"b":1,"r":0},{"i":"237358858","s":"76561197972776005","g":1551,"n":95,"p":11527,"f":11709,"l":"spanish","t":"Complicada reseña...\nLos controles desesperan en momentos clave, la cámara es tu peor enemigo, las misiones son de recadero en su mayoría, los enemigos finales te matan de un golpe a la que te descuides, a veces el puzzle es descubrir que hay un puzzle, desinformación en lo importante y exceso de datos absurdos... pero es bonico.\n\nSi te gusta explorar y descubrir cosas que no necesitas, pues está muy bien. Llevo pajareando casi 200 horas y lo estoy disfrutando, excepto los combates contra jefes que entre la cámara y los controles que hacen lo que les apetece, y que da igual lo preparado que vayas que no le quitas casi nada y la que te descuidas te mata de un combo o golpe.\nLa historia pues ni idea, desconecté de ella prácticamente al principio, unos que luchan contra otros por lo que creen que es suyo.\n\nY gráficamente está muy bien optimizado y se ve de fábula y juntamente a la gran cantidad de contenido que tiene lo hace muy disfrutable.\n\nAsí que la reseña es complicada, no es un juego para todo el mundo. Si buscas algo profundo, olvídate.\n\nPD: Pues matar mapaches, solo por eso merece la pena","c":1791628385,"u":1,"b":0,"r":0},{"i":"237358199","s":"76561199803813650","g":0,"n":6,"p":4465,"f":4885,"l":"turkish","t":"Bu oyun alabileceğiniz en iyi açık dünyaya sahip bence kesinlikle parasını hak ediyo ubisoft oyunları gibi boş bi açık dünya yok. Ödüllendirici bi açık dünyası var aynı zamanda kılıç abis eserleri kılıç geliştirmeleri çok detaylı bosslar da aşırı kaliteli bulmacalarına ayrı özenilmiş oyunu kesinlikle alın derim.","c":1791627673,"u":1,"b":1,"r":0},{"i":"237355803","s":"76561199013145841","g":0,"n":10,"p":790,"f":790,"l":"english","t":"Pc go burrrrrr","c":1791625189,"u":0,"b":1,"r":0},{"i":"237354217","s":"76561198328947577","g":0,"n":1,"p":6102,"f":6102,"l":"english","t":"Good game, best open world I've played so far.\nHuge map, good mechanics.\nPhysics are crazy","c":1791623412,"u":1,"b":0,"r":0},{"i":"237353780","s":"76561198008432471","g":0,"n":1,"p":3663,"f":5491,"l":"english","t":"Amazing.","c":1791622884,"u":1,"b":0,"r":0},{"i":"237352369","s":"76561198830398092","g":0,"n":38,"p":228,"f":2104,"l":"schinese","t":"在我灵魂与肉体皆深陷现实之际，我内心非常渴望一场异世界的旅行，而《红色沙漠》很好的承接了我这份渴望。满分","c":1791621269,"u":1,"b":1,"r":0},{"i":"237351328","s":"76561199076823732","g":32,"n":1,"p":6583,"f":7354,"l":"schinese","t":"就是缺点特效哦\r\n","c":1791620016,"u":1,"b":0,"r":0},{"i":"237350699","s":"76561199163382656","g":0,"n":5,"p":10966,"f":11895,"l":"english","t":"The best game I've played in past 3 years","c":1791619227,"u":1,"b":0,"r":0},{"i":"237348534","s":"76561199401348617","g":43,"n":7,"p":3800,"f":4488,"l":"schinese","t":"简直了这操作手感 不开帧生成的操作手感也是狗屎一样 本来就很垃圾的手感延迟还做你妈逼的解密，操你妈还没什么引导我操你妈逼","c":1791616536,"u":0,"b":0,"r":0},{"i":"237348260","s":"76561199071838520","g":0,"n":1,"p":4279,"f":4279,"l":"schinese","t":"除了剧情拉完了，其他还是可以的，值得一玩","c":1791616154,"u":1,"b":0,"r":0},{"i":"237346315","s":"76561199069429106","g":0,"n":1,"p":12450,"f":12450,"l":"russian","t":"Мне вкатило","c":1791613535,"u":1,"b":1,"r":0},{"i":"237345970","s":"76561198399863851","g":0,"n":2,"p":203,"f":1053,"l":"brazilian","t":"bom jogo","c":1791613089,"u":1,"b":0,"r":0},{"i":"237344810","s":"76561198159102694","g":0,"n":1,"p":1216,"f":3048,"l":"russian","t":"Это потрясающая игра, как ловко она дурит тебя в самом начале выдавая себя за второстепенный не нужный продукт, но нужно переварить всю информацию, которую так усердно вам засовывают в рот все первые часы, и поверьте игра раскроется, вы уже привыкните к основным механикам и получите свободу действий и тогда игра каждый раз, начнет вас приятно удивлять!\n","c":1791611597,"u":1,"b":0,"r":0},{"i":"237337671","s":"76561198326501602","g":166,"n":4,"p":5009,"f":5368,"l":"russian","t":"Прошел полностью сюжет и множество доп квестов, залутал все лучшие комплекты брони и оружия, освоил все механики, осуществил переезд лагеря в Пайлун, победил всех легендарных боссов, прошел бездну и тд, поэтому считаю нужным написать обзор. \nОднозначно рекомендую игру к покупке. Дальше по порядку:\nСюжет: безусловно сюжет не самый лучший, но вот уж точно гавном не назовешь. Я бы оценил сюжетную часть на 6\\10. Это неплохо для игры такого масштаба. \n\nКасаемо игры в целом и то, что она похожа на рдр, ведьмака, скайрим и другие легендарные игры: а ♥♥♥♥ нет то? Да в отдельности каждую она не превосходит, но она берет от каждой лучшее, миксует и делает это на твердое 8/10. \n\nКасаемо неоднозначных обзоров ютуберов: во многом многочисленные отрицательные отзывы на ютубе связаны исключительно с тем, что человек наиграл меньше +-15 часов. Игра невероятно слаба в самом начале. Да, я не понимаю, почему разработчики так сильно забили на начало и сюжетно и геймплейно, ведь игра наоборот должна заинтересовывать именно в начале, а тут же ты понимаешь, что играешь во что-то шедевральное только на уровне 25-30 часов игры. Да, минусы есть и ты их четко осознаешь, но плюсов в разы больше. Да, намешали миллион мини механик, типа разных игр, рыбалок, лагерь свой, обустройство дома и вот этому подобное, ну так не пользуйтесь ими, зачем это осуждать не понимаю искренне. Игра в первую очередь созидательная. \n\nПро положительные отзывы: люди наигрывают по 300-400 часов. ♥♥♥, че вы там делаете все это время ахаха, за 80 часов я прошел очень много, контента осталось еще часов на 40-50 и это всякие зачистки, мелкие миссии \"принеси-подай\", поймай преступников и несколько доп квестов. \n\nГеймплей: это вот то, что делает игру шедевральной. Вот ты играешь условно в любую другую громадную игру с открытым миром типа гта, рдр, скайрим, ведьмак и тд. Ты к 15ому часу шаришь вообще за весь геймплей и механики, здесь же игра будет тебя удивлять с первого часа и до последнего. Абсолютно всегда что-то новое. Я такое вижу впервые.\nБоевка мне лично зашла, если углубиться и правильно построить билд, очень круто играется. \nМне очень нравится, когда нет этого тупого левелинга врагов, когда тебе нельзя условно в Ведьмаке пойти  в такую то локацию, потому что ты 10 уровня, а там враги 30 уровня. В кримсоне иди куда хочешь и экипируй что хочешь. Броня и оружие конечно имеют бафы, но по своей сути экипировка ближе к косметической части. Это лучшее, что может дать игра в открытом мире. \n\nКарта: я лично провел замеры. В диаметре пробежать игру на ножках 31 минута, на виверне 11 минут, рдр 2 пробежать на коне 15 минут. Скорость бега + полет и тройная пальмара в кримсоне в целом такие же как бег на коне в рдр 2. Карта кримсона не сильно прям больше того же рдр 2. Не прям громадная, но когда смотришь с какой нибудь горы на нее, ощущается, как что-то колоссальное. Дело тут как раз в том, что такое мнение складывается из-за титаночиеской работы по проработке этой самой карты. Я не встречал еще такого, что громадная карта будет полностью проработана и заполнена. Даже не знаю, это и дар и проклятие этой игры) Всегда есть, чем заняться) \n\nГрафика: я играл в нвую Enchanced Edition, так что может раньше было по-другому, ведь на ютубе все говорят о посредственной графике, но лично у меня на средней карточке с длсс на качество и ультра настройках графики - она шедевральная для такого масштаба игры. Вот у меня такие же ощущения от графики, как когда я играл в Ведьмака году в 2016-2017. Я просто в ахуях от красоты пейзажей и детализации. Играл в 2к.\n\nГринд: честно, я прошел ооочень много игр и когда вижу отзывы про гринд в этой игре, просто не понимаю, где его искать) Игра сама дает тебе по мере прохождения квестов и сюжета все необходимое для улучшений оружий и доспехов, которые по сути то и улучшать сильно не обязательно. Я колол деревья и добывал руду только 1 раз за игру, когда в прологе тебя этому обучают, потом либо покупал, либо само падало с квестов. Я помню сраных асасинов, где реально надо гриндить и вот это слово абсолютно не применимо к кримсону. \n\nОтдельная благодарность разработчикам за работу с игрой. Патчи выпускаются настолько часто, что я просто не могу вспомнить ни одного подобного случая. Патчи не просто устраняют какие-то ошибки, они улучшают геймплей, графику, сюжет. Это просто ВАУ.\n\nИтоговое мнение: игра лично для меня шедевр на 10/10. Это максимально субъективно, так как минусы есть и особенно они видны в начале игры, но плюсы настолько сильно перевешивают это, что просто хочется закрыть на них глаза. Если будут вопросы, готов на них отвеетить.","c":1791602439,"u":1,"b":0,"r":0},{"i":"237336870","s":"76561199145497085","g":62,"n":4,"p":2002,"f":2002,"l":"schinese","t":"还行","c":1791601435,"u":1,"b":0,"r":0},{"i":"237336353","s":"76561198066806277","g":0,"n":33,"p":2471,"f":2917,"l":"english","t":"Amazing game","c":1791600779,"u":1,"b":1,"r":0},{"i":"237336054","s":"76561197979085366","g":0,"n":8,"p":2467,"f":3259,"l":"english","t":"Great open world, single player game. Amazing graphics on my gaming pc with a good transition to my Macbook when I need to travel.","c":1791600395,"u":1,"b":1,"r":0},{"i":"237335869","s":"76561198093221153","g":20,"n":3,"p":6264,"f":7077,"l":"russian","t":"выфвф","c":1791600145,"u":1,"b":1,"r":0},{"i":"237335365","s":"76561198016156987","g":379,"n":36,"p":465,"f":1856,"l":"italian","t":"capolavoro non ti stanchi mai di giocare......","c":1791599484,"u":1,"b":0,"r":0},{"i":"237335038","s":"76561199003962548","g":0,"n":1,"p":5059,"f":5338,"l":"english","t":"Great game","c":1791599124,"u":1,"b":1,"r":0},{"i":"237334858","s":"76561198032644791","g":885,"n":157,"p":7566,"f":8035,"l":"english","t":"So many things to do, I am not usually one to get lost while questing, but there are so many insects, bugs, creatures, side quests, enemies, fighting, exploring etc.... I just have never really been so lost in a game that keeps pushing you further down the rabbit trails.\r\n\r\nThe voice acting is obviously a dub, but all in all when playing the game there is just more and more to do.... I hear the new expansion will be even more so overwhelming.","c":1791598928,"u":1,"b":1,"r":0},{"i":"237334824","s":"76561198647388991","g":0,"n":2,"p":1642,"f":1701,"l":"english","t":"amazing game in every way","c":1791598899,"u":1,"b":1,"r":0},{"i":"237334784","s":"76561197980363123","g":76,"n":12,"p":15245,"f":15487,"l":"german","t":"It is honestly the best open world sandbox Ive ever played in. With the Enhanced update the story is much more compelling albeit still a little flat, but it makes up with spectactular battles, breathtaking draw distance, so many possible playstyles and builds, endless content to do, mounts and pets to tame and everything enhances your experience.","c":1791598842,"u":1,"b":0,"r":0},{"i":"237334706","s":"76561198889487175","g":12,"n":1,"p":5724,"f":6752,"l":"brazilian","t":"Simplesmente incrível, divertido, e CHEIO de coisas interessantíssimas para fazer. Me viciei quase que instantaneamente assim que comecei a jogar.","c":1791598752,"u":1,"b":0,"r":0},{"i":"237333627","s":"76561198008051271","g":0,"n":10,"p":15203,"f":15203,"l":"english","t":"good game for a good boi","c":1791597352,"u":1,"b":0,"r":0},{"i":"237332918","s":"76561198345182033","g":118,"n":6,"p":5708,"f":6074,"l":"french","t":"GOATY 2026","c":1791596422,"u":1,"b":0,"r":0},{"i":"237332686","s":"76561199141887230","g":0,"n":2,"p":15323,"f":15933,"l":"english","t":"This game is solidly placed in the top five for me. I thought $70 was too steep, but they give you $70 worth of game. The combat is a blast, the progression is good, the map is massive and rich with detail. You can really get lost in this game and not want to be found. I am looking forward to the DLC. At this point, I've finished the main story, but still have probably 100 hours of game play left.","c":1791596126,"u":1,"b":1,"r":0},{"i":"237330958","s":"76561197989341104","g":0,"n":299,"p":7760,"f":9976,"l":"koreana","t":"왜 사람들이 400시간이나 하는가 과연 그럴만한 게임이 맞는가 라는 의문이 들었으나\n\n오픈월드에 내쳐질때부터 간이캠프 짓기전까지 100시간이나 해버렸다..\n그만큼 숨겨지고 할게많다는 이야기.\n\n여기에 각 항목의 도전과제까지 한다면 400시간은 충분히 넘을거같다는 생각이 들었다..\n\n워낙 이슈가많이되고 관련 컨텐텐츠가 많이 생성된만큼 왠만한 공략은 다있으니 이런 부분은 걱정없이 즐길 수 있다.\n\n그러한 믿음으로 DLC를 예구했는데 솔직히 발매일엔 바로 못할듯 싶다 아직도 200~300시간 핥아먹어야할게 많기 때문이다..\n\n\n\n추천드리지 않는 분들은 게임이 너무긴것을 선호하지 않는 분들 뿐이며\n\n거의 대부분 풀 보이스 한국어 더빙이라는점도 매우 긍정적인 요소\n\n어느정도 패치가이뤄진 이후에 시작했던지라 평가가 부정적일때 게임을 해보진 못햇지만 현재로썬 매우 추천하는 바이며 난이도가 소울처럼 어렵다던가 하는것은 아니기때문에 충분히 성장만 한다면 해볼만 할 게임","c":1791594016,"u":1,"b":0,"r":0},{"i":"237329188","s":"76561199518598057","g":0,"n":4,"p":6324,"f":6324,"l":"french","t":"Tu découvre littéralement une nouvelle fonctionnalité de jeux a chaque session, et c'est encore le cas après 100h. Le jeu parait infinie","c":1791591899,"u":1,"b":0,"r":0},{"i":"237328783","s":"76561198824953682","g":0,"n":9,"p":10280,"f":11017,"l":"koreana","t":"재미있음. 스토리 끝이 없음.","c":1791591449,"u":1,"b":1,"r":0},{"i":"237328278","s":"76561198086385861","g":343,"n":54,"p":1933,"f":3541,"l":"latam","t":"Curenme de este vicio.","c":1791590885,"u":1,"b":0,"r":0},{"i":"237328260","s":"76561197992706454","g":1161,"n":355,"p":8810,"f":10472,"l":"german","t":"Eine epische Reise. \r\nEin fantastisches Erlebnis. Bombastische Grafik. Was will man mehr.","c":1791590862,"u":1,"b":0,"r":0},{"i":"237327656","s":"76561199779076113","g":0,"n":3,"p":10706,"f":10708,"l":"english","t":"fun but long","c":1791590170,"u":1,"b":1,"r":0},{"i":"237327517","s":"76561198825701031","g":180,"n":8,"p":6315,"f":6315,"l":"spanish","t":"ya no voy a comprar mas juegos llevo 100 horas y aun asi no comprendo el juego     10\\10","c":1791590003,"u":1,"b":1,"r":0},{"i":"237326995","s":"76561199241485569","g":0,"n":4,"p":11022,"f":12135,"l":"spanish","t":"Juegazo, empieza lento pero vale mucho la pena.","c":1791589403,"u":1,"b":0,"r":0},{"i":"237325097","s":"76561199150037741","g":218,"n":10,"p":1056,"f":1056,"l":"brazilian","t":"do neida abrindo e fechando numa 5070 10x pra abrir o jogo e ele crashar quando entro  no jogo aperto pause jogo crasha agora nao abre mais so crasha","c":1791587283,"u":0,"b":0,"r":0},{"i":"237324048","s":"76561198061301018","g":0,"n":14,"p":171,"f":171,"l":"english","t":"What I was expecting: \n\nOpen world assassins creed, play as you want, learn skills from enemies diverse weapon and fighting styles.\n\nWhat you get: A Rigid \"You can use an axe or a sword, you get a bow, and you get a shield!\"\n\nThere are other protagonists that are brawlers, etc....guess what? Main character can only use swords or axes 1 handed.....I was hoping to gain skills from diverse characters and incorporate my own preferred playstyle. Imagine watching that monk do some cool looking dropkick only to realize you are playing the protagonist that can't learn that cool dropkick....EXHAUSTING.\n\nFirst quest is to basically get inside a Knight's training area. You must wear Knight attire....you can't just find a knight and make them disappear and come back with their armor. If you kill a guard they drop almost nothing but random stupid things like grapes.\n\nYou can't even loot their weapons...they were using this cool looking halbred...NOPE.\n\nTHIS IS NOT A PLAY AS YOU WANT OPEN WORLD GAME.\n\nYou can learn like 24 skills from VERY specific enemies across the game, they only really save skill points.\n\nI hate that this game is nothing like I expected.\n\nIn order to complete that damn first quest btw, you need to basically do everything for every npc you can possibly think of...They want you to gather ores and other resources, but they tell you in 1 random throwaway dialogue where to go....\n\nThis game does a terrible job at telling you where to go for the first storyline quests...you'll explore, find out that you get almost no benefit from killing ANYTHING and then just get really bored.\n\nI absolutely hate this game's fighting style, it feels super clunky.\n\nI wish I could get a refund but I bought it on sale at a random place.\n\nI am now going to uninstall this game and never look back.","c":1791586179,"u":0,"b":0,"r":0},{"i":"237322724","s":"76561198296558166","g":76,"n":7,"p":19282,"f":19282,"l":"latam","t":"Solamente las horas jugadas lo dicen todo, excelente mundo abierto. Tendre que rejugarlo denuevo por las nuevas mejoras que le han hecho al juego a lo largo de los meses, lo juego desde su lanzamiento y ahora a esperar el DLC que viene en camino.","c":1791584791,"u":1,"b":0,"r":0},{"i":"237321448","s":"76561197963431027","g":732,"n":12,"p":28,"f":28,"l":"german","t":"Deutsche Synchro = TOP!","c":1791583502,"u":1,"b":0,"r":0},{"i":"237318130","s":"76561198121476789","g":0,"n":3,"p":4889,"f":4927,"l":"english","t":"The game is completely half baked, some good exploration and ideas but\r\nThe story is bad. The characters are as deep as a puddle\r\n\r\nThe missions are designed to be as annoying as possible. \r\n- Follow NPC on horse quests where the character banter is awful and the character moves as a snails pace.\r\n- A ton of fetch quests where it's the exact same time wasting motif (go here talk to an NPC, oh no he's not there, read a text, oh he's there). \r\n- Bounty quest where they copied Red Dead Redemption without understanding that it needs a story not just fetch some random character and bring them half way across the map in absolute silence.\r\n- Forced character change where you use another character (that most of the time you never level up)\r\n- Bandits Riding Wolf quest (the absolute worst). \r\n- Flying boss fights \r\n\r\nThe controls are absolutely random (sometimes it'll trigger some action, sometimes others with the exact same input timing). \r\n\r\n","c":1791580332,"u":0,"b":1,"r":0},{"i":"237317940","s":"76561198341243898","g":0,"n":12,"p":2789,"f":2789,"l":"english","t":"What is this game?","c":1791580165,"u":1,"b":1,"r":0},{"i":"237316957","s":"76561197995274555","g":1148,"n":17,"p":263,"f":629,"l":"german","t":"FIX FSR 4 Graphic Pipeline Sharpness bug","c":1791579319,"u":0,"b":0,"r":0},{"i":"237315871","s":"76561199521187308","g":0,"n":11,"p":126,"f":179,"l":"english","t":"would really like to play this game, but constant crashes and hitches, is making it really liked what I saw so far","c":1791578344,"u":0,"b":1,"r":0},{"i":"237315329","s":"76561198050256277","g":462,"n":177,"p":2520,"f":2809,"l":"german","t":"Bin conflicted. Auf der einen Seite macht es Spaß, vor allem die ganzen wunderschönen Regionen zu erkunden und es gibt echt viele coole Sachen.\n\nAuf der anderen Seite gibts aber leider auch einige Dinge die stören. Zum einen find ich den Combat nicht gut. Kleine Gegnerhorden kann man einfach runtermashen, Bosse sind teilweise unnötig schwierig aufgrund der clunky Steuerung.\n\nDialoge fühlen sich manchmal auch echt clunky an. Gerade bei Nebenquests (von denen es einen Haufen gibt), nehmen NPCs gefühlt immer ne halbe Stunde Pause zwischen jedem Satz. Kliff sagt dort meistens gar nichts, auch wenn er Dinge gefragt wird und die NPCs darauf reagieren. Manchmal sinds auch nur 1 von 3 Voicelines die für Nebenquests genutzt werden, die meistens auch nicht passen.\nDafür kann man Konversationen Fast Forwarden, was ich eine coole Idee finde.\n\nUnd die Visuals stechen mir hier auch, meist negativ, in die Augen. Das Game ist zwar sehr schön, wenn man nicht genau hinschaut. Schaut man aber genauer hin, dann gibts so körnige Visuals, die ich wirklich nicht schön finde. Vor allem bei Gesichtern fällt das stark auf, und reißt mich bei Konversationen auch immer raus.\n\nUnd noch n paar andere Sachen, die sich einfach clunky anfühlen und mich immer wieder aus dem Game raus reißen, leider. \n\nDafür bekommt man aber ne Menge für sein Geld geboten (zu viel?) und ich bin jetzt auch bei Weitem noch nicht durch. Also in einem Sale auf jeden Fall empfehlenswert. Für den Vollpreis mMn aber nicht.\n\n~ \"Light’s blessings and all that...\"","c":1791577881,"u":0,"b":1,"r":0},{"i":"237315320","s":"76561198333165579","g":0,"n":14,"p":7435,"f":7650,"l":"german","t":"Stabil!","c":1791577874,"u":1,"b":0,"r":0},{"i":"237314843","s":"76561198302770310","g":0,"n":6,"p":10339,"f":10339,"l":"russian","t":"Замечательная игрушка в которой можно провести много времени. Графика 9/10. Геймплей 9/10 ( не 10/10 потому что 10/10 не бывает ). \n Про сюжет ничо плохого тоже сказать не могу, после патча 2.0 они его сильно переработали и в сюжетных миссиях Клифф ощущается ныне более живым. Но в большинстве сайд квестов он всё так же говорит всякие бестолковые вещи. \n Боевка потрясающая, конечно ты можешь просто зажать 1 кнопку, только вот зачем если можно очень красиво разматывать 100 врагов различными ударами. \n\n Есть проблемки только в управлении тем же драконом или виверной, оно немного шакальное. \n Ещё один из немногих минусов лично для меня - это слишком времязатратные ачивки, но это ультра субъективщина, с учетом того что многим на ачивки пох. \n Так же в игре есть ультра позорные моменты по типу квестов с допросами ( которые моментально были забиты в гугле ) или же квестов с выслеживанием, которые то ли багались то ли изначально было задумано что тебе нужно пробежать область по кругу дважды. \nНу и также в моем прохождении была парочка багов, по типу того что меня босс закинул под текстуру, но это было до патча 2.0, мб такого уже и нет.\n В целом игру могу советовать всем, так как давно сингл игры меня не затягивали настолько сильно. Главное по сюжетке не спешить, ибо у меня стало меньше желания играть в игрушку после прохождения, но 50+ часов после сюжетки всё равно были наиграны. \n\n","c":1791577487,"u":1,"b":1,"r":0},{"i":"237314137","s":"76561198042344439","g":31,"n":7,"p":486,"f":486,"l":"english","t":"my pc kinda sucks but this game looks awful. tried playing it multiple times. killed one boss. uninstalled it and recently tried playing it again but now it wont even launch.","c":1791576914,"u":0,"b":1,"r":0},{"i":"237313124","s":"76561198160498800","g":0,"n":6,"p":13253,"f":13253,"l":"french","t":"oui, très bien","c":1791576105,"u":1,"b":0,"r":0},{"i":"237313066","s":"76561198155471348","g":0,"n":1,"p":1895,"f":2588,"l":"russian","t":"10 украденных котов из 10.\r\nОчень медитативная игра","c":1791576065,"u":1,"b":0,"r":0},{"i":"237310243","s":"76561198256243928","g":199,"n":30,"p":12454,"f":12454,"l":"brazilian","t":"Crimson Desert é um dos melhores jogos de exploração que já joguei.\n\nO que mais me impressiona é a capacidade de transformar um mundo aberto em algo que realmente dá vontade de conhecer. A liberdade, a verticalidade, a variedade de mecânicas e a quantidade de coisas para descobrir fazem com que até mesmo sair do caminho principal seja uma experiência recompensadora. É aquele tipo de jogo em que você começa indo atrás de um objetivo e, quando percebe, passou horas explorando algo completamente diferente.\n\nO mundo é enorme, visualmente impressionante e cheio de possibilidades. A movimentação e o combate complementam muito bem essa experiência, tornando a exploração algo muito mais dinâmico do que simplesmente percorrer um mapa atrás de marcadores.\n\nInfelizmente, a história não acompanha a qualidade do restante do jogo. Falta profundidade narrativa, melhor desenvolvimento dos personagens e uma conexão emocional que faça jus ao mundo construído. É frustrante perceber o potencial que a narrativa poderia ter alcançado.\n\nAinda assim, suas qualidades compensam boa parte dessas falhas. Crimson Desert entende algo que muitos jogos de mundo aberto parecem esquecer: explorar não deveria ser apenas uma forma de chegar ao próximo objetivo, mas um motivo para continuar jogando.\n\nTalvez não seja uma obra-prima em todos os aspectos, mas, como experiência de exploração, é facilmente um dos jogos mais marcantes que já tive o prazer de jogar.\n★★★★★★★★★☆ 9/10","c":1791573721,"u":1,"b":0,"r":0},{"i":"237309788","s":"76561198096764857","g":0,"n":10,"p":7067,"f":7530,"l":"koreana","t":"[u] 진짜 재밌다. [/u]\n[u] 상당히 재밌다. [/u]\n\n아주 큰 문제라면 퍼즐...근본이란게 없다.\n진짜 몇 번을 욕하면서 퍼즐을 풀었는지 모를 정도로 근본이 없는 퍼즐로 인한 스트레스가 있다.\n소소하게 조작감이 안좋은 부분이 존재한다.\n\n[u] 하지만 진짜 재밌다. [/u]\n[u] 퍼즐만 빼면 상당히 재밌다. [/u]\n\n아쉬운 점이라면 플레이어블 주인공의 매력이 부족한 것이다.\n스토리 보강으로 인해 어느정도 스토리는 괜찮아졌지만 메인은 탐험이다.\n맵에 보이는 장소에 가서 뭐라도 막 뒤지다보면 보물상자 등을 줄 것이다.\n그 재미를 느낄 수 있다면 상당히 재밌는 게임이다.\n\n문제라면 그 장소에 숨겨진 보물을 찾는게 짜증나는 경우가 생긴다.\n도대체 [spoiler] 어떤 폭포가 뚫리는 것인지... [/spoiler] [spoiler] 돌아가는 벽이 어떤 것인지... [/spoiler]\n진짜 아주 자세히 보지 않거나 아주아주 에민한 감각이 없다면 찾지 못할 것이다.\n그럴 경우에는 구글링을 통해 찾아서 하는 것이 멘탈 건강에 좋다.\n\n이러한 단점들이 존재하지만,\n[u] 미친듯이 진짜 재밌다. [/u]\n[u] 시간 가는 줄 모르고 할 정도로 상당히 재밌다. [/u]\n\n고로 나는 아직 메인 스토리 진행의 반도 하지 못했으며 아직도 탐험 중이며, 파이웰의 시간은 간다.\nDLC가 기대가 되면서도 조작 부분 등의 사소한 문제로 인해 걱정도 살짝 된다.","c":1791573378,"u":1,"b":1,"r":0},{"i":"237309410","s":"76561199469874776","g":34,"n":9,"p":3346,"f":3346,"l":"english","t":"fabuła jest jak koszmar podczas gorączki, pozatym spoko","c":1791573036,"u":1,"b":1,"r":0},{"i":"237309274","s":"76561198045626511","g":704,"n":57,"p":3382,"f":3382,"l":"english","t":"I usually stop playing a game when I start to slowly have Youtube videos on my second monitor when I start doing boring stuff.. After a while, I started watching Youtube all the time whilst playing Crimson Desert. I seriously had no interest in anything or any quest that I was doing. Everything is simply so dull and uninteresting.","c":1791572929,"u":0,"b":1,"r":0},{"i":"237309059","s":"76561198859063435","g":0,"n":8,"p":6048,"f":6048,"l":"schinese","t":"TOO MUCH","c":1791572761,"u":1,"b":1,"r":0},{"i":"237306580","s":"76561198003791274","g":0,"n":2,"p":6967,"f":6987,"l":"german","t":"Top spiel macht sehr viel laune und bis jetzt kein ende in sicht","c":1791570774,"u":1,"b":1,"r":0},{"i":"237305722","s":"76561199221329839","g":0,"n":1,"p":4337,"f":4574,"l":"schinese","t":"游戏优化很差，反复卡死闪退。基本不到30分钟就会卡死一次，打开背包或者地图基本稳定卡死闪退，各种画质调的中等，各种方式都尝试了，依然反复卡死闪退","c":1791570072,"u":0,"b":0,"r":0},{"i":"237301317","s":"76561199671972648","g":0,"n":1,"p":194,"f":1049,"l":"french","t":"Le jeu se ferme après quelques secondes en jeu.. J'ai réinstallé, mis mes pilotes de carte graphique à jour..","c":1791566424,"u":0,"b":0,"r":0},{"i":"237298625","s":"76561198840644277","g":0,"n":3,"p":1854,"f":3162,"l":"koreana","t":"재밌음","c":1791564251,"u":1,"b":1,"r":0},{"i":"237298447","s":"76561198399425085","g":115,"n":2,"p":6947,"f":7124,"l":"schinese","t":"好玩","c":1791564100,"u":1,"b":1,"r":0},{"i":"237298297","s":"76561199105295971","g":73,"n":3,"p":19208,"f":19912,"l":"english","t":"One of the best games I have ever played, if not THE best!","c":1791563969,"u":1,"b":1,"r":0},{"i":"237298026","s":"76561198822643354","g":0,"n":2,"p":1346,"f":1407,"l":"koreana","t":"존잼","c":1791563743,"u":1,"b":1,"r":0},{"i":"237297666","s":"76561198206658789","g":0,"n":1,"p":12235,"f":12235,"l":"german","t":"Um es vorwegzunehmen: Crimson Desert ist ein Meisterwerk und für mich ein absolutes GOTY!\n​Die Spielwelt ist riesig, abwechslungsreich und bietet viel zu entdecken. Die Grafik ist wunderschön und das Game läuft sehr stabil. Die Bosse sind teilweise knackig, aber niemals unfair.\n​Das Highlight des Games ist aber das Kampfsystem: Es ist so genial mit den vielen unterschiedlichen Möglichkeiten, Gegner zu bekämpfen. Ob mit Schwert, Axt, Bogen, Bomben, Stangen, Bäumen, irgend welchen Robotern, Drachen oder einfach nur mit den nackten Fäusten. Es bietet so viel Abwechslung und die Steuerung, hat man sich erst einmal an sie gewöhnt, funktioniert gerade da sehr, sehr gut! Man lernt nie aus und findet immer wieder neue Kombos heraus! Es macht einfach richtig Spaß zu kämpfen. Meiner Meinung nach ist es das beste Gameplay seit Langem!\n​Zur Story: Sie ist nicht schlecht, aber auch nicht überragend. Aber sicherlich nicht langweilig!\n​Alles in allem ein Spiel, das unglaublich viel Spaß macht, es einfach zu spielen!\n\nDanke Pearl Abyss :)","c":1791563453,"u":1,"b":0,"r":0},{"i":"237296722","s":"76561199223142996","g":0,"n":3,"p":12846,"f":13923,"l":"spanish","t":"the best game 2026 and history video game","c":1791562717,"u":1,"b":1,"r":0},{"i":"237294538","s":"76561198251781968","g":0,"n":1,"p":233,"f":329,"l":"english","t":"So far best game in long time, there is SO MUCH to do and the world is beautiful, its the first game since original Witcher 3 WH/RDR2 came out that i dont want to stop!","c":1791561051,"u":1,"b":1,"r":0},{"i":"237294160","s":"76561198073655265","g":264,"n":21,"p":2669,"f":2781,"l":"brazilian","t":"agora ta bom","c":1791560757,"u":1,"b":1,"r":0},{"i":"237292767","s":"76561197976541435","g":0,"n":5,"p":1856,"f":2773,"l":"koreana","t":"초기엔 손안대고 인핸스드업뎃 후 시작해서 스팀에 30시간 플스에20시간정도 연동해서 하고 있음.\r\n갠적으로 PC가 너무 구형이거나 또는 TV를 고집하는게 아니라면  스팀판을 추천함 플스가 슬림인데 성능모드로 해도 적들 많아지거나 화면이 복잡해질때 좀 버벅거림 \r\n가장 말나왔던 조각감은 별문제가 안됨 스토리도 그럭저럭 많이 나아졌음\r\n그래픽은 처음부터 죽여줬음 서브퀘 하면서 필드 돌아다니는데 탐험하는 재미가 확실함\r\n여기저기 돌아다니면서 하는 게임 좋아한다면 정말 추천함.","c":1791559730,"u":1,"b":1,"r":0},{"i":"237292348","s":"76561198033509670","g":60,"n":25,"p":348,"f":348,"l":"czech","t":"skurvena picovina dementna","c":1791559440,"u":0,"b":0,"r":0},{"i":"237291150","s":"76561199823438898","g":0,"n":1,"p":8100,"f":8812,"l":"koreana","t":"플레이 리뷰 간단하게 남깁니다. 일단은 재미있게는 해서 추천은 박습니다.\n\n스토리:이건 예민한 문제일 수 있어서 스토리는 따로 설명하지 않고 제가 단순 느낀 점만 서술하겠습니다.\n동화책 느낌이 납니다. 뻔하고 유치합니다. 물론 뭔가 스토리가 \"있어 보이지만\" 클리프에게 깊게 공감 되지도 않으며, 메인 빌런 중 매력적인 빌런은 단 한명도 없을 뿐더러 퀘스트의 라인이 전부 비슷한 맥락으로 흘러가다 보니 초반엔 시원시원한 전투도 나중엔 귀찮기만 한 노동에 불과했습니다. 인핸스드 이전에 스토리 개선 되기 전에 플레이를 해봤다면 모를까, 지금 개선된 이후에 플레이를 했음에도 이 정도 스토리인 거면 인핸스드 이전 플레이어들 상당수 하차했겠다 싶습니다.\n\n그래픽: 제 컴퓨터 스펙은 기본 AMD 783D에 GPU 4080s RAM 32gb입니다. 인게임 옵션은 올 시네마틱 + RR을 켠 상태로 플레이 하구요.\n \n일단 그래픽은 RR을 켜지 않으면 게임 플레이가 거의 불가능 할 정도로 실내 그래픽이 어둡습니다. 특히나 악세 업그레이드 하려 은광석 하나 캐자고 동굴에 들어가면 전혀 보이지 않아서 조준 상태에서 뜨는 오브젝트 위 동그라미의 색(빨,파)로 구분해서 광질하고 다닙니다. 아 랜턴 켜면 되지 않냐구요? 눈뽕 뒤집니다 진짜. 더구나 RR을 켜도 중간중간 그림자 그래픽이 깜빡거리지 않나.. 특히나 실내에서 실외로 갈 때 진짜 눈뽕이 너무 심합니다. 용접공들의 마음을 이해하는 그런 계기가 된 것 같습니다. 그래도 자연 경관은 상당히 멋져서 게임 하는 내내 휴식 한다는 느낌은 더러 받았지만 다음 내용에서 이 장점이 다 상쇄됩니다. \n\n조작감: 이건 아니죠.. 이렇게나 빠른 템포를 가진 게임에서 캐릭터의 조작감을 이렇게나 무겁게 가져가다뇨.. 특히나 암벽 탈 때 시도 때도 없이 캐릭터는 미끌어지고, 섭리로 줄타기 해도 중간에 바위나 이런 곳에 걸리면 갑자기 섭리 줄 땡기다가 벽을 타질 않나... 항아리 게임 하는 줄 알았습니다. 더구나 보스 패턴 때... 무슨 구르다가 벽 타고 좆만한 돌맹이에 앞길 막히거나 미끄러져 넘어져서 보스 패턴 쳐맞고 죽고... 빌어먹을 다 대 일 전투에선 시체 때문에 사방에 껴서 구르기도 안되서 쳐맞고 뒤지고.. 한 두 번 이러면 예능이지만 거의 매번 싸울 때마다 이러니 살짝 모발이 얇아지는 느낌이 오더라구요. 이미 이것조차 한 번 개선 한 줄 알고 있습니다. 진짜 매번 어떤 컨텐츠를 할 때마다 선발대들은 어떻게 버텼나 싶네요... \n\n컨텐츠: 아 시발 버그 존나게 많습니다. 검은색 물약 하나 얻어보겠다고 두 시간에 걸쳐서 뺑이 치고 그러고 염색공까지 다 열고 나서 보니 염색약이 없네요. 그래서 재접, 무결성, 다 돌려봐도 안되길래 혹시나 싶어서 퀘스트 들어가보니 이미 깬 퀘스트가 중간부터 뭐가 꼬였는지 완료 처리가 되질 않았더군요. 다시 하는데 1시간 정도가 더 걸렸습니다. 이런 경우는 허다하고 보물상자를 먹어도 템이 제대로 들어오지 않는 현상, 거점 되찾는데 게이지가 안 뜨는 현상(화염기사성 무결성, 재설치 해도 안되길래 세이브 파일 이틀 전 걸로 돌려서 깼습니다.)  등 생각보다 자잘한 버그들이 많습니다. 근데 이게 자꾸 지역에 넘어갈 때마다 이러니 참... \n\n성장 시스템: 아이템 티어 추가 및 무기 별로 차별점을 좀 주세요.. 초반부 아이템, 후반부 아이템 전부 똑같은 건 타 게임들 어떤 걸 보시고 이렇게 설계를 하신지 모르겠지만 솔직히 재미가 없습니다. 그렇다고 각 무기마다 특정 효과, 이펙트가 있는 것도 아니고 결국 어비스 기어로 모든 걸 해결 해야 하는 상황인데 이 어비스 기어 조차도 다양성이 떨어지고 이 조차도 이미 있는 어비스 기어 합성 딸깍 돌려서 합성 조지면 원하는 거 거의 10트 안에 바로 얻을 수 있으니... 뭐 서우치감도 없고 후반부 갈 수록 재미가 없습니다. 특히나 전투의 다양성이 떨어지고 이런 싱글플레이 오픈월드 게임에선 엔딩 이후 할 수 있는 게 제한 되어 있다 보니... 컨셉질로 다회차 도시는 분들도 많을텐데 너무 다양성이 떨어지고 차별점이 없어서 성장의 욕구가 떨어지는 느낌이 강합니다. \n\n이 정도 입니다. 굉장히 재미있는 게임인 건 사실입니다. 훌륭한 만듦새와 수려한 그래픽 덕에 뻥 뚫리는 가슴, 내가 바라보는 곳을 그저 걸어서 갈 수 있다는 그 자유도 하나로도 저는 충분히 140시간 가까이 되는 시간 동안 너무나도 흥미롭고 즐거운 경험을 했던 것도 사실이구요. 더불어 이런 작품이 드디어 한국에서도 나왔다는 그 사실 하나 만으로도 환희가 느껴졌습니다. 그와 동시에 이 정도의 물리 엔진과 그래픽, 그리고 자유도를 구성하고 실현해 나가기까지 여러 개발자 분들의 디스크와 목디스크의 희생이 따랐다 생각하니 괜시리 마음도 뭉클해집니다.  \n그와 동시에 후속 관리도 플레이어들의 의견을 잘 수용하시고 고쳐 나아가는 그 게임사의 태도에도 정말 감동을 느꼈습니다. 그렇기에 이렇게 평가 짧게나마 남깁니다. 후속작이 나온다면 이 경험을 통해 더욱더 개선된 플레이 경험을 할 수 있도록 해주시면 너무나도 감사하겠습니다. 펄어비스 화이팅","c":1791558532,"u":1,"b":1,"r":0},{"i":"237290330","s":"76561198852803206","g":72,"n":5,"p":6699,"f":7260,"l":"schinese","t":"其实我也不知道哪里好玩，但是真的还挺好玩的","c":1791557941,"u":1,"b":0,"r":0},{"i":"237289415","s":"76561198056283103","g":0,"n":1,"p":8126,"f":9537,"l":"koreana","t":"just do it!","c":1791557244,"u":1,"b":1,"r":0},{"i":"237288837","s":"76561198000736203","g":652,"n":34,"p":4690,"f":5779,"l":"spanish","t":"Este es el exponente de como se debe hacer un juego. A ESTOS ESTUDIOS ES A LOS QUE HAY QUE APOYAR!!!","c":1791556783,"u":1,"b":1,"r":0},{"i":"237286979","s":"76561199823368182","g":0,"n":3,"p":1527,"f":2368,"l":"english","t":"The puzzles and story are horrible but other then that the games perfect so good the combat perfect the exploration perfect the legendary mounts perfect the weapons types perfect the skill tree kinda janky to naviigate but still perfect i can acknowledge that this game isnt for everyone but in my eyes the games perfect (exluding the puzzles and story)","c":1791555330,"u":1,"b":0,"r":0},{"i":"237283262","s":"76561198020313592","g":1121,"n":673,"p":11304,"f":11304,"l":"english","t":"[h1]Quick Sum-Up[/h1]\n[h3]In-depth analysis further down.[/h3]\n[b]No AI was used to write this review.[/b]\n[hr]🟩 [b]Pros[/b] 🟩\n\n• A massive open world to explore, filled to the brim with secrets, puzzles and unique encounters. The level of care and attention to detail in making each area is exceptional.\n\n• Excellent, spectacular combat system, that features plenty of weapon-exclusive movesets, unique combos, powers and attack types to suit any playstyle. \n\n• Superb enemy variety, with each region featuring dozens of unique variants. Bosses are largely unique, well-designed and adequately challenging.\n\n• Enormous amount of side activities: from farming to pet taming, gambling, house furnishing, racing, dueling, camp management, goods trading and much more.\n\n• Extremely rewarding exploration system, that grants access to hidden quests, secret upgrades and unique items to thorough explorers.\n[hr]🟥 [b]Cons[/b] 🟥\n\n• Weak early game that gives a terrible first impression. The first 10-15 hours are a chore, filled with boring fetch quests and inconsequential dialogues.\n\n• Kliff doesn’t have the charisma and depth necessary for a solid main character. His flat, uninvolving demeanor makes him uninteresting.\n\n• Overly elaborate, clunky control system that takes a good while to get used to; it isn’t reliable when executing more complex actions or combos. Use a gamepad to retain your sanity.\n\n• Many puzzles are badly designed and frustrating. They often have obscure mechanics that don’t follow any consistent logic.\n[hr]🟨 [b]Bugs / Issues[/b] 🟨\n\n• Specific areas suffer from heavy performance issues regardless of settings.\n\n• Occasional random crashes. Frequent autosaves generally avoid progress loss.\n\n• Specific questlines may stop showing progress and new available tasks.\n[hr][h3]Content & Replay Value:[/h3]\nIt took me 188 hours to complete Crimson Desert on Hard difficulty, taking considerable extra time to complete all the side quests or optional content I could find and fully explore the entire map. If you’re an achievement hunter, add another 30 hours of grinding. The entire content is linear, there’s no reason to replay.\n\n[h3]Is it worth buying?[/h3]\nYes. The AAA price of 70€ is still very good considering the enormous amount of content and overall very good quality. If you’re a fan of massive open world games with a lot of variety, this is a great pick.\n\n[h3]Verdict: Very Good[/h3]\nAn immense open world title that tries to merge almost every genre into one, and is mostly successful at doing so. Despite the wide variety of content, it still has enough depth in many of its gameplay systems.\n[url=https://steamcommunity.com/sharedfiles/filedetails/?id=2548409603]Rating Chart[/url]\n\n[quote]Thanks for reading up to this point! Consider checking out and following my Curator, [url=https://store.steampowered.com/curator/39323490]Tamaster's Review Archive[/url].[/quote]\n\n[h1]In-Depth Analysis[/h1]\n[h3]Writing & Worldbuilding[/h3]\nCrimson Desert is what happens when devs put 90% of their budget on gameplay, content and graphics while only 10% on the writing. Aside from Kliff being a rather flat and unremarkable protagonist, other side characters such as his main companions or prominent secondary story-related ones aren’t much better either. At no point does their character or behavior evolve based on the events, while their dialogues and lines are mostly for gameplay or story continuation purposes. \n\nThe story as a whole isn’t much better, revolving around Kliff’s status as a chosen one destined to save Pywel from the forces of darkness. The worldbuilding, despite being contoured by hundreds of optional lore files, fails to ever deliver the sense of depth and mystery usually associated with narratives set in a post-technology-apex medieval setting such as this one. It simply doesn’t have the necessary pathos or narrative depth to be a truly involving story that hooks the player and motivates them to go further to uncover all of its intricacies. Ironically enough, plenty of side-quests have more interesting premise and self-contained narrative than the main plot.\n\n[h3]Exploration & Secrets[/h3]\nPywel is an immense continent, with a huge diversity of locations, biomes and geographical landmarks. Divided into five enormous areas you’re free to explore from the start, it features an overwhelming amount of locations, secrets, outposts and cities to explore, each hosting dozens of quests, unique items, hidden bosses and character upgrades. Exploration in Crimson Desert feels organic and worthwhile, and is always directly tied to character progression. Most of your skill points and better gear will not derive from quests and defeating foes, but instead from successfully finding and clearing out the plentiful secrets scattered throughout the land. \n\nAnything that remotely looks like a point of interest, marked on your map as such or otherwise, often hosts something unique for you to find, thus making Kliff stronger by means of gear stats or abilities. The world looks spectacular, feels immersive, and is incredibly involving to simply pick a direction and see where the road brings you. Rarely have I seen an open world game capable of making such a large setting, and at the same time fill it with so much unique detail and personality, recycling very little assets or locations at all.\n\n[h3]Combat System & Bosses[/h3]\nCombat plays out using a wide array of melee and ranged weapons, from swords to halberds, rifles, bows and even unique powers or fragments of lost technology. It’s generally fast paced, giving great emphasis to player skill, while also keeping resistances, gear and attributes as an important component. Mechanics such as parrying, perfect dodging, stamina management and studying your opponents’ movesets are the core of this system, that in some ways plays out very much like a Souls game in case of bosses, but feels much closer to a Musou when facing dozens of foes at a time in larger battles. \n\nThanks to the plentiful Artifacts embeddable in gear and weapons to grant unique effects, and the varied skill trees, there’s a large amount of possible combinations to make Kliff and his two playable companions into characters that suit your playstyle. You can be an elusive ranger killing foes from a distance, a tanky sword and shield user, or instead focus on powers and high-risk unarmed combos to deal staggering amounts of damage. The prominent physics-based component of combat, controlling not only enemy models but also most props and buildings, completely destructible, makes every fight spectacular and weighty. You’ll start like a highly skilled warrior, to progressively acquire supernatural powers and lost technology to become a force of nature capable of leveling entire outposts alone. \n\n[h3]Character Progression & Crafting[/h3]\nKliff and his companions share skill points and certain powers, however each of them has access to unique weapon classes and powers, other than specific quests unlockable only by playing as one of them. While you won’t be forced to play as Damiane or Oongka most of the time, it’s good to have three available characters with markedly different skills and playstyles to spice up the variety.\n\nOther than acquiring Abyss Artifacts, acting as skill points, you’ll have to invest money and materials in research to unlock late-game powers, or complete specific hidden quests that grant them. The progression of your character is entirely non-linear, save for a few skills unlocking at specific story events; if you explore enough, you might find and use end game weapons just a few dozens hours in. It’s a good system that still maintains balance pretty well. An extensive crafting system, allowing you to make food, buff potions, weapons and upgrade existing gear with powerful artifacts and enhance their base stats involves material grinding, recipe collecting, and tinkering with stats to see what complements your build the best.\n[hr]\n\n","c":1791552221,"u":1,"b":0,"r":0},{"i":"237282964","s":"76561198058741599","g":0,"n":2,"p":4531,"f":4531,"l":"polish","t":"Trochę pograłem i niestety wydarzyło się to, czego się obawiałem. Jako wieloletni gracz BDO, gdzie naprawdę widać, że bardzo wiele próbowali z MMO przeciągnąć, stwierdzam, że ta gra jest po prostu nijaka. Dosłownie widać, że twórcy od początku do końca nie byli zgodni co do tego, czym ta gra właściwie ma być.\n\nJedyne plusy, jakie jestem w stanie wymienić, to grafika, a tak poza tym można w tej grze robić wiele, tylko po chwili pojawia się w głowie pytanie: po co właściwie to robić, skoro nic konkretnego to nie daje?\n\nWiele mechanik jest zbyt rozbudowanych i można to określić tak, że są efektowne, ale kompletnie nieefektywne, a po czasie zwyczajnie męczące.\n\nGra aktorska jest typowo azjatycka, mnóstwo gestów, bardzo energiczne zachowanie, momentami aż do przesady. Czasami miałem ciary na plecach z zażenowania.\n\nDialogi się kończą i zostajesz z takim: meh, nic ciekawego. Są przedłużane, nie trzymają w napięciu ani nie wywołują ciekawości, co będzie dalej.\n\nPostacie są puste i nijakie, nie ma się jak do nich przywiązać. Dosłownie nie zapadła mi w pamięć ani jedna postać i ogólnie mam wrażenie, że wszystkie są do siebie podobne.\n\nO głównym bohaterze nawet nie wspomnę. On po prostu jest i tyle, nic więcej. Jest płytki do granic możliwości.\n\nSumma summarum można to porównać do sytuacji, w której ktoś chce Ci sprzedać ładne, drogie i szybkie auto. Wsiadasz, auto nie odpala, zaglądasz pod maskę, a tam silnik od kosiarki.","c":1791551970,"u":0,"b":0,"r":0},{"i":"237282907","s":"76561199532422656","g":41,"n":1,"p":6144,"f":7518,"l":"russian","t":"Игра супер!!! Настоятельно рекомендую к покупке, особенно, если она будет со скидкой. Играю уже 2 недели и открыто только 30% игры и впереди ещё много всего интересного. Есть конечно и минусы в виде мелких багов. В защиту могу сказать, что игра только недавно вышла и в ней постоянно проводятся исправления. Так же было крупное обновление, где поменяли и добавили много всего и углубили сюжет. Через пол годика игра должна стать идеальной. Уже купил DLC к данной игре и жду её выхода","c":1791551915,"u":1,"b":0,"r":0},{"i":"237282403","s":"76561199082531904","g":48,"n":4,"p":7380,"f":7732,"l":"russian","t":"круче гта 6","c":1791551513,"u":1,"b":0,"r":0},{"i":"237281641","s":"76561198062259816","g":0,"n":10,"p":23844,"f":25584,"l":"brazilian","t":"Espetacular jogo de mundo aberto.","c":1791550774,"u":1,"b":0,"r":0},{"i":"237281509","s":"76561198068082825","g":0,"n":18,"p":1856,"f":1856,"l":"koreana","t":"오랜만에 재밌는 게임했다ㅇㅇ","c":1791550662,"u":1,"b":1,"r":0},{"i":"237281392","s":"76561199661683887","g":0,"n":1,"p":4829,"f":6656,"l":"german","t":"Perfektes Spiel für Leute, die Lust auf ein open World Adventure spiel haben, wo man viel Erkunden kann und auch gegen verschiedene Gegner kämpfen kann.","c":1791550561,"u":1,"b":0,"r":0},{"i":"237279138","s":"76561198796749617","g":90,"n":11,"p":313,"f":462,"l":"brazilian","t":"Jogaço do c4r4lh0","c":1791548292,"u":1,"b":0,"r":0},{"i":"237278550","s":"76561198090728987","g":1603,"n":52,"p":6123,"f":6123,"l":"english","t":"100 hours in and I'm maybe a quarter through the story. Not because it's slow, but because every time I try to follow the main quest, Pywel throws ten other things at me and I just go do those instead. Kliff has been [strike]on his way to the next story mission[/strike] lost for about 80 hours now. There's so much to explore and do that the only real problem with this game is that a day only has 24 hours. I need [i]48[/i]. Pearl Abyss, if you can fix that too, please do.","c":1791547662,"u":1,"b":0,"r":0},{"i":"237277197","s":"76561198042493112","g":166,"n":30,"p":3058,"f":3058,"l":"turkish","t":"50 saat oynadım, yetti. Bitirmeye gerek yok.\r\n\r\nMmorpgi mi bu lan, sikko bir oyun. Neyi neden yaptığınız belli değil, zibilyon tane mekanik, tuş var. Oyun hiçbirşey anlatmıyor, anlatmak istediğinde de anlatamıyor. Yazık potansiyel yok olmuş.","c":1791546131,"u":0,"b":0,"r":0},{"i":"237277156","s":"76561198113151033","g":0,"n":8,"p":452,"f":1456,"l":"koreana","t":"액션게임, 특히 각종 소울류를 좋아하는 사람이라면 절대 하지 마셈.\r\n조작감이 진짜 이보다 더 쓰레기일 수가 없음.\r\n액션게임의 재미는 조작키를 눌렀을 때 캐릭터가 즉각적으로 반응하고, 그 반응을 바탕으로 적의 공격을 막거나 회피하고, 순간순간 공격을 주고받는 데서 오는 즐거움임. 그런데 이 게임은 그런 걸 기대하고 시작하는 순간 본인 성질만 버리게 됨.\r\n일반 전투는 무쌍 게임 하듯 공격 버튼만 딸깍딸깍 눌러도 적들이 죽음. 물론 일반 전투조차 모션의 직관성이나 가시성이 현저히 떨어져서 전투가 시원시원하게 느껴지지도 않음.\r\n문제는 보스전임. 보스전에서는 내가 원하는 타이밍에 회피나 가드를 하고, 빈틈을 노려 공격까지 할 수 있어야 하는데 이 게임은 그런 기본적인 전투의 합이 제대로 이루어지지 않음. 결국 플레이어 입장에서는 패턴을 읽고 대응하다 죽는 게 아니라, 조작이 제대로 먹히지 않아 억지로 죽는다는 느낌을 받게 됨.\r\n거기다 포션 역할을 하는 음식도 거의 무한정 보급할 수 있으니 전투에서 오는 긴장감마저 떨어짐.\r\n소울류 특유의 정교한 조작과 패턴 공략에서 오는 쾌감을 기대한다면 절대 사지 마셈.","c":1791546080,"u":0,"b":0,"r":0},{"i":"237277121","s":"76561199079531380","g":0,"n":1,"p":14537,"f":14706,"l":"koreana","t":"제발 플레이해주세요 그냥 너무 재밌고 .. 이 게임을 만들어주셔서 감사합니다","c":1791546045,"u":1,"b":0,"r":0},{"i":"237276998","s":"76561198091328122","g":0,"n":1,"p":15187,"f":15190,"l":"koreana","t":"한동아 게임을 유튜버가 진행하는 게임만 보면서 즐기다 쉬고있던 게임생활을 다시금 게임을 하고싶게 만들어 타이틀을 구매를 하여 다시금 직접 플레이를 하고 또 DLC까지 구매하게 한 게임이다","c":1791545894,"u":1,"b":0,"r":0},{"i":"237276718","s":"76561198197693247","g":0,"n":6,"p":3369,"f":3493,"l":"schinese","t":"非常好玩，无敌好玩，一点都不卡","c":1791545570,"u":1,"b":0,"r":0},{"i":"237276498","s":"76561198062896123","g":0,"n":5,"p":11445,"f":11480,"l":"english","t":"Very Long game","c":1791545318,"u":1,"b":1,"r":0},{"i":"237275604","s":"76561199699822546","g":0,"n":9,"p":11890,"f":11890,"l":"schinese","t":"一堆没有引导的解密，打最终BOSS之前还要进行一堆无意义的解密，剧情拉跨，开放世界仅仅只是地图开放，剧情走向毫无选择，其他任务都是通马桶，打BOSS，毫无沉浸感","c":1791544285,"u":0,"b":0,"r":0},{"i":"237275341","s":"76561198419843210","g":0,"n":4,"p":52,"f":367,"l":"english","t":"Wataa Chudai","c":1791544005,"u":1,"b":0,"r":0},{"i":"237272835","s":"76561199175132299","g":84,"n":29,"p":9796,"f":11354,"l":"schinese","t":"游戏里除了主线都挺好玩，但是好玩的部分需要主线解锁，司马韩国人没点自知之明，你真以为那个狗屎主线上得了台面啊，加一个一键跳过所有主线剧情的功能我立马改好评","c":1791540865,"u":0,"b":1,"r":0},{"i":"237272722","s":"76561199784101354","g":0,"n":4,"p":2415,"f":5524,"l":"english","t":"So after my 4th playthrough of Rdr2. i honestly gave up on finding that feeling again of being overly immersed in the environment and exploration. That is no longer an issue and my god this game is the most exceptional piece of art ive ever played. I love ditching my horse completely and just walk around and take in the environemntal story telling, Npc's, creatures and side content. Please give this game a chance. Its incredible and the controls are literally fine. I was so nervous after hearing reviews but the controls are legit easy as! This game is the legend of zelda,red dead redemption and Skyrim all rolled into 1 with about a billion more content. Oh and everything has physics and is destructable,. I have had to retrain my brain because ill end of breaking ♥♥♥♥ and realsing my smooth brain didnt even think of trying.","c":1791540702,"u":1,"b":0,"r":0},{"i":"237271980","s":"76561198953972812","g":235,"n":1,"p":386,"f":386,"l":"spanish","t":"Mundo abierto, interesante.","c":1791539765,"u":1,"b":0,"r":0},{"i":"237271178","s":"76561198039168305","g":0,"n":3,"p":853,"f":954,"l":"japanese","t":"〇良い点\nグラフィックがきれい。以上\n\n×悪い点\n・ミッションがクソほどつまらないです。\nゲームでなぜこんなくそつまらないことをやらされているのか、理解できないほどです。\n・謎解きが信じられないほど分かりにくいです。\nそんな誰が分かるねんと、攻略サイトを見て初めて先に進めます。\n\n結論\nゲームをやっていてこんなむなしい気持ちになるなら、「やめた方がいい」です。\n","c":1791538745,"u":0,"b":1,"r":0},{"i":"237270771","s":"76561198151170599","g":0,"n":3,"p":5096,"f":7183,"l":"koreana","t":"재밌음","c":1791538222,"u":1,"b":1,"r":0},{"i":"237269783","s":"76561198411118770","g":128,"n":7,"p":18627,"f":18627,"l":"english","t":"I bought it because people implied it's better than Skyrim. 300 hours later, I absolutely love everything about this game (with primary focus on main story and achievements only) and now I'm eagerly looking forward to whatever more is coming from Pearl Abyss. \r\n\r\nI'll update this review in my traditional steam review format, once I complete a reasonable amount of side quests and the upcoming expansion.\r\n\r\nFor now, it's a solid 9/10. My favourite power fantasy videogame of this century.","c":1791536837,"u":1,"b":1,"r":0},{"i":"237267441","s":"76561197980551205","g":0,"n":2,"p":8613,"f":8613,"l":"koreana","t":"GOOD GAME!!!!!","c":1791533584,"u":1,"b":1,"r":0},{"i":"237266348","s":"76561198141465767","g":0,"n":21,"p":3328,"f":3328,"l":"italian","t":"narrativamente è pessimo, Non si capisce perché fai 3/4 delle cose che fai. Il protagonista non ha nessuna personalità e non si pone nessuna domanda su cosa succede intorno a lui","c":1791532085,"u":0,"b":0,"r":0},{"i":"237266247","s":"76561199211786077","g":81,"n":4,"p":1536,"f":1898,"l":"schinese","t":"好玩的\r\n","c":1791531946,"u":1,"b":0,"r":0},{"i":"237265382","s":"76561198300087618","g":96,"n":18,"p":2500,"f":2500,"l":"english","t":"I barely played when it first came out because I was completely lost and had no clue what to do. I decided to give it another try 7 months later and have played the crap out of it. I've learned how to somewhat properly play the game and have been flat out addicted to it.","c":1791530696,"u":1,"b":1,"r":0},{"i":"237263928","s":"76561198129750562","g":0,"n":2,"p":8832,"f":9104,"l":"schinese","t":"恶心的解谜","c":1791528535,"u":0,"b":1,"r":0},{"i":"237262399","s":"76561199474994116","g":0,"n":4,"p":5052,"f":5097,"l":"koreana","t":"84시간만에 스토리봤다 스토리 내용은 이해가 제대로 안 되는데 엔딩은 굳 그래픽은 진짜 개goat 할 것도 많고 게임하면서 지루하다고 느낀 적은 없다 조작감은 joat이지만 엔딩 볼 때까지 지루하다고 느낀 적은 한 번 도 없었고 질릴까봐 걱정했는데 그런 거 하나도 없었음 스토리는 레데리2 급은 기대하지말고 그래픽은 훨씬 고트임 dlc 나오면 바로 사야지","c":1791526356,"u":1,"b":1,"r":0},{"i":"237259777","s":"76561197999645094","g":0,"n":4,"p":1929,"f":2614,"l":"french","t":"Le bac à sable heroic fantasy dont on a tous rêvé. Peut faire peur tellement les possibilités sont grandes","c":1791522316,"u":1,"b":0,"r":0},{"i":"237258396","s":"76561198032479769","g":0,"n":7,"p":4463,"f":4738,"l":"german","t":"Alles in allem ein gutes Spiel aber es gibt 2 Dinge die nerven. Das Springen funktioniert nicht richtig. Man muss die Taste immer 2x betätigen und der Ladevorgang selbst nervt. Meiner Meinung nach braucht es die Musik und den Vorgang so nicht. Es verlängert die Ladezeit.","c":1791520291,"u":1,"b":1,"r":0},{"i":"237257761","s":"76561199080122674","g":0,"n":1,"p":14519,"f":14519,"l":"spanish","t":"....","c":1791519353,"u":1,"b":0,"r":0},{"i":"237257672","s":"76561198372027016","g":367,"n":12,"p":14545,"f":14999,"l":"english","t":"Very Good","c":1791519227,"u":1,"b":1,"r":0},{"i":"237257573","s":"76561198740768908","g":0,"n":1,"p":1876,"f":4208,"l":"schinese","t":"最好玩的人生\r\n","c":1791519057,"u":1,"b":1,"r":0},{"i":"237256603","s":"76561198769548722","g":41,"n":2,"p":291,"f":596,"l":"latam","t":"ME ENAMORE DE UN JUEGO","c":1791517767,"u":1,"b":0,"r":0},{"i":"237256373","s":"76561198038686332","g":0,"n":4,"p":6265,"f":7065,"l":"english","t":"104 hours played when I'm writing this and I'm still in the tutorial. The amount of stuff that you can do is insane. That could be a little overwhelming for some people, but for me, it's the best game of the decade so far. A perfect mix between Zelda and GTA.\n\nIf you are reading this, buy the game.","c":1791517454,"u":1,"b":1,"r":0},{"i":"237255665","s":"76561198058798467","g":48,"n":5,"p":257,"f":1664,"l":"koreana","t":"플스에서 pc로 넘어왔다 더욱 재밌다.","c":1791516533,"u":1,"b":0,"r":0},{"i":"237255555","s":"76561198070171935","g":450,"n":16,"p":6821,"f":8510,"l":"english","t":"I was suspicious of this game at launch and waited until about September 2026 to purchase. I have not stopped playing this game since I bought it, I cannot recommend enough. Fills that looting and exploring itch that I've been missing for a long time! This game gets updates nearly weekly with meaningful fixes and QOL updates as well. Recommend!","c":1791516335,"u":1,"b":1,"r":0},{"i":"237254062","s":"76561198055754537","g":0,"n":3,"p":1968,"f":2517,"l":"english","t":"One of the best games I've played. Previous fav was Witcher 3, this is right there with it.","c":1791514389,"u":1,"b":0,"r":0},{"i":"237252587","s":"76561199296272450","g":27,"n":2,"p":185,"f":713,"l":"schinese","t":"太好玩了","c":1791512357,"u":1,"b":0,"r":0},{"i":"237252369","s":"76561198175507383","g":0,"n":11,"p":3983,"f":5074,"l":"english","t":"I love it! there are so many things you can do in this game! I almost feel like its a great big cozy game. you can work on your camp, farm, fish, hunt, gather crafting materials, do missions with your buddies. most of the combat is pretty easy, and the bosses can be brute forced with palmer pills. really all that's missing to make it a A tier cozy game, is romance... so I guess we'll see what happens there. combat is as deep as you wanna take it. stick with default sword and board, or switch to dual wielding, spear, two handed, unarmed with wwe style wrestling moves! or just use your bow! I have barely scratched the surface of this amazing game! and I cant wait to see what else is waiting. sorry if glazing, here's the negatives. choice paralysis there's really just too much to do, its really daunting. Kliff can get hung up on everything so traversal over a bunch of little rocks or up hills can feel kinda jerky. there's no tutorials for a lot of systems, and others get a splash screen (sometimes in the middle of a fight) that doesn't feel like it explains thing sometimes. it feels like it took inspiration for a lot of systems ( like fishing) from RDR2 witch is minor, but a little weird to me. altogether though, amazing game. it looks like devs will be supporting this for a while too!! witch is super exciting!","c":1791512097,"u":1,"b":1,"r":0},{"i":"237252361","s":"76561199006672522","g":0,"n":1,"p":8232,"f":8232,"l":"koreana","t":"조작감 10창난 게임 더이상하기가 싫음 패드로하던 키보드로 하던 둘다 ㅈ같음","c":1791512089,"u":0,"b":1,"r":0},{"i":"237251941","s":"76561198184888550","g":0,"n":2,"p":1761,"f":1979,"l":"english","t":"Basically every game ever made packaged into one and I'm here for it","c":1791511520,"u":1,"b":1,"r":0},{"i":"237251277","s":"76561199218919301","g":86,"n":6,"p":5885,"f":10653,"l":"schinese","t":"玩的最上头的开放世界罐头","c":1791510656,"u":1,"b":0,"r":0},{"i":"237250994","s":"76561199445703741","g":83,"n":15,"p":20311,"f":20780,"l":"schinese","t":"这游戏设计组的祖宗叫巨型真鲷。更新一次加大一次水生知识这挑战的难度。让玩家花几十个小时钓鱼？没活瞎整","c":1791510274,"u":0,"b":0,"r":0},{"i":"237250719","s":"76561198965903310","g":0,"n":6,"p":2540,"f":4635,"l":"tchinese","t":"Game is funny, content is huge. I like it","c":1791509970,"u":1,"b":1,"r":0},{"i":"237250352","s":"76561199734525202","g":8,"n":1,"p":1493,"f":1757,"l":"schinese","t":"我蛮喜欢的","c":1791509471,"u":1,"b":0,"r":0},{"i":"237250257","s":"76561198109329669","g":0,"n":56,"p":4681,"f":5645,"l":"english","t":"\"Look! Over there!\" The Game. Its great. No notes","c":1791509350,"u":1,"b":1,"r":0},{"i":"237250208","s":"76561198344608960","g":83,"n":30,"p":3849,"f":3866,"l":"spanish","t":"GOTY 2026","c":1791509288,"u":1,"b":0,"r":0},{"i":"237249957","s":"76561198144666011","g":496,"n":9,"p":12966,"f":14220,"l":"english","t":"Honestly one of the best RPG's I have ever played. The combination of the many weapon types, different playable characters with each having unique abilities and skill trees, QOL, and being able to interact with the game world in ways that I have wished for in other RPG's beforehand. All of these come together to create a truly unique experience that I wholeheartedly recommend for every fan of the genre. Solid 9.5/10, I am going to be putting a lot of time into this game over the next few years.","c":1791508952,"u":1,"b":1,"r":0},{"i":"237249345","s":"76561198130580363","g":159,"n":25,"p":3461,"f":3507,"l":"schinese","t":"缝合玩法集大成者，细节很多，优化很好，墙裂推荐","c":1791508121,"u":1,"b":1,"r":0},{"i":"237248299","s":"76561198141711702","g":93,"n":36,"p":2893,"f":2996,"l":"english","t":"This is a hard recommendation.  The game does so many things well, and is like a dream in so many aspects, but after 48 hours of playing this game I still think the combat is mediocore at best.  The story isn't the greatest but its ok, the exploration is awesome, the mechanics for most things are super impressive, and the combat seems like it would be great but it just falls flat.  That is really the ONLY think I don't like about the game.  Had they dialed in combat it would be easy game of the year for me, even with only a C+ story, but the combat is trash. YOu have the ability to stealth kill in this game but why bother you mash two buttons and can easily win any non boss battle.  Fix the combat please.","c":1791506805,"u":1,"b":1,"r":0},{"i":"237247182","s":"76561198960675293","g":38,"n":2,"p":3086,"f":3827,"l":"english","t":"I haven't felt this way about a game since playing Skyrim when it first came out. \n\nI love how it rewards your creativity and exploration. The graphics are absolutely mesmerizing and I find myself getting lost in the world. It's truly an open world; you can quest, collect pets/mounts, fish, find artifacts, do bounties, GET a bounty, explore every nook and cranny, fly around, solve puzzles, find unique armor and weapons, treasure hunt, cook, upgrade your camp, have a freaking farm, decorate your house, do alchemy, and SO much more. I'm about 50 hours in and literally haven't even scratched the surface of the game. And now there's a DLC coming out! It's the perfect time to get into Crimson Desert (or Hernand, if you're like me)\n\nRight now my main focus is collecting loafy cats and decking them out in armor. 10/10","c":1791505402,"u":1,"b":1,"r":0},{"i":"237246871","s":"76561198034467150","g":0,"n":11,"p":2051,"f":8416,"l":"english","t":"Unique open world experience","c":1791505033,"u":1,"b":1,"r":0},{"i":"237246674","s":"76561198138795121","g":232,"n":4,"p":11039,"f":11516,"l":"koreana","t":"퀘스트에 있어 아직도 불쾌한 지점이 좀 있기는 합니다. 지루할 때도 있고요 하지만 방대하고 제대로 된 오픈월드가 그 단점들을 넘어서 확실한 재미를 줍니다. 컨텐츠가 어마어마하게 많은 점도 확실히 재미있고요. 컨텐츠가 너무 많다고 들어서 이 게임을 구매하기 꺼려하시는 분들도 계시던대 괜찮습니다. 그 컨텐츠를 안하면 그만입니다. 안해도 괜찮은게 게임이 엄청 불친절해서 안 알려줄 예정이거든요. 이것도 단점이기는 하네요. 하지만 재밌습니다.","c":1791504781,"u":1,"b":1,"r":0},{"i":"237246317","s":"76561198018679124","g":0,"n":4,"p":48678,"f":52120,"l":"english","t":"Just swipe the card... You wont regret it.","c":1791504350,"u":1,"b":0,"r":0},{"i":"237244662","s":"76561198842652232","g":0,"n":1,"p":1946,"f":2881,"l":"english","t":"Amazing! HUGE GAME with TONS of things to get lost and spend hours exploring and helping people.","c":1791502287,"u":1,"b":0,"r":0},{"i":"237244490","s":"76561198097777784","g":0,"n":2,"p":6975,"f":8369,"l":"spanish","t":"hacia años que no me metia tanto en un mundo de un videojuego sin buscar terminarlo rapido","c":1791502067,"u":1,"b":0,"r":0},{"i":"237244365","s":"76561198065072494","g":69,"n":9,"p":2881,"f":5872,"l":"brazilian","t":"O jogo e muito bom, mas ainda esta atualmente com um bug de fechar o jogo ao abrir o inventario e isso foi relatado por muitos jogadores.","c":1791501892,"u":0,"b":1,"r":0},{"i":"237243927","s":"76561199084480537","g":0,"n":5,"p":19047,"f":19047,"l":"koreana","t":"갓 붉은사막~!!","c":1791501386,"u":1,"b":1,"r":0},{"i":"237243915","s":"76561198192952831","g":183,"n":3,"p":7338,"f":7338,"l":"russian","t":"I'm lowering my rating because the seasonal cycle system shown two years ago is still missing from the game.","c":1791501369,"u":0,"b":1,"r":0},{"i":"237242639","s":"76561199230762356","g":0,"n":1,"p":10493,"f":12144,"l":"english","t":"I guess ill just buy the game again\n","c":1791499904,"u":1,"b":0,"r":0},{"i":"237242060","s":"76561198378394663","g":181,"n":17,"p":2529,"f":2529,"l":"brazilian","t":"⡴⠑⡄⠀⠀⠀⠀⠀⠀⠀ ⣀⣀⣤⣤⣤⣀⡀\n⠸⡇⠀⠿⡀⠀⠀⠀⣀⡴⢿⣿⣿⣿⣿⣿⣿⣿⣷⣦⡀\n⠀⠀⠀⠀⠑⢄⣠⠾⠁⣀⣄⡈⠙⣿⣿⣿⣿⣿⣿⣿⣿⣆ bão\n⠀⠀⠀⠀⢀⡀⠁⠀⠀⠈⠙⠛⠂⠈⣿⣿⣿⣿⣿⠿⡿⢿⣆\n⠀⠀⠀⢀⡾⣁⣀⠀⠴⠂⠙⣗⡀⠀⢻⣿⣿⠭⢤⣴⣦⣤⣹⠀⠀⠀⢀⢴⣶⣆\n⠀⠀⢀⣾⣿⣿⣿⣷⣮⣽⣾⣿⣥⣴⣿⣿⡿⢂⠔⢚⡿⢿⣿⣦⣴⣾⠸⣼⡿\n⠀⢀⡞⠁⠙⠻⠿⠟⠉⠀⠛⢹⣿⣿⣿⣿⣿⣌⢤⣼⣿⣾⣿⡟⠉\n⠀⣾⣷⣶⠇⠀⠀⣤⣄⣀⡀⠈⠻⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⡇pó compar\n⠀⠉⠈⠉⠀⠀⢦⡈⢻⣿⣿⣿⣶⣶⣶⣶⣤⣽⡹⣿⣿⣿⣿⡇\n⠀⠀⠀⠀⠀⠀⠀⠉⠲⣽⡻⢿⣿⣿⣿⣿⣿⣿⣷⣜⣿⣿⣿⡇\n⠀⠀ ⠀⠀⠀⠀⠀⢸⣿⣿⣷⣶⣮⣭⣽⣿⣿⣿⣿⣿⣿⣿⠇\n⠀⠀⠀⠀⠀⠀⣀⣀⣈⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⠇\n⠀⠀⠀⠀⠀⠀⢿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿","c":1791499257,"u":1,"b":1,"r":0},{"i":"237238078","s":"76561199241113905","g":0,"n":3,"p":1982,"f":3447,"l":"english","t":"One of the best games I've ever played. An absolute masterpiece.\n\nI genuinely can't remember the last time a game gave me this much enjoyment. Crimson Desert is something special.\n\nThe beauty of this game is that there is literally no wrong way to play it. You're constantly rewarded for being curious, experimenting, thinking outside the box, and just doing things your own way. The amount of freedom, hidden details, Easter eggs, and unexpected discoveries is absolutely insane. Every time I think I've seen it all, the game surprises me with something new.\n\nAnd the sheer SCALE of this world? It's HUGE. Almost ridiculously huge. There's so much to explore, so much to discover, and so many ways to have fun that it genuinely feels endless. Even doing absolutely nothing productive can somehow turn into hours of entertainment.\n\nWhat I love most is that the game rewards creativity at every step instead of forcing you to play a certain way. It actually feels like the developers wanted players to have FUN, rather than just follow objectives and tick boxes.\n\nFor the first time in years, I can confidently say that I got every single penny's worth out of a game, and then some. In an industry where so many games feel overpriced, unfinished, or soulless, Crimson Desert reminds me why I fell in love with gaming in the first place.\n\nI honestly can't wait to see what the developers have planned next, especially future expansions. If this is what they've already delivered, I can only imagine what's coming.\n\nThe developers deserve every penny.\n\nThank you for making a game that actually feels like an adventure again.\n\n10/10. Worth every cent. Would buy it again without hesitation.","c":1791495098,"u":1,"b":1,"r":0},{"i":"237237699","s":"76561199802685211","g":23,"n":7,"p":28722,"f":34113,"l":"english","t":"THIS game is spectacular, that's all ima say.","c":1791494735,"u":1,"b":0,"r":0},{"i":"237237511","s":"76561198074137599","g":255,"n":28,"p":1076,"f":1166,"l":"english","t":"GOTY","c":1791494516,"u":1,"b":0,"r":0},{"i":"237234950","s":"76561198865226809","g":42,"n":4,"p":305,"f":305,"l":"schinese","t":"挺不错的。。。","c":1791492047,"u":1,"b":0,"r":0},{"i":"237233431","s":"76561198265402418","g":102,"n":20,"p":1873,"f":3189,"l":"schinese","t":"主线只能用个大叔，劳资要玩妹子！","c":1791490659,"u":0,"b":1,"r":0},{"i":"237232436","s":"76561199379765581","g":0,"n":13,"p":2281,"f":3156,"l":"english","t":"I love the graphics and gameplay. I hate the super grind and often lack of explanation of things. There are like a million things to learn only half a million explained. starting to have more fun the longer i play and learn and upgrade. I'm sure with a dozen mods this game can compete with skyrim for all my free time.","c":1791489821,"u":1,"b":1,"r":0},{"i":"237230896","s":"76561199855827420","g":0,"n":2,"p":15879,"f":15885,"l":"russian","t":"Я, пожалуй, знаю все мнения об этой игре, размещаемые в интернете. Мне лично игра очень понравилась. Я перся просто разворачивая камеру и наблюдая пейзаж. Я видел как постарался цех корейских визуальщиков. Но, ребят, оставьте игру в покое. Я больше не могу в неё поиграть, у меня какие то странные пищания и вылеты, вы зачем ее сломали? Она превосходно шла, а теперь совершенно перестала быть играбельна. Была хорошая игра - стал труп, лично для меня.","c":1791488507,"u":0,"b":1,"r":0},{"i":"237230125","s":"76561198051610742","g":0,"n":2,"p":5482,"f":5531,"l":"french","t":"Très bon jeu.\n\nTrès grande map, monde varié, gameplay excellent.\n\nDans ce type de jeu, je pense qu'il est au-dessus du lot de ce qui a pu être fait jusqu'ici.\n\nIl est graphiquement très beau, si tant est que l'on possède une carte graphique du tonnerre : le jeu devient époustouflant.\n\nLe monde ouvert est incroyable et riche !\n\nBeaucoup de possibilités, beaucoup de choses à faire.\n\nC'est un style qui peut ne pas plaire à tout le monde, comme la plupart des jeux.\n\nLes créateurs sont assez réactifs sur les patchs. Perso, je n'ai pas rencontré de problèmes particuliers (sauf ce p**** d'aigle de fer qui ignore ma perche...).\n\nLes combats sont jouissifs et, pire, je me suis mis à utiliser le corps à corps (surtout avec Diamane) et franchement, c'est très stylé ! Superbe développement. Dans l'ensemble, les armes, le CaC et les enchaînements ont la classe !\n\nAttention, la prise en main au départ est compliquée pour certains, mais on s'y fait !","c":1791487873,"u":1,"b":0,"r":0},{"i":"237228788","s":"76561198156291292","g":0,"n":1,"p":9861,"f":9873,"l":"koreana","t":"그냥 무조건 3시간만 버티고 하셈 멈출수가 없음","c":1791486809,"u":1,"b":1,"r":0},{"i":"237228406","s":"76561198065045945","g":0,"n":3,"p":7232,"f":8922,"l":"spanish","t":"Es increíble. El mundo abierto definitivo.","c":1791486499,"u":1,"b":0,"r":0},{"i":"237228207","s":"76561198094930809","g":208,"n":35,"p":21481,"f":23248,"l":"english","t":"Incredibly gorgeous open world that has a ton to do and explore. A bit of a learning curve to get acquainted with all of the game's systems at the start but it rewards you for pushing through. After the Enhanced Edition update the story isn't complete garbage anymore and is actually somewhat competent (not winning any awards but way better than pre-Enhanced). \n\nSee full review (written for pre-Enhanced Edition): https://medium.com/@edmond-wu0895/review-crimson-desert-incredible-single-player-mmo-sandbox-3aebb12923b6","c":1791486329,"u":1,"b":0,"r":0},{"i":"237228169","s":"76561199010276870","g":51,"n":4,"p":154,"f":1633,"l":"english","t":"goated ♥♥♥♥♥♥♥ game.","c":1791486298,"u":1,"b":0,"r":0},{"i":"237227963","s":"76561199357894715","g":65,"n":2,"p":4871,"f":5024,"l":"turkish","t":"beğenildi\r\n","c":1791486128,"u":1,"b":1,"r":0},{"i":"237226923","s":"76561198089458991","g":140,"n":3,"p":15266,"f":15802,"l":"english","t":"Do you miss that feeling of playing games as a kid. Welcome back.","c":1791485252,"u":1,"b":1,"r":0},{"i":"237226794","s":"76561198980412551","g":70,"n":1,"p":8251,"f":10937,"l":"english","t":"Amazing, what else is there to say.\r\n\r\nmy favourite game by a mile","c":1791485139,"u":1,"b":0,"r":0},{"i":"237226429","s":"76561198082216474","g":472,"n":52,"p":760,"f":760,"l":"english","t":"Who are the greymanes? Why should I care about them? What do they do? Why does the game start as if it assumes I should already know about the characters and the world? Kliff is a non character, controls are very clunky and unresponsive, difficulty is nonexistant. People keep saying that this game is an MMO without the MM, It is and it sucks.","c":1791484855,"u":0,"b":1,"r":0},{"i":"237224140","s":"76561198369783187","g":0,"n":14,"p":4343,"f":5550,"l":"english","t":"The combat feels great, the mechanics are deep, and the physics make the world feel alive.","c":1791483020,"u":1,"b":1,"r":0},{"i":"237222574","s":"76561198842652528","g":223,"n":95,"p":393,"f":5091,"l":"french","t":"Meilleur monde ouvert","c":1791481767,"u":1,"b":0,"r":0},{"i":"237222205","s":"76561198070896026","g":52,"n":1,"p":9887,"f":9887,"l":"russian","t":"Отличный открытый мир, много чего иследовать можно с кайфом. Сюжет, к сожалению не настолько идеальный, но в целом игра шикарная.","c":1791481480,"u":1,"b":1,"r":0},{"i":"237220806","s":"76561198072027933","g":0,"n":4,"p":1803,"f":2040,"l":"german","t":"GOTY","c":1791480528,"u":1,"b":0,"r":0},{"i":"237219628","s":"76561198096604679","g":10,"n":1,"p":8381,"f":10073,"l":"schinese","t":"缺点是boss战太简单了，但是设计精致。关于bug，我游玩的时候只遇见过一次。总体好评，有沉浸感，兄弟们放心冲","c":1791478710,"u":1,"b":1,"r":0},{"i":"237218961","s":"76561199209533880","g":99,"n":4,"p":363,"f":2955,"l":"english","t":"fun and good game.","c":1791478177,"u":1,"b":1,"r":0},{"i":"237218393","s":"76561198388198182","g"
