lidade. Mas essa luta final? Pu** que pariu, era melhor nem ter. Patética, literalmente um lixo.","c":1791763282,"u":1,"b":0,"r":0},{"i":"237507924","s":"76561198161773183","g":0,"n":10,"p":7729,"f":7729,"l":"english","t":"Honestly the most fun ive had all year, great combat and gameplay that feels like fun and engaging.","c":1791760438,"u":1,"b":1,"r":0},{"i":"237506074","s":"76561198119027729","g":75,"n":10,"p":8003,"f":9590,"l":"brazilian","t":"**132 horas de jogo e ainda não explorei nem 30% do conteúdo!**\n\nO mundo de Crimson Desert é simplesmente maravilhoso. Já perdi horas admirando paisagens, observando a fauna e flora e colecionando animais. Você pode domesticar desde pequenos pássaros até ursos polares, dar nomes, fazer carinho e levá-los ao acampamento. É impressionante!\n\n**Exploração e atividades: 10/10**\n\nO jogo simplesmente não deixa você ficar entediado. Pesca, mineração, agricultura, comércio, construção, missões, puzzles, caça, colecionáveis... Sempre existe algo interessante para fazer. Uma missão aparentemente simples pode terminar numa batalha contra um chefe gigantesco. E explorar é extremamente recompensador: nada melhor do que encontrar um cavaleiro lendário escondido numa região congelada, derrotá-lo e conseguir sua armadura!\n\n**Combate: 8/10**\n\nExtremamente variado, com inúmeros estilos, armas e combinações. Você pode até transformar o combate em uma espécie de luta livre! Entretanto, senti falta de maior profundidade técnica, principalmente contra chefes. Um combate mais próximo de Soulslike nos confrontos importantes seria interessante, mantendo o hack and slash contra inimigos comuns.\n\n**Progressão e personalização: 10/10**\n\nTalvez minha parte favorita! São inúmeras armas, armaduras e possibilidades de personalização. O melhor é que praticamente qualquer equipamento pode acompanhar você até o final, desde que seja aprimorado. Infelizmente, faltou um sistema de transmog, e algumas opções demoram demais para serem desbloqueadas.\n\n**Economia e mundo vivo: 8/10**\n\nVocê pode ser comerciante, agricultor, minerador, cozinheiro, fazendeiro e até investir no banco! É muito divertido, embora a economia perca importância com o tempo. Minha dica: EVITEM TUTORIAIS DE FARM! Descobrir tudo sozinho torna a experiência muito melhor.\n\nPor outro lado, o mundo reage pouco às suas decisões. Construir relacionamentos com NPCs oferece poucos benefícios, crimes quase não possuem consequências e senti falta de romances e vínculos mais profundos.\n\n**Narrativa e puzzles: 8/10**\n\nA história é interessante, envolvendo paradoxos temporais, mas nem sempre é bem explicada. Os puzzles são criativos e permitem soluções alternativas. Precisa atravessar obstáculos? Às vezes você simplesmente pode voar por cima deles! Essa liberdade é fantástica.\n\n**Movimentação e desempenho: 7/10**\n\nA movimentação oferece muitas possibilidades, com escalada, voo e diversas montarias personalizáveis. Entretanto, alguns comandos são imprecisos, principalmente durante escaladas.\n\nMesmo com meu PC modesto (RX 6600), consegui aproximadamente 60 FPS no cinematográfico, com ray tracing e geração de quadros 2x, após alguns ajustes.\n\n**Interface e qualidade de vida: 5/10**\n\nAqui está uma das maiores fraquezas. Menus radiais pouco práticos, troca de equipamentos confusa, poucos atalhos para consumíveis e melhorias excessivamente demoradas. Refinar equipamentos exige repetir animações e comandos desnecessariamente. São pequenos problemas que, acumulados durante centenas de horas, incomodam bastante.\n\n**Veredito: 9/10**\n\nCrimson Desert não é perfeito, mas é absurdamente ambicioso. A quantidade de sistemas, possibilidades e descobertas faz dele uma experiência extraordinária. Ainda há muito espaço para melhorar a interface, as consequências das decisões e a profundidade do combate.\n\nDepois de 132 horas, continuo descobrindo coisas novas, ansioso pela DLC e longe de terminar tudo o que o jogo oferece.\n\n**Recomendo demais, especialmente para quem ama explorar e descobrir as coisas por conta própria!**","c":1791758404,"u":1,"b":0,"r":0},{"i":"237505513","s":"76561198029739178","g":0,"n":32,"p":8975,"f":10156,"l":"latam","t":"weno weno weno","c":1791757764,"u":1,"b":1,"r":0},{"i":"237502908","s":"76561198146601460","g":49,"n":12,"p":764,"f":1981,"l":"latam","t":"Estoy alucianando amigo. Llevo re pocas horas, pero estoy flipando dirìa si fuera gallego. Desde Skyrim que no me siento tan atrapado por un juego.. la idea de explorar, cruzarte bandidos de la nada en tu camino, descrubrir lugares. Y las gràficas man... incluso habiendo caballo a veces voy a pie y caminando (no corriendo), para ver los paisajes, la gente caminando, la iluminaciòn, el viento jugando con los àrboles... es impresionante. Tiene algunos bugs de sonido, y a veces se ve que por cargar una parte del mapa te quedas unos segundos trabado... pero es nada; lo digo para q no suene a fan.. menciono lo que veo mal tambièn. Pero es alucianante loco, el combate, el primer jefe fue la ostia tio! jaja ok, estuvo de put@ madre. Nada, con mucha manija. Comprenlo, no sean put@s","c":1791755202,"u":1,"b":0,"r":0},{"i":"237502869","s":"76561198803974897","g":0,"n":6,"p":3173,"f":3782,"l":"spanish","t":"Creo que nadie puede negar que **Crimson Desert es un gran juego**, con sus defectos, evidentemente, pero también con una cantidad de cosas que ofrecer que me parece una auténtica barbaridad.\n\nSu mundo abierto, la cantidad de mecánicas, las posibilidades que te da y esa sensación constante de que todavía te quedan cosas por descubrir son aspectos que, personalmente, valoro muchísimo. Es uno de esos juegos en los que puedes empezar queriendo hacer una cosa y acabar dos horas después haciendo algo completamente distinto. Y para mí, eso es parte de la magia de un buen mundo abierto.\n\nPero si hay algo que realmente me ha impresionado de Crimson Desert, y que creo que merece muchísimo reconocimiento, es **la ambición que hay detrás del juego**.\n\nÚltimamente tengo la sensación de que muchos videojuegos, especialmente las grandes producciones, se limitan a seguir fórmulas que ya saben que funcionan. Y no digo que eso sea necesariamente malo, pero se agradece muchísimo encontrarse con un estudio que parece haber dicho: «Vamos a intentar hacer algo a lo grande, aunque no todo salga perfecto».\n\nY tampoco creo que Crimson Desert haya inventado la rueda. De hecho, muchas de sus ideas y mecánicas las hemos visto antes en otros juegos. Pero precisamente ahí está parte de su mérito: **han intentado coger elementos de muchos juegos diferentes, mezclarlos y construir algo propio, enorme y lleno de posibilidades**. Y eso, aunque sobre el papel pueda parecer sencillo, me parece un reto tremendo.\n\n¿Que hay cosas mejorables? Por supuesto. ¿Que algunas mecánicas podrían estar mejor pulidas y que a veces tanta ambición juega en su contra? También. Pero sinceramente, prefiero encontrarme con un juego que intenta hacer muchas cosas, incluso equivocándose en algunas, que con otro que se limita a repetir una fórmula segura sin arriesgar prácticamente nada.\n\nCreo que es importante valorar ese esfuerzo, porque hacer un juego así implica tomar decisiones arriesgadas, y se nota que no han querido conformarse con hacer simplemente otro mundo abierto más.\n\n**Crimson Desert no es un juego para todo el mundo**, y entiendo perfectamente que haya personas a las que algunas de sus decisiones no les convenzan. Pero para mí es una experiencia que ofrece muchísimas horas, un mundo en el que merece la pena perderse y, sobre todo, algo que cada vez valoro más en esta industria: la sensación de estar jugando a algo hecho con ganas de ir un poco más allá.\n\nOjalá viéramos más estudios dispuestos a asumir este tipo de riesgos. Porque, al final, prefiero un juego ambicioso e imperfecto que uno correcto, pero que no intenta sorprenderme en absolutamente nada.","c":1791755164,"u":1,"b":0,"r":0},{"i":"237500751","s":"76561197973904941","g":0,"n":1,"p":13514,"f":13592,"l":"french","t":"super jeu","c":1791753211,"u":1,"b":1,"r":0},{"i":"237499689","s":"76561198932678924","g":0,"n":2,"p":30993,"f":30993,"l":"brazilian","t":"Pra mim o melhor rpg,otima trilha sonora, um otimo remake da historia. batalhas incriveis com chefes inclusive o Beloth sem se esconder atras da pilastra. jogaço","c":1791752167,"u":1,"b":1,"r":0},{"i":"237498530","s":"76561197984630398","g":0,"n":7,"p":5664,"f":5664,"l":"english","t":"An absolutely baffling game, has so many mini-games and features which could have been entier games in their own right tucked away inside of it. Yet some of the main mechanics sometimes feel a bit half baked. \r\n\r\nMost play sessions I started with a singular goal in mind, and generally speaking after 20 minutes of play time I would have completely forgotten that starting goal and have instead found a new quest, new mechanic, or new puzzle to play around with. \r\n\r\nThere is often more to find in any section of this games map, than in most AAA games released today, and every time I start this up, I find something new, and generally not what I was looking for. \r\n\r\nI feel the greatest praise for the game was that there is SO much stuff in it, that they were not afraid of something they put in being \"bad\" because if you don't like something outside of the core combat loop, you generally don't have to engage with it. \r\n\r\nI went into this game expecting it to be a hodge-podge of maladjusted gimmics put in for one time use, to then be discarded. Instead I left with a profound feeling of appreciation  for the devs who must have put every idea they had into the game, and made one of the most \"free\" feeling open worlds I have ever played in.","c":1791751051,"u":1,"b":1,"r":0},{"i":"237498085","s":"76561199244027723","g":0,"n":1,"p":3195,"f":3990,"l":"italian","t":"ampio respiro, sterminato come ambientazioni, musiche non ripetitive, dettagli ambientali super solo leggermente macchinoso come comandi, ma cmq il migliori insieme a Dune Awakening per le mie \"voglie\" di gamer!!!","c":1791750691,"u":1,"b":1,"r":0},{"i":"237496954","s":"76561198041454391","g":208,"n":4,"p":3956,"f":4429,"l":"latam","t":"Facilmente uno de los mejores juegos de mundo abierto que existen. Tosco en muchos aspectos pero en conjunto magnifico.","c":1791749717,"u":1,"b":0,"r":0},{"i":"237495783","s":"76561198217178447","g":0,"n":3,"p":12472,"f":13280,"l":"russian","t":"В эту игру не играешь, в ней живешь!)\nОгромный, красивый и бесшовный мир, дух исследования, многообразие активностей, куча разной брони и оружия, динамичная боевка и много всего что не дает заскучать) \nЗамечательное приключение)","c":1791748861,"u":1,"b":1,"r":0},{"i":"237494379","s":"76561198073128817","g":0,"n":78,"p":1214,"f":2813,"l":"polish","t":"ŁAŁ","c":1791747793,"u":1,"b":0,"r":0},{"i":"237493299","s":"76561197976053764","g":383,"n":14,"p":1671,"f":1863,"l":"french","t":"La quantité de contenu dans ce jeu est strictement aberrante.\n10/10.","c":1791747000,"u":1,"b":0,"r":0},{"i":"237492663","s":"76561199242186688","g":38,"n":14,"p":878,"f":2258,"l":"english","t":"Very Good","c":1791746533,"u":1,"b":0,"r":0},{"i":"237491422","s":"76561198450411289","g":253,"n":11,"p":942,"f":942,"l":"english","t":"why there is no big c0ck mod? this is unacceptable. I love muscle men and their peniisl. stupid game!","c":1791745554,"u":0,"b":1,"r":0},{"i":"237490349","s":"76561198129224032","g":0,"n":2,"p":688,"f":695,"l":"english","t":"Game keeps crashing when opening menu.","c":1791744733,"u":0,"b":1,"r":0},{"i":"237488452","s":"76561198191221286","g":552,"n":30,"p":9891,"f":9891,"l":"english","t":"[h1]Hands down, one of the best games I've played in a long time especially when it comes to giving me that sense of wonder and excitement while exploring, Never knowing what you're going to discover and theirs a plethora of content to discover. That feeling of heading out into an open world game and genuinely not know what you'll discover is rare im of itself. An absolute contender for GOTY. [/h1]\n\nCrimson Desert reminds me of Morrowind, and i know, both games are nothing alike in terms of gameplay or the fact its First Person or even the story but what they both have in common is that sense of wonderment. A feeling i haven't experienced since i played Morrowind for the first time on my original Xbox when i was a little kid. But just like Morrowind, Crimson Desert is about figuring things out on your own, stumbling across things you weren't expecting to find, discovering weapons and armor or whole quest lines you could easily miss if you dont take the time to explore. Heck, you can even spend time walking around talking to random people and you can actually learn about places to explore, giving you a map icon and a good amount of lore that goes deeper explaining different location, You can even learn different meals to cook, all from just talking to people and raising their reputation.\n\nIn Crimson Desert you never seem to run out of things to do/ Whether it's farming, collecting livestock for your farm, finding unique mounts, exploring ancient ruins, or stumbling across caves with unique weapons and items,  and a plethora of more content you cam engage in. there's always something waiting to be discovered if you take the time to explore the MASSIVE open world and what amazes me, every section of the world seems hand crafted. Crimson Desert has to be one of the best looking games released this year or even in the past 6 years.\n\nThe combat is also some of the most fun I've had in combat thats not souls-like related. The sheer amount of stuff you can do in terms of combat is so much fun, from pulling off combos and hitting enemies with German suplexes or flying clotheslines to straight-up throwing someone off a high cliff. It's just a blast to mess around with, and there's a great variety of enemies to fight along the way. Honestly, this is some of the best combat I've experienced in a non-Soulslike action game in years and you're even given two more characters to use and switch out seamlessly. Granted, if you wanna play the entire game as Kliff you can but some puzzles require different characters  \n\nAlso, the way every NPC feels alive with their own motivations and will give you useful into about the world. Being locations, other NPC's who if you ask someone, sometimes you'll get some juicy gossip or a really far off place with actual deep and interesting backstories. You can even see how NPC's interact with each other. Sometimes they'll get into arm wrestling duels of heated debates and im sure ive missed other random moment between NPC's. Not even special story related NPC's, just ones you see walking around tje world and depending on where you are, you can get whole new types of information. Crimson Desert is hands down the most alive video game ive ever played \n\nI can honestly see myself putting well over 500 hours into this game, and I'm not exaggerating when I say that. Crimson Desert is one of the best open-world action games I've ever played, Well, Second Behind Elden Ring but both are the same caliber of excellence, Just in different genre's\n\nOne of my favorite mechanics in this gane has to be the Visione, a special helmet that lets you uncover memory fragments and witness past events in areas you discover through your time exploring the continent. I’m a sucker for deep lore and environmental storytelling, so having a mechanic that lets you dig into the history of the world is a beautiful cherry on top of whats already an impressive game. Pair that with the already impressive voice acting and the new cutscenes added in 2.0, and it makes exploring Pywel that much more rewarding.\n\nIn conclusion, Crimson Desert is 100% in the conversation for my personal GOTY. I cant suggest  people to buy this game enough. All i can say is, if you love video games, it's nearly a crime not to play this. [b]  Absolutely a 10/10 if their ever was one [/b]","c":1791743206,"u":1,"b":1,"r":0},{"i":"237486495","s":"76561198177868286","g":430,"n":17,"p":12559,"f":13468,"l":"russian","t":"Лучшая игра 2026, разрабам респект","c":1791741759,"u":1,"b":1,"r":0},{"i":"237484126","s":"76561198357842253","g":0,"n":4,"p":221,"f":3906,"l":"german","t":"super","c":1791739960,"u":1,"b":0,"r":0},{"i":"237483741","s":"76561198827936826","g":0,"n":4,"p":1152,"f":3066,"l":"brazilian","t":"estou me divertindo no meu tempo, faz um bom período que eu não desfruto de um game assim.","c":1791739671,"u":1,"b":0,"r":0},{"i":"237482638","s":"76561198100407706","g":70,"n":29,"p":14958,"f":14958,"l":"schinese","t":"在推荐和不推荐间，勉强选择了推荐，这游戏新鲜劲过了之后，你会觉得所有的支线都是通马桶，几百个任务做到你想死。同类型的武器除了样子不一样基本都一样，没任何差别，哪怕你用默认武器也是一样的，唯一差别就是齿轮。优化也很差，我虽然显卡有点老了，但在同样使用多倍帧黑科技的前提下，玩巫师3和这游戏画质就是差距很大，这游戏永远都感觉调不出最适合的画质。反正就是玩还是能玩，个人觉得还是以通关为目的去玩就好，像我玩到这个时长之后只能感到无聊了，好没意思，不是为了通关我都想卸载了。","c":1791738840,"u":1,"b":0,"r":0},{"i":"237482244","s":"76561198147650167","g":43,"n":4,"p":6254,"f":6520,"l":"english","t":"goated","c":1791738565,"u":1,"b":1,"r":0},{"i":"237482079","s":"76561199090432855","g":0,"n":1,"p":7385,"f":7385,"l":"english","t":"Beautiful open world game. Lots of content. Fun combat.","c":1791738447,"u":1,"b":1,"r":0},{"i":"237481549","s":"76561198956332017","g":0,"n":1,"p":35031,"f":35661,"l":"koreana","t":"너무 재밌음","c":1791738073,"u":1,"b":1,"r":0},{"i":"237479900","s":"76561198882659493","g":0,"n":1,"p":13998,"f":14016,"l":"english","t":"Good !","c":1791736839,"u":1,"b":1,"r":0},{"i":"237479244","s":"76561199076693522","g":128,"n":1,"p":681,"f":852,"l":"brazilian","t":"muito bom o jogo","c":1791736318,"u":1,"b":0,"r":0},{"i":"237478923","s":"76561198277855849","g":0,"n":7,"p":138,"f":138,"l":"english","t":"worth my time and money. 9/10","c":1791736088,"u":1,"b":1,"r":0},{"i":"237478224","s":"76561198400602893","g":0,"n":20,"p":3085,"f":3085,"l":"thai","t":"เกมดีภาพสวย แต่อยากให้ปรับปรุงเรื่องแสงสะท้อน เวลาปิด Ray หน่อย ยิ่งเวลาฝนตกนะ แทบดูไม่ได้เลย แสงสะท้อนบนเกราะหยาบมาก แต่อย่างอื่นยอมรับว่าทำออกมาได้ดี บรรยากาศสวย สำรวจสนุก บัคน้อยมากๆเทียบกับเกมสเกลนี้ถือว่า ok เลย และอยากให้อัพเดท เพิ่มภาษาไทย","c":1791735564,"u":1,"b":0,"r":0},{"i":"237478215","s":"76561198145995401","g":0,"n":3,"p":30743,"f":32398,"l":"english","t":"Beautiful, vast open-world setting with great attention to detail.  High quality map interface.  A perfect balance between storyline/light role-playing and exploration/discovery.  Highly recommend for a long and satisfying journey.","c":1791735560,"u":1,"b":1,"r":0},{"i":"237476764","s":"76561199481914964","g":11,"n":3,"p":970,"f":1308,"l":"german","t":"macht spaß ist mal was anderes wie die ganzen anderen open world games :)","c":1791734527,"u":1,"b":1,"r":0},{"i":"237475997","s":"76561198285249811","g":56,"n":6,"p":4567,"f":4569,"l":"schinese","t":"缺点：首先是 游戏玩了70h 就闪退，其次游戏中有大量的bug，主线无法推进，支线找不到npc的bug，地图钥匙bug导致无法进入，我觉得首先是要优化\n优点：地图是真大，探索起来非常爽，各位是各种缝合，战斗，探索，贸易，造家，偷窃，服装，染色，这点是非常好的，自由度非常大，只可惜可能再也不会玩了，因为游戏性能优化问题，唉","c":1791734008,"u":0,"b":1,"r":0},{"i":"237475093","s":"76561198432405308","g":85,"n":2,"p":2731,"f":3113,"l":"schinese","t":"指引极差，部分关卡跳下只能重来","c":1791733359,"u":0,"b":1,"r":0},{"i":"237474853","s":"76561198283813355","g":159,"n":12,"p":2159,"f":2712,"l":"schinese","t":"增强版出了才开始玩的，没感觉到任何不适应，除了按键太多。后来换了鲲鹏706D，多6个按键，再配合肩键震动，真的超级爽。玩法感觉就是奇幻版荒野大镖客2，可探索内容特别多，压根就没咋打主线。游戏难度不高，但是有些谜题最好用豆包查下攻略，不然真的纯折磨。总体是100%的推荐。","c":1791733194,"u":1,"b":1,"r":0},{"i":"237474811","s":"76561198074706389","g":0,"n":11,"p":13656,"f":13857,"l":"italian","t":"Storia non esaltante e personaggi anche primari con zero carisma.\r\nLa cosa bella del gioco è esplorare e scoprire sempre posti nuovi, i paesaggi sono fantastici.\r\nMolte armi e molte combinazioni di combattimento.","c":1791733156,"u":1,"b":0,"r":0},{"i":"237474464","s":"76561197996719445","g":65,"n":1,"p":11220,"f":14197,"l":"brazilian","t":"Jogo imenso, incrível, foda, vale cada centavo!","c":1791732887,"u":1,"b":1,"r":0},{"i":"237473233","s":"76561198046372723","g":0,"n":2,"p":2939,"f":3301,"l":"english","t":"Masterpiece. The world and exploration especially. I think it's the greatest gaming world I've ever experienced. Beating Witcher 3, Skyrim, KCD1&2. Cutscenes, story, and characters are decent in the enhanced edition. Performance is also impressive considering the beauty of the world.","c":1791732062,"u":1,"b":1,"r":0},{"i":"237473173","s":"76561199755742158","g":0,"n":6,"p":5852,"f":5852,"l":"polish","t":"wybitna gra. przydałoby się tylko kilka ciekawszych achievementów","c":1791732021,"u":1,"b":1,"r":0},{"i":"237473062","s":"76561198059566654","g":265,"n":5,"p":3834,"f":3834,"l":"french","t":"12/20 jeu avec du potentiel mais pas fini .\n\nTrop de bug / crash et optimisation pas terrible manque clairement de peaufinage .\n\nEn clair jeu intéressant mais n'a pas l'air fini a 100% malgré plusieurs patch et une version Enhanced dommage car j'ai bien aimé jouer mais les bugs et autres problème m'on sortit du jeu \n\n","c":1791731948,"u":0,"b":1,"r":0},{"i":"237472810","s":"76561199473361016","g":732,"n":7,"p":5469,"f":5993,"l":"schinese","t":"这b游戏解密是真折磨人啊不看攻略根本过不去。引导也跟没有一样玩法是神解密就是一坨屎","c":1791731770,"u":0,"b":0,"r":0},{"i":"237471835","s":"76561199509349886","g":581,"n":94,"p":656,"f":656,"l":"schinese","t":"还可以。\n缺点：剧情一般，不够引人入胜。交互逻辑和动作设计不太爽，（如爬墙后摇太大。解密必须打灯笼才能看到谜题。多按键组合才能完成一些常用操作。）光影表现过于依赖光追，吃配置。\n优点：装备和物品系统较完善，内容丰富。美术建模不错。系统玩法丰富，量大管饱。","c":1791731148,"u":0,"b":0,"r":0},{"i":"237471583","s":"76561198285686050","g":0,"n":1,"p":14817,"f":16045,"l":"english","t":"this feels like a skyrim next gem 10/10","c":1791730972,"u":1,"b":1,"r":0},{"i":"237470802","s":"76561198416347244","g":0,"n":12,"p":11906,"f":12277,"l":"russian","t":"Очень огромный проработанный и разнообразный мир, куча квестов и загадок, красивые персонажи а с включением DLSS 5 через программу DLSS Swaper  так вообще просто шикарно и адаптировано под не особо мощное железо. Чем то напоминает Ведьмака, но картинка сочней. Единственное немного путаница с определёнными головоломками, но благо в Ютубе куча подсказок и вариаций прохождения... Минусов не обнаружил, рекомендую!!!!","c":1791730415,"u":1,"b":0,"r":0},{"i":"237470386","s":"76561198272032099","g":0,"n":12,"p":1825,"f":1841,"l":"english","t":"\r\n\r\n.","c":1791730131,"u":1,"b":1,"r":0},{"i":"237469832","s":"76561199740255019","g":0,"n":2,"p":405,"f":1442,"l":"brazilian","t":"absolut CINEMA","c":1791729758,"u":1,"b":0,"r":0},{"i":"237469399","s":"76561199226894562","g":54,"n":3,"p":3007,"f":3578,"l":"brazilian","t":"Jogo muito bom vale a pena cada centavo! Jogar com a voz do Yasuo e muito bom 👍","c":1791729455,"u":1,"b":0,"r":0},{"i":"237468912","s":"76561198452830248","g":0,"n":3,"p":27012,"f":27133,"l":"koreana","t":"ㄹㅈㄷ입니다.. 아직도 저는 합니다 dlc 엉덩이 들썩 거리는중","c":1791729130,"u":1,"b":1,"r":0},{"i":"237468447","s":"76561198841449249","g":304,"n":59,"p":5205,"f":5298,"l":"english","t":"at this pace (86 hours just to get to the location that is in the game's title), it's hard to think about how big this game actually is. the visuals are beautiful, the quests are from some mmorpg though, and the main story is just okay. but the world, exploration and battles are the reasons why I like it so much","c":1791728786,"u":1,"b":0,"r":0},{"i":"237467032","s":"76561198262698093","g":30,"n":3,"p":18727,"f":18757,"l":"turkish","t":"Crimson Desert harika bir atmosfere ve derin bir hikayeye sahip. Oyunda halihazırda Türkçe alt yazı desteği olması çok güzel bir adım, ancak bu devasa açık dünyayı tam anlamıyla yaşayabilmemiz için Türkçe seslendirme (dublaj) desteği de harika olurdu. Gelecek güncellemelerde Türkiye'deki geniş oyuncu topluluğu için Türkçe seslendirme seçeneğinin de eklenmesini heyecanla bekliyoruz! #CrimsonDesert #PearlAbyss\n\nCrimson Desert is a masterpiece with its deep lore and cinematic storytelling. While we highly appreciate the Turkish subtitle support, having Turkish voice acting (dubbing) would make the experience truly immersive for the huge Turkish gaming community. Since Pearl Abyss has already added full voiceovers for multiple languages post-launch, we sincerely hope to see Turkish voiceover support in future updates!","c":1791727835,"u":1,"b":1,"r":0},{"i":"237466709","s":"76561199477657348","g":0,"n":4,"p":73,"f":73,"l":"english","t":"its intresting","c":1791727638,"u":1,"b":1,"r":0},{"i":"237466045","s":"76561198843824998","g":127,"n":4,"p":1743,"f":2106,"l":"english","t":"endless fantasy","c":1791727238,"u":1,"b":1,"r":0},{"i":"237465777","s":"76561198155800760","g":0,"n":90,"p":2406,"f":2406,"l":"schinese","t":"他妈的 BUG是不是有点太多了","c":1791727087,"u":0,"b":1,"r":0},{"i":"237465702","s":"76561198272511215","g":0,"n":2,"p":13739,"f":13789,"l":"turkish","t":"Crimson Desert harika bir atmosfere ve derin bir hikayeye sahip. Oyunda halihazırda Türkçe alt yazı desteği olması çok güzel bir adım, ancak bu devasa açık dünyayı tam anlamıyla yaşayabilmemiz için Türkçe seslendirme (dublaj) desteği de harika olurdu. Gelecek güncellemelerde Türkiye'deki geniş oyuncu topluluğu için Türkçe seslendirme seçeneğinin de eklenmesini heyecanla bekliyoruz! #CrimsonDesert #PearlAbyss\n\nCrimson Desert is a masterpiece with its deep lore and cinematic storytelling. While we highly appreciate the Turkish subtitle support, having Turkish voice acting (dubbing) would make the experience truly immersive for the huge Turkish gaming community. Since Pearl Abyss has already added full voiceovers for multiple languages post-launch, we sincerely hope to see Turkish voiceover support in future updates!","c":1791727025,"u":1,"b":0,"r":0},{"i":"237465655","s":"76561199154657320","g":177,"n":12,"p":7905,"f":7977,"l":"english","t":"beautifully built game that just works so well and scratches that itch!","c":1791726988,"u":1,"b":0,"r":0},{"i":"237463255","s":"76561198199276479","g":135,"n":2,"p":16052,"f":16052,"l":"english","t":"masterpiece","c":1791725238,"u":1,"b":1,"r":0},{"i":"237463075","s":"76561198011702714","g":0,"n":3,"p":7212,"f":7542,"l":"english","t":"This isn't a game, this is THE game.\nIt will not hold your hand, you will struggle with the controls, you will not know what to do to complete random puzzles.\nYou will think it's stupid... but it isn't, you're the one that's stupid. This game will give you the tools and allow you to fail, it will allow you to throw yourself at it until you complete it because the truth is that the developers respect your intelligence enough to truly believe YOU (yes YOU!) can figure it out.\nIt will eventually all click - the controls; This is the grapple command, this is light and heavy, jump and force punch. You'll understand the relation of each button to the other.\nYou will see a puzzle and know what to look for. This is a location to stab, you can light that on fire, push or move this and that.\nSuddenly, the universe is yours and all that friction you thought you were feeling becomes something you're proud of overcoming.\n\nIt isn't perfect, but what it does right is so close to perfect that it blows everything else out of the water, hands down. \nCrimson Desert is undeniably game of the year, and potentially game of the decade.\n\nThat being said, despite the it being so good there is room for improvement. \nThe graphics settings are rather cumbersome to navigate and there's ghosting and visual artifacts from rendering that are nearly impossible to get rid of even when tweaking local graphics card settings on your PC and not just the game. That is where I'd ask Pearl Abyss to focus on for future patches or future releases.","c":1791725092,"u":1,"b":1,"r":0},{"i":"237462947","s":"76561198117770105","g":88,"n":43,"p":24012,"f":25566,"l":"tchinese","t":"這遊戲本體操作方式不太好 但是這遊戲mod很多啊 彌補了缺點 還增加更多優點","c":1791724998,"u":1,"b":1,"r":0},{"i":"237461443","s":"76561198313234468","g":50,"n":14,"p":6175,"f":6175,"l":"schinese","t":"玩了100小时，没有发现这游戏的任何优点，简直是屎中屎。营销倒是舍得花钱，以前B站批评的主播，后面都改口吹。上了鬼子的当。晦气。","c":1791723738,"u":0,"b":0,"r":0},{"i":"237461414","s":"76561199152209011","g":0,"n":1,"p":317,"f":317,"l":"english","t":"Can’t play without crashing — and they just announced a €25 DLC for October 30th...\r\n\r\nGPU crash every 10–30 minutes:  Esc, inventory, map, sometimes NPC dialogue. 20+ crashes in my first two days. And it's not my PC — same GPU hang (DXGI_ERROR_DEVICE_HUNG) at the same address in their code every time, through every setting, every upscaler, two drivers.\r\n\r\nAnd the optimization is a joke. Native on an RTX 4070: 44 fps, after turning half the settings down. The upscaler gets it running great — but then it starts the crashes.  Pick your poison: slideshow or crash-roulette.\r\n This exact crash is already fixed on PS5 — on PC it’s not even on their Known Issues page. \r\n\r\n\r\n\r\nDon’t buy until it actually works — and don’t put €25 on top of a game that doesn’t.","c":1791723714,"u":0,"b":0,"r":0},{"i":"237460892","s":"76561197970936966","g":0,"n":18,"p":60,"f":163,"l":"german","t":"Denuvo benötigt bei mir eine tägliche Aktivierung. Das ist ein impliziter Online-Zwang, der nicht kommuniziert wird und hat dafür gesorgt, dass ich mir nie wieder ein Spiel mit Denuvo kaufen werde. Vielen Dank für so wenig Kundenfreundlichkeit.","c":1791723272,"u":0,"b":1,"r":0},{"i":"237460368","s":"76561198427038646","g":70,"n":1,"p":6940,"f":7425,"l":"schinese","t":"挺好玩的，内容强大","c":1791722834,"u":1,"b":1,"r":0},{"i":"237459475","s":"76561198790493410","g":17,"n":1,"p":5058,"f":5727,"l":"schinese","t":"可以非常好玩我之玩完荒野大镖客然后玩了这游戏很不错挺适合我的","c":1791722067,"u":1,"b":0,"r":0},{"i":"237458857","s":"76561199198484867","g":0,"n":1,"p":7010,"f":7010,"l":"koreana","t":"너무 재밌음 올해 최고의 역작 감동의 게임","c":1791721536,"u":1,"b":1,"r":0},{"i":"237458257","s":"76561198015542444","g":328,"n":11,"p":867,"f":1676,"l":"russian","t":"Боевка - сложные комбинации для восприятия в начале игры. Слишком насыщенные цвета по контрастности не совсем реалистично.  Русская озвучка если будет то просто супер.","c":1791721009,"u":1,"b":0,"r":0},{"i":"237458160","s":"76561199752757110","g":60,"n":5,"p":5077,"f":5278,"l":"schinese","t":"解密简直是构式中的构式","c":1791720929,"u":0,"b":0,"r":0},{"i":"237455461","s":"76561198026527631","g":154,"n":5,"p":2904,"f":3231,"l":"english","t":"Honestly, Crimson Desert is a pretty damn good experience. The world is beautiful, there's tons of stuff to do, and you can easily get carried away exploring without even realizing how much time has passed.\n\nThe combat is really cool and satisfying once you get the hang of it. The game looks amazing, and you can tell a lot of work went into it.\n\nOf course, it's not perfect. Some things can feel a bit clunky, and it takes some time to get used to the gameplay. But honestly, the exploration and all the things you can do make up for it.\n\nIf you're into open-world games where you can lose yourself for hours, I'd definitely recommend giving it a try. Personally, I don't regret it at all.","c":1791718443,"u":1,"b":1,"r":0},{"i":"237455094","s":"76561198321989281","g":0,"n":17,"p":1951,"f":2127,"l":"schinese","t":"推荐，好玩，：）","c":1791718089,"u":1,"b":1,"r":0},{"i":"237454099","s":"76561198138077319","g":153,"n":12,"p":31258,"f":31893,"l":"english","t":"Very fun, actually if you have time.","c":1791717151,"u":1,"b":1,"r":0},{"i":"237453972","s":"76561199200832773","g":48,"n":1,"p":5689,"f":5689,"l":"schinese","t":"又香又臭，很多反人类的地方，给个中评","c":1791717035,"u":0,"b":1,"r":0},{"i":"237453311","s":"76561199750196382","g":104,"n":1,"p":3652,"f":3652,"l":"schinese","t":"战斗很爽，画面也还可以，但是主线指引拉得一比，爬墙爬着爬着就悬挂，潜入只要被小兵按住就要强制转圈读条，r还很难按到，只要被按住基本就要重来，还有帧生成失效，这么久了还有这个问题，难崩。","c":1791716402,"u":0,"b":0,"r":0},{"i":"237452529","s":"76561198206279396","g":239,"n":21,"p":5317,"f":5373,"l":"schinese","t":"不能说食之无味，只能说弃之可惜。\n\n底子非常好的一款单机游戏，画质开满也是目前市面顶级表现。角色全程配音，很多很多形态招式各异的Boss都能看得出制作组是用了心的，成百上千的装备和超大的世界可供探索，战斗方面不限制吃药CD不限制打斗方式，可以使用武器，技能，远程等玩法，平时小兵很多可供割草，整体自由度还是很高的，爽感还是可以的。如果你恰好有大把时间而且有点游戏荒，作为一款动作冒险RPG单机，这款游戏沉下心来玩总体来说是可以给到7分以上的体验的。\n\n但其中很多内容能看得出是明显从网游的构造里扒出来加进去的，比如强化、跑商、运营挂机托管资源。但这些只是可选的玩法并不影响主线流程体验。而成百上千的装备虽然外形都不同，可以说美术建模立大功，但整体的性能是差不多的，只是在数值上有微弱区别，而因为游戏的养成时间成本极高，到通关也大概率只能强化一套装备来用，而且大概率强不满。作为一款单机游戏，我是觉得投入几十上百小时时间去挖矿砍树是非常不不值得的，所以就导致游戏的养成又臭又长毫无意义，甚至完全是扣分项。但如果你开修改器获得这部分资源，你会发现对你整体游戏的体验不仅没有折扣，反而体验变得更好了，这真的是一款少有需要开修改器才能获得更好体验的游戏。\n\n而游戏中的支线除了通马桶，还有一条和成就系统强绑定的玩法，就是你需要在各种地方获得“阿比斯”，拿到某个特定“阿比斯”之后才会开启挑战，而这些挑战难度不同，你必须要全部做完才能完成成就，但为了获得开启挑战的钥匙即“阿比斯”，你需要全世界到处跑去寻找，而这些阿比斯的位置是完全没有任何提示和指引的，说白了只能靠随缘。\n\n其实在去除掉这些“网游元素”的糟粕之后，游戏可玩性还是很高的，但可惜抛不开。而且因为游戏体量太大了，后期会发现角色配音高度雷同，建筑和人物素材复用严重，多数任务玩法都是通马桶的换汤不换药，而且几乎没有引导导致大量解谜和任务做起来非常棘手，除非你是顶级中的顶级的游戏天才，不然很多解谜都需要通过他人的攻略来解决，更别说解谜所花的时间和收益大多根本不成正比，比如游戏中有个道具可以用来强化技能和装备，这个道具的需求量大概是三四百甚至更多的，路边就可以随手捡到。而某些解谜如果不看攻略纯手动，大概需要一个多小时才有可能解决，而当你花了这么多时间解开谜题，拿到的不是什么稀世珍宝顶级装备，而是路边就能随手捡到的技能点+1，你只会觉得自己是个傻逼。\n\n主线剧情方面完全可以用低幼平庸来形容，基本上就是8岁小孩都能轻松看懂的程度，整个剧情几乎没有什么起伏，非常的平而且有些地方更是莫名其妙，称其为及格都有点勉强，所以在代入感上非常的差。而且所有对话、主线、支线都不允许跳过，只允许2X速，所以对于不喜欢主线的人来说这是非常折磨的，到了后面我经常就按空格加速然后刷手机...\n\n游戏整体的素质是中规中矩的，但较好的画面表现，全程不断的配音，可供收集的物品较多，战斗体验比较流畅，这些作为加分项，作为268价位的单机动作RPG，我觉得及格线以上水平是没毛病的，提个年度最佳的名或者年度最佳美术也没啥毛病。\n\n游戏如果本身是燕云那种运营方式，可联机的话很多玩法都是可圈可点的，但可惜作为一款单机，其中太多要素不适配单机玩法，给游戏减了很多分。\n\n游戏只适合有大量时间，不想速成想慢慢体验，不浮躁能沉得下心来，能容忍完全无指引的解谜玩法，电脑配置不错能开高画质，对开放世界动作冒险有游戏一定经验的玩家游玩。如果上述任何一条有不符合你的情况的，我的建议直接跑，千万别玩！","c":1791715619,"u":1,"b":1,"r":0},{"i":"237452021","s":"76561197961246228","g":80,"n":1,"p":13567,"f":14268,"l":"english","t":"I like the game. The setting, the pacing, the story, the obvious Asian influence. It's fun. But is is absolutely trash when it comes to grafic optimisation. I have an old 1080Ti and, on paper, I should be able to at least play it on low to medium settings. Accepable for an old card but the game engine is so pooly designed or optimized that the game just crashes. No FPS drop or stuttering which would already be annoing, no. It just crashes. Depending on the grafics setting it would crash after a few minutes or hours. Some boss fights use semingly exotic effects that make it crash directly. Only because the games is otherwise captivating I suffer my way through it on minimum settings with a low, distored resolution just to be able to play it for a hour or two at a time. \r\n\r\nIn my desperation also tried playing on via Geforce Live where I would have access to better grafic hardware but even ther it crashes constanlty. In terms of software quality it is a dumpster fire.\r\n\r\nIt is both a very good and and the same time a trash game. And to make matters worse pearl abbys has made no progress on fixing that. \r\n\r\nSo, to conclude, I have to diencourage everyone from playing it.","c":1791715103,"u":0,"b":1,"r":0},{"i":"237450501","s":"76561198839532297","g":0,"n":2,"p":25224,"f":25315,"l":"english","t":"nice game","c":1791713570,"u":1,"b":1,"r":0},{"i":"237450172","s":"76561199641073063","g":0,"n":2,"p":2221,"f":2252,"l":"schinese","t":"突然游戏就进不去了，点了开始游戏，过了几秒什么都没有了。","c":1791713255,"u":0,"b":0,"r":0},{"i":"237450126","s":"76561199752751090","g":67,"n":4,"p":8091,"f":9346,"l":"schinese","t":"我对你的解密情有独钟","c":1791713222,"u":1,"b":0,"r":0},{"i":"237449110","s":"76561198830155419","g":0,"n":4,"p":2061,"f":3832,"l":"koreana","t":"조작은거지같은데 게임은잘만듬","c":1791712165,"u":1,"b":1,"r":0},{"i":"237447413","s":"76561198256779786","g":293,"n":12,"p":904,"f":904,"l":"turkish","t":"siz mmo'dan devam kanka","c":1791710455,"u":0,"b":0,"r":0},{"i":"237446630","s":"76561199200953589","g":76,"n":14,"p":6774,"f":6779,"l":"english","t":"GOOD","c":1791709690,"u":1,"b":1,"r":0},{"i":"237446589","s":"76561198895137063","g":6,"n":1,"p":10544,"f":10993,"l":"brazilian","t":"Pra min o melhor jogo do ano, podem entregar os trofeus Rs...","c":1791709640,"u":1,"b":1,"r":0},{"i":"237445417","s":"76561198807441292","g":0,"n":11,"p":501,"f":501,"l":"english","t":"I NEVER SAW ANY COOL ♥♥♥♥ LIKE IN THE TRAILERS. THIS GAME IS SO BORING. i really wanted to like this game because i love open world adventure rpgs but this game is so bad, the story is boring, the tutorial is never ending, the world is huge but not very exciting. SAVE YOUR MONEY AND YOUR TIME.","c":1791708414,"u":0,"b":1,"r":0},{"i":"237445351","s":"76561198316279003","g":107,"n":5,"p":316,"f":316,"l":"schinese","t":"操控手感便秘到不行，人物韧性还低的要死。打架的时候永远有小怪在旁边射你，还要搞你那个逼处决动画，烦的要死。各种操作技能整一大堆然后boss战就是全程霸体，你就回血复读就完事了。\n解密更是大芬中的大芬，你敢想一个解密任务居然是会有bug的，需要你退出到主菜单重进才会正常？？？\n制作组应该是完全沉浸到自己的艺术当中了，东拉一坨西拉一坨，但是完全没想过玩家吃到的是什么答辩","c":1791708348,"u":0,"b":0,"r":1},{"i":"237445295","s":"76561198049510047","g":776,"n":108,"p":10292,"f":10292,"l":"english","t":"One of the best sandbox RPGs that I've ever played.\r\nLong story short it feels like a game that was created by people that wanted to play their creation.\r\n\r\nPros:\r\n- Huge open world filled to the brim with stuff to do\r\n- Uniqe factions and kingdoms that they occupy\r\n- Exploration is kept fresh and interesting due to diverse biomes and frequent POIs\r\n- Loads, and I mean LOADS, of activities that, maybe are not the best around when looked individually, but synergise and work together well, creating comprehensive sandbox experience\r\n- Combat is simple at first, but gains nice layer of depth as you learn the ropes\r\n- Great manner of ways to traverse the land\r\n- There is a lot of ways of gaining skillpoints, letting you progress characters via your own way\r\n- Visuals are great\r\n- Bossfights are mostly fun (Tanks and circus clown can go to hell) with a sprinkle of epic cutscenes\r\n- Side quests are great fun, rewarding you with a unique gear and/or interesting bossfight \r\n- Horizontal gear progression (I was sceptical about it at first but it works great with how game is balanced)\r\n- You can get really creative on how you approach combat or just on how you have fun\r\n- Puzzles and mazes are mostly (I've found a duplicate of a puzzle two or three times) unique and fun\r\n- Story is good. It is not something innovative or genree defining, but it works well\r\n- Voice acting is really well done in english version\r\n\r\nCons:\r\n- Chore missions (the ones from nottice board) for vendor NPC's are repetitive between cities and boring. They sprinkle a bit of day to day life to the world, but they lack dialogue (mostly NPC is just monologueing for few lines of dialogue and MC grunts once or twice) and meaningful rewards (at first you get +3 to inventory space, but it caps at 240). \r\n- Performance can be a bit bad in cities or in places with a lot of NPCs (mostly it is due to my old CPU, but still)\r\n- Game can be overwhellming at first few hours due to bloat of mechanics and controls that it presents at the start\r\n- Yann\r\n- Dialogues in side quests in later areas are hit or miss in terms of MC involvement (best one that I can remember was with dying NPC, that VA gave 100% of his performance into, talking about that he is on deathbed, wanting to warn rest of the community about some danger and MC just went with \"Understood\" and walked away)\r\n- Lack of transmog. Don't get me wrong, most of the drip, that you can aquire, is immaculate, but upgrading whole set, so it can match new found cool armor, can be a bit pricey\r\n- Few annoying bugs, problems with spawning NPCs or updating objectives. Nothing to cry about and easy to fix by teleporting to fast travel point, but annoying nontheless\r\n- I was playing on a Xbox controller and it was not great in terms of control consistency\r\n- Where two weeks of my life went?\r\n\r\nTLDR best 9/10 game. Worth the price","c":1791708298,"u":1,"b":1,"r":0},{"i":"237445029","s":"76561198232843316","g":0,"n":4,"p":5691,"f":5774,"l":"schinese","t":"这儿游戏内容丰富，但是用手柄玩视角锁定几乎等于没有视角乱的不行，特别是到BOSS战真的做的太差了这方面，操作太复杂了，很不流程","c":1791708034,"u":0,"b":1,"r":0},{"i":"237444960","s":"76561197998774156","g":0,"n":2,"p":13423,"f":13423,"l":"english","t":"great combat, great exploration, never bored, never feel like i need to do or bother with a mechanics that are not my cup of tea. just great.","c":1791707938,"u":1,"b":1,"r":0},{"i":"237444499","s":"76561199404107844","g":112,"n":11,"p":21848,"f":24456,"l":"schinese","t":"最好玩的魔法开放世界，当之无愧","c":1791707438,"u":1,"b":0,"r":0},{"i":"237443820","s":"76561198165945698","g":16,"n":1,"p":8783,"f":8783,"l":"koreana","t":"오픈월드를 그냥 즐기는 게임으로서는 좋은 그래픽과 넓은 맵에 할 수있는 것들이 많아서 좋은건 추천... 하지만 부족한 스토리와 뜬금없이 강력한 보스몬스터의 등장 등으로 게임 흐름이 끊기고 몰입도가 떨어지는 부분은 많이 아쉽다 ... 달리기 방향전환 전투중 패링이나 피하는것 등등 거의 멍청이 급 조작감도 몰입에 방해되는 요소중 하나... 2018년 출시한 레데리2를 넘지 못한 게임","c":1791706676,"u":0,"b":1,"r":0},{"i":"237443174","s":"76561198042502402","g":138,"n":5,"p":459,"f":459,"l":"schinese","t":"每次一按Esc就卡死闪退，你们怎么做的游戏！","c":1791705949,"u":0,"b":1,"r":0},{"i":"237441859","s":"76561198091652417","g":281,"n":173,"p":107,"f":107,"l":"english","t":"Game is boring af\r\ncan't see what people find in it.","c":1791704441,"u":0,"b":0,"r":0},{"i":"237440655","s":"76561199079923861","g":0,"n":4,"p":9870,"f":10200,"l":"koreana","t":"농장에 나무하나 심지 못 했는데 나는 세계를 구한 영웅이 되있었다.","c":1791702976,"u":1,"b":1,"r":0},{"i":"237440502","s":"76561198785431639","g":15,"n":2,"p":1254,"f":2576,"l":"schinese","t":"还是可以，风景不错，优化也还行","c":1791702795,"u":1,"b":0,"r":0},{"i":"237440420","s":"76561198210914188","g":0,"n":1,"p":2416,"f":2498,"l":"russian","t":"Был скиптично настроен к данной игре, неоднозначные отзывы, обзоры которые заполонили интернет отбили желание играть в нее на выходе, возможно, оно и к лучшему, учитывая проблематику на старте. В конечном итоге, игра понравилась и можно смело рекомендовать ее к посещение, да, сюжет очень слабый, сама суть его понятна, но реализация... Диалоги, это отдельный вид \"искусства\", такое ощущение, что диалоги писали в попыхах  и весь бюджет ушел на дизайн локаций и саундтреки, кстати о дизайне, это то, чем игра действительно может похвастаться, некий санаторий  для глаз) в этом направлении разрабы задрали такую планку, что её ещё не скоро кто то сможет переплюнуть, я бы даже сказал, что это бриллиант в шкатулке гейм дизайна). Да открытый мир пустоват, но как же красиво он сделан. Итог какой, если Вы готовы мириться с топорным сюжетом и диалогами, и Вы просто хотите насладится картинкой, то смело берите.","c":1791702712,"u":1,"b":0,"r":1},{"i":"237439578","s":"76561199505276513","g":13,"n":15,"p":330,"f":330,"l":"brazilian","t":"toooper","c":1791701652,"u":1,"b":0,"r":0},{"i":"237439461","s":"76561198345805424","g":0,"n":4,"p":13057,"f":13110,"l":"spanish","t":"Sin temor a equivocarme es el mejor juego que he jugado este 2026 y uno de los mejores que he jugado en años, en mi opinión es el GOTY de 2026.  La jugabilidad,  los paisajes,  el mundo abierto, los detalles de cada cosa, este es un juego bien cuidado y echo con cariño. Lo recomiendo al 100% vale cada centavo, estoy esperando el DLC - Pearl Abyss hizo un gran trabajo con este juego.","c":1791701506,"u":1,"b":1,"r":0},{"i":"237439151","s":"76561197969454496","g":0,"n":68,"p":155,"f":155,"l":"english","t":"3rd Attempt now to get into this. It should be my type of game but the controls, for the love of god the damn controls are insanely bad. Even after half a year of patching and apparent updates specifically to them they're just nuts. Not just awkward or just complexity you need to put in the time to learn them but damningly frustratingly stupid beyond belief. How anyone got paid to do this system in the first place, let alone everyone along the production chain letting it through is just baffling. Maybe I'll try a 4th, or just put this down to a dev snatching defeat from victory in what looks like a good game otherwise but I'm done with this utter waste of time for now (again...).","c":1791701133,"u":0,"b":0,"r":0},{"i":"237439122","s":"76561198256348096","g":0,"n":1,"p":13154,"f":13301,"l":"dutch","t":".","c":1791701091,"u":1,"b":1,"r":0},{"i":"237439083","s":"76561198015391545","g":0,"n":10,"p":9565,"f":10929,"l":"italian","t":"Un gioco molto bello , a volte vuole strafare ma cista' . Grafica bellissima e gira bene anche su configurazioni mediocri . Io che sono appassionato di cultura orientale e occidentale mi sono trovato a casa con delle chicche davvero gradite . Armature e armi STUPENDE","c":1791701057,"u":1,"b":1,"r":0},{"i":"237438916","s":"76561199689118187","g":0,"n":1,"p":13952,"f":14148,"l":"koreana","t":"오묘하게 빠져드는 게임","c":1791700838,"u":1,"b":1,"r":0},{"i":"237438518","s":"76561198315787981","g":0,"n":7,"p":3637,"f":4362,"l":"english","t":"Takes a good couple of hours to get fully immersed into the gameplay.\r\nWorld is wast with lots of quests and side quests, rebuilding, battles, collecting, challenges, puzzles.\r\n60 hours in and I so so finished the first area, four more to go.\r\n\r\nHuge disappointment are the graphics though, the game is blurry, overly shiny armour during the day. Dark spaces are completely black, the colouring inside of buildings also gets super messy if it's dark.\r\n\r\nSolid 7/10, can easily get 9/10 if they fix the graphics.\r\nNot regretting buying it full price.","c":1791700338,"u":1,"b":0,"r":0},{"i":"237437926","s":"76561198076633519","g":0,"n":5,"p":8615,"f":11459,"l":"german","t":"ein bisschen zu schwer, aber tolles Spiel","c":1791699609,"u":1,"b":0,"r":0},{"i":"237436822","s":"76561198194659428","g":200,"n":31,"p":1164,"f":1828,"l":"schinese","t":"这是一款越玩越觉得可惜的游戏，希望后续更新越来越好吧，有望成为神作。","c":1791698226,"u":1,"b":0,"r":0},{"i":"237436592","s":"76561199039045611","g":0,"n":6,"p":1118,"f":2146,"l":"spanish","t":"Un basto mundo donde hay mucho que hacer y buenas mecánicas de combate","c":1791697938,"u":1,"b":1,"r":0},{"i":"237436396","s":"76561198021356514","g":0,"n":13,"p":7170,"f":7698,"l":"koreana","t":"이만한 국산겜 없다","c":1791697701,"u":1,"b":1,"r":0},{"i":"237436363","s":"76561198808698915","g":0,"n":1,"p":3229,"f":3229,"l":"brazilian","t":"ótimo jogo, muito bonito da pra passar muito tempo.","c":1791697665,"u":1,"b":0,"r":0},{"i":"237436351","s":"76561198193561554","g":0,"n":2,"p":212,"f":251,"l":"german","t":"komme leider überhaupt nicht klar  scheiter schon an Mission 1 und finde hier keine weise frau oder  was hier verlagt wird hab 1 stunde gesucht ;D aber bin zublöd und hab kein bock immer alles zu googeln","c":1791697649,"u":0,"b":1,"r":0},{"i":"237436173","s":"76561199826370311","g":0,"n":45,"p":279,"f":1335,"l":"english","t":"totally lost. hell yeaah","c":1791697441,"u":1,"b":1,"r":0},{"i":"237436131","s":"76561198116115329","g":1246,"n":19,"p":3570,"f":3570,"l":"russian","t":"Я прохожу ещё этот нейрокал, но уже есть много минусов(буду дополнять по мере прохождения)\n- Тупые оборванные сценарии, целый регион резко захватить, некоторые квесты начинаются с пол пинка как будто там времени прошло месяцы и вы давно знакомы. Как будто тонна квестов вырезана ради соло игры, но лучше бы вырезали доп квесты по типу приниси мясо я занят, а непись за углом\n- враги болванчики\n- софтлок пришлось качать мод для сейвов\n- сдвинь модельку на миллиметр что бы нажать квадратик\n- а ой кнопка появилась но ты не мог взаимодействовать поэтому ПРЫЖОК\n- оптимизация для такой графики полный кал\n- скучная боевка надоедает после 30 часов\n- после 30 часов геймплея твой гг досихпор не знает что такое рюкзак, а если ты не подобрал бабочку одну из 100 расцветок ты не знаешь ее, что это самолёт?\n- второй персонаж? зачем?(UPD дали третьего.....)\n- механика света настолько полезна насколько возможна\n- руду собирать когда она весит на стене? я все больше убеждаюсь, что их главный гейм дизайнер это гимини на пол ставки потому что даже головоломки на уровне возьми камень потому что осел \n- охуенно глубоко прописанные персонажи просто которыми движет ток освободить регион, и они тупо как прямая полоса каждый болванчик. Они пытались выписать что то по типу жанровых классических друзей, один тупой, один добрый и тд. Но это мега тупость когда чел который бухает по кд просто в деревне полный врагов говорит да го вырежем их мда легендарный ♥♥♥♥♥ серогривый \n- квесты с огнем вообще отдельная тема я почти все вылизал в первой локе но все чаще мне попадались квесты где надо что то сжечь и единственны выходом было искать огонь за три пизды что бы поджечь стрелу - ходят слухи у меня уже 40 часов и где то точно есть магия огня ♥♥♥♥ ДА ДАЖЕ ДИНАМИТ ИЗ ШЕСТЕРЕНОК ЕСТЬ, КОТЛЫ ♥♥♥♥♥ С БЕСКОНЕЧНЫМ ПРОСТРАНСТВОМ А КОКТЕЙЛИ МОЛОТОВА ИЛИ ЗЕЛЬЯ ОГНЯ НЕ ПРИДУМАЛИ НУ ИЛИ ХОТЯ БЫ НА СРАНЫЕ ЛИАНЫ ИЛИ КВ ЗАДАЧИ ДАВАЛИ БЫ ЗАЖИГАТЬ КАМНЯМИ КАК ГГ ПО ВСЕЙ ИГРЕ И ДЕЛАЕТ\n- лутание убил 100 болванчиков прожми почти на каждого квадрат, зачистил поселение кат сцена очень нужного ракурса поселения болванчиков нет за то надпись, награда перенесена в хранилище, какая награда что дали.\n- лагерь сначала я радовался, круто можно расширять строить ранчо и тд. ОДИН КВЕСТ ЗА 40 ЧАСОВ ИГРЫ НА РАСШИРЕНИЕ ЛАГЕРЯ И ВСЁ НИКАКИХ ТЕБЕ ♥♥♥♥♥ МОДУЛЕЙ, А ДА ТЕБЕ ДАЛИ ПО ДОП КВЕСТУ ХОЛОДИЛЬНИК ХААААААААААААААААА МЫ НЕ НАУЧИМ ТЕБЯ РАЗМЕЩАТЬ ПРЕДМЕТЫ В ЛАГЕРЕ СОСИ потому что в этой игре даже пердеть тебя должны научить сам ты не можешь потому что тупая макака с интеллектом уровень 0\n- после каждой кат сцене с битвой менять тебе на меч с щитом и потом либо вообще не переключать либо переключать с задержкой где тебе уже сносят ♥♥♥♥♥ и анимация смены оружия не прошла\n- баги БАГИ и ещё 40 багов, анимации, застревания, зацикливания, квесты рожают по 10 минут, зависание плашек с испытаниями так что ты их видишь и в кат сценах\n- из плюсов все кат сцены на игровом движке, почему из плюсов а потому что эти соевые диалоги можно ускорять и скипать уебищные анимации драк на 5 минут. Ну реально? Ну еще раз 5 его перебросите его через спину и покажите как он мужественно парирует ух стояк аж\n- мне дали третьего персонажа и у него якобы тоже есть силы боже ♥♥♥♥♥ куда этот сюжет идет и этого качай и того качай ♥♥♥♥♥ ну ♥♥♥♥♥ \n-Пейлун - переодевшись в маскировку весь захваченный город в пленниках (хотя уже захвачен давно и че все стоят на улице и смотрят за пленниками нейронка момент) случайно пробежавшись мимо пленника ты его освобождаешь и 50 стражников вокруг тебя такие салам\n- множество заданий сломано, но не это бесит, а бесит то что 50% заданий это сядь на лошадь зажми кнопку следовать и просто ♥♥♥♥♥ сиди мниут 5 пока вы куда то доедете. Ладно была бы кнопка просто один раз нажал и сидишь, НЕТ!!! ХАЖМИ ПАДЛА И ЕДЬ С ЗАЖАТОЙ КНОПКОЙ ЕЩЕ ПАРУ РАЗ ПОСТОЙ ПОТОМУ ЧТО НЕПИСЬ ЗАЛАГАЛ\n\nНе давайте пожалуйста больше никогда денег Pearl Abyss, что ммо ♥♥♥♥♥♥ так и эта залупа такая же нейроновая ♥♥♥♥♥♥\n\nUPD: я устал в конец от этой игры, что хочу добавить. Сюжет чем дальше тем шизоидней, повторюсь его просто вырывали кусками, бесконечный гринд даже на среднем уровне сложности, все бои с противниками это зажатие одной кнопки и спам еды, я проходил и не такую духоту но на эту игру мне даже жаль потраченного времени. ","c":1791697386,"u":0,"b":0,"r":0},{"i":"237435387","s":"76561198419610469","g":39,"n":1,"p":13712,"f":17026,"l":"english","t":"best game ever\r\n","c":1791696517,"u":1,"b":1,"r":0},{"i":"237435309","s":"76561198170935054","g":0,"n":15,"p":11633,"f":12236,"l":"english","t":"There's no other open world action adventure game like this on the market, it truly feels like the first next-gen 'experience' that so many other studios have promised but failed to produce. The fidelity of the world, interactivity of game systems and density of things to find or do has set a new bar for the genera. Exploration truly feels rewarding, in a way that Bethesda games used to, with stories or events woven around things like forts or caves, some with unique bosses or puzzles, offering hundreds of landmarks to explore and loot.\r\n\r\nThe combat options and systems offer quite a few fun ways to fight, there's an abundance of gear to craft or find that also alter combat in meaningful ways. The (mostly) optional camp management system is also fun and rewarding, getting to see the landscape and areas change with the work your Greymanes do, you don't see that type of world reactivity in games.\r\n\r\nMany expressed issues with the main quests and characters when the game first launched, with the main critique being they lacked definition or felt underdeveloped, which the developers addressed in the 'Enhanced' update, adding more depth to the already interesting characters and world.\r\n\r\nThe story beats and characters aren't as well rounded as the Witcher series, which is some of the best in gaming, but considering this is an entirely new IP without 40+ years of world crafting behind it, what the team at Pearl Abyss managed to pull off is absolutely worthy of the asking price.\r\n\r\nCan't wait to see what the DLC has in store!","c":1791696396,"u":1,"b":1,"r":0},{"i":"237435183","s":"76561198049075846","g":4178,"n":5,"p":3627,"f":4942,"l":"english","t":"I upgraded my 9-year-old rig because of this game and completely forgot the rest of my Steam library exists.","c":1791696253,"u":1,"b":1,"r":0},{"i":"237432227","s":"76561199024654297","g":221,"n":3,"p":1403,"f":1403,"l":"schinese","t":"当电子阳痿时，可以试试这个","c":1791692752,"u":1,"b":0,"r":0},{"i":"237431792","s":"76561199084702693","g":0,"n":1,"p":9261,"f":9708,"l":"latam","t":"Goty","c":1791692256,"u":1,"b":1,"r":0},{"i":"237431636","s":"76561198950563752","g":109,"n":12,"p":11375,"f":11375,"l":"english","t":"this is Game Of the year for me in my heart. at 2026","c":1791692077,"u":1,"b":1,"r":0},{"i":"237430962","s":"76561198073962621","g":287,"n":5,"p":5768,"f":5768,"l":"russian","t":"Наиграл чёт типа 100 часов, дойдя до 10 главы, и вот что таки хочу сказать...\n\nВ целом игра отличная, много механик, глаза разбегаются чем бы заняться, но ММОшность прям отовсюду лезет. В тех же механиках, во взаимодействии с миром. \n\nСраные головоломки заебали уже на 50м часу игры. Не решая эти бесконечные \"пятнашки\" невозможно практически прокачиваться. Да бог с ней с прокачкой, снаряжение не прокачать!\n\nА снаряжение тут отдельный вид издевательства. У нас присутствует миллиард разного оружия, которое капитально отличается размерами, стилем боя и так далее, но цыферки у них - ТАДАДАМ!!! - одинаковые! На одинаковых уровнях прокачки, конечно. Отличаются на \"2 сраных процента\", как говорил один гений игрообзоров. В этом есть плюсы - можешь ходить с любой пухой. Но есть и минусы - ТЫ МОЖЕШЬ ХОДИТЬ С ЛЮБОЙ ПУХОЙ. Мету не собрать, смысла ходить по миру искать легендарки практически нету (сферки бездны, вы скажете? Нуну... их и так в игре хоть жопой ешь)\n\nНо игру всё-равно рекомендую. Красиво. Разнообразно. Для любителей головоломок и ММО. Для тех, кому внешка важнее циферок. \n\nИгра нашла своего игрока и я понимаю почему. Остальное не важно, так как вкусовщина.","c":1791691279,"u":1,"b":0,"r":0},{"i":"237429438","s":"76561197996424755","g":0,"n":133,"p":308,"f":308,"l":"spanish","t":"aburrido crei que iba hacer algo un rpg de aventura aglo mas directo","c":1791689439,"u":0,"b":1,"r":0},{"i":"237428995","s":"76561198161001386","g":72,"n":5,"p":3033,"f":3337,"l":"english","t":"very good very nice goodgame","c":1791688866,"u":1,"b":1,"r":0},{"i":"237428888","s":"76561198267812397","g":0,"n":1,"p":22579,"f":23060,"l":"brazilian","t":"Melhor jogo de exploração que já joguei, gráficos belíssimo, quantidade de missões insanas, pra mim melhor jogo do de 2026.","c":1791688747,"u":1,"b":0,"r":0},{"i":"237428767","s":"76561198346445382","g":286,"n":29,"p":1682,"f":2533,"l":"english","t":"fun lil game. slow burner tho. very slow burner","c":1791688599,"u":1,"b":0,"r":0},{"i":"237428136","s":"76561198301563957","g":0,"n":13,"p":13614,"f":14735,"l":"brazilian","t":"Esperei muito e no fim das contas ele e muito melhor do que eu imaginava, história meio foda-se, boss final facil pra caralho, mas o mundo, as mecânicas e possibilidades, ta maluco, ultimo jogo que me prendeu assim foi o Elden","c":1791687863,"u":1,"b":1,"r":0},{"i":"237427926","s":"76561198840360429","g":23,"n":4,"p":4704,"f":5433,"l":"spanish","t":"P-E-A-K","c":1791687591,"u":1,"b":0,"r":0},{"i":"237427731","s":"76561198066236834","g":366,"n":44,"p":9153,"f":9153,"l":"english","t":"152 hours. Did so much in the game, finished the main quests without rushing, and yet I feel like I've barely scratched the surface... There were a few buigs, and a lot of areas that I feel it needs some improvement, like time management and such, but otherwise? Stellar game. The sheer amount of stuff to do, the options, the minigames... From the poker-like game, to the minigolf, to the damn pinball machines I found out and probably spent at least an hour on... \r\n\r\nIt's worth every cent I paid.","c":1791687363,"u":1,"b":1,"r":0},{"i":"237427220","s":"76561198363491303","g":0,"n":8,"p":1061,"f":1344,"l":"koreana","t":"진짜 잘만든 오픈월드 체험공간인데 이걸 게임으로 보면 이만한 개쓰레기가 없음 절대 사라고 추천은못하겠다\r\n\r\n자기들 물리엔진 그래픽 딸치는용으로 만들어놓은듯 그래픽 개지리긴함 근데 확실한건 이건 겜이라고 할수없음 게임 관점으로 보면 그냥 개쓰레기임","c":1791686820,"u":0,"b":1,"r":0},{"i":"237425341","s":"76561199550722168","g":0,"n":4,"p":197,"f":249,"l":"koreana","t":"환불해달라고","c":1791684585,"u":1,"b":1,"r":0},{"i":"237425106","s":"76561198142804440","g":150,"n":30,"p":6573,"f":7691,"l":"english","t":"Great sandbox, open world action-adventure experience. If you just want something that you can quest and sink hundreds of hours in then definitely give this a chance especially if its on sale.\r\n\r\nLowkey scratches that MMORPG itch a little bit while we wait for a worthwhile MMORPG game to come out","c":1791684320,"u":1,"b":0,"r":0},{"i":"237424585","s":"76561198069559295","g":76,"n":2,"p":3909,"f":4499,"l":"schinese","t":"最伟大的开放世界游戏没有之一","c":1791683672,"u":1,"b":1,"r":0},{"i":"237424503","s":"76561199176526236","g":15,"n":4,"p":4958,"f":4958,"l":"brazilian","t":"MUITO BOM mas esperava mais da historia","c":1791683563,"u":1,"b":0,"r":0},{"i":"237424182","s":"76561199167875792","g":0,"n":9,"p":12426,"f":12426,"l":"english","t":"This Game is absolute Peak.\r\n\r\nThe World is full of unseen Wonders and let me tell ya its's Beautiful af.You got so many interesting Places in this Gasme like Top left of the Map resembles The World of Vikings and then in the other Corner you got Futuristic Orks Battling the Kingdom of Machines.Honorable Mention the 3 Island that resemble Asian Culture.You got everything.\r\n\r\nFighting in this Game feel hella nice too either you go full bonkers and start nuking everything or you go Jon Cena on them.Even Ranged Weapons as Mains feels nice.It's Incredible how everything can become Powerful and fun to play with.\r\n\r\nAlso if you want a pet or two get youself anything you want.A Lion?! Here you go! or maybe a Phoenix? Of cours you can!!! It's breathtaking how many things you can do in this game and i sincirly hope more of future Games will look and feel like this one.\r\n\r\nAbsolute Masterpiece!!!\r\nAlso i got 207 Hours Playtime and this is my first Playthrought so yeah this game got a lot to offer","c":1791683208,"u":1,"b":0,"r":0},{"i":"237423435","s":"76561198405011728","g":97,"n":1,"p":1457,"f":1457,"l":"schinese","t":"如此繁琐","c":1791682219,"u":0,"b":0,"r":0},{"i":"237421836","s":"76561198006162964","g":0,"n":1,"p":1664,"f":3350,"l":"english","t":"I have never written a Steam review because I have never felt the need to. I am an almost 40 year old gamer who has been playing games since before Windows 3.1 (writing .BAT files to get Rebel Forces to run) and this is the FIRST review I've written:\r\n\r\nI was on the fence about Crimson Desert, big time. I've been watching reviews on Youtube for almost six months, and of course the vast majority of them have an aggressive bias, basically all saying the same thing: Crimson Desert is a love it or hate it experience. The majority of reviews focus on the immense sense of scale, the endless layering gameplay systems, the almost insane wealth of things to do (usually pushed into ideas like \"side quests\" and \"content\"), and ALL of them mention that the story is pretty lacking, even with the \"Enhanced\" edition. \r\n\r\nThis is my take: Crimson Desert is less of a game and more of an absolutely breathtaking, completely enveloping experience. It is MADE of overlapping gamified systems, all of which you will have seen somewhere else, but it's HOW all of these things come together that make this... thing what it is. I'm only twenty five or so hours in and I have never been so utterly captivated. From the procedural, biome based weather system that can turn a mountain climb into a harrowing ascent, only to force you into a cliff side cave, to the realization that there's an entire NPC and commodity based working economy operating under the hood at all times, I'm led to my first point, one that doesn't get nearly enough attention in reviews: everything just works. Every system, no matter how big or small, works with an elegant competency both individually and together, from the absolute macro level to the smallest detail. You immediately start TAKING FOR GRANTED the fact that you can see the entire world at once, and then open a fully illustrated book in your inventory, watching your character's fingers turn the pages. I honestly think that when people are saying the words \"immense scope\" what they really should say is, \"truly unbelievable tapestry.\" From MY perspective, having played through and followed the entire scope of modern gaming, this is the kind of stuff that makes me re-think about what this medium is now and how it got to the point where some people are somehow immune to the magic that's happening here.\r\n\r\nThe cons? Yeah, the story is almost painful at times. Turn your brain off, use mods to make your character hot, and zone out for thirty seconds and you'll be right back in it. It is the SMALLEST of prices to pay for this thing, and knowing the developer they'll probably change it all soon anyway. Is it whacky? Absolutely. The tone and aesthetic of the game are so stubbornly stuck between western and eastern fantasy ideologies that sometimes it feels like the developer was DESCRIBED a style, then put a blindfold on and started writing. But again, I simply couldn't care less, and if you've been feeling suddenly bored by videogames in the past few years?/// \r\n\r\nGuess what, you weren't wrong, and this is the cure.","c":1791680245,"u":1,"b":0,"r":0},{"i":"237421424","s":"76561198350219889","g":181,"n":7,"p":226,"f":625,"l":"english","t":"excellent game for people who want something more than cinematic rpgs. It is a game with emergant gameplay possibilities.","c":1791679735,"u":1,"b":1,"r":0},{"i":"237418264","s":"76561198262052956","g":0,"n":13,"p":9990,"f":12672,"l":"english","t":"10/10 great game, cant wait for the DLC!!! thank you pearl abyss!!! make more games like this!","c":1791675846,"u":1,"b":1,"r":0},{"i":"237418248","s":"76561198134167086","g":137,"n":3,"p":2692,"f":2900,"l":"french","t":"Short: Problèmes visuels / Gameplay contre-intuitif / Copie d'autre jeux pas maîtrisée / Scénario terrible / Gameplay contre intuitif (il mérite d'être là deux fois)\n\n=== \n\nOuvrons des portes ouvertes: c'est un plagiat constant de tout les succès critiques au moment de sa sortie, oui. Mais le jeu semble avoir une démarche sincère puisqu'il propose tout de même un univers très singulier et neuf, on peut donc espérer un genre de petit renouveau ? A défaut de renouveau du genre ? \n\nNon. Mais alors pas du tout.\nPrenons le combat par exemple; c'est quand même fou d'avoir la prétention de retravailler les duels de from software mélangés avec divers vs fighters pour pondre un truc aussi horrible. \n\nLa caméra veut votre mort et les effets visuels sont vraiment (vraiment) surutilisés en permanence rendant le tout illisible, sans parler des fx qui masque parfois l'intégralité de l'action vous forçant à spammer l'esquive et prier pour retrouver des yeux votre personnage, et ça en espérant qu'un boss ne vous attrape pas pendant ce laps de temps. \nNe comptez pas sur un seul tutoriel pour venir vous aider car même ceux présents loin dans les menus austères du jeu sont incomplets. Vous devrez tenter de comprendre la baston... en pleine baston. Le pire étant que l'on nous vend un dynamisme et une fluidité folle mais que vous ne verrez jamais puisque la moitié de votre temps de combat sera occupé à ouvrir l'inventaire pour consommer de la nourriture en boucle.\n\nBien sûr ce n'est qu'un exemple parmi d'autres, j'aurais pu aussi citer le level design qui oscille de catastrophique à carrément antagoniste, partant souvent du principe que les joueurs sont en parfaite maîtrise constamment et glissant donc des tonneaux explosifs, des jets de flammes et autre joyeusetés dans les arènes, ce qui a défaut de corser la progression vous achève purement et simplement la plupart du temps. Ca peut être également une densité d'ennemi improbable ou des énigmes... présentes. \nBref, sinon l'histoire! Loin d'être mémorable et cousue de fil blanc malheureusement. La moindre interaction vu en cinématique se finira exactement comme vous l'imaginerez, les dynamiques entre personnages étant d'ailleurs tout droit sorties du chapeau d'un célèbre RDR2.  \nEt je ne parle pas du dlss qui ici est géré de la pire des manières. Niveau visuel, ayez une machine récente avec un écran potable (pas de dalle VA) car vous aurez du ghosting dans tout les sens. Le crépitement de la génération d'image est insoutenable à tel point que pour voir - je dis bien juste voir - correctement le jeu il vous faudra jongler entre appli nvidia (exit amd) et modding. Et encore ce ne sera jamais parfait. Quel dommage quand on voit à quel point les enviro artistes de ont géré l'occlusion mapping... Laissez-moi en profiter!\n\nQuoique qu'il en soit, c'est un ovni, une curiosité, certe! Mais qui ne vaudra jamais les originaux dont il s'inspire, laissant chacune de ses mécaniques repompées ailleurs en suspend ou à demi terminée. Ainsi, si vous avez déjà joué à Red Dead 2 / Zelda TOTK ou BOTW / Elden Ring ou tout autre du genre et bien vous ne serez non seulement pas dépaysé, mais surtout le jeu ne fera que vous rappeler à quel point chaque seconde passé ici était plus agréable sur l'un des titres originaux.\n\nForcément, à vouloir rentrer au chausse pied tout ce qui plaît on souffre de la comparaison, et puis même, la sensation d'être pris pour un pigeon en nous servant du gameplay réchauffé n'est pas particulièrement plaisante. \n\nSi vous avez 300h d'une traite sans travail, ni repos, ni loisir, foncez car pourrez dédier 100% de votre attention à décoder ce que le jeu tente de reproduire (les oracles disent même que vous pourriez apprécier le système de baston, même si c'est pas gagné).\nSinon, si vous êtes un humain tout autant lambda que le reste d'entre nous, je vous en conjure achetez plutôt l'un des jeux dont il s'inspire et vous passerez un formidable moment, en plus d'être moins cher.","c":1791675828,"u":0,"b":1,"r":0},{"i":"237417321","s":"76561199801351851","g":0,"n":2,"p":1162,"f":1658,"l":"english","t":"This game is awesome. its a combination of some of the best games of all time. If youre a fan of RDR2 or the early assassins creed games. Theres so much content to the game that i still havent unlocked all the different things to do.   The exploration is fun and the combat i think is really good as well. Story could be better but all the depth of the game makes up for it in my opinion. Simply put i think this is one of the best games that as come out in quite some time.","c":1791674790,"u":1,"b":1,"r":0},{"i":"237416897","s":"76561197996975060","g":601,"n":72,"p":302,"f":336,"l":"english","t":"Wowee, boy! I love sucking it. What a premium, well optimized, triple 69 experience. I can feel it in my stomach.","c":1791674341,"u":1,"b":1,"r":0},{"i":"237416774","s":"76561197985721381","g":165,"n":1,"p":278,"f":278,"l":"english","t":"Crash Simulator 2026\r\n\r\nCrashes on loading the game\r\nCrashes on loading a save\r\nCrashes on accessing the codex\r\nCrashes on accessing the inventory\r\nCrashes on playing the game\r\nCrashes on thinking about playing the game\r\n\r\nI’ve got 5 hours in-game, and 50 hours out of game furiously editing graphics settings, Nvidia settings, Windows registry, deleting corrupt save files (LOBBY SAVES?!), updating drivers, removing drivers, rolling back to old drivers, trawling user forums... and nothing works.\r\n\r\nI have literally never played a game that crashes this often and consistently. It is genuinely unplayable.\r\n\r\nThey should rename it to Crash Desert Downgraded.\r\n\r\n","c":1791674211,"u":0,"b":0,"r":0},{"i":"237416210","s":"76561198070290570","g":13,"n":2,"p":11005,"f":11715,"l":"english","t":"Good game with some of the worst boss designs,sometimes it kills the fun","c":1791673681,"u":0,"b":1,"r":0},{"i":"237415169","s":"76561198965908018","g":45,"n":5,"p":440,"f":1046,"l":"turkish","t":"günlerimi aylarımı gömmeye geldim","c":1791672611,"u":1,"b":0,"r":0},{"i":"237415148","s":"76561198924850006","g":88,"n":17,"p":2935,"f":3002,"l":"brazilian","t":"Jogão!","c":1791672591,"u":1,"b":0,"r":0},{"i":"237414853","s":"76561198099936202","g":0,"n":8,"p":957,"f":1621,"l":"latam","t":"me demore demasiado pero al fin un juegasooo","c":1791672265,"u":1,"b":0,"r":0},{"i":"237414626","s":"76561197973962184","g":0,"n":3,"p":9583,"f":10534,"l":"english","t":"Enhanced Edition is the way to go.  It is almost a perfect game now - you'll never be bored.","c":1791672041,"u":1,"b":0,"r":0},{"i":"237414568","s":"76561199521761788","g":71,"n":8,"p":10421,"f":11889,"l":"schinese","t":"虽然它通马桶，但它有事干啊\n虽然它解谜阴，但它攻略多啊\n虽然它跑图累，但它地图大啊\n虽然它连招难，但它给轮椅啊\n虽然它交互差，但它给了辅助技能啊\n虽然它剧情滚木，但它更新出了2.0啊\n虽然它装备区别不大，但它什么装备都能穿啊\n一款全是缺点也全是优点的游戏，入手前一定要三思，受不了一直查攻略或者不习惯赤石的千万别买，游玩体验分化严重\n这个游戏就应该呆在褒贬不一或者多半好评，不是神作，但绝对算不上粪作，玩这游戏不骂制作组的可以去止静寺山顶坐着了。。打开游戏的第一个小时，你就能发现它的一堆缺点，甚至看不到任何优点\n如果你真的下定决心赤石，[spoiler]强烈建议先推一些主线，不要过早停下，直到主线最后一章前都是有新玩法的，如果推的太晚，主线奖励只能用来打滚木了。。必须提升实力的时候会很明显打不过主线，但硬凹也能过\n推的太快可能会导致地图太和平前中期没怪刷钱，自己权衡利弊吧\n解密建议直接复制位置搜攻略，这个逆天游戏解谜教学只有一次，甚至还藏在某个开荒遇不到的地方，你卡了半天的解谜大概率是想都想不到的逆天方式，看完攻略直接气笑\n多搜攻略，战斗系统是给了轮椅的，甚至开局不久就能拿到[/spoiler]\n总有一些瞬间，它能惊艳到你（虽然大部分时间在被气到吐血）","c":1791671998,"u":1,"b":1,"r":0},{"i":"237412918","s":"76561198019532112","g":0,"n":38,"p":39784,"f":39877,"l":"english","t":"This game made me feel like a kid again. I haven't had this much fun in an open world game in a while. That being said, everything you've heard is 100% right. You'll either love it or never touch it again after 60hrs in. If you do decide to give it a shot, HAVE PATICENCE! I promise you it will be worth it. I beat the story months ago and I'm still playing to this day.","c":1791670470,"u":1,"b":1,"r":0},{"i":"237412085","s":"76561198029785279","g":0,"n":14,"p":3289,"f":3659,"l":"czech","t":"super.","c":1791669725,"u":1,"b":1,"r":0},{"i":"237411975","s":"76561198157286907","g":90,"n":10,"p":16927,"f":17235,"l":"spanish","t":"El goty 2026 para mi","c":1791669617,"u":1,"b":0,"r":0},{"i":"237411724","s":"76561198054178934","g":0,"n":16,"p":15812,"f":15909,"l":"english","t":"1000% worth the money, the previews don't show nearly enough of all that there is to experience in this game. A must buy for anybody that likes open world RPGs.","c":1791669411,"u":1,"b":1,"r":0},{"i":"237410872","s":"76561198788328249","g":0,"n":2,"p":1809,"f":2395,"l":"czech","t":"Love this game!!! But the puzzles are so hard. Why? It unnecessarily ruins the flow of the gameplay.","c":1791668688,"u":1,"b":1,"r":0},{"i":"237410485","s":"76561199811848755","g":38,"n":8,"p":9339,"f":9375,"l":"turkish","t":"150 saat kadar oynadıktan sonra rahatlıkla söyleyebilirim ki bu sene oynarken en keyif aldığım oyun oldu, öncelikle dünyası aşırı büyük ve detaylı, bu kadar saat oynadım ama oyunun yarısını bile keşfettiğimi sanmıyorum daha ayak bile basmadığım bi ton yer var, ayrıca yapabileceklerinizin sınırı yok resmen herşeyin oyunu gibi bişey olmuş, ister ticaretle uğraşıp tüccar ol ister kale kale gezip fetihler yap ister ejderhana binip dünyayı keşfet ne dilersen, ancak oyunun bazı kötü yanları da var maalesef, ilki hikayesi pek güzel olmamış ilginç değil ve ufaktan sıkıcı, ayrıca bazı puzzlelar gereksiz derecede zor, bi ton da getir götür tarzı yan görevler var, hikayeyi bitirdikten sonra oyun daha da zevkli hale geliyor bu arada bir sürü özellik açılıyor ejderhaya binmek gibi, toparlarsak crimson desert ı hikayesi için değil de manzarası için oynanış çeşitliliği için vs oynanması alınacak keyfi bi hayli arttırır bence, genel olarak tavsiye ederim beğendim","c":1791668350,"u":1,"b":0,"r":0},{"i":"237409520","s":"76561198894168998","g":124,"n":36,"p":8643,"f":8851,"l":"brazilian","t":"I think this is the game I've always wanted Skyrim to be after installing 500 mods before starting a new playthrough. I've put 150 hours into the game so far, and I know there's still plenty left to do, but I feel like I've explored a little bit of every aspect of the game to write a proper review.\r\n\r\nLet me get this out of the way first: I'm absolutely in love with this game, and I've had fun 99% of the time. So, let's start with the very few things I didn't like. First, the puzzles. Many of them are fun and creative, but after a while, they start to get tiring. And the worst part is that, at certain key moments in the story, your progress comes to a halt until you solve them. A little annoying, but nothing too bothersome.\r\n\r\nMy biggest complaint, though, is probably how the story is distributed across the different regions. I must have spent around 70 hours just in Hernand, the first region. Then, you still have a good chunk of the main story taking place in Pailune and Demeniss, but once you reach the final two regions, it's practically a quick visit and goodbye. Sure, there's plenty of content left for you to enjoy after finishing the main story, but I feel like the game could have given us more reasons to explore those areas, especially the desert region.\r\n\r\nThe story itself is pretty straightforward and entertaining. I like the characters, but there's nothing particularly groundbreaking here. It's a classic hero's journey built around the \"Chosen One\" archetype. It won't blow your mind, but it serves its purpose as a backdrop to get you out there exploring the world. There are also some genuinely impressive narrative sequences along the way. Just to be clear, I only started playing after the Enhanced version came out, so even though the story is simple, I thought it flowed pretty smoothly from beginning to end.\r\n\r\nBut the real magic of this game lies in hopping on your horse, drawing a straight line on the map, and just going. There are so many weapons, pieces of equipment, combos, and abilities that it's easy to feel overwhelmed by all the possibilities. It took me a few hours to get fully comfortable with the combat, but once everything clicked, it became one of the most fun combat systems I've ever experienced. And I don't even think I've scratched the surface of everything it has to offer.\r\n\r\nElemental combos with different weapons, all kinds of fighting styles, fans, mechs, dragons, straight-up hand-to-hand combat... It all works surprisingly well. The combat feels incredibly fluid, whether you're clearing out areas packed with enemies or taking on bosses.\r\n\r\nSpeaking of which, I really enjoyed the variety of bosses in this game. Some hit like a truck, others are incredibly fast, and some rely on massive area-of-effect attacks. There's a lot of variety in how you approach each fight. Playing as the two additional characters is also pretty fun. The only problem is that the game doesn't give you many reasons to actually use them. Still, it's fun to explore the world and customize their builds. Damiane is particularly enjoyable, as she has the most distinct playstyle of the three characters.\r\n\r\nI experienced some FPS drops in areas with large numbers of enemies, but overall, performance was great, even during massive battles with tons of visual effects flying around. I'm playing on an Acer Nitro V15 (13th-gen i5, RTX 4050 6GB, and 32GB RAM), and I was able to play on High settings with DLSS 4.5 set to Quality and Ultra lighting. The game looked absolutely gorgeous and ran very smoothly. Honestly, the optimization is one of the most impressive things about this game, especially considering everything that's happening on screen at any given moment. It runs remarkably well for a game with this much going on.\r\n\r\nUltimately, I understand that this game might not be for everyone. There are plenty of moments when it doesn't hold your hand, but it's a game that genuinely rewards exploration. There's always a better piece of equipment waiting for you after a boss fight or hidden away in some obscure corner of the world. The story might not get you emotionally invested, but it does a good enough job of guiding you through this spectacular map. Because, at the end of the day, Crimson Desert is all about discovering Pywel.\r\n\r\nHop on your horse, bear, moose, dragon, wyvern, or whatever else you can ride, and just go. There's an incredible amount of stuff waiting to be discovered.\r\n\r\nI wish the story had been more fleshed out, and I wish the game gave us more reasons to play as Oongka and Damiane. But I had so much fun exploring Pywel and beating the hell out of everything that stood in my way that these shortcomings become pretty easy to overlook.\r\n\r\n\r\n","c":1791667496,"u":1,"b":0,"r":0},{"i":"237409493","s":"76561199121946097","g":51,"n":8,"p":6469,"f":7204,"l":"spanish","t":"# 🎮 Crimson Desert — Review\n\n**Nota:** 8/10  \n**Plataforma:** PC  \n**Horas jugadas:** 110 h  \n**Fecha de finalización:** 10/10/2026  \n**Estado:** Completado (platinándolo)  \n**Desarrolladora:** Pearl Abyss\n\n## 📝 1. Opinión general\n\nCrimson Desert es un juego inmenso, con una gran variedad de actividades y misiones secundarias. Su mundo abierto no solo está lleno de vida y cosas que hacer, sino que también es precioso. Gráficamente, estamos ante uno de los juegos más impresionantes de la generación y, si hay algo que destacar por encima de todo, es la libertad que ofrece.\n\nEra un videojuego al que le tenía muchísimas ganas y ha cumplido con mis expectativas, llegando incluso a ofrecerme momentos en los que he flipado.\n\n## 📖 2. Historia y narrativa\n\n- **Trama:** 7/10\n- **Personajes:** 7/10. Kliff es espectacular, pero los otros dos protagonistas son bastante flojos.\n- **Desarrollo narrativo:** 7/10\n- **Final:** 8/10\n\n## 🎮 3. Jugabilidad\n\n- **Combate y mecánicas:** 9/10. El combate es dinámico y rápido. El árbol de habilidades es inmenso y el juego cuenta con una gran variedad de habilidades, capacidades de combate y artefactos que permiten cambiar la forma de jugar.\n- **Exploración:** 10/10. Es el punto fuerte del juego: espectacular, amplia y llena de posibilidades.\n- **Progresión:** 9/10.\n- **Variedad:** 8/10.\n- **Sensación al jugar:** Libertad absoluta y la posibilidad de jugar sin tener que seguir constantemente un rumbo marcado.\n\n## 🎨 4. Apartado artístico y técnico — 9/10\n\n- **Gráficos:** 10/10.\n- **Dirección artística:** 9/10.\n- **Banda sonora:** 7,5/10.\n- **Rendimiento y optimización:** 9,5/10.\n- **Ambientación:** 9/10.\n\n## ❤️ 5. Impacto personal — 8/10\n\n- **¿Qué me ha hecho sentir?**\n\n  Una enorme sensación de libertad. Crimson Desert es uno de esos juegos en los que puedes pasar horas haciendo lo que te dé la gana, sin sentir la necesidad de seguir constantemente la historia principal.\n\n- **¿Me ha hecho reflexionar sobre algo?**\n\n  No es un juego que destaque especialmente por hacerte reflexionar, sino por la experiencia que ofrece y por las posibilidades que pone a tu alcance.\n\n- **¿Hay alguna escena o momento que recordaré?**\n\n  La primera vez que consigo al dragón. Es uno de esos momentos que destacan dentro de una aventura tan inmensa.\n\n- **¿Me ha sorprendido, emocionado o decepcionado?**\n\n  Me ha sorprendido por la cantidad de cosas que puedes hacer y por la libertad que ofrece. Es un juego al que le tenía muchas ganas y que ha conseguido cumplir mis expectativas.\n\n- **¿Me ha dejado huella?**\n\n  En parte. Es una experiencia que recordaré especialmente por su mundo abierto, su exploración y la libertad que ofrece al jugador.\n\n## ⚖️ 6. Lo mejor y lo peor\n\n### Lo mejor\n\n- **La libertad y la exploración.** El mundo es inmenso, precioso y está
