us illisibles qu'ils ne le sont déjà pour la majorité des boss.\nCependant comme je l'ai dit au début, c'est un très bon jeu avec énormément de possibilité et de très longue heure d'aventure et d'exploration.\n\nBon jeu à tous","c":1792336278,"u":1,"b":0,"r":0},{"i":"238026751","s":"76561198047207793","g":122,"n":2,"p":2102,"f":2285,"l":"koreana","t":"Enhanced 패치 이후에 시작했는데, 스토리도 머 그럭저럭이고 조작도 그럭저럭이고 좋습니다.\r\n약간 싱글로 하는 MMO 느낌? 할것도 많은데 타격감이나 전투도 재미있고, 월드 탐험하는게 또 너무 재미있네요.","c":1792336274,"u":1,"b":0,"r":0},{"i":"238026534","s":"76561199765725258","g":0,"n":2,"p":10151,"f":10788,"l":"english","t":"i love this came its awsome\r\n","c":1792336115,"u":1,"b":1,"r":0},{"i":"238024821","s":"76561198768689883","g":0,"n":2,"p":6576,"f":6576,"l":"russian","t":")","c":1792334803,"u":1,"b":1,"r":0},{"i":"238024630","s":"76561198931129001","g":0,"n":27,"p":1227,"f":1227,"l":"russian","t":"НЕТ/ДУШИ","c":1792334650,"u":0,"b":1,"r":0},{"i":"238023968","s":"76561198253895114","g":0,"n":64,"p":107,"f":107,"l":"english","t":"Game seemed good but the graphics are giving me a sore head. The optimisation is terrible.","c":1792334167,"u":0,"b":1,"r":0},{"i":"238023579","s":"76561197996095931","g":582,"n":19,"p":725,"f":829,"l":"german","t":"Spiel macht Spaß und läuft absolut flüssig! Habe es gekauft, nachdem nun deutsche Audio vorhanden ist!","c":1792333871,"u":1,"b":0,"r":0},{"i":"238023172","s":"76561198141161908","g":0,"n":1,"p":16927,"f":16927,"l":"english","t":"ALL","c":1792333554,"u":1,"b":1,"r":0},{"i":"238023163","s":"76561198970954179","g":0,"n":1,"p":205,"f":205,"l":"schinese","t":"300小时路过，PS5和PC都买了。PS5从4月到8月玩的时间。现在已经坐等PC的DLC了哈哈哈\n[doge]只要你爱剑与魔法，爱开放世界，红沙不会让你失望。\n虽然主线剧情稍微拉胯、解谜不看攻略稍显坐牢[呲牙]但是战斗手感顶级、开放世界体量顶级、玩法丰富度顶级，再加上开发商持续长线更新，月底的DLC还补充了海战、进一步强化了家园建造的玩法。不多说，一玩一个不吱声[吃瓜]\n[呲牙]BTW，还可以骑龙奥，谁能拒绝骑龙呢哈哈哈哈","c":1792333544,"u":1,"b":1,"r":0},{"i":"238022958","s":"76561198026718398","g":0,"n":20,"p":17652,"f":17880,"l":"spanish","t":"Buenas tardes, tras casi 300 horas viviendo en el mundo de Pywel ,habiendo hecho la mayoría de misiones secundarias todas distintas(mejores y peores) terminada la historia ya en el “end game” he decidido realizar mi análisis y experiencia de juego a dos semanas de la salida del DLC que espero con locura. \n\nEs un excelente mundo abierto con toques y mezclas de distintos títulos y mecánicas como zelda BOTW ,the witcher,red dead redemtion 2,kingdom come deliverance,skyrim,etc…\n\nUn mundo abierto que te deja con la boca abierta por su belleza por sus lugares y fauna que se ve excelentemente bien el motor gráfico que se ve de locos  ,cosas por descubrir en tus viajes con cosas y mecánicas nuevas a hacer hasta bien tarde en el juego siguen apareciendo mecánicas nuevas.\n\nSu punto más débil por lo menos en mi partida de salida fue la historia o narrativa inconexa y la falta de explicación o erronea de los acontecimientos que van ocurriendo o mecánicas que van apareciendo en los puzzles,etc…\n\nDecir que ya Pearl abyss han ido parcheado y mejorando estos puntos en sus actualizaciones desde el lanzamiento que han sido muchas actualizaciones en estos 7 meses de vida mejorando para una experiencia más clara, mejorando la calidad de vida y los pocos bugs que he visto.El doblaje hablado al español de España incluido tras la salida es un trabajazo que se agradece\n\nLos controles parecen raros al principio al no ser los típicos pero a las pocas horas haces click, te acostumbras a correr y son simples 3 botones para el excelente combate y armas que vas mejorando con las objetos del abismo que puedes ir incluyendo a tus ataques. \n\n1 botón 3 acciones al mismo tiempo(o 5 a dos manos) y combos a realizar con los objetos del abismo hace que los combos del combate brille sobre todo con los bosses que son muchos y completamente distintos que te premian con sus armas o equipamiento al derrotarlos.\n\nDecir que hablo sólo de Cliff pero tienes dos personajes jugables más (Damiane y Oongka) que puedes levear sus habilidades y combos jugando con ellos ,hasta poder llevarlos junto a ti en tus aventuras (apenas los he usado he sido más lobo solitario)\n\nDonde realmente brilla es en su mundo tremendamente bonito y lleno de regiones por descubrir con una distancia de dibujado que te impacta desde el primer momento ver a lo lejos.\nUn mundo que cambia con tus acciones liberando campamentos de bandidos y distintos maleantes que se llena de vida tras esto,con NPCS con sus propias rutinas ,vendedores y nuevas misiones a realizar para subir tu reputación en esa región.\n\nSon como 4 o 5 regiones bien diferenciadas con sus biomas propios,construcciones,NPCS,flora,fauna,cuevas y secretos por descubrir,\nzona como Hernand con su estética mas medieval con llanuras bosques y construcciones que pudiéramos conocer de la vida real medieval\n\nUna zona más tecnológica NPCS robots y tecnología que te choca como en Marni en sus misiones ya lo veréis .\n\nLa nobleza de Démeniss y su historia con Damiane.\n\nLa zona helada con grandes montañas y parajes helados con fauna,flora y bosses exclusivos\n\nIngenieros y eruditos de ErudiPetra \n\nLos niños de Pororin y su historia\n\nCrimson desert con 3 biomas diferenciados en el de grandes desiertos rojos ,claras dunas de arena y una jungla exuberante llena de cosas por descubrir.\n\nZona montañosa de Pailune grandes arboles con fuertes y poblados de madera incluso en los árboles y algún personaje único …\n\nY como no la zona del abismo que es totalmente otro nuevo mapa la zona que mas choca su estética futurista e incluida en el mundo de Pywel que vas descubriendo su historia y porque esta en este mundo y que te une a él. Tan lleno de cosas por descubrir y completamente por puzzles que a un principio parecen un poco complicados pasarlos pero al final usas 4 habilidades(brazo axiomatico,brillo espada,espíritu y palmeos) o combinaciones de estas para ir pasando los puzzles.\n\nOtra parte del juego es la mecánica gestión de tu campamento los melenas grises,\nDurante las misiones de la historia allá por el capitulo 3 se abre otra nueva mecánica que es el campamento de melenas grises tu clan desperdigado que vas reencontrándote y haciendo crecer tu campamento con misiones para ellos y posibles recolección de recursos  ,mandarlos para poder hacer crecer el campamento de mano de obra humana “o no”  con sus habilidades únicas para cada misión:\nproteger y cobrar por ello,talar,minerales,objetos comercio,comida,armas,recursos varios y únicos que sólo se pueden conseguir en estas misiones de gestión del campamento\n\nTambién sus distintos roles en el campamento te abren vendedores,barbero,rancho,herrero,establo,comida,muebles(sí sí también tienes tu propia casa para decorar y tener tus cofres con objetos,recursos,mascotas,etc\nAnimales por descubrir y traer a tu granja o usar como mascota para que te recoja el loot ,algunas usadas de montura por tierra y aire para viajar de una manera mas rápida o por los tp´s.\nY no puedo decir mucho mas de mecánicas o personajes para evitar espoilers de la historia ,pero es un mundo precioso por el que proponerse viajar a una misión a varios km para entregar unos objetos,ves varios biomas,te aparece una montura legendaria de camino que tameas,un puzzle,liberas un fuerte que devuelves a la vida con sus gentes y vendedores,una lucha con un boss,una cueva secreta con equipamiento único,un santuario de las brujas y tras dos horas sigues sin llegar a donde te has propuesto llegar pero el camino ha sido especialmente rico y es lo caracteriza este título que mezcla una motón de cosas y mecánicas que hacen disfrutar de su mundo tan y tan adictivo con la curiosidad de que encontraras más adelante y como puede sorprenderte\n\nLO IMPORTANTE NO ES LLEGAR ES LO QUE SUCEDE POR EL CAMINO ,GRACIAS PEARL ABYSS","c":1792333370,"u":1,"b":0,"r":0},{"i":"238021763","s":"76561198716979913","g":0,"n":6,"p":507,"f":2258,"l":"english","t":"its the G.O.A.T i got this and it so good 10000000000000/10","c":1792332476,"u":1,"b":1,"r":0},{"i":"238021596","s":"76561199258459478","g":0,"n":1,"p":5053,"f":5056,"l":"koreana","t":"정말 재밌어요.\r\n게임 불감증이 사라졌어요.","c":1792332339,"u":1,"b":1,"r":0},{"i":"238021076","s":"76561198140634704","g":0,"n":5,"p":2929,"f":2982,"l":"english","t":"Yes great game. Would be even cooler if it ♥♥♥♥♥♥♥ ran on my PC.","c":1792331902,"u":1,"b":0,"r":0},{"i":"238019884","s":"76561197984856864","g":0,"n":2,"p":7481,"f":7929,"l":"english","t":"This has been the most fun that I experienced for quite some time. I definitely recommend this game.","c":1792330913,"u":1,"b":1,"r":0},{"i":"238018735","s":"76561198200822597","g":221,"n":15,"p":156,"f":243,"l":"polish","t":"lepszy skyrim","c":1792329989,"u":1,"b":0,"r":0},{"i":"238018402","s":"76561199871996606","g":30,"n":4,"p":1440,"f":1473,"l":"german","t":"1 der besten Spiele die ich jemals gespielt habe ich liebe dieses Spiel es ist Oben wirklich 1 meiner 3 Lieblingsspiele die Open World ist fantastisch du kommst sehr schnell an gute Waffen ran Und die Updates zieht jetzt auch noch rausgekommen sind Spiel noch mal besser gemacht haben das kliff Nicht nur so ne Sehenlose Hülle ist ist So so gut Ich hoffe dass alle die dieses Spiel spielen Freude daran haben Und das hat mir echt Spaß gemacht das Spiel zu spielen Ich bin auch noch mittendrin","c":1792329706,"u":1,"b":1,"r":0},{"i":"238017281","s":"76561199594212454","g":74,"n":11,"p":7400,"f":7400,"l":"schinese","t":"私凤游戏，首发的时候我玩着挺爽的，当时是i3 12100f+RX5600xt，这个配置算低配吧。但是我当时玩着画面也不糊，没噪点，帧率也比较稳定，玩着很爽。当时我绝对能给个78分很优秀了，但是现在我换了5060反而玩不了了，闪屏、噪点、糊、帧率低、帧率不稳定全都出来了。谁敢信我5060玩这游戏1k只有三十帧？虽然说游戏厂商更新很勤快，很听玩家意见。但是貌似优化问题和画面问题刚出的时候大家就在说了吧，都更新增强版了，也被优化好啊大哥。哎……","c":1792328760,"u":0,"b":1,"r":0},{"i":"238016825","s":"76561198021634815","g":446,"n":29,"p":8416,"f":8666,"l":"russian","t":"Ничё не знаю, игра года\r\n10/10","c":1792328373,"u":1,"b":1,"r":0},{"i":"238016575","s":"76561199802029839","g":0,"n":2,"p":11990,"f":12424,"l":"brazilian","t":"Melhor jogo que já joguei, incrível.","c":1792328147,"u":1,"b":0,"r":0},{"i":"238016182","s":"76561199827445310","g":0,"n":2,"p":10085,"f":10085,"l":"russian","t":"Вылетает уже на всех миссиях полный шлак \r\nИ на миссии с Яном после карт и когда хочешь отправить людей на задание \r\nРазработчики видимо уже забили на игру","c":1792327771,"u":0,"b":1,"r":0},{"i":"238016076","s":"76561198002919071","g":32,"n":1,"p":10478,"f":10667,"l":"koreana","t":"이번년 최고의 게임! 감탄만 나옵니다.","c":1792327681,"u":1,"b":1,"r":0},{"i":"238015001","s":"76561198314925917","g":0,"n":6,"p":4292,"f":4294,"l":"russian","t":"Crimson Desert\r\n — это игра для тех, кто хочет не просто пройти сюжет, а по-настоящему погрузиться в огромный фэнтезийный мир, исследовать его тайны, сражаться с опасными противниками и переживать собственные приключения.\r\n\r\nЕсли вы ищете масштабную одиночную игру с впечатляющей графикой, зрелищными боями и множеством возможностей для исследования, Crimson Desert определённо заслуживает вашего внимания.\r\n\r\nЧто делает игру интересной?\r\n\r\n1. Боевая система, в которой хочется совершенствоваться\r\nСражения — одна из главных причин обратить внимание на игру. Здесь можно сочетать удары мечом, захваты, броски, специальные способности и различные боевые приёмы. По мере развития героя открываются новые возможности, позволяющие создавать собственный стиль боя. Особенно впечатляют масштабные битвы с боссами.\r\n\r\n2. Огромный мир, который хочется исследовать\r\nКонтинент Пайвел наполнен городами, лесами, горами, руинами и другими необычными местами. Здесь интересно не только выполнять задания, но и отклоняться от маршрута, искать секреты и случайно находить новые испытания. Исследование — одна из наиболее сильных сторон Crimson Desert.\r\n\r\n3. Необычные способы передвижения\r\nИгра не ограничивается обычной ходьбой и верховой ездой. В приключении встречаются крюк-кошка, планирование и другие способы перемещения, а также возможность летать на драконах. Благодаря этому путешествие по миру становится отдельной частью игрового удовольствия.\r\n\r\n4. Эпические боссы и серьёзные испытания\r\nЕсли вы любите изучать поведение противников, подбирать подходящие способности и искать моменты для контратаки, бои с сильными врагами могут стать настоящим удовольствием. Некоторые сражения требуют терпения и хорошей реакции, хотя отдельные боссы способны показаться чрезмерно сложными.\r\n\r\n5. Много занятий помимо сражений\r\nМожно заниматься развитием лагеря, выполнять побочные задания, решать головоломки, собирать ресурсы и осваивать дополнительные игровые активности. Это делает мир разнообразнее и позволяет переключаться между приключениями, исследованиями и более спокойными занятиями.\r\n\r\nЧто может не понравиться?\r\n\r\nЯ бы рекомендовал игру с несколькими оговорками:\r\n\r\nСложность освоения. Много механик и способностей, поэтому в начале может потребоваться время, чтобы во всём разобраться.\r\n\r\nНе всегда удобные задания. Некоторые головоломки и игровые задачи могут казаться недостаточно понятными.\r\n\r\nНеравномерный темп. Не все активности одинаково интересны, а некоторые сражения затягиваются.\r\n\r\nНе самая сильная история. Если вы прежде всего ищете глубоких персонажей и эмоциональный сюжет, игра может не оправдать ожиданий.\r\n\r\nКому я особенно рекомендую Crimson Desert?\r\n\r\nЛюбителям открытых миров\r\n\r\nЕсли вам нравится часами исследовать карту, находить секреты и самостоятельно выбирать занятия, игра предлагает много возможностей.\r\n\r\nПоклонникам динамичного экшена\r\n\r\nЕсли вы предпочитаете зрелищные комбинации, мощных боссов и активные сражения, боевая система может стать главным преимуществом игры.\r\n\r\nТем, кто любит погружаться в большие игры надолго\r\n\r\nЗдесь много механик, занятий и мест для исследования, поэтому не обязательно торопиться к финалу.\r\n\r\nМой итог\r\n\r\nЯ рекомендую Crimson Desert попробовать тем, кто хочет получить большое фэнтезийное приключение с красивым миром, разнообразными боями и свободой исследования. Её главная привлекательность — в ощущении, что за следующим холмом, в очередном подземелье или за очередным сильным противником может ждать что-то новое.\r\n\r\nПри этом я бы не называл её идеальной игрой: у неё есть недостатки, но масштаб задумки и возможности игрового мира заслуживают внимания.\r\n\r\nЕсли коротко: Crimson Desert стоит рассматривать ради исследования, боевой системы и впечатляющих приключений, а не только ради сюжета.","c":1792326718,"u":1,"b":0,"r":0},{"i":"238010501","s":"76561198079891711","g":0,"n":11,"p":10856,"f":10856,"l":"english","t":"I cannot recommend a game that has thrash lighting system.","c":1792322815,"u":0,"b":0,"r":0},{"i":"238009630","s":"76561198874175813","g":32,"n":12,"p":8635,"f":8891,"l":"schinese","t":"什么寄吧任务设计，一堆脑残小巧思，血色加冕仪式这个韩币任务摘了头盔卡半小时，明明是那么全面的游戏，总在关键地方恶心人","c":1792321951,"u":0,"b":1,"r":0},{"i":"238008233","s":"76561198023748569","g":0,"n":10,"p":24068,"f":24128,"l":"japanese","t":"400時間かけて一応クリア\n最近10年の間プレイしたゲームの中では一番作りこみがすごいゲームだった\n冒険する楽しさと言うか意味なくマップだけでかいだけじゃなく\n宝箱とか色々あって退屈と感じる暇さえなかった\nDLC楽しみやな\n","c":1792320423,"u":1,"b":1,"r":0},{"i":"238007863","s":"76561198083293751","g":13,"n":4,"p":14590,"f":14640,"l":"german","t":"Ich hatte nie Interesse an Spiele dieser Art. Ich spielte ausschließlich Ego-Shooter und Dota 2.\r\nAber das hier ist etwas ganz großes.\r\n\r\nWeiter so Pearl Abyss.\r\n\r\nHervorragen.","c":1792320043,"u":1,"b":0,"r":0},{"i":"238007462","s":"76561198365526396","g":190,"n":5,"p":15512,"f":15541,"l":"schinese","t":"好玩爱玩","c":1792319653,"u":1,"b":1,"r":0},{"i":"238007222","s":"76561198757448988","g":10,"n":2,"p":837,"f":842,"l":"english","t":"Amazing graphics, amazing combat. When im riding my horse i dont get bored even though it is slow, I love to take in this games beautiful scenery and graphics. Combat is fun but a bit easy. Story is lacking but i dont really care about the story line. If you are looking for a beautiful and fun game to get lost into every night this is for you.","c":1792319415,"u":1,"b":1,"r":0},{"i":"238006869","s":"76561199042841648","g":113,"n":1,"p":251,"f":251,"l":"schinese","t":"室内到室外太闪了","c":1792319068,"u":0,"b":0,"r":0},{"i":"238005249","s":"76561198098321995","g":259,"n":7,"p":1241,"f":1241,"l":"schinese","t":"这弱智解谜太劝退了","c":1792317402,"u":0,"b":1,"r":0},{"i":"238004432","s":"76561199377287902","g":125,"n":4,"p":1676,"f":1755,"l":"schinese","t":"作为一个开放世界游戏，这游戏剧情和引导做的实在太差了，感觉完全没花心思在上面，玩家玩游戏是为了花大量时间和你猜谜语吗？","c":1792316543,"u":0,"b":0,"r":0},{"i":"238003276","s":"76561198015009150","g":0,"n":34,"p":1860,"f":2071,"l":"russian","t":"Отличная игра, реально раскрывается после пролога) На стимдеке идет на минималках, шрифты все крупные.","c":1792315296,"u":1,"b":1,"r":0},{"i":"238002292","s":"76561198124992625","g":0,"n":2,"p":4187,"f":4284,"l":"koreana","t":"이야 재밌다. 딱조타.","c":1792314219,"u":1,"b":1,"r":0},{"i":"238001216","s":"76561198050433447","g":0,"n":5,"p":1018,"f":1735,"l":"french","t":"Très bon jeux , j'avais de mauvais a priori mais c'est une pépite.","c":1792313025,"u":1,"b":0,"r":0},{"i":"237996861","s":"76561198045420045","g":0,"n":5,"p":11509,"f":11509,"l":"russian","t":"GOTY 2026\n\nНемыслимо как эту игру поддерживают разработчики, можно было-бы даже отдельно наградить Pearl Abyss только за то, что они перепатчили эту игру много раз (24 патча если верить AI) и это просто немыслимо. \n\nКасаемо ядра игры - это именно песочница и про исследования столь обширного мира, который вкупе с красивой картинкой дает полный спектр ощущений что это реально большой и реально проработанный мир\n\nЗа 190ч я убил всех 77 боссов, закрыл бОльшую часть контента в игре (около 77% бестиария) и оставшиеся побочки это в духе принеси мясо или наруби дров. И в целом я остался доволен данным продуктом, приятно осознавать что среди многочисленных игр есть те разрабы которые своё детище не оставляют на произвол судьбы и стараются отполировать все острые углы. \n\nДанная игра раскрывается очень медленно, от этого нету быстрого геймпленого дофамина которым пичкают всяческие AAA проекты, но которые кроме него ничего особо не могут предоставить, к сожалению. \n\nСюжет тут после релиза 2.0 постарались преподнести с более кинематографичной стороны, добавили катсцен и по всем обзорам Клифф перестал быть угукающим болванчиком. Да, он не передает большой драмы и не старается удивить вас какими-то переломными моментами, но этой игре он и не нужен, он просто дает вам понимание с чем вы боритесь и за что, не более.\n\nМеханически игра удивляет, настолько разнообразного геймплея я не видел давненько, на котнроллере тяжеловато давались некоторые аспекты (видимо на МнК это сделано чуть удобнее) но в целом всё это мелочи на фоне того чем дает занять себя игра: хочешь - иди отвоюй лагерь, хочешь улети в небеса и разгадывай головоломки, хочешь занимайся торговлей (ненавижу её) и т.д.\n\nВ игре есть свой шарм, и то как разработчики поддерживают игру - низкий поклон.\nПосмотрим еще на DLC, думаю дополню обзор\n\n9/10, очень достойный продукт\n","c":1792307697,"u":1,"b":1,"r":0},{"i":"237994776","s":"76561199116847885","g":40,"n":6,"p":15911,"f":15911,"l":"english","t":"Freaking masterpiece. I have no idea how I’m supposed to spend 70 bucks on anything less than this now (and pretty much every game is way below CD at the moment in terms of scale and overall experience)\n","c":1792305040,"u":1,"b":1,"r":0},{"i":"237994241","s":"76561198694077438","g":26,"n":3,"p":875,"f":875,"l":"schinese","t":"红色沙漠是我玩到的最适合去体验去放空心灵，的大世界我爱它但是希望他能越做越好","c":1792304288,"u":1,"b":1,"r":0},{"i":"237993902","s":"76561198836554461","g":0,"n":2,"p":636,"f":1226,"l":"brazilian","t":"jogaço!!!","c":1792303835,"u":1,"b":0,"r":0},{"i":"237993680","s":"76561198093633404","g":0,"n":3,"p":7089,"f":7304,"l":"koreana","t":"진짜 재밌게 하고 있었는데 메인퀘 진행이 안 됩니다.\n\n메인퀘 챕터 11 '멋진 신세계' 진행중 3개의 열쇠 다 얻고 '마르니 절벽 비밀기지' 까지 도착 후 책들도 다 읽고 '누름단추' 눌렀는데도 전혀 진행이 안 되네요.\n\n모험일지 보면 '멋진 신세계' - '기묘한 저택' - '수상한 남자를 만날 방법 찾기' 여기까지만 뜨고 \n세이브파일 에서는 '현실과 진실' - '광뢰전차' 라고 뜹니다. 메인퀘가 꼬인 것 같아 세이브에디터를 사용해봤지만 세이브 에디터 사용하면 아예 게임실행이 안 되네요.\n\n이전 세이브 파일이 10일도 넘어서 해당세이브파일 수정 못하면 그냥 아예 새로해야하는 수준입니다. \n\n아무리 검색해봐도 저처럼 꼬인 사람은 안 보이네요.\n\n저는 여기까진가 봅니다. 하........\n\n언젠가 패치던 뭐 어떻게 해결되면 좋겠네요.","c":1792303556,"u":1,"b":1,"r":0},{"i":"237991615","s":"76561198851411610","g":61,"n":2,"p":3533,"f":3624,"l":"schinese","t":"好玩","c":1792300769,"u":1,"b":0,"r":0},{"i":"237991144","s":"76561198794699761","g":0,"n":3,"p":1929,"f":2042,"l":"english","t":"this game is amazing and full of content, but sooo many simple tasks like \"read the letter\" then \" examine the boxes\" which should take seconds, can turn into 6 minutes of me frustratedl looking and googleing EVERYTHING. i spend 1/4 of the time just googleing things because you cant highlight an actual needle in a haysdtack.","c":1792300175,"u":0,"b":1,"r":0},{"i":"237990757","s":"76561198354489205","g":0,"n":2,"p":3037,"f":3037,"l":"english","t":"Genuinely stunning game overall from visuals, to gameplay, to story line--no notes! I preordered the DLC as soon as it was announced and can't wait to see how it further expands everything you can do in this already vast world (really looking forward to the romance element tbh!)","c":1792299665,"u":1,"b":1,"r":0},{"i":"237990065","s":"76561198373706519","g":0,"n":15,"p":6886,"f":7545,"l":"schinese","t":"如果去掉垃圾解密，游戏还是很不错的","c":1792298800,"u":1,"b":1,"r":0},{"i":"237989235","s":"76561198689296663","g":19,"n":7,"p":398,"f":455,"l":"schinese","t":"垃圾哦","c":1792297691,"u":0,"b":0,"r":0},{"i":"237988812","s":"76561199698290187","g":0,"n":2,"p":1744,"f":2004,"l":"english","t":"good\r\n","c":1792297180,"u":1,"b":1,"r":0},{"i":"237988332","s":"76561199481158909","g":25,"n":9,"p":64,"f":64,"l":"koreana","t":"패드 조작 진입장벽 상당하네..","c":1792296581,"u":1,"b":1,"r":0},{"i":"237987658","s":"76561199587992482","g":80,"n":5,"p":9632,"f":9632,"l":"schinese","t":"你tm的，克里夫只会嗯嗯嗯","c":1792295690,"u":1,"b":0,"r":0},{"i":"237987506","s":"76561198956470550","g":17,"n":2,"p":8305,"f":8373,"l":"schinese","t":"垃圾游戏，找不到售后的联系方式","c":1792295489,"u":0,"b":0,"r":0},{"i":"237986864","s":"76561198075313816","g":0,"n":17,"p":2302,"f":4208,"l":"brazilian","t":"Mundo aberto com ótimos gráficos, combates intensos.\r\nPontos positivos é a liberdade de exploração, a variedade de armas e habilidades.\r\nÓtimo jogo eu recomendo.","c":1792294651,"u":1,"b":0,"r":0},{"i":"237986126","s":"76561198255016678","g":0,"n":2,"p":3292,"f":3292,"l":"schinese","t":"这游戏底层战斗逻辑如果不修改，再怎么改这游戏都是纯粹的一坨屎，骑着龙逛来逛令人心旷神怡，德米安也很养眼，但是一旦碰到战斗，要么无数个小怪把你射成马蜂窝，要么逆天boss中一下就被秒杀，女主看起来搏击很多连段，实际上逼用没有，吃了50小时的屎实在吃不动了，纯粹的左右脑互博的游戏，想学RDR2，各种地方都照着RDR2来，但是人家RDR2不做你这样的狗屎战斗系统，想学塞尔达，一堆东西模仿塞尔达来，人家塞尔达的林克也不像你这里的角色一样小儿麻痹症，boss更不是纯粹的疯狗加秒杀。","c":1792293688,"u":0,"b":1,"r":0},{"i":"237984819","s":"76561198749618188","g":0,"n":5,"p":2173,"f":2771,"l":"spanish","t":"dont expect a good story, but this is a massive beautiful world to explore. I have 36 hours and im still at chapter 3. well optimized and looks great with dlss 5. if you want to play smth new I 100% recommend it, the first hours are horrible though to be fr but it becomes great afterwards\r\n","c":1792292165,"u":1,"b":0,"r":0},{"i":"237984487","s":"76561198012993987","g":191,"n":2,"p":7226,"f":7320,"l":"english","t":"gud","c":1792291729,"u":1,"b":1,"r":0},{"i":"237984281","s":"76561197972150531","g":1807,"n":298,"p":3076,"f":3076,"l":"english","t":"All kinds of fun, all kinds of jank.\r\n\r\nPuzzles are on par with the easier side of Zelda, in the first bit anyway. 'Progression' is slower, tied to gear and skill points, not levels or farming (Except for materials) and some things are poorly explained (Translated?). Also the first 30~ hours of exploration/quests serve for tutorials essentially, explaining systems you may have already figured out.\r\n\r\nI do find the \"Get on your horse and ride with me\" Exposition style to be VERY slow for completing quests. It does get a little annoying, I am hoping for more 'meat' later, but we will see. The world is pretty enough and interesting enough to keep me hooked though, which is hard these days.\r\n\r\nAll in all, worth your time.","c":1792291459,"u":1,"b":1,"r":0},{"i":"237984160","s":"76561198109982357","g":0,"n":1,"p":3114,"f":3304,"l":"schinese","t":"发售的时候就被画面吸引，换新电脑后马上就开始玩。非常喜欢里面明亮写实的画面，玩法非常多、环境也很丰富。刚开始不太适应各种交互，习惯以后密集的交互也增加了现实感。剧情非常一般但是也算能感受到主角的成长吧。","c":1792291275,"u":1,"b":1,"r":0},{"i":"237984114","s":"76561199392647769","g":33,"n":3,"p":980,"f":980,"l":"schinese","t":"没事的时候跑跑图看看风景挺不错的，就是剧情有点拉，个人最喜欢的是游戏画面和画质","c":1792291215,"u":1,"b":0,"r":0},{"i":"237984012","s":"76561198351417985","g":0,"n":1,"p":12432,"f":13097,"l":"english","t":"gute diese","c":1792291090,"u":1,"b":0,"r":0},{"i":"237982878","s":"76561198187316402","g":0,"n":4,"p":3305,"f":3344,"l":"schinese","t":"静下心慢慢玩的话还是挺不错的，地图很大一点点去探索还是很好玩的。","c":1792289663,"u":1,"b":1,"r":0},{"i":"237981874","s":"76561198784962925","g":0,"n":2,"p":620,"f":735,"l":"schinese","t":"很好的看风景游戏","c":1792288394,"u":1,"b":0,"r":0},{"i":"237981430","s":"76561198078954405","g":0,"n":128,"p":196,"f":196,"l":"polish","t":"Grę dopiero zaczynam i mało co pozytywnego mogę o niej powiedzieć, na pewno na plus to że widać mnogość mechanik, ale już samo wykonanie jest nudne, za dużo wszystkiego na raz, i ogólnie gra wygląda jakby zrobiona tylko po to by nasrać mechanik ale już nie dać lepszego modelu poruszania się, walki, lepszych tekstur. Może zmienię kiedyś zdanie ale na razie jest lipa.","c":1792287847,"u":0,"b":0,"r":0},{"i":"237980230","s":"76561199030092642","g":51,"n":1,"p":5430,"f":6400,"l":"schinese","t":"完美符合我游戏xp的一款游戏，除了不能捏脸美中不足以外，几乎没有可挑剔的。画面明亮优美，地图量大管饱，虽然收集、解谜、战斗元素看起来缝合了很多游戏，但好在仍有自己的特色。战斗难度可选，适合我这种不喜欢被虐的游戏玩家，不强制主线随时随地可以去探索，支线任务也有很出彩的剧情。唯独就是材料收集上有点费劲，背包机制还可以再优化一下。","c":1792286320,"u":1,"b":0,"r":0},{"i":"237979719","s":"76561198152257737","g":0,"n":4,"p":8619,"f":9874,"l":"koreana","t":"아 진짜 우리나라 게임이라는 걸 빼고서도 굉장히 수작임.\r\n물론 조작감이나 불친절한 몇몇 점들이 있지만 그걸 고려해도 좋음.\r\n아직까지 개선사항이 더러 보이지만 DLC가 곧 나올 것도 그렇고 지속적인 업데이트가 예상됨.\r\n펄 어비스 너무 좋아","c":1792285680,"u":1,"b":1,"r":0},{"i":"237979682","s":"76561198210023805","g":0,"n":20,"p":7500,"f":7500,"l":"german","t":"Nach 125 Stunden habe ich es endlich beendet.\r\n\r\nGrafisch ist das Spiel wirklich sehr schön und auch die Zwischensequenzen sehen gut aus. Leider hört es da für mich aber auch schon auf.\r\n\r\nDas Kampfsystem ist in den ersten paar Stunden noch interessant, wird danach aber schnell langweilig. Genauso sieht es bei der Story aus. Ich persönlich konnte einfach keine Bindung zu den Charakteren aufbauen. Jeder hätte sterben können und es wäre mir vollkommen egal gewesen. Die Story wird unnötig in die Länge gezogen, was nicht unbedingt schlimm wäre, wenn sie dabei nicht so endlos langweilig wäre.\r\n\r\nWas mir allerdings gut gefallen hat, ist die offene Welt, die voller Geheimnisse und Rätsel steckt. Hier gibt es wirklich viel zu entdecken und zu erkunden.\r\n\r\nWenn das Spiel irgendwann im Sale für 20 € zu haben ist, kann man bedenkenlos zugreifen. Den Vollpreis würde ich dafür allerdings nicht bezahlen.\r\n\r\n4/10","c":1792285645,"u":0,"b":0,"r":0},{"i":"237979377","s":"76561199247248419","g":0,"n":3,"p":2929,"f":3022,"l":"latam","t":"Juegazo, la mitad de las horas que le llevo es de pura exploración y cada vez que me distraigo encuentro cosas nuevas","c":1792285246,"u":1,"b":0,"r":0},{"i":"237979144","s":"76561199193887563","g":0,"n":11,"p":719,"f":719,"l":"schinese","t":"引导做了但是做的非常差，操作复杂反直觉，键位八爪鱼","c":1792284947,"u":0,"b":0,"r":0},{"i":"237978841","s":"76561198031995628","g":0,"n":27,"p":2753,"f":2753,"l":"english","t":"There are some things to like here, and it's impressive on a technical level, but the game just feels like ♥♥♥♥♥♥♥ to play, has horrible quest design, and an awful story. It feels like the devs haven't played a game in the last 30 years and just did thing their way. That approach could have paid off, but it just didn't here. After 45 hours of forcing myself to play, I'm tapping out. Bad game.","c":1792284566,"u":0,"b":1,"r":0},{"i":"237978396","s":"76561198252594922","g":0,"n":3,"p":4222,"f":4222,"l":"english","t":"Game of the year for sure! Deep exploration, amazing mechanics, fun combat, and dragon mounts with huge map to explore. I will remember this game as one of my top 10 all time best.","c":1792284015,"u":1,"b":0,"r":0},{"i":"237978178","s":"76561199146237329","g":179,"n":4,"p":10978,"f":10978,"l":"koreana","t":"너무 재미있다, 현상수배만 반복 퀘스트 느낌 나지만 다른건 다 서사가있고 스토리가 있어서 서브퀘 조차도 하나하나 재미있음. 조작도 괜찮고 스킬이 엄청 많아서 키들도 많지만 그것마저도 익숙해지니 진짜 재미있음","c":1792283733,"u":1,"b":1,"r":0},{"i":"237976252","s":"76561199421643464","g":0,"n":17,"p":309,"f":580,"l":"koreana","t":"해봐 갓겜이다","c":1792281423,"u":1,"b":1,"r":0},{"i":"237976182","s":"76561198313580731","g":0,"n":8,"p":3108,"f":3385,"l":"turkish","t":"Mükemmel","c":1792281350,"u":1,"b":1,"r":0},{"i":"237976065","s":"76561198010375507","g":0,"n":7,"p":536,"f":1058,"l":"english","t":"The VERY best single player RPG game I've played in a VERY long time.  HIGHLY reccommended!","c":1792281239,"u":1,"b":1,"r":0},{"i":"237975733","s":"76561198065324758","g":0,"n":5,"p":1552,"f":1650,"l":"english","t":"So 25 hours in and I'm frustrated and bored. The game is basically an unrewarding walking simulator,\r\nThe controls on keyboard / mouse are terrible.\r\nI really want to like this game, but I simply don't want to play anymore.","c":1792280904,"u":0,"b":1,"r":0},{"i":"237975671","s":"76561199229377339","g":296,"n":61,"p":274,"f":274,"l":"english","t":"Beginning was really boring but once you beat chapter 1 the pace starts to pick up a bit and u can do whatever you want.","c":1792280831,"u":1,"b":1,"r":0},{"i":"237975468","s":"76561197983760536","g":115,"n":6,"p":7175,"f":7175,"l":"brazilian","t":"Puta jogão. Vale cada centavo.\n\n🟩 Pros 🟩\n\n• A massive open world to explore, filled to the brim with secrets, puzzles and unique encounters. The level of care and attention to detail in making each area is exceptional.\n\n• Excellent, spectacular combat system, that features plenty of weapon-exclusive movesets, unique combos, powers and attack types to suit any playstyle.\n\n• Superb enemy variety, with each region featuring dozens of unique variants. Bosses are largely unique, well-designed and adequately challenging.\n\n• Enormous amount of side activities: from farming to pet taming, gambling, house furnishing, racing, dueling, camp management, goods trading and much more.\n\n• Extremely rewarding exploration system, that grants access to hidden quests, secret upgrades and unique items to thorough explorers.\n🟥 Cons 🟥\n\n• Weak early game that gives a terrible first impression. The first 10-15 hours are a chore, filled with boring fetch quests and inconsequential dialogues.\n\n• Kliff doesn’t have the charisma and depth necessary for a solid main character. His flat, uninvolving demeanor makes him uninteresting.\n\n• Overly elaborate, clunky control system that takes a good while to get used to; it isn’t reliable when executing more complex actions or combos. Use a gamepad to retain your sanity.\n\n• Many puzzles are badly designed and frustrating. They often have obscure mechanics that don’t follow any consistent logic.","c":1792280624,"u":1,"b":0,"r":0},{"i":"237973649","s":"76561199591123780","g":0,"n":4,"p":10888,"f":10888,"l":"brazilian","t":"Recomendo 10/10 o jogo mudou tudo desde o começo sendo atualizado basicamente toda semana pra resolver bugs e atualizando o conteúdo em si, a historia foi atualizada, o gráfico é um dos melhores do ano e bem otimizado, se for pra falar oq eu mais gostei nesse jogo é o combate e a exploração nesse mapa gigantesco e cheio de desafios e puzzles e diversidade de inimigos e regiões. tenho quase 200h de jogo e ainda sim tem muita coisa pra fazer ainda, além da dlc que ainda pretendo pegar, resumindo pode ir sem medo se vc não odeia jogos que tem um progresso meio lento.","c":1792278505,"u":1,"b":0,"r":0},{"i":"237973129","s":"76561199160713500","g":0,"n":10,"p":11576,"f":12846,"l":"english","t":"This is my new favorite game, I haven't had a game grab me like Crimson Desert since Skyrim's release and Morrowind before that. The game is beautiful, its fun, it doesn't hold your hand, and after almost 200 hours the game is still throwing surprises at me, and doesn't feel like various other repetitive copy and paste open world games. I suspect that people are going to be playing and modding this game for decades to come. Something to note, there's a lot of review videos about this game, and people either criticize this game or they totally glaze it, but in both cases they are pretty honest and factually correct. You'll either love this game, or be completely disappointed by it, so before you part with your cash, scroll through some for and against youtube videos, and you'll know whether its for you or not. For me its the best money I ever spent on Steam and makes my expensive for me PC seem like it wasn't a waste of money.","c":1792277906,"u":1,"b":1,"r":0},{"i":"237973120","s":"76561198379558221","g":0,"n":20,"p":1806,"f":2037,"l":"english","t":"I'm barely 30 hours in and I can't stop playing. There is so much content in this game it is genuinely ridiculous. I am finally getting that feeling I got playing TW3 and Skyrim for the first time again. This game is outstanding.","c":1792277899,"u":1,"b":1,"r":0},{"i":"237972805","s":"76561199052249060","g":332,"n":3,"p":7554,"f":7554,"l":"spanish","t":"After 125 hours and finishing it twice, I can tell you that this game is an absolute masterpiece. The exploration, the quests, the combat, the different fighting options, and the way you can explore are incredible.\r\nExploration itself deserves a special mention: I’ve seen friends with around 300 hours who still have parts of the map left to discover. I recommend completing the main story first and then exploring everything else to make the experience more enjoyable.\r\nAs for the story, I’ve seen a lot of criticism calling it bad, but I actually found it pretty decent. It has plot twists and real depth. While it’s true it might not be the absolute best and the overall quality of the game sets such a high bar that you expect the story to match it it is by no means bad.\r\nGraphics-wise, it's mind-blowing. I played it on an RTX 5080, but I’ve seen gameplay running on an RTX 2060 and it’s genuinely a beautiful game. The draw distance and its ability to load things from so far away is fascinating. On top of that, the art style combining robots with dragons in an ancient medieval setting is absolute perfection.\r\nAll in all, if you’re looking for a game with continuous exploration, pure combat, and a great touch of lore, I recommend it 100%.","c":1792277524,"u":1,"b":0,"r":0},{"i":"237971260","s":"76561199884288731","g":0,"n":1,"p":6610,"f":6830,"l":"english","t":"The story and most of the quests in this game are tom pearl levels of poo but everything else is peak","c":1792276007,"u":1,"b":1,"r":0},{"i":"237970169","s":"76561198041625777","g":0,"n":5,"p":6788,"f":7341,"l":"english","t":"Depend on what you are looking for. Open world yes, some crafting yes, hold you hand to know what to do nope, fun yes and it is hard at times.","c":1792274959,"u":1,"b":1,"r":0},{"i":"237970037","s":"76561199046019086","g":0,"n":8,"p":12239,"f":12856,"l":"brazilian","t":"[i]Cheguei nas [b]2OO[/b]h de game e essa vai ser a minha sincera opinião[/i]\n\nCrimson Desert é o jogo ideal pra quem busca um game de exploração em mundo aberto com liberdade criativa de build.\n\n[h1]O Game:[/h1] \nVou começar essa análise falando do mundo que é o ponto que mais me encantou. Você tem todos os principais biomas naturais como floresta, deserto, locais nevados e todos são muito extensos pra explorar à cavalo (o que é um ponto [b]MUITO[/b] positivo), todos eles muito bem ambientados com fauna e flora vivos e uma penca de animais pra descobrir. Tudo muito prazeroso de passear por conta de uma vegetação tão bem feita. Percebi que nas arvores, tem um efeito incrível de folhas balançando, faz lembrar uma arvore de verdade, e faz ter a impressão que está mesmo ventando muito no game. Achei isso INCRIVEL! \nOs npcs hostis ou amigáveis são muito bem feitos, todos com suas características próprias e sempre com vestimentas de acordo com a cidade ou região em que se encontram. E são muitos npcs MESMO! Tem até criança monge.\n\n[h1]Parte Técnica:[/h1]\nPouquíssimos bugs eu observei no game, [b]pouquissimos[/b] mesmo tendo em vista que foi um jogo lançado às pressas. Mas por receber patchs, acaba por sempre manter tudo sempre em constante atualização. \nOs bugs que posso relatar que me lembro: \n- Durante alguma missão com a carroça, se você agarrar ela em algum ponto do trajeto, o game te oferece um botão chamado \"fugir\" que te volta todo o trajeto novamente. Mas te tira da trap.\n- Só tem esse mesmokkkk\n\nO jogo está quase perfeito! Só tem coisas pra melhorar, tipo a mobília, tem que dar pra interagir pelo menos com a cadeira. [b]Eu quero [u]sentar[/u] na cadeira![/b] O jogo tem sofás que eu ainda nao comprei mas acredito que também não dê pra me sentar, então acho isso básico demais pra nao ter. Mas da pra mobiliar perfeitamente e tem até opção de \"[i]movimentar lento[/i]\" como tem no [i]The Sims[/i] pra conseguir colocar objetos com mais liberdade sem ter que respeitar o \"enquadramento\". \n\nA parte sonora do game é muito irada também. Popularmente conhecido no trailer, o gigante da floresta foi o meu [i][b]insight[/b][/i] da qualidade audiovisual da obra. Ele treme a terra nos passos, você percebe um impacto sonoro e físico no espaço, e até o tremor nos galhos das arvores. Como ele anda lento, a proporção desses efeitos aumenta na medida que ele se aproxima. Surpreendentemente incrível esse game!\n\nAs trilhas sonoras são muito prazerosas também. Combinam com os locais e são todas muito empolgantes. Até as canções dos próprios personagens da história também são muito boas. Tudo muito de acordo com a pegada de fantasia do game.\n\n[h1]As Referências:[/h1]\nEsse é um ponto que eu não tocaria porém é inevitável. Porque algumas coisas são [b]perceptíveis[/b], podem não ser propositais na intenção de uma forma direta de homenagem até porque hoje em dia existem tantos jogos de ideias diferentes que é difícil ter uma ideia genuinamente original mas essas mecânicas estão presentes no game, são parecidas com outras em outras obras por aí e como eu disse: é inevitável não lembrar.\n\nNo game temos a possibilidade de escalada, muito popular por conta do [i]Assassins Creed[/i]. Muito bacana no começo do game por ser desafiador devido aos [b]paredões rochosos[/b] presentes no game. Eu que já pratiquei escalada, e particularmente achei muito empolgante mas igualmente cansativo. Você precisa de estamina que no começo do game é pouca, então tem que buscar pontos planos nos paredões pra recuperar o \"[b]fôlego[/b]\" e continuar. \nTem a possibilidade de escalar, o que se estende as vezes a um personagem ou outro no game e é algo muito bem feito no game, lembra o [b]Shadow Of The Colossus[/b] mas igualmente bem feito em termos de [i]mecânica funcional[/i]. Assim como, [i]nesse mesmo game[/i], você caçava os bosses através do clarão da sua espada no [b]Crimson[/b], os pontos de interesse também são apontados com o clarão da espada!\n\nAs telas de carregamento lembram o [b]Animus[/b] de [i]Assassins Creed[/i], também!\n\nDescobri a pouco tempo que dentre as formas do personagem subir no cavalo, como pulando do alto da janela por exemplo como em [i]Red Dead 2[/i], quando em movimento, ele monta como o [i]Legolas[/i] em [b]O Retorno do Rei[/b] durante a ultima grande guerra da trilogia, algo que pra mim é especial de mais. Sou fã da saga desde a infância! E nessa mesma ideia [b]Tolkieniana[/b] o jogo se assemelha até pelo fato de existirem uma gama grande de raças, como anões, gigantes, goblins, dragões e orcs, mas amigáveis. Entre vários outros!\n\nQuando encontrei um [b]quadro falante[/b] como em [i]Harry Potter[/i], achei a coisa mais incrível do game, o jogo reafirmando sempre que possível que está pra me surpreender!\n\n[h1]Considerações Finais:[/h1]\nÉ incrível o quão [b]bem feito é[/b] este game. A minha compra se deu por conta de uma [b]carência em experiências complexas e duradouras[/b] em que eu pudesse me [b]aprofundar[/b] no game em si e não só em [b]propósitos distintos[/b] como a história ou conquistas. E esse jogo me supriu demais nisso! A cada vez que eu saí a cavalo pelo mundo, vi algum lugar novo pra explorar ou alguma caverna diferente com loot, o que da algum dinheiro ainda pela [b]run[/b]. Fora as [i]paisagens belíssimas e de esplendor[/i] que o game oferece durante o dia e principalmente a noite!\nPercebi uma mecânica interessantíssima que permite uma certa [i]liberdade criativa[/i] que possibilita a [i]escolha mais estética[/i] dos itens, sem depender tanto dos status altos. Isso me ganhou demais porque jogar bonito é muito mais legal rsrsr E perceber essa mecânica deixou tudo muito mais irado. Espero que [b]percebam[/b] essa mecânica :D\n\nEu sou [b]clt[/b] e quando chego em casa quero abrir o game pra ver qual surpresa ele vai me oferecer, e sempre vem algo bacana! Isso que me ganhou. É um jogo que eu recomendo demais e acho que vale cada centavo! \n\nEles vão lançar uma dlc paga em breve. Acredito que a DLC valha para o jogador tendo em vista que o próprio game já tem uma boa [b]frequência de atualização[/b] e correção de bugs. E essa expansão oferece muito do que é perceptível até [b]ingame[/b]. Como ver [i]navio ancorado no mar[/i] ou perceber a própria [b]vida marinha[/b] ali mas [b]inalcançável[/b]. A própria decoração da casa é [b]limitada[/b] assim como as interações com mobília. Então acho que a dlc é uma compra  indispensável se você assim como eu perceber esses [i]detalhes faltosos[/i].\n\n[h1]No mais, o jogo é incrível![/h1]\nAcredito demais que mereça concorrer ao [b]GOTY 2026[/b] e espero que leve premiações porque tem muito capricho envolvido aí.\n\nSe você é clt como eu e quer ter uma experiencia prazerosa com uma surpresa a cada vez que entrar pra jogar, esse jogo é pra você! Vale cada centavo e o jogo é lindo!\n\nＳｉｍ！　Ｃｏｍｐｒｅｍ　ｅｓｔｅ　ｊｏｇｏ！\n\n[quote=author] Rodrigo \"ditonha\" Alecsander Gomes [/quote]","c":1792274844,"u":1,"b":0,"r":0},{"i":"237968851","s":"76561198803619638","g":0,"n":1,"p":2853,"f":3776,"l":"russian","t":"Имба","c":1792273701,"u":1,"b":0,"r":0},{"i":"237968338","s":"76561198839769745","g":108,"n":2,"p":2511,"f":3203,"l":"english","t":"♥♥♥♥ this game\r\n","c":1792273198,"u":0,"b":1,"r":0},{"i":"237967163","s":"76561198304904261","g":0,"n":5,"p":15390,"f":16744,"l":"brazilian","t":"Já adianto que o único defeito desse jogo é a falta de um coop, o combate é ótimo, e a historia que não era o ponto forte está bem melhor agora, mas todo o resto é muito bom, comprei na pré-venda e não me arrependo, não tive nenhum tipo de problema, eu só parei de jogar porque eu não queria acabar tão rápido, e esse  é um jogo que puxa tempo , ele tem tanto conteúdo que eu ainda não vi tudo, e depois da atualização  da historia eu reiniciei e continuo empolgado, mesmo tendo ficado meses sem entrar no jogo\nEu me apaixonei por esse jogo desde o inicio, desde a  época que ele ainda seria um mmo, e quando eles mudaram de ideia pra ser um single, ai que me pegou, afinal nunca fui muito fã de jogo online apesar de jogar muito mmo, e sendo um jogador de BDO eu sabia do potencial do estúdio. esse jogo é simplesmente maravilhoso pra mim, e seria e é meu GOTY absoluto.\nEu queria muito que meu irmão pudesse ter jogado esse jogo comigo, meu irmão sempre quis jogar um jogo que na minha cabeça seria esse, mas ele infelizmente sofreu um acidente de caminhão enquanto trabalhava em junho de 2025, então eu escrevo essa analise como se tivesse contando pra ele do jogo, esse é um habito que adquiri pra lembrar a única coisa que a gente tinha em comum.\n\nObrigado Pearl Abyss por ter criado essa obra de arte que eu posso compartilhar de certa forma com meu irmão!","c":1792272146,"u":1,"b":0,"r":0},{"i":"237963477","s":"76561198080557927","g":0,"n":1,"p":23076,"f":23467,"l":"italian","t":"A questo gioco bisogna dedicargli del tempo, solo così lo si può apprezzare veramente. Grafica mozzafiato, e i continui aggiornamenti continuano a perfezionarlo.\r\nLo consiglio perchè le ore di gioco volano letteralmente.\r\n","c":1792268949,"u":1,"b":0,"r":0},{"i":"237962402","s":"76561199579884376","g":55,"n":3,"p":12349,"f":12349,"l":"italian","t":"One of my favorite games of the decade. Is massive. 9/10","c":1792268072,"u":1,"b":0,"r":0},{"i":"237962373","s":"76561197997084017","g":63,"n":1,"p":12161,"f":12258,"l":"english","t":"I started this game pre \"Enhanced\" edition and got 15hrs in before I just stopped. There was a part of me that wanted to get into the game but honestly couldn't. Fast forward 3-4 months and I got into Cyberpunk 2077 which was fantastic and played 120 hrs of that. Then I chose to come back to Crimson Desert and just give it a go and play through the story in the new 2.0 version. Oh boy am I so glad I did. \r\n\r\nFor context, at the 120hr mark on Cyberpunk I was done with all quests the game could offer and felt like I was at a good place to end my travels in Night City. I'm 200 hrs into Crimson Desert now and I still feel like a kid waking up and excited to dive back into Pywell. \r\n\r\nTo me this game is a blend of the show Reacher + Solo Leveling for characters and story mixed with elements of Civilization, Skyrim and more. Thanks Pearl Abyss for creating a masterpiece to dive into and explore. So stoked for the expansion.","c":1792268050,"u":1,"b":1,"r":0},{"i":"237962152","s":"76561197986113311","g":525,"n":32,"p":1082,"f":1082,"l":"english","t":"Overrated. The combat is actually kind of garbage. The protaganist is lifeless, the crew boring slop. A lot of fetch quests and boring ride alongs. Also, quests start like events and cancel you out of other quests and makes everything feel disjointed and messy. I was glitched into an important quest way above my \"level\", which made the game really unfun.","c":1792267865,"u":0,"b":0,"r":0},{"i":"237962144","s":"76561199528697355","g":70,"n":2,"p":5681,"f":5693,"l":"schinese","t":"量大管饱，我认为这游戏真的已经是我想象中开放世界应有的样子，剧情确实不算优秀，但是厂家真的是把自己的脑洞能做的全都做进去了，基本上永远都在想：“我靠，还能这么操作？”    期待后续的更新，把全新的运营式单机做下去","c":1792267859,"u":1,"b":0,"r":0},{"i":"237959973","s":"76561198066547797","g":0,"n":20,"p":6432,"f":6842,"l":"german","t":"best openworld rpg to date","c":1792266051,"u":1,"b":0,"r":0},{"i":"237959589","s":"76561199489066220","g":0,"n":1,"p":4671,"f":5880,"l":"english","t":"So much you can do and explore. Story is also good in my opnion.","c":1792265705,"u":1,"b":1,"r":0},{"i":"237958856","s":"76561199156678685","g":162,"n":30,"p":751,"f":1605,"l":"brazilian","t":"tenho apenas 9 horas de jogo e sinceramente, achei o jogo bom, porem ja vou avisando, se vc quer um jogo com uma historia decente e uma escrita legal nn compre, ainda estou no inicio da historia mas ja consegui perceber q a escrita desse jogo é pessima, personagens usando vocabulario tosco, conversas sem sentido e xingamentos forçados o tempo td, o jogo tenta ser adulto nessa questao de escrita mas acho desnecessario, o jogo ja é bem maduro em gameplay e gore, esse negocio de ficar xingando so ficou estranho pra mim, a gameplay do jogo é execpcional, gostei muito, em relaçao aos graficos, realmente nn me agradaram, nn por serem feios, sao lindos, mas o jogo na minha 4060, com o grafico alto e usando o dlss 4.0 fica todo serrilhado e dando bugs graficos, eu ja estou acostumado com o dlss fudendo o meu jogo mas nesse jogo aqui é pior ainda, no geral, achei o jogo uma boa experiencia, se o jogo tivesse um roteiro melhor seria sem sombra de duvidas perfeito, mas com essa escrita pra mim so fica em bom\n\nobs: vim jogar esse jogo logo dps de zerar rdr2, q mexeu bastante cmg, entt eu estranhei bastante a questao da historia, mas eu nn vou comparar pq os jogos tem propostas diferentes entt nem faria sentido","c":1792265136,"u":1,"b":0,"r":0},{"i":"237955282","s":"76561197967879292","g":355,"n":12,"p":5534,"f":6393,"l":"russian","t":"Хороший геймплей а после енхасд стало ещё баще\r\n","c":1792262244,"u":1,"b":0,"r":0},{"i":"237954940","s":"76561199003194324","g":41,"n":15,"p":180,"f":972,"l":"brazilian","t":"Baita jogo desse ano. Quando o game lançou eu ví algumas gameplays e o pessoal reclamando da \"falta\" de história. Mas sinceramente, em 3h de jogo eu fiz uma missão principal após o prólogo. O resto foi ajudando o pessoal de Hernand e matando uns bandidos. O que me impressiona, pois não sou o tipo de jogador que tenho paciência de fazer sidequest/colecionáveis, e etc. Mas a gameplay desse jogo é tão boa que até pegar madeira e minerar é legal kkkkkkkk. \n\nA variedade de animais que eu encontrei só nessa região ao entorno de Hernand é coisa de maluco, acho que nunca encontrei tanto bixo diferente em outro jogo todo igual encontrei só nesse pedaço de Hernand. Não sei como está armamento, árvore de habilidade (se tiver), poder, magia... Como disse só refinei um escudo, e estou jogando com tudo base do prólogo, menos o capacete que a gente encontra no início do jogo.\n\nMas eu quis deixar minha primeira impressão para argumentar o que ouvi dizer outros falarem de que o jogo demorar para engrenar, e que eu teria que jogar 50h de jogo para achar ele bom. Meu único arrependimento é não ter um pc bom o suficiente para rodar com gráficos mais altos, e uma estabilidade e \n de frame maior. Pra quem estiver interessado, estou usando uma GTX 1660 padrão com gráficos no médio/baixo, Intel XeSS no modo qualidade e com FrameGen de 2 quadros para manter 60fps.\n\nO único ponto negativo para mencionar nessas humildes 3h de jogo são os menus/interface. São muito complexos e nada intuitivos, esse layout alá TW3 de misturar LT/RT com LB/RB me tira do sério, mas é acostumar.","c":1792261981,"u":1,"b":0,"r":0},{"i":"237954710","s":"76561198026234148","g":0,"n":1,"p":9169,"f":9672,"l":"german","t":"Best game since a long long time!","c":1792261783,"u":1,"b":0,"r":0},{"i":"237953909","s":"76561198256173743","g":0,"n":8,"p":3839,"f":4059,"l":"english","t":"It's so unexpectedly bad. I thought that after such a long time, you would have fixed the disgusting parts or fixed the bugs. The task of finding the chanterelle mushrooms would make you pass out and be forced to do the village task, right? After completing the village task, there would be nothing in the cave and no chanterelles either. Do you know this? If it was because you were knocked out and the monsters were killed, then your design is really interesting. I encountered this a few months ago when we first came out. I never expected that your stupid brain circuit still hasn't changed now. Trash.","c":1792261122,"u":0,"b":1,"r":0},{"i":"237953672","s":"76561198328757321","g":82,"n":18,"p":3176,"f":4332,"l":"english","t":"I wish I had more time to play","c":1792260929,"u":1,"b":1,"r":0},{"i":"237952824","s":"76561198116548424","g":52,"n":15,"p":1584,"f":1592,"l":"english","t":"Pretty fun, pretty","c":1792260224,"u":1,"b":1,"r":0},{"i":"237952390","s":"76561199152195987","g":0,"n":1,"p":4553,"f":4928,"l":"english","t":"took me a while to get into but once i did its pretty gas","c":1792259884,"u":1,"b":1,"r":0},{"i":"237951527","s":"76561199806480326","g":0,"n":2,"p":6544,"f":6544,"l":"french","t":"Tellement bien !","c":1792259221,"u":1,"b":0,"r":0},{"i":"237949935","s":"76561199643471051","g":61,"n":4,"p":7581,"f":7793,"l":"schinese","t":"这游戏像包着狗屎的糖，要先吃20小时的屎才能觉得这个游戏好玩，阿比斯解密神鬼二相性新手来过要以小时起步，我的购买建议是喜欢快节奏别买。","c":1792257961,"u":1,"b":0,"r":0},{"i":"237949375","s":"76561198847130168","g":0,"n":11,"p":17049,"f":17085,"l":"koreana","t":"만능 지정타","c":1792257534,"u":1,"b":0,"r":0},{"i":"237948661","s":"76561198052887369","g":199,"n":1,"p":5690,"f":5690,"l":"english","t":"I dont think i am ever gonna be able to fully finish this game.","c":1792256972,"u":1,"b":1,"r":0},{"i":"237948521","s":"76561199867321397","g":43,"n":2,"p":3459,"f":3864,"l":"schinese","t":"好玩，但无意义的小支线太多了","c":1792256858,"u":1,"b":0,"r":0},{"i":"237946708","s":"76561198972363356","g":0,"n":3,"p":2088,"f":2088,"l":"russian","t":"Полная ерунда, играл, играл, так и не раскрылось не чего.\nОчень жалею, что за это отдал 4200.\nХудшая моя покупка,","c":1792255482,"u":0,"b":0,"r":0},{"i":"237945039","s":"76561198092456096","g":0,"n":3,"p":4219,"f":4547,"l":"italian","t":"avventura molto bella molto diversificata e divertente.... poi si puo cavalcare un drago!!!","c":1792254172,"u":1,"b":0,"r":0},{"i":"237942791","s":"76561199005983439","g":0,"n":3,"p":933,"f":1114,"l":"english","t":"Greatest game I ever played","c":1792252475,"u":1,"b":0,"r":0},{"i":"237942626","s":"76561199378116084","g":273,"n":3,"p":464,"f":796,"l":"schinese","t":"好玩","c":1792252338,"u":1,"b":0,"r":0},{"i":"237942238","s":"76561198653951314","g":0,"n":1,"p":868,"f":868,"l":"schinese","t":"这游戏真的是垃圾中的战斗机，游戏机制完全是缝合就不说了，你有自己的东西也行，搞得游戏操作超级复杂（为了复杂而复杂）好像复杂了就很高级一样，韩国人的脑回路果然不一般，游戏场景里竟然还有离谱的BUG，一个蜗牛飘在空中，旁边的树上才能抓，但树上什么都没有，任务描述更是模糊不清，寻人找物的任务到任务地点之后什么都没有，我真是服了，我一开始还觉得不错，玩了十几个小时直接玩不下去了，钓鱼机制更是神奇，纯模仿的大镖客，但是按操作提示一直无法完成钓鱼操作，我真是服了，你仿就好好仿，非整的好像自己自创的一样，最后整的不伦不类，谁玩谁脑袋嗡嗡的，你就玩吧，一玩一个脑袋嗡嗡的。","c":1792252029,"u":0,"b":0,"r":0},{"i":"237942190","s":"76561198146428778","g":451,"n":28,"p":209,"f":209,"l":"schinese","t":"sb D加密","c":1792251997,"u":0,"b":0,"r":0},{"i":"237942117","s":"76561198169318239","g":0,"n":4,"p":9439,"f":9554,"l":"koreana","t":"조작하는거만 익숙해지면 재밋고 손맛이 있네요","c":1792251936,"u":1,"b":1,"r":0},{"i":"237941656","s":"76561198924936048","g":0,"n":3,"p":4242,"f":4242,"l":"russian","t":"когда уже починят эти ебучие вылеты игра итак мыльная на максималках со скучными квестами так еще после обновления игра вылетает ?!","c":1792251584,"u":0,"b":0,"r":0},{"i":"237940974","s":"76561198777538388","g":0,"n":1,"p":227,"f":798,"l":"english","t":"The game we have all been waiting for. Unlimited exploration and endless discovery. A world that feels real and massive enough to get lost in, over and over. Ive enjoyed 400hrs on console and now continuing here on Steam. Cant wait for what Pearl Abyss has planned this game.","c":1792251084,"u":1,"b":1,"r":0},{"i":"237940888","s":"76561198330334609","g":0,"n":1,"p":6838,"f":7801,"l":"brazilian","t":"Ótimo combate. Boa história. Mapa é maravilhoso. Bem otimizado","c":1792251019,"u":1,"b":0,"r":0},{"i":"237940486","s":"76561198164084821","g":0,"n":15,"p":11912,"f":13623,"l":"english","t":"Best game I have played in 20+ years.","c":1792250722,"u":1,"b":1,"r":0},{"i":"237940171","s":"76561198817438234","g":85,"n":23,"p":12527,"f":12527,"l":"english","t":"We better be able to marry the witches in the DLC","c":1792250461,"u":1,"b":1,"r":0},{"i":"237939667","s":"76561198084948591","g":12030,"n":327,"p":8292,"f":8292,"l":"tchinese","t":"玩法上很割裂  像是4,5隻遊戲強行塞在一隻遊戲內  個人感覺像生化危機9的問題但比他更嚴重\n\n生活養成占了前10小時  10小時後開始有戰鬥感覺像類魂BOSS戰+UBI刺客教條神話3部曲式的據點戰  同時間夾雜大量超大量迷題  迷題沒有任何清晰提示 不知道要做甚麼 也不知道迷題範圍有多大 而導致經常看漏迷題可互動目標  \n再到中後期就變成組流派一套爆下去管你是神還是鬼  沒秒對方就是被對方秒\n\n因為以上內容全部都不能跳過  整體體感玩下來很吃電波  非雜食玩家很容易被個別遊戲元素勸退  就連我也差點破防  解迷迷題個人建議在網絡搜攻略別浪費時間了\n\n其次是遊戲內容做太大了  如果是短時間內不停遊玩會有噁心的作業感","c":1792250081,"u":0,"b":0,"r":0},{"i":"237939270","s":"76561198324200807","g":43,"n":5,"p":2824,"f":3866,"l":"polish","t":"wszystko","c":1792249797,"u":1,"b":1,"r":0},{"i":"237937999","s":"76561198007076813","g":0,"n":13,"p":16613,"f":18284,"l":"french","t":"bon jeu","c":1792248879,"u":1,"b":0,"r":0},{"i":"237937605","s":"76561197981822996","g":0,"n":6,"p":1605,"f":1687,"l":"german","t":"Faszinierendes Spiel, welches immer mehr Spaß macht, je weiter man kommt und neue Sachen frei spielt.\r\nSogar an die Steuerung gewöhne ich mich langsam.\r\nRiesen Umfang und viel zu Erkunden. Werde noch viele Stunden darin versenken.","c":1792248540,"u":1,"b":1,"r":0},{"i":"237936852","s":"76561199524363055","g":50,"n":1,"p":677,"f":1560,"l":"schinese","t":"打开背包技能会出现闪退","c":1792247987,"u":0,"b":0,"r":0},{"i":"237935010","s":"76561198020743112","g":0,"n":1,"p":3180,"f":5870,"l":"koreana","t":"게임은 재밌는데 어비스 퍼즐 때문에 부정적 줌 \n\n퍼즐 맞추기랑 인내숲이랑 둘중에 하나만 처해야지","c":1792246486,"u":0,"b":0,"r":0},{"i":"237934527","s":"76561198071968547","g":0,"n":2,"p":455,"f":455,"l":"french","t":"IMPOSSIBLE A JOUER!!!!!!! CRASH ET ENCORE DES CRASH et impossible d'être rembourser","c":1792246093,"u":0,"b":0,"r":0},{"i":"237933997","s":"76561198312680734","g":260,"n":14,"p":2009,"f":2892,"l":"thai","t":"มีใครค้างอยู่หน้าพัซเซิลไหมเอ่ยยยย กดไรก็ไม่ได้ หันจอได้อย่างเดียว ออกเข้าใหม่ก็ยังเป็นเหมือนเดิม\n\nส่วนตัวชอบเกมนี้ เพราะไม่ใช่คนชอบอ่านเควสอยู่แล้ว ชอบระบบแคมป์ ส่งคนงานฟีลๆแบบ BDO\nทุกอย่างโอเคหมด จนกะทั่งเจอเหตุการณ์โง่ๆอย่างทำได้แค่หันหน้าจอไปมา UI ก็เปิดไม่ได้","c":1792245675,"u":0,"b":0,"r":0},{"i":"237933968","s":"76561199033312442","g":0,"n":2,"p":7648,"f":8040,"l":"koreana","t":"솔직히 빡치고 불편하고 짜증나는 구간이나 시스템이 있지만 끊을수가 없는 구린맛이 있음 ㅇㅇ 오픈월드를 좋아하면 솔직히 싫어할만한 요소는 없다고 본다 몇가지 불편점만 빼면 매우 긍정적 수준의 게임이고 그 몇가지만 개선하면 압긍도 괜찮아 보인다","c":1792245646,"u":1,"b":1,"r":0},{"i":"237933824","s":"76561199155873977","g":201,"n":8,"p":400,"f":400,"l":"english","t":"READ THIS IF YOU HAVE GRAPHIC PROBLEMS!!!!! turn of upscale  blurry down and ray reconstruct, anyways was blown away by this game there is so much little detail like leaning on the wall and sitting down but what's crazy is if you have the graphics all the way up it looks like a literally action figure set like if you had little clay motion right in front of you the graphics are literally the realist i have ever seen i have spent literally hours just walking around staring at people and brick roads for hours. i cant believe how really it looks just beware it takes a minute to get the trees to act right make sure to put the density all the way down its crazy there details another parts of the game you'll spend hours just exploring stuff its like fable, black desert (but more involved and not so auto play). and Skyrim and maybe Zelda in one defiantly worth it","c":1792245527,"u":1,"b":1,"r":0},{"i":"237931376","s":"76561199078207270","g":41,"n":1,"p":364,"f":1949,"l":"schinese","t":"优化简直就是一坨","c":1792243530,"u":0,"b":0,"r":0},{"i":"237931047","s":"76561198021524680","g":0,"n":5,"p":6586,"f":7891,"l":"english","t":"I would recommend this as the only game to play forever.\r\nI paid for the Enhanced version and started playing 109 hours ago. Its insane.","c":1792243239,"u":1,"b":1,"r":0},{"i":"237931016","s":"76561198022532053","g":0,"n":2,"p":20492,"f":21303,"l":"english","t":"beautiful game","c":1792243213,"u":1,"b":1,"r":0},{"i":"237929065","s":"76561198362975843","g":0,"n":1,"p":12180,"f":12817,"l":"german","t":"Einfach schön, könnte es den ganzen Tag spielen, klare Kaufempfehlung.\r\nMan vergisst einfach die Zeit und schwupps, wieder mal 12 Stunden im Game gewesen.\r\n","c":1792241461,"u":1,"b":1,"r":0},{"i":"237928998","s":"76561199145911223","g":0,"n":6,"p":932,"f":1067,"l":"koreana","t":"진짜 그래픽,넓은 공간,탐험 등의 요소가 진짜 좋고 최적화도 잘 되어있고 스토리 개선해서 진짜 좋아졌는데 ㅈ같은 조작감 떄문에 최고라고는 못하겠다.이게 조작감이 개선된거라고 하던데 출시부터 하던 유저들 진짜 존경스럽다","c":1792241397,"u":1,"b":1,"r":0},{"i":"237928475","s":"76561198076659512","g":0,"n":1,"p":14607,"f":16549,"l":"german","t":"Wie kann man als Entwickler dieses Games, dass Pferdefang spiel in die hauptquest legen wenn sie beim 10. mal nicht klappt, außerdem ist das eine Quest die nicht wichtig ist oder die Rätsel sind teilweise so aufgebaut, wer weiß den die Abfolge der Primzahlen und von den Backs will ich mich nicht weiter aufregen.\nVerändert beim nächsten Update die Pferdemission und fickst die Backs, ich habe keine 1 Minute Zeit und Lust solche vermeidbaren Missionen, die nur Füller sind, hätte man in eine Nebenmission legen können.\n\nMit freundlichen Grüssen\n\nBernd\n\nWie kann man ein Spiel herstellen und eine wertlose Quest die nicht wichtig ist in eine Hauptquest packen.\nIch habe kein Problem, wenn eine Quest nicht leicht ist, aber das Pferd zu beruhigen ist unmöglich und ich habe nicht Geld bezahlt um an einer Hauptquest zu scheitern. Also fickst dieses Problem ihr dreckiger Abfall und wenn ihr Arschgesichter euch der Tragweite bewusst seit, das alles was der Kunde bezahlt zum teil dann sein Eigentum ist und etwas gekauft hat, was er nutzen will und nichts zum hinstellen.\nDieser Umstand das diese Lückenfühler Quest in einer Hauptquest verbaut ist, erfühlt den Tatbestand, des teilweise Betruges!!!!!!!!","c":1792240907,"u":0,"b":1,"r":0},{"i":"237928174","s":"76561198080092463","g":0,"n":13,"p":567,"f":567,"l":"english","t":"Relies on DLSS to run decently, yet introduces visual glitching when paired with DLSS that requires more AI implementation to fix (Ray Reconstruction), which then tanks performance further, so I don't know what the solution is. Beyond this, the gameplay doesn't hold up enough to justify the time spent trying to sort it out.\n\nIt's a game for the crowd that thinks special effects make a good movie.","c":1792240616,"u":0,"b":1,"r":0},{"i":"237928050","s":"76561198066566952","g":268,"n":3,"p":1883,"f":2675,"l":"english","t":"Easily GOTY","c":1792240524,"u":1,"b":1,"r":0},{"i":"237927737","s":"76561197982439629","g":0,"n":8,"p":1544,"f":3289,"l":"russian","t":"Игра постоянно зависает, а потом вылетает. Оказалось, что разработчики не сумели подружить игру с новыми драйверами от Nvidea - на последних и предыдущих не работает, а вот на 600.88 - работает. Остальные игры не вылетают, а эта - постоянно, причём на самых свежих драйверах вылетает ещё чаще.\nСама игра довольно интересная - некая смесь Ведьмака 3 и последних The Legend of Zelda.","c":1792240241,"u":0,"b":0,"r":0},{"i":"237927102","s":"76561198097356956","g":0,"n":5,"p":9172,"f":9356,"l":"tchinese","t":"遊戲鼓勵玩家收集物品與合成，但給的背包與倉庫空間非常吝嗇\n即便擴充到最大背包空間還是明顯不足，還要玩家解任務擴展背包空間\n我還以為我在玩10幾年前的網遊，這些系統都已經過時了\n何況這還是單機遊戲\n許多任務解謎像是要玩家去通靈一樣\n完全沒有任何互動提示，遊戲引導也是明顯差勁\n把那些罐頭任務刪掉拿來做遊戲引導不好嗎\n縱使有許多缺點，但這遊戲還是好玩的\n遊戲世界做的很迷人，會讓人不停的想一直冒險下去\n","c":1792239629,"u":1,"b":1,"r":0},{"i":"237926844","s":"76561199383289701","g":0,"n":1,"p":10800,"f":11422,"l":"english","t":"This is one of the best games that has been made in years.","c":1792239379,"u":1,"b":1,"r":0},{"i":"237926309","s":"76561198070442358","g":0,"n":1,"p":810,"f":1129,"l":"english","t":"I've also played 70 hours of ps5, with cross play.  A deeply immersive world, just play past he first 2 chapters, then it really opens up.","c":1792238854,"u":1,"b":0,"r":0},{"i":"237926133","s":"76561199135097556","g":97,"n":18,"p":2585,"f":2658,"l":"koreana","t":"좋소.조작감은 구리오.","c":1792238697,"u":1,"b":1,"r":0},{"i":"237925441","s":"76561198073376056","g":272,"n":57,"p":1993,"f":2094,"l":"english","t":"spending 50% of playtime to solve puzzles by asking google instead of exploring the world","c":1792237950,"u":0,"b":1,"r":0},{"i":"237924522","s":"76561198040330200","g":2342,"n":64,"p":6010,"f":6098,"l":"spanish","t":"A nivel historia siendo que las misiones principales es bastante corta e incluso apresurada en algunos momentos pero alargando algunos otros innecesariamente. Deja muchas cosas inconclusas y sin explicar pero creo que es para abrir futuras entregas y DLCs.\r\nLuego en misiones secundarias y contenido complementario lo encuentro bastante bien, considero que exploré bastante y aun me quedan muchas cosas que hacer. \r\n\r\nLas mecanicas son entretenidas y aunque los personajes son divertidos de jugar, terminé haciendo todo (salvo lo que me obligaron) con el protagonista. Tener que armar la build para los 3 personajes me resultaba pesado. Aunque supongo que una vez terminado intentaré darles otra oportunidad y mas cariño.\r\n\r\nA nivel grafico, todo en ultra, me dejó bastante que desear pero no estaba mal. Contento que corra bien en la Steam Machine :), en la SteamDeck la probé hace un tiempo e iba 'medianamente bien' pero supongo que con el FSR4 irá mejor.\r\n\r\nMusicalmente está bien, sin mas, algunos sonidos se hacian un poco pesaditos. Y el mundo en general me gustó, coge cosas de todos lados y termina siendo un popurrí interesante. \r\n\r\nLe doy un 7/10, no puedo evitar compararlo constantemente con Witcher 3 que salió hace mas de 10 años y creo que eso no es positivo (aunque es mas una critica a la industria)","c":1792237003,"u":1,"b":0,"r":0},{"i":"237923769","s":"76561198157303839","g":19,"n":1,"p":4567,"f":5042,"l":"spanish","t":"la amplia variedad de cosas que puedo hace y todav'ia no he salido del principo","c":1792236198,"u":1,"b":0,"r":0},{"i":"237923548","s":"76561199124793394","g":8,"n":3,"p":1660,"f":2452,"l":"english","t":"this game is a amazing","c":1792235963,"u":1,"b":0,"r":0},{"i":"237922763","s":"76561198239429682","g":0,"n":1,"p":1791,"f":2519,"l":"latam","t":"Un juego muy divisivo. O hace click contigo o no lo hace. Si quieres una historia bien planteada y personajes memorables con sidequests a la altura de algo como Witcher 3 o Baladur's Gate, aléjate lo más que puedas. Si lo quieres es un sandbox y un mapa en el que te puedas perder como en BotW pero con mejor combate, entonces pocos juegos hay que cubran estos parámetros.\n\nEso si, este Crimson Desert EXIJE tu tiempo y si quieres llegar al contenido jugoso, te va a hacer trabajar por él. Con decir que para desbloquear algo tan burdo y básico como cambiar de peinado, tienes que hacer una cadena de misiones que por si sola es más larga que muchos otros juegos LOL.","c":1792235129,"u":1,"b":0,"r":0},{"i":"237920682","s":"76561198444922949","g":419,"n":32,"p":126,"f":126,"l":"english","t":"Game runs perfect, but theres like a 80% chance that if I open my inv, the game crashes.","c":1792232785,"u":0,"b":1,"r":0},{"i":"237919971","s":"76561198296207352","g":32,"n":9,"p":17856,"f":18439,"l":"schinese","t":"好玩\n我认为这是继上古卷轴5之后奇幻游戏的又一个顶峰之作\n虽然增强版已经修复了不少地方，但仍然有不少缺点：雅恩、各种骑马和马车任务、后期缺乏玩法（小怪两下死，boss重复打也没意思，一身神装没怪打，只能修修阿比斯到处看看风景了）\n希望dlc能给人更好的体验","c":1792232123,"u":1,"b":0,"r":0},{"i":"237919942","s":"76561198930878944","g":50,"n":1,"p":26164,"f":26164,"l":"schinese","t":"浮空岛阿比斯解密可以删除、马车跑商、每周刷新的王室供货、其实整个贸易系统以及相配套的贸易商品都可以彻彻底底地删掉。快速跳过时间冷却时间过长，钓鱼应针对特定鱼增设鱼饵系统，npc受惊期间无法交互浪费时间。通缉类任务、居民日常小任务也可以删掉。另外，建议你们团队找点有文化的员工来写剧情，思考对话逻辑和深度。除了上边这些，这款游戏还行。","c":1792232091,"u":1,"b":0,"r":0},{"i":"237919484","s":"76561199547147046","g":39,"n":4,"p":12453,"f":12555,"l":"schinese","t":"好玩","c":1792231610,"u":1,"b":0,"r":0},{"i":"237918515","s":"76561199243964251","g":158,"n":153,"p":7768,"f":8001,"l":"english","t":"This is probably going to be my longest review, and so far, my most meaningful as well. This won't mean much to anyone else, but that's fine. I just rolled credits and want to write down my thoughts about my experience. \n\nWhen this game was first announced as an MMO I had zero care about it. Black Desert looked awesome but I'm not a multiplayer person. It wasn't until the game was announced as a single player game that I actually started looking deeper into it! I saw the combat and just thought \"yup, this game is for me\". \n\nBack in 2024 I started playing soulslikes, absolutely loved them, I play nine throughout the end of 2024 and into 2025, but towards mid 2025 I started to burn out on them. I burn out on a lot of games, it's something that I can't stand. Gaming is fun, but if I put too much time into it, it won't hit the same so I take breaks.\n\nWhen I started watching more of Kliff's journey in the trailers I started getting more excited for it, and I wanted to hype myself up by playing more action games that aren't just soulslikes. So I got into the Batman Arkham games, Atlas Fallen, Forspoken, Hogwarts Legacy, and more to satisfy my action itch. \n\nFinally Crimson Desert drew near, but unfortunately the unexpected happened. My Mom fell on the cement and shattered her shoulder around the beginning of March. I took the month off work and helped take care of her. Most of my enthusiasm for the game died after needing to worry about my Mom's surgery and helping her get her arm back, I still played the game on launch since my Mom would go to bed very early around 6pm so I still had time to myself, but as word started to get out that the story was long, I started to get demoralized! \n\nI bounced off the game pretty bad, the world was massive and beautiful, but I had too much happening irl to feel like I wanted to spend time with a game so huge! I even made it to Crowcaller but the bosses felt like such a hurdle I didn't want to spend more time having to constantly go back and try to level my gear up on top of having such a long story! So I stopped playing after 29 hours!\n\nFast forward to September, The Blood of Dawnwalker came out I bought the game, and in 18 hours got two endings and loved it, while jumping on some rocks and constantly sliding down I thought to myself \"in Crimson Desert you could climb anything\" and decided to give it another chance. So I started a new game.\n\nSomething clicked, I tamed a cat and named him \"Vincent\" after my cat at home, finding the abyss nexus' got easier, I started to understand the combat more, and the controls weren't too bad when you finally got the hang of them! It hooked me. I started coming home from work at 10pm every night and playing until 4am, I journeyed all over, I tamed a bunch of animals including a Porcupine, Desert Fox, and Partridge, I got a Wyvern long before Blackstar, I did tons of faction quests and fought so many side bosses.\n\nAfter rolling credits I just broke down, like I said before, I burn out bad in a lot of games, but here something grabbed me, I DO love the story even with some of it's nonsensical moments. The set pieces are amazing, I love the characters, and building up the Greymane camp was such a wonderful experience! \n\nAll of this to say: the game isn't perfect, but my adventure that lead me here I wouldn't trade for anything. Thank you Pywell, and thank you Greymanes for helping me through something that's always been tough for me.","c":1792230527,"u":1,"b":1,"r":0},{"i":"237918125","s":"76561198037944633","g":276,"n":28,"p":6349,"f":6349,"l":"english","t":"What an absolute Stunning game. in Comparison to many other devs nowadays, with this one you can feel the dedication and passion beeing put into the game, each single update and now even the new dlc. Absolutely loved the open world, so many things to explore and be immersed into. The graphics are stunning and to my surprise, i noticed barely any frame drops during gameplay. only when my screen was very cluttered with many enemies and special effects like fire, smoke etc is when i experienced occasional slight framedrops. for a 2026 game this is absolutely amazing.\n\ni realy suggest anyone thats looking to be immersed into a medieval/dark fantasy story to get this game and give it a chance","c":1792230081,"u":1,"b":1,"r":0},{"i":"237916489","s":"76561198075378503","g":83,"n":8,"p":182,"f":182,"l":"french","t":"","c":1792228249,"u":0,"b":0,"r":0},{"i":"237915777","s":"76561198054531418","g":47,"n":18,"p":389,"f":796,"l":"italian","t":"S T U P E N D O","c":1792227406,"u":1,"b":0,"r":0},{"i":"237915507","s":"76561198814072597","g":79,"n":3,"p":607,"f":1182,"l":"indonesian","t":"lancar dan banyak konten","c":1792227061,"u":1,"b":1,"r":0},{"i":"237914291","s":"76561199250702798","g":22,"n":2,"p":4790,"f":5245,"l":"french","t":"Apres plus de 80heures de jeux je n'ai découvert qu'une moitié de la carte ^^' et peut être la moitié des mécanique du jeux il est vraiment incroyable.\nun peut dommage pour la VF les changement de voix chelou de temps en temps mais aucun impacte sur le gameplay.","c":1792225516,"u":1,"b":0,"r":0},{"i":"237914163","s":"76561198040609402","g":166,"n":2,"p":9289,"f":9665,"l":"german","t":"zu viel spiel und zu wenig zeit das beschreibt das game ganz gut.","c":1792225389,"u":1,"b":0,"r":0},{"i":"237911708","s":"76561198196032221","g":0,"n":1,"p":6975,"f":6975,"l":"english","t":"Honestly, what they have done is amazing. The game runs great, the map is massive, the areas are obviously different, and there is so much to explore. \n\nThe camera is god awful... when riding a horse the camera doesn't fallow you like every other game. so you have to constantly turn the camera when you take a turn. Then when you are close to a wall, the camera does what ever it wants. maybe you can see maybe you can't. It gets annoying when doing puzzles in tight spaces. \n\nThe game being and RPG is almost a lie. You do not get very many skills to do much of anything but slash at enemies. The stealth mechanics are terrible. I prefer to play stealth with a bow in all RPG games but this game its useless. even the missions requiring stealth you just go through a window and then no one is around to see anyway. Or the mission to go behind enemies lines I thought maybe this is it, maybe stealth will be useful. Nope.... Its just underwhelming at best. \n\nsmall grips: they packed so many mechanics into the game it gets very annoying to try and do even the smallest thing. try and pick up a note and you might jump or talk to someone. Try and jump and you might grab a random item or talk to someone. There are so many mechanics tied to the same buttons it gets a little aggravating. \n\nThe cutscenes for the most minor and repetitive things get annoying. Every time you go through an abyss get, small cutscene, then right after you turn the pillar, cutscene... after the tenth time, I get the platforms show up. \n\nThe climbing is great! then it randomly isn't. Your character may or may not grab on randomly. I thought maybe its the wall but no, after you jump again he grabs on. so the climbing mechanic is iffy sometimes. pretty minor though. \n\nBigger issues: \n\nCharacters are underwhelming. They have some character but mostly they are devoid of any real substance and feeling. Might be the dialogue or the tone I'm not sure. I found myself just zoning out after so many cutscenes due to the lack of emotion the characters bring to the table. \n\nThe Story is ok. I grant them props for making changes. However, its not the story itself that's lacking its how its played out. You can have the perfect script for a movie but the director can make it lackluster. The story feels almost hallow and maybe that's due to the characters or dialogue or the combination. \n\nRegardless of all that I still think the game offers a lot to explore and do and that makes it a thumbs up. I just wish they would change a few things to make it an amazing game. \n\n","c":1792222328,"u":1,"b":1,"r":0},{"i":"237911573","s":"76561198012908221","g":0,"n":14,"p":10297,"f":11078,"l":"tchinese","t":"沒有主線就是神作了","c":1792222163,"u":1,"b":1,"r":0},{"i":"237911254","s":"76561198204540260","g":128,"n":11,"p":596,"f":596,"l":"english","t":"7 months since launch and game still has the same terrible LOD and far texture issues, the game that brags about having hundreds of beautiful views to gaze at, cant even load said views...I've done every fix possible online, even downloaded LOD and texture mods for the specific fix, it has changed nothing, this is the reason I stopped playing when the game first came out, nice to see 7 months later nothing has changed....Id request a refund if i could","c":1792221709,"u":0,"b":1,"r":0},{"i":"237909577","s":"76561199054706724","g":94,"n":9,"p":234,"f":276,"l":"schinese","t":"无敌","c":1792219525,"u":1,"b":0,"r":0},{"i":"237908615","s":"76561198112876990","g":24,"n":4,"p":2037,"f":2226,"l":"english","t":"after enhance update game keeps crashing\n\nEDIT\nworks fine now on latest driver i just enable HAG \nwindows settings>system>graphics settings>turn on Hardware-accelerated GPU scheduling\n","c":1792218193,"u":0,"b":0,"r":0},{"i":"237908038","s":"76561198645668788","g":0,"n":1,"p":5654,"f":6420,"l":"spanish","t":"Es un juego muy entretenido, con sus complejidades pero muy bueno, seguro que es el mejor mapa mundo abierto de todos","c":1792217372,"u":1,"b":0,"r":0},{"i":"237904171","s":"76561199625619297","g":46,"n":14,"p":540,"f":614,"l":"english","t":"For how crazy good the graphics are it actually runs surprisingly well. I found myself going off and doing random events and side quests more than the main story. I have never seen another game with actually fun side quests like these before. The combat and movement also is very versatile and smooth.","c":1792212261,"u":1,"b":1,"r":0},{"i":"237903985","s":"76561198446450425","g":0,"n":5,"p":17537,"f":19238,"l":"english","t":"What's not to like about this game?  A really well built open world.  Secrets and puzzles to solve all throughout just because you decided to go left instead of right.  Really fun combat.  And the optimization is pretty impressive.  This damn thing will be setting the gold standard on how to launch and support games in the future.","c":1792212027,"u":1,"b":1,"r":0},{"i":"237903201","s":"76561199585880297","g":0,"n":1,"p":4218,"f":4939,"l":"english","t":"Great Game","c":1792210954,"u":1,"b":1,"r":0},{"i":"237902691","s":"76561198195530435","g":16,"n":4,"p":14942,"f":14942,"l":"brazilian","t":"Gostei muito do jogo! Dá para fazer muita coisa, a história é boa e tem bastante conteúdo para explorar. Porém, achei desnecessário fazer várias missões secundárias aparecerem aleatoriamente. Essa parte me pareceu mal planejada: por sorte, não impede a progressão, mas quem gosta de completar tudo acaba gastando várias horas extras revisitando os locais e contando com a sorte para ativar uma missão.\r\n\r\nNo geral, o jogo rodou muito bem no meu PC, mas fechou sozinho algumas vezes, sem aviso, o que atrapalhou um pouco a experiência.\r\n\r\nEstou publicando esta review com “apenas” 250 horas de jogo e pretendo completar tudo, incluindo a DLC. Pelo tanto de coisa que ainda falta encontrar e fazer, acredito que vou passar mais umas 100 horas por aqui tranquilamente!","c":1792210291,"u":1,"b":0,"r":0},{"i":"237902070","s":"76561198084126497","g":0,"n":4,"p":3197,"f":3992,"l":"english","t":"Crimson Desert is a generational game. This is the kind of game that comes out and truly feels like it's leveraging new horsepower in consoles and on PC.\n\nOne of the most beautiful looking and sounding games I've ever play.\nThe story is okay for the moment. Nothing momentous, but compelling due to the fun characters and the world.\nThe combat is excellent. The level of experimentation is you have available is quite insane. The next best games don't have half as much.\nCrimson Desert will be talked about for a long time, and it's sad that a slightly shaky launch (which was addressed almost immediately) has turned some off.\nThis is easily a GotY contender.\n\nBreath of the Wild meets Assassin's Creed meets Red Dead.\nThe interactivity is frankly unmatched.\n\nIf you are looking for a world to immerse yourself in, that will give you the same joy as Skyrim did, or Breath of the Wild, then this is it. I'm 50 hours in and haven't left the starting area and I'm not someone that gets bogged down by side content, all of which is also good.\n\nI currently have an orange tabby cat named Cheedo that rides on my shoulder and then collects loot for me when I'm done fighting.\n\nI could keep going on and on. None of this is hyperbole. This is an absolutely bonkers game and other AAA devs should take notice. This is what action RPGs should be like going forward, bare minimum.\n","c":1792209571,"u":1,"b":1,"r":0},{"i":"237901307","s":"76561198324979831","g":26,"n":5,"p":4042,"f":5405,"l":"schinese","t":"非常好玩","c":1792208520,"u":1,"b":0,"r":0},{"i":"237898050","s":"76561198395987354","g":0,"n":22,"p":838,"f":2579,"l":"english","t":"We are paying nearly $100 for a game that requires us to be our own tech support. Why at this point in time with the tech available, for this much $ do I have to look for a mod to fix bugs and graphic issues? Gaming has taken an unreal nosedive.","c":1792204439,"u":0,"b":1,"r":0},{"i":"237896269","s":"76561199441633281","g":0,"n":2,"p":19335,"f":21167,"l":"english","t":"322 hours of gameplay im still 50/50 about it. It's definitely love /hate , graphics are spot on, the world size and map spot on. fighting mechanics are ok, all armor and weapons are equal it only matters what you so
