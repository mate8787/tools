ll polished cliche, which I respect; but it's not quite the flavor/experience i am after. \n\nA lot of effort and care were put into this game, undeniably. However, overall atmosphere and story, to me feel juvenile, predictable, and uninspiring, it's just there to fill a hole, and the main point here is for you to explore the world, and dominate it's inhabitants, as this demi-god-person; if that's what you prefer - you'll love this.  \n\nCombat is extremely flat, a lot of very pretty animations and effects though. \n\nThey have a lot of mechanics in this game, but the whole thing feels quite crowded rather than useful or truly needed.","c":1791462042,"u":0,"b":1,"r":0},{"i":"237199393","s":"76561197985837703","g":0,"n":6,"p":7058,"f":10834,"l":"koreana","t":"많이 개선되었다고는 해도 군데군데 조작감 관련한 문제는 여전히 있음. 창문을 통해 들어가려할때 스틱을 툭 위로 올려도 바로 지붕으로 넘어가버린다던가 하는 것과 밑에 물이 있는 지형에서 점프를 하면 시점을 조금만 건드려도 물쪽으로 다이빙을 해버린다던가 하는 것이 제법 짜증났음. 거기에 특정 퀘스트 중 유저의 조작 능력에 따라 쉬워지거나 어려워지는 구간이 있다는 것 정도. 퀘스트는 개선 되기 전 버전을 안해봐서 크게 이상하거나 어색한 부분은 느끼지 못했음. 다만 내가 경험한 바로 최악중의 최악은 회색갈기 세력 퀘의 대부분을 차지하는 민폐 새끼의 존재임. 다른 인물로 대체를 했다던가 성격을 좀 정상적으로 만들어서 넣어놨더라면 플레이 내내 이렇게까지 스트레스 받지는 않았을 거임. 온갖 사고는 다 치고 다니면서 주인공한테 수습을 시키고 도망가는 게 한 두 번이 아님에도 주인공 성격이 로봇같아서 불평불만이 아예 없음. 서사적 측면에서 보면 제일 큰 문제임. 아무튼 이 새끼와 함께 퀘스트를 할 때의 체감 피로도는 레데리2의 마이카 벨을 뛰어 넘는 수준이었음. 더빙으로 하면 성우가 이 연기를 잘 해서인지 엿 같은 기분이 두 배가 됨. 근데 앞의 단점들도 게임 전체로 놓고보면 사소하다 싶을 정도로 할게 많고 재미있음. 그게 이 게임의 매력임. 근데 스킬을 많이 찍으면 강해진다는 개념보다는 더 편해진다는 개념에 가까워진다는 것과 아이템별 성능 차이가 크지 않다는 것은 성장요소를 중요시 하는 사람들에게는 불호일 수도 있음. 그래픽과 최적화는 확실히 좋음. 거의 권장사양의 끝에 걸쳐있는 느낌이지만 충분히 할만함.","c":1791461069,"u":1,"b":1,"r":0},{"i":"237197860","s":"76561199641379436","g":0,"n":1,"p":3189,"f":4194,"l":"czech","t":"Works great, no lags, world building is great, quests ewerywhere, lot of fun for many...many...many hours lol","c":1791459371,"u":1,"b":1,"r":0},{"i":"237195953","s":"76561198149832903","g":0,"n":31,"p":5646,"f":5789,"l":"schinese","t":"1","c":1791456887,"u":1,"b":1,"r":0},{"i":"237194819","s":"76561199582816416","g":0,"n":1,"p":1023,"f":1212,"l":"russian","t":"Отличная игра, нравится в ней все","c":1791455432,"u":1,"b":1,"r":0},{"i":"237194518","s":"76561198819724185","g":113,"n":1,"p":14658,"f":14729,"l":"french","t":"Cet OpenWorld mérite d'être joué","c":1791455083,"u":1,"b":0,"r":0},{"i":"237194360","s":"76561198103171967","g":24,"n":5,"p":5091,"f":5667,"l":"schinese","t":"塞尔达代餐","c":1791454881,"u":1,"b":1,"r":0},{"i":"237192663","s":"76561198051576858","g":94,"n":7,"p":17823,"f":17823,"l":"spanish","t":"Me lo disfrute muchisimo recomendado! candidato al goty","c":1791452736,"u":1,"b":1,"r":0},{"i":"237188819","s":"76561198059740514","g":176,"n":15,"p":14490,"f":14490,"l":"english","t":"Good game","c":1791447007,"u":1,"b":1,"r":0},{"i":"237187865","s":"76561199072298353","g":0,"n":3,"p":23141,"f":27360,"l":"schinese","t":"终极缝合怪，量大管饱，挺好玩的，觉得可以是年度最佳游戏。缺点就是引导差，需要进行红沙大课堂学习","c":1791445432,"u":1,"b":0,"r":0},{"i":"237187560","s":"76561198335095025","g":0,"n":26,"p":1177,"f":1177,"l":"koreana","t":"어쌔신 크리드 신화 3부작(오리진 / 오디세이 / 발할라)에서 영감을 받았는지 전체적인 진행 방식과 전투 방식 및 서브 콘텐츠 등에서 유사점이 많으며 딱 위에 언급한 게임들을 플레이한 감각과 감상 그대로였음\n\n그냥 유비식 오픈월드에서 볼륨만 엄청 확장됐다고만 생각이 듦\n\n의문점 하나는 장비는 기획자 없으니 밸런스 맞추기 싫어서 성능을 비슷하게 설정한건지 그냥 룩 좀 괜찮은거 부위별로 파밍하면 맵 돌아다니면서 파밍할 이유가 없음\n\n이 게임이 10년대 후반 또는 20년대 초반에만 나왔어도 오픈월드 갓겜이란 소리 들었을텐데\n\n26년 현재로썬 오픈?월?드 란 생각과 함께 그냥 볼륨 큰 액션 어드벤처 게임으로 느껴짐\n\nDLC 나오면 다시 켜서 해볼 예정","c":1791444906,"u":0,"b":1,"r":0},{"i":"237187303","s":"76561198103830949","g":0,"n":7,"p":3481,"f":6060,"l":"english","t":"Crimson Desert feels like Assassin's Creed, Far Cry and Zelda's BOTW/TOTK on steroids, with combat and gameplay being the stars of the show. It's fluid, deep and varied, and after about 70 hours (I wasn't sure I was going to like the game so I tried on a friend's account) I still haven't fully got to grips with it\r\nbecause just as you start to understand Kliff, you're introduced to our female co-protagonist (though she feels like a side character entirely) Damiane, and later, Oongka (big Orc dude). So you have three playable characters who each play very differently. I gravitate towards Kliff, but the other two are just as fun.\r\n\r\nThe graphics are mind-blowing. On an i9 and RTX 4080 Super, I get 100-120 fps at near-max settings 1440p without ray tracing, or medium-high settings with RT, depending on upscaling. When I say mind-blowing I mean there are SEVERAL times in the game where you're doing something and when you look up, you just gotta stop for a second and breathe in the SHEER AWE-INSPIRING SCENERY, The attention to detail is outstanding, say what you want about the story, but we're reaching a point where detail, sharpness and lighting are close to matching real life. Heck, I showed my mom the game and she said it looked like a live-action movie.\r\n\r\nExploration is rewarding when it works. It can be vague and convoluted, some missions have you circling around hunting for specific enemies, and there are a few bugs, though they're being ironed out. But figuring out that annoying puzzle without watching Youtube videos, dropping out of the sky into an unintended boss fight, or stumbling onto a gorgeous view, is hard to beat. and yet, some puzzles really had me pissed at whoever developed them and spent time coding them into the game. \r\n\r\nThe story is the weak link, though it picks up as it goes. The VA work ranges from decent to excellent, but I never connected with the characters. I'm not alone. Many find the main story unfocused, jumping between the Greymanes and the Abyss without enough cohesion. Others say the wartime drama's pacing is buried under pointless busywork, and that fetch quests rarely have interesting characters. Damiane and Oongka arrive late and some feel they are a bit wasted. Even Kliff's mocap actor has admitted the game lacks in narrative. \r\n\r\nBut don't let that put you off. There's so much rich and deep content that one can sink several hundred hours and still be at the beginning, storywise. The game lets you wander off to explore on your own, though you will sometimes reach some areas with the text \"You can't access this region yet.\", which is essentially telling you to go to the orange marked missions on the map.\r\n\r\nVerdict: 8.5/10. \r\n\"A stunning, huge and brilliant-to-play open world with a forgettable story.\"","c":1791444459,"u":1,"b":0,"r":0},{"i":"237185612","s":"76561198156955910","g":0,"n":6,"p":10985,"f":10985,"l":"english","t":"Recaptured that childhood sense of wonder.\n\nI am normally a strictly story-driven gamer, but Crimson Desert hit me with a gameplay loop so absurdly fun that the original story flaws didn't even matter to me.\n\nThe open world gave me back that feeling of pure discovery I haven't felt since I was a kid. I spent hours upon hours just roaming the map, hunting down armor upgrades, and maxing out my skills before I even touched the main missions. Getting completely lost in this world is effortless.\n\n(Note: I played through the original release prior to the enhanced story revamp, so I haven't experienced the new narrative updates yet—but the core gameplay alone easily carried the entire game for me.)\n\nThe Good:\n\nUnmatched open-world freedom and exploration.\nExtremely rewarding gear progression and skill upgrading.\nGameplay and mechanics are so good you'll forget what the main quest even was.\nThe Neutral:\n\nOriginal story was light on substance, though the enhanced version reportedly addresses this.\nAbsolute blast of a game. I can't wait to see what they bring with the upcoming DLC.","c":1791441627,"u":1,"b":1,"r":0},{"i":"237185417","s":"76561198768085298","g":0,"n":2,"p":8200,"f":10385,"l":"english","t":"loved it","c":1791441326,"u":1,"b":1,"r":0},{"i":"237184918","s":"76561198281417838","g":0,"n":5,"p":3847,"f":3847,"l":"turkish","t":"Mükemmel bir deneyim olsa da hayatımda bu kadar karmaşık duygulara sahip olduğum başka bir oyun oynamadım. Oyunun size sundukları inanılmaz geniş ama bazı yerlerde de yeteri kadar derin değil gibi hissettirebiliyor. Ama ardından bu düşüncenizi kıracak bir olay yaşanıyor. Oyunda yer yer bunu hissettim ama beni kendine hep bağlamayı başardı.\n\n Oyunu enhanced güncellemesinden sonra deneyimledim. Eski hali nasıldı bilmiyorum ama oyunun hikaye örgüsü şuan çok sırıtmıyor bence. Bazen çok yükselttiği bile oldu ve sinematik sahneler gayet başarılı. Sadece oyun biraz hikayeyi kapmanız konusunda sizin de uğraşmanızı bekliyor diyebilirim. Souls formülü gibi düşünün. Elinize geçen, hele ki hikaye bölgelerinde bulduğunuz çoğu kitap ya da belge hikayeyi size daha detaylı anlatacak nitelikte. Bunları böyle şeylerden sıkılan biri değilseniz okumanızda fayda var. Ayrıca Kliffle hiç bağ kuramayacağımı düşünüyordum en başta ama bağ kurmaya da başladığımı hissediyorum. Başta buzdolabı gibi hissettiren bir karakter çünkü ama ileride ne kadar spoiler veremesemde hikayesi biraz daha derinleşiyor ve duygularını daha net görüyoruz. Diğer karakterlere geçtiğinde her seferinde olabildiğince hızlı kliffe dönmeye çalıştım hatta.\n\nOyunun bence en büyük sıkıntısı grafiksel problemleri. Ben ve araştırdığım kadarıyla çoğu insanda bu sorunu yaşamış. Oyunu hangi grafiklerde oynarsanız oynayın belirli hava koşullarında görüntü çamurlaşıyor. Piksel piksel oynuyorsunuz. Ve tüm ayarlar sinematikte ray reconstruction açık şekilde oynuyorum. Belki 1080 çözünürlükte oynadığım için bunu yaşıyor olabilirim ama yine de saçma geliyor. İlk başlarda beni oyundan inanılmaz itti bu durum ama sonra gözüm alıştı çünkü bazen de grafikler şahane gözüküyor. \n\nHarita muazzam bence. Örneğini çok zor görebileceğimiz bir harita. Bende bu kadar keşif isteği yaşatan bir dünya görmedim. Şu ana dek 64 saat civarı oynadım ve hikayede de daha yolum var. Ama bunun yarısı keşif diyebilirim. Ödüllendirici de olduğunu düşünüyorum. \n\nBahsetmek istediğim bir problem de oyunun belirli bir noktasına kadar hikayesel olarak çoğu görevinin tutorial gibi hissettirmesi. Sanki sadece oyunu öğretmek için basit görevler yaptırıyor. Aslında komplike mekanikler için akıllıca ama sizi biraz atmosferden iten bir durum. Eğer bu noktada dişinizi sıkabilirseniz sonrasında sizi inanılmaz bir oyun bekliyor. Boss görsel tasarımlarını da başarılı buldum ama çatışma halinde olan görsel bozulmalar ve pikselleşmeler zevkimi biraz kırıyor. Savaşın tam içinde hissedemiyorum ve bossu kesişim çoğu zaman olduda bittiye geliyor gibi hissediyorum. Onun dışındaki açık dünya çatışmaları daha temiz hissettiriyor. \n\nMekanikleri es geçemeyeceğim. Oyuna çok geniş bir aksiyon yelpazesi eklemişler. Çok farklı şekilde buildler yapabiliyorsunuz. Her oyundan bir parça dövüş mekaniği var gibi düşünün ve bu tamamen size bırakılan bir seçim. Nasıl oynamak istediğiniz size kalmış ve bunu çok beğendim. Açık dünya etkileşimleri de çok detaylı. İstediğin ağacı kes ya da tırman istediğin her dağa taşa çıkabil, istediğin herkesle selamlaşabil çoğundan bir şeyler dinle. Üstüne bir de hayran kaldığım bir olay da oyundaki her karakter sürekli bir şeyle etkileşimde. Bu kadar canlı hissettiren bir dünya görmedim. Sonrasında istersen git maden yap ağaç kes survival mod takıl, istersen git ticaret yap ya da paranı bankaya yatır borsayla oyna. Birçok böyle seçenek sayabilirim. Uzun lafın kısası şans verin ve başlarda diş sıkın çünkü ben 4-5 kez silip yeniden denedim. Başlangıçta dediğim gibi içine girmek zor olabiliyor çok büyük bir dünya ve her şey üzerinize yığılıyor çünkü. Her insanın deneyimlemesi gereken bir oyun olduğunu düşünüyorum. \n\nSaygılar","c":1791440477,"u":1,"b":0,"r":0},{"i":"237184660","s":"76561198639281171","g":0,"n":2,"p":610,"f":3108,"l":"english","t":"Amazing world","c":1791440011,"u":1,"b":1,"r":0},{"i":"237184450","s":"76561198039984325","g":4001,"n":171,"p":939,"f":1336,"l":"english","t":"This game runs like complete and utter dogwater, and is unfortunately a slowly starting game, that likes to trickle down features over what is effectively an off-rails tutorial, over the course of literally 14 hours. Hell I've been too sidetracked to unlock Farmville yet.\n\nHowever, once you get past the initial hump, you will be completely and utterly overwhelmed with dozens of mechanics, that make this game feel like it's 3 different games stapled together loosely.\n\nAnd yet I'd still recommend this, especially if your PC can somehow run this game. Why? Because this is the exact kind of game that appeals to the people who get giddy at the phrase \"single-player spinoff of an MMO that plays like Dragon's Dogma on KBM\".\n\nYou need to have a specific kind of mind to like this game, and that kind of mind is someone who says \"to hell with polish, give me something that feels like the lovechild of Archeage's somehow more successful cousin (Black Desert) and Tears of the Kingdom, I'm unemployed, I have the time\", because that's exactly what you're going to get.\n\nIs it entirely uninspired and derivative? Yes. Is it well executed? Arguable. But is there a ridiculous amount of toying around and tinkering you can do within this sandbox? Absolutely.\n\nI wouldn't say this game really, lands in any particular aspects, but it also at no point really fails, it's like deli mac and cheese, it's nothing special, but it hits the craving. This is the Digorno's Pizza of open world games, it's certainly better put together than most Ubisoft open world games, and this is coming from someone with a secret soft spot for Ubi games for when I don't want to think, but also this ain't Witcher 3, not even close.\n\nAlso this game's mods go crazy, someone already made a full custom character creator mod, in case you find Kliff boring. It probably was built from some sort of scrapped function, who knows really, apparently this game was in some WILD dev hell, which comes to no surprise as someone who actually on-off played BDO, their other game, for like 10 years, during which the devs got bought by Korean Facebook (as predatory as the real thing) and then spun off to be independent again. To say their priorities changed wildly each time, is an understatement.\n\nStrong 7/10, but like in the same way Dragon's Dogma is a strong 7/10, where you're gonna have some wild moments if you play outside the box a little, but like objectively it's nothing special. It's like Eurojank, but like, the Korean equivalent. Joseon-jank, if you will.","c":1791439704,"u":1,"b":0,"r":0},{"i":"237183305","s":"76561198140481365","g":0,"n":5,"p":6177,"f":7583,"l":"english","t":"Loving it so far... 100hrs and I feel like I`m just getting started. The only thing I would ask for at this point is a co-op mode, So I can join friends.","c":1791437654,"u":1,"b":1,"r":0},{"i":"237181723","s":"76561197999366289","g":0,"n":293,"p":1809,"f":1809,"l":"english","t":"Bought it because it looked like it might scratch the itch for something like BoTW, however I found the puzzles to be unintuitive and janky, the exploration to be dull because the environment is unimaginative, the combat to be merely serviceable, and the dopamine rewards from finding better gear and power upgrades to be near non-existent. \n\nI wish I hadn't spent so much money on it. I'm uninstalling it and just don't see myself coming back to it with so many other things to do with my time.","c":1791435142,"u":0,"b":0,"r":0},{"i":"237181705","s":"76561199247450609","g":54,"n":4,"p":7077,"f":9985,"l":"english","t":"Game of the year no doubt","c":1791435113,"u":1,"b":0,"r":0},{"i":"237181164","s":"76561198110517928","g":0,"n":5,"p":7219,"f":8666,"l":"english","t":"NOTE: IF YOU SEE PEOPLE TALKING ABOUT CONSTANT CRASHING, ROLL BACK YOUR DRIVER TO A MORE STABLE VERSION\n\nI really wanted to be swayed away from this game, but I am completely glad I read the positive reviews on this game and gave it a chance. \n\nTo start, the game is absolutely stunning. Worst I can really say is that shaders don't always render the correct way, which causes the game to look a little clunky and bad. However, there are mods and other in game solutions that smooth out the graphics. You take one look in this game and get lost in hours just looking around, taking screenshots and exploring areas that you would normally say \"I would love to go there, but its walled off.\"\n\nWhat do I mean by that last part? It means exactly as it's said. If it looks like you can travel there, you absolutely can, and the game does an amazing job making you feel so small. I think I spend more time chasing down the adrenaline high of fighting big bosses and reaching the highest of heights, and I don't regret it at all.\n\nThe story is the part that most players critique a lot, which is fair because sometimes the story feels like they had too many ideas all in one sitting. However, if you take the story as it is, and look at the very positive qualities that come with the game, you'll grow to love the game no matter what. I think a lot of it comes down to how the game feels like a giant single player MMO-style game, and Pearl Abyss doesn't really look that ashamed of it. So, honestly, I just buy into the game as much as I can so I can at least feel immersed in it.\n\nYOU WILL BE INTIMIDATED BY THE COMBAT, and that is OKAY! Read the skills, and learn the combos, and I promise you that you will be completely impressed by how smooth the combat feels. \n\nI love this game, and I wouldn't put over one hundred hours in this game if I didn't. In fact, I am over one hundred hours in, and I still feel like there is so much more I can do.","c":1791434242,"u":1,"b":1,"r":0},{"i":"237180950","s":"76561198382035280","g":0,"n":3,"p":18472,"f":24205,"l":"english","t":"GOTY","c":1791433900,"u":1,"b":0,"r":0},{"i":"237179747","s":"76561198130669653","g":0,"n":20,"p":367,"f":367,"l":"english","t":"Was a big fan of Black Desert and now I'm a fan of this!","c":1791432169,"u":1,"b":0,"r":0},{"i":"237179686","s":"76561197967951241","g":0,"n":1,"p":10271,"f":10273,"l":"koreana","t":"지금까지 해왔던 RPG 게임 생각하고, 유튜브 쇼츠보고 이 게임하려고 하면 진짜 잘생각해라\r\n스토리 별로인건 소문 다 났으니까 말할건 없고\r\n\r\n난 스토리 전혀 신경안쓰는데도 진짜 이제 못해먹을 것 같아서 스팀에서 평가 처음 남긴다. 진짜 이 넓은 땅에 전투말고도 할거 이렇게 많이 만들었는데 뭐라도 있겠지 라고 생각하고 참고 이 시간동안 한게 너무 아까워서 열받아서 평가 남긴다\r\n\r\n1. 아이템 파밍문제\r\n처음 10분안에 길가다 주은 장비든, 150시간 이상하고 메인퀘도 다 따고 히든보스 어렵게 잡아서 얻은 장비든 다 똑같다. 그리고 어느 보스를 만나든 죽이고 나면 어비스아티팩트 1개만 준다. 이게 얼마나 치명적이냐면 이 넓은 땅에 그 많은 숨겨진 장소든 얼마나 센 보스든간에 내가 플레이 1시간하고 느낀 감정 그대로 몇십시간 반복되는 보상구조라고 보면 된다. 그러면 어비스기어라고 장비에 장착하는 아이템 이야기를 안할 수가 없는데 이것도 처음엔 와 이거라도 잘 파밍해봐야겠다라고 느끼고 희망고문으로 계속 하게 되는데 이것도 내가 10시간해서 얻은 어비스기어에서 몇백시간하고 거의 만렙을 찍었다 하더라도 더 특별한거 얻는거 없다. 모든 아이템이 성능이 거기서 거기라서 룩딸로만 쓰는거고 그나마 있는 쿠쿠새 장비들도 후반에 만들 수 있고 어렵게 재료모아서 만들었다 하더라고 다른 RPG게임에서 느끼던 와 진짜 좋은템 얻었네? 이런거 없다. 뭔가 특수한 기능이 붙은 장비? 번개의반지 예를 들면 비를 2분이나 쳐맞아야 겨우 쓸 수 있는데 막상 쓰면? 데미지? 욕나온다. 이런거 다 안써도 되고 쓰는게 더 귀찮다.\r\n\r\n2. 캐릭터 성장 문제\r\n지금 어비스아티팩트 240개 모았고 찍을 스킬 거의 다 찍었다. 그런데 이 게임은 내 캐릭이 성장하는 맛이 거의 없다. 처음에 한 60개 정도 모을때까진 있을 줄 알았다. 스킬트리에 있는 많은 스킬들? 진짜 다 필요없다.\r\n예를 들어 어비스아티팩트 열심히 모아서 3개가 필요한 스킬을 기대하고 찍었다면 얼마나 세고 좋을까 기대를 할텐데 그런거 없다. 어떻게 보면 어비스 아티팩트가 캐릭터 성장에서 제일 중요한건데도 3개나 날렸지만 능력치 초기화 자체도 귀찮아서 그냥 날려도 아깝지 않을 정도로 쓸만한 스킬은 거의 없고 내가 쓰는거 2개만 써도 전투는 다 무난하다. 그래서 유뷰트에서 보던 그런 화려한 콤도? 다 필요없고 철권콤보처럼 그냥 자기만족으로 하듯이 연습하고 쓸려고 해도 쓸 대상 거의 없다. 잡몹? 콤보 시작도 안했는데 죽는다. 보스? 안통한다.\r\n\r\n3. 탐험\r\n월드구현 진짜 잘해놨고 숨겨진 장소들도 진짜 많다. 난 불합리한것도 너무 좋아해서 남들이 욕하는 퍼즐도 괜찮고 이걸 어떻게 찾아? 하는 것들도 정말 좋아하는데 앞에서 말한 캐릭터 성장과 아이템파밍 문제, 거의 반복되는 똑같은 보상때문에 새로운 마을, 숨겨진 장소를 봐도 별 기대되는게 아무것도 없다. 룩딸할거라고 찾아다니는것도 잠시지, 탐험의 이유는 그냥 말그대로 관광요소 밖에 없다. 진짜 신기한 곳에 마을이 있다? 신기하고 예쁘네가 끝이다.\r\n\r\n다른 단점들은 다른 리뷰에서 너무 잘 말해줘서 다 생략하고\r\n이 게임살려고 하는 사람들은 전투 이외에 요리하거나, 늑대캠프 운영하거나, 다른 시뮬레이션 요소가 좋을 것 같으면 하는거다. 잘알고 있던 그런 RPG 성장의 재미를 생각하고 한다면 그것도 어비스 아티팩트 한 100개 정도 모았을 때 느낄거다. 그때되면 내 캐릭이 엄청 강해질 것 같은 기대는 없어질거고 공허하게 필드만 돌아다니고 있을거다. 총 플레이타임은 몇백시간 나올거 같이 완전 잡탕으로 할건 많은데 그것도 전투, 성장 아니고 말그대로 그냥 돌아다니고 시뮬레이션 요소로 하는거다.","c":1791432075,"u":0,"b":1,"r":0},{"i":"237179139","s":"76561198157753856","g":0,"n":4,"p":1893,"f":3386,"l":"koreana","t":"재밌는데 똥 같을 때가 있음 똥과 갓을 넘나드는 게임임","c":1791431289,"u":1,"b":0,"r":0},{"i":"237178621","s":"76561198632738637","g":0,"n":1,"p":257,"f":8 big opigus prime. \r\nbig too har for mi to win.... that ok\r\ni praktis. fun","c":1791427446,"u":1,"b":1,"r":0},{"i":"237176150","s":"76561198247958178","g":0,"n":56,"p":5692,"f":6729,"l":"spanish","t":"100h y sigo en la primera zona","c":1791427084,"u":1,"b":1,"r":0},{"i":"237175963","s":"76561199553806890","g":0,"n":8,"p":3009,"f":4188,"l":"brazilian","t":"meu GOTY!","c":1791426805,"u":1,"b":0,"r":0},{"i":"237173347","s":"76561198050296212","g":0,"n":6,"p":124,"f":124,"l":"english","t":"I’m giving this a positive review even though I’m probably never going to play it again, because I can see how this could be a fantastic game for the right player.\n\nTL;DR: Overall, my impression is that this isn’t a game for players who want a more immediately accessible experience. I don’t have a lot of time to play video games anymore, and when I play, I want to be able to jump in, understand at least most of what I can do within a few hours, and not have to spend 20+ hours (basing this number on other reviews) trying to get a handle on the controls and systems. Some people have even said the game doesn’t reach its peak fun factor until well after that.\n\nI found the limited time I spent with it fascinating, but also extremely frustrating. I haven’t personally experienced the payoff of learning the systems deeply, but it at least sounds like doing so makes this an ideal game for a certain type of player.\n\nStarting with the good:\n\n1. The world is really pretty. I didn’t have any performance issues like others have reported, even with the game on max settings with ray tracing.\n\n2. There’s an extreme density of things to do and systems to interact with. It feels like a big, interactive sandbox. It seems like there would be a huge number of things to do if you invest enough time.\n\n3. A lot of the systems are pretty unique to the open-world RPG genre, and there are a lot of things that are really reminiscent of something like Breath of the Wild.\n\nPoints 2 and 3 are actually kind of WHY I think the game isn’t for me, though.\n\nMy main gripes are: (Keep in mind that there might be workarounds for some of these issues that I haven’t played long enough to discover.)\n\n1. The default camera settings are downright nauseating. I had to mess with the in-game settings AND download a camera mod to avoid feeling seasick from the camera movement. I have legitimately never experienced motion sickness from a video game before.\n\n2. While I think this could be a benefit for the right player, I find the extreme density of movement mechanics, controls, and interactions to be extremely clunky and strange. Having to hold two buttons to interact feels really bad, and I never really understood why you could sometimes interact without doing that and other times couldn’t. Sometimes interactions are grayed out, and I have no idea why.\n    I feel like my fingers need to be trained acrobats to get a handle on all of the systems at once. I also find movement kind of slow and clunky, at times not very satisfying or responsive, even though it feels like it should be.\n    Navigating menus, equipping and changing items/tools, etc., is also clunky at best and downright confusing at worst. The lantern in particular was annoying. I’d equip and unequip it by mistake all the time, and I don’t like that I have to hold it up to direct the light.\n    I tried playing with both a controller and keyboard and mouse, and either way, I couldn’t really get the hang of it.\n    To clarify, I don’t think complexity is inherently bad. I enjoy games with deep mechanics, but I prefer complexity that emerges from how systems interact rather than complexity in how I physically communicate with those systems. I don’t mind spending time mastering a game, but I want that time to feel like I’m mastering the gameplay rather than learning to navigate the interface.\n\n3. I wish there were a way to highlight interactables, and especially loot, because sometimes it’s hard to see stuff on the ground or know what I can interact with. I also don’t really love the whole mechanic of identifying things by picking them up. I feel like a silver bowl is a pretty obvious object. I shouldn’t have to pick it up to know it’s a silver bowl.\n\n4. This is probably partially because I didn’t spend enough time with it, but I also found the gameplay very slow, the quests kind of drab, and the systems as a whole very confusing. Some of it can be read as immersion, but some of it just feels tedious and boring.\n    One example of the tedium is the first time I entered the Abyss realm (not sure if that’s what it’s called). You have to platform across an abyss on moving platforms. This might have been fun if I found the movement mechanics more responsive and intuitive, but instead, it felt like I was fighting the controls just to complete a relatively simple platforming sequence.\n\n5. This is probably too nitpicky, but stamina is a resource that I feel drains FAR too quickly for how many things require it. It’s actually a problem I have with a lot of games in general, but Crimson Desert uses stamina for SO much.\n    \nI feel like stamina drain should be prioritized like this:\n\nCombat actions: Large stamina cost.\n\nDifficult actions: Meaningful stamina cost (lifting/moving heavy things, manipulating objects that would clearly take effort, etc.).\n\nDangerous world traversal: Modest stamina cost (climbing, flying, diving, etc.).\n\nOrdinary world traversal: Very little or no stamina cost (sprinting outside of combat, for example).\n\nOne final thing I do want to emphasize is that I don’t necessarily think all of these issues can be excused as matters of personal preference. There’s a difference between complexity that adds meaningful depth to gameplay and complexity that comes from unintuitive controls or cumbersome design choices. I do kind of enjoy games that ask players to invest time in learning them, but I don’t think that investment should have to involve fighting the controls to perform even relatively simple actions.\n\nI’m sure there are players who enjoy extremely complex games that still would probably be irritated by many of Crimson Desert’s systems. I think this game has a lot of genuinely interesting mechanical depth, but I also think some of its complexity feels like unnecessary friction rather than intentional design. Of course, as I’ve stated before \n I haven’t played enough to confidently say where that line falls in every case.","c":1791423333,"u":1,"b":1,"r":0},{"i":"237172548","s":"76561198825705566","g":0,"n":6,"p":22404,"f":22404,"l":"english","t":"When i started it,the game didnt even have an exit game button.I literally had to alt f4 to close it.\nDid that hold me back?No.Why?\nCause of the story at the start,cause of all those small details,like the meat cooking while doing the sword skill,if you put out the fire from a fireplace the smoke wouldnt come out of the chimney,or the npc reactions,how they would pick up their stuff after you bumped into them,the pets,then it was the armors,such amazing armor sets..!\nBut most if all,yes the open world exploration.Its that good,i cant even describe how happy i was when i saw that Ent walking at me.","c":1791422257,"u":1,"b":1,"r":0},{"i":"237170501","s":"76561199201507260","g":0,"n":1,"p":1336,"f":1370,"l":"english","t":"I mean, it's an okay game at best.\r\nI enjoy a lot of it, on the cinematic points; but the combat and the story is just unbearable. Not to mention all the bugs, puzzles feel tedious instead of engaging, and there's so many quests that are literally just following someone for 5 minutes or just lead you directly wrong and expect you to figure it out. Leveling up is super tedious, a lot of the equipment is generic, and exploration just feels empty. If I could, I would go back and not purchase this game and give it another 6 months to figure its sh out. They really didnt know where they wanted this game to go.","c":1791419392,"u":0,"b":1,"r":0},{"i":"237170483","s":"76561199220691681","g":396,"n":59,"p":160,"f":160,"l":"english","t":"[b]Kram[/b] (streamer): Pass\n[b]Doppl[/b] (streamer): Pass\n[b]Chat[/b] (community): Watch\n\n\"An overwhelming number of systems and an underwhelming set of tutorials and motivations\" \n\nWe reviewed this at launch and we refused to give more than a few hours to this (because it didn't hook us at all). It's beautiful, the map is gigantic (BotW comes to mind), and clearly the game is Ambitious. \n\nThat said, This game has almost every single game mechanic we could list from memory and they are mashed together - not in a perfect stew or elegant orchestra, but rather a giant messy Katamari ball (we didn't see this mechanic yet, god bless). This is likely from the MMO foundation and talent that precedes Crimson Desert, but we received it as a blurry incoherent cluster of systems and asked ourselves \"why.\" \n\nYet: \nThere's a reason you trim the grass. \nThere's a reason you delete dead code from a project. \nThere's a reason a painting has a border. \nSometimes, less is more.  \n\nA new mechanic every minute. Disconnected lore. Some wild intro missions and a stint as a chimney sweep. We got lost and we never got found. \n\nWe hope you enjoy it if you already bought it, but we're going to wait for Crimson Desert Kai. \n\n[list]\n[*]“Beautiful map and rich combat system”\n[*]“I think you heard me say ‘a lot of mechanics’, what I said was 'we have all the mechanics”\n[*]“Ok, ok, so hear me out - why?”\n[*]“the MMO bones are visible”\n[*]“An overwhelming number of systems and underwhelming set of tutorials”\n[*]“john action game”\n[*]“YES WE CAN, but… should we?”\n[/list]\n\nReview recommendations are an aggregate of the streamers and the community - Games are rated as a \"Play, Watch, or Pass.\"\nWe do live community reviews of new games with 1 player and 1 host. Duet Comedy meets live game reviews on [url=http://twitch.tv/DemoDuo]twitch.tv/DemoDuo[/url]. You can also find us at [url=http://demoduo.tv]http://demoduo.tv[/url].","c":1791419370,"u":0,"b":1,"r":0},{"i":"237169409","s":"76561198295137253","g":0,"n":2,"p":17299,"f":18530,"l":"spanish","t":"Gran Juego!\r\nSin duda unas de las mejores compras de este año, buenos gráficos, muchas mecánicas, diálogos (inglés sobretodo) han mejorado la historia aunque lo suyo es el combate, que es de lo mejor que he probado en PC, recomiendo teclado y ratón ya que tiene muchas combinaciones/mecánicas de combate, sin olvidar la actualización Enhanced que ahora esta mejor optimizado, me veo otras 200 horas tranquilamente.","c":1791417918,"u":1,"b":0,"r":0},{"i":"237169124","s":"76561198289253031","g":0,"n":1,"p":8227,"f":8319,"l":"french","t":"Parfait.","c":1791417519,"u":1,"b":0,"r":0},{"i":"237166676","s":"76561198065382311","g":0,"n":1,"p":14429,"f":14454,"l":"english","t":"It's beautiful and fun, with constant improvements, worldclass GOTY material.","c":1791414217,"u":1,"b":0,"r":0},{"i":"237161567","s":"76561199203713047","g":0,"n":5,"p":4872,"f":5778,"l":"english","t":"Without a doubt the best game I've ever played","c":1791408255,"u":1,"b":0,"r":0},{"i":"237160308","s":"76561198018763353","g":0,"n":1,"p":2072,"f":2497,"l":"english","t":"Best open world since Witcher III","c":1791406959,"u":1,"b":1,"r":0},{"i":"237159257","s":"76561199839634898","g":0,"n":1,"p":3495,"f":3777,"l":"french","t":"magnifique jeu, \r\nVive la patate","c":1791405957,"u":1,"b":1,"r":0},{"i":"237158942","s":"76561199592271179","g":39,"n":1,"p":908,"f":3230,"l":"spanish","t":"es lo mas parecide al skyrim mucha libertad muy caro pero buen juego","c":1791405668,"u":1,"b":1,"r":0},{"i":"237157266","s":"76561197970330043","g":0,"n":10,"p":2152,"f":2242,"l":"german","t":"The sandbox and overall world design are awesome. Great exploration. But you really have to accept that you will not follow every trail of bread crumbs and that you will not be able to experience everything on the table. Just get the first ten hours out of the way. Watch a video on the mechanichs and skill progression and let loose in this amazing world. I felt that the main story gets in the way a lot. I guess it can be interesting but it's just way too much of everything. Also, I think there is base building and trading in there somewhere but the game is enough without it. I mean you get freaking tool tipps about 10h into the game....Jesus. If you need money, just rob a town blind. Once the game lets you go, it really opens up though and it is a lot of fun to simply go for treasure hunts and pick random fights.","c":1791404180,"u":1,"b":1,"r":0},{"i":"237156033","s":"76561198132056924","g":40,"n":7,"p":1776,"f":4105,"l":"schinese","t":"顶级好玩 比塞尔达跟大镖客上头多了","c":1791403210,"u":1,"b":0,"r":0},{"i":"237155410","s":"76561198191164153","g":0,"n":4,"p":3667,"f":4121,"l":"turkish","t":"Parasının hakkını veriyor. Oynadıktan sonra başka oyunlara girmiyorum işten geldiğim gibi açıyorum ve yatana kadar oynuyorum.","c":1791402615,"u":1,"b":0,"r":0},{"i":"237153678","s":"76561198694701229","g":0,"n":7,"p":815,"f":1557,"l":"english","t":"GOTY","c":1791400993,"u":1,"b":1,"r":0},{"i":"237151513","s":"76561198870894947","g":261,"n":29,"p":5684,"f":5942,"l":"brazilian","t":"melhor jogo top","c":1791399066,"u":1,"b":1,"r":0},{"i":"237150370","s":"76561198381873052","g":40,"n":3,"p":4970,"f":6994,"l":"english","t":"Cool gameplay, story is a bit underwhelming can't find myself caring about any of the characters unlike games like Wither, RR or Cyberpunk where the story was emotional with highs and downs.","c":1791398069,"u":1,"b":1,"r":0},{"i":"237148567","s":"76561198004770106","g":0,"n":2,"p":182,"f":182,"l":"german","t":"Das Game bockt hart ;-)","c":1791396534,"u":1,"b":0,"r":0},{"i":"237147642","s":"76561199065140300","g":72,"n":2,"p":8374,"f":10123,"l":"schinese","t":"大地图很爽，骑龙很爽，装备很帅\r\n任务狗屎，引导狗屎，解密狗屎\r\n虽然更新了，但是任务之间的衔接仍然一坨，满地图通马桶","c":1791395699,"u":1,"b":0,"r":0},{"i":"237146776","s":"76561198215432861","g":194,"n":25,"p":375,"f":375,"l":"english","t":"r","c":1791394962,"u":1,"b":0,"r":0},{"i":"237144006","s":"76561199035430189","g":177,"n":32,"p":2006,"f":2006,"l":"schinese","t":"大不剀","c":1791392432,"u":0,"b":1,"r":0},{"i":"237143158","s":"76561199207321168","g":0,"n":14,"p":1102,"f":1190,"l":"english","t":"Hello pc/console player of this game . i recomend this game, as a black desert player back in the day , it was easy to get right in this game . Crimson deset  its worth the money and im sure the DLC will be good to discover as well  on console here is a hot mess,it crashes.","c":1791391704,"u":0,"b":1,"r":0},{"i":"237141723","s":"76561198409076956","g":0,"n":1,"p":11794,"f":13079,"l":"koreana","t":"옵션 조금 조절하면 노트북에서도 쾌적하게 할 수 있게 최적화 잘 돼있고\r\n즐길수 있는 컨텐츠가 정말 많고 모험을 제대로 즐길 수 있다는게 장점\r\n한국의 온라인RPG게임을 싱글로 편하게 즐길 수 있다면 좋겠다고 생각했다면 좋은 선택이 될 겁니다","c":1791390435,"u":1,"b":1,"r":0},{"i":"237141674","s":"76561198215855944","g":1429,"n":16,"p":1102,"f":5791,"l":"schinese","t":"【RTX3060Ti 优化指南 | 2K光追高画质+Xess 3倍帧生成+Reshade改善颜色】\r\n\r\n【游戏画质设置】\r\n本人建议开光追，画面提升比较明显，损失的帧数可以靠后面的帧生成补上，其他设置网上的方案大同小异，本人参考的是B站 阿敲Aqiao的红色沙漠优化指南。里面有详细说明哪些吃帧数，我个人觉得阴影质量和光追比较重要，所以这两项调的是最高，其他的基本是极高。这样设置后2K画面原始帧率基本在20-30左右。\r\n\r\n【Xess帧生成补丁】\r\n目前已经有了DLSS原生帧生成补丁，但本人强烈推荐使用OptiScaler里的XeSS帧生成补丁，效果比DLSS帧生成稳定很多，基本没有果冻感！原版Optiscaler XeSS只有 x2帧生成，本人用的是B站MrCreeperBoom 提供的 修改版OptiScaler XeSS ，增加了x3至x6帧生成，我自己用的是x3帧生成， 2K高配画面稳定60帧（我的显示器最高60帧），另外OptiScaler本身带垂直同步，OptiScaler设置中打开V-Sync后，把游戏内部和NVIDIA App的垂直就可以关闭了，避免重复开启！\r\n\r\n【Reshade改善颜色和清晰度】\r\n这个游戏白天的颜色个人觉得过于鲜艳，看久了累眼！\r\n本人推荐使用N网的Color and Objects Fix - Better Details and Shadows - UI Options\r\n开启后颜色明显没有原版那么艳、晃眼，同时阴影和物体细节的层次感也更加舒服一些。\r\n特别提醒Optiscaler和ReShade的dxgi.dll冲突，只需把Optiscaler的dxgi启动文件改成dbghelp或其他OptiScaler支持的加载名称！\r\n\r\n【DLSS模型预设】\r\n超分辨率M，光线重建F，不建议全局设置，最好针对不同游戏单独设置。\r\n\r\n【Optiscaler导致F12无法截图】\r\n需要把设置中的OptiFG改成Streamline（此方法仅限游戏本身支持帧生成的情况）改完F12截图就恢复正常了\r\n\r\n【最后】\r\n以上方法网上都有教程可以直接查到，遇到问题欢迎留言 或是通过AI一步步解决，最后祝各位30系列老玩家们老兵不死，再战5年！！！\r\n","c":1791390391,"u":1,"b":0,"r":0},{"i":"237139678","s":"76561198015725442","g":90,"n":25,"p":6306,"f":6604,"l":"german","t":"Ein Meisterwerk! \r\nDieses Spiel als Online MMORPG, würde alle andern in Regen stehen lassen!","c":1791388722,"u":1,"b":0,"r":0},{"i":"237138119","s":"76561198016432008","g":0,"n":92,"p":7126,"f":7732,"l":"english","t":"\"Took me 118.7 hours but now I finally seeing the end credits.  Took me 88 hours before I even started Skyrims main quest.   When a game is this fun and has so much fun side things to do it takes time before you even see the end credits becuse you doing the side content.   I plan to 100% the game now when I beaten it but that I will chip away and so slowly.\n\nBut yeah This is my game of the year game to hell with trash games like GTA and so on this is a open world game that´s fun has a good story and just overal fun combat when I don´t keep using Axiom Force becuse I happen to press in the left stick.   That´s my only gripe about it.  I wish Axiom Force was an item instead you pick from the menu where you pick weapons. Becuse my god boss fights become a bit annoying when I Axiom Force the ground randomly intsead of dodging.  Other than that the combat is fun.\n\nPros:\nCombat \nMusic \nVoice acting \nArmor design my good even in black desert they shown that they can rely make some cool designs\nThe game run well on my mid range PC thank you DLSS 4. \n\nCons:\nThe Axiom Force as I said is a pain and I wish it was a toggable item instead like weapons and such.\nGame still has some buggs not game breaking.  One exmpale is on the minimap some times the road wobbles like a gitar string when im riding around. \n\nHonestly I can´t think of many bad things more then how annoying the Axiom Force is during combat.","c":1791387453,"u":1,"b":0,"r":0},{"i":"237137597","s":"76561198285139879","g":88,"n":20,"p":5618,"f":6478,"l":"schinese","t":"讲句实话，东西和内容是真的多，但是引导真的烂完了，后期也有点重复，像是二游一样清任务，总的来说在我这艾尔登>荒野之息>红沙>王国之泪，非常推荐。","c":1791387032,"u":1,"b":1,"r":0},{"i":"237137332","s":"76561197981802305","g":0,"n":16,"p":61,"f":61,"l":"english","t":"Looks terrible, plays worse","c":1791386807,"u":0,"b":1,"r":0},{"i":"237137291","s":"76561198388565662","g":0,"n":1,"p":4866,"f":7918,"l":"koreana","t":"쩌네요","c":1791386780,"u":1,"b":1,"r":0},{"i":"237136578","s":"76561198871249058","g":0,"n":9,"p":2361,"f":2361,"l":"schinese","t":"鸡肋 建议没买的直接去玩网游 还有去你的边走边说明 不能跳过 瞎几把走最后还要我自己跑到目的地","c":1791386188,"u":0,"b":1,"r":0},{"i":"237136144","s":"76561198077340139","g":191,"n":22,"p":8373,"f":9359,"l":"brazilian","t":"Jogo exelente , da pra fazer muita coisa nele , ou seja vai durar muito ainda mais dublado oficialmente para o portugues do brasil","c":1791385831,"u":1,"b":0,"r":0},{"i":"237136068","s":"76561198323998695","g":114,"n":29,"p":2854,"f":5190,"l":"schinese","t":"内容极其丰富体量巨大的开放世界角色扮演游戏，买了绝对不亏。但是这游戏硬伤很严重，有些地方设计的极度莫名其妙：\r\n1. 最严重的问题就是解谜，即使是大量修复优化后的增强版也是垃圾水平，实在不会弄弱引导就老老实实把玩家每一步要干什么都做成常态提示，而且偏偏无论主线还是支线或者传送点都塞了大量解谜，你不想体验就进行不下去，玩的时候别怀疑自己，老老实实查攻略吧\r\n2. 还有资源的数量变动，非要弄成转表从0-9循环在那里转半天我也看不出钱到底多了还是少了 \r\n3. 交谈选项，时而需要背对人物，时而需要正对人物，我知道有时候npc在跟别人对话，那又如何，你把都识别到交谈选项了，只不过是变灰了不让我选，偏偏让玩家绕npc一圈去猜这次是正面还是背面，很愚蠢的设计","c":1791385764,"u":1,"b":1,"r":0},{"i":"237133721","s":"76561198211037124","g":0,"n":18,"p":1305,"f":1328,"l":"schinese","t":"度过入门期后就是神作！","c":1791383831,"u":1,"b":1,"r":0},{"i":"237133375","s":"76561199009581569","g":0,"n":1,"p":2334,"f":4777,"l":"schinese","t":"有缺点，但沉浸玩下去很有意思。","c":1791383533,"u":1,"b":0,"r":0},{"i":"237131894","s":"76561198126653831","g":363,"n":15,"p":95,"f":95,"l":"english","t":"looks n plays terrible, no identity","c":1791382290,"u":0,"b":0,"r":0},{"i":"237131024","s":"76561198373627656","g":0,"n":10,"p":7271,"f":7271,"l":"english","t":"Because it doesn't have a character creator or at least a much better face customization options later in the game, I can't give it a very high praise as it is something important to me and could make this specific game a lot more enjoyable. Also, I wish the questing was completely skippable as I don't care about the story and they said that this game isn't about the story anyway. There are some skills that should be core skills for all the playable characters, I don't want to play only as Kliff to feel complete. But it definitely is a good game with an amazing open world: visually and how much there is to do and how rewarding it is to explore. The combat is fun to mess around with also, to mix and match skills and so on. Many cool looking armors and weapons to discover, it sure has kept me busy. I can for sure recommend the game as it has a lot to offer for a reasonable price.","c":1791381529,"u":1,"b":1,"r":0},{"i":"237130825","s":"76561198004104434","g":0,"n":2,"p":5014,"f":7273,"l":"italian","t":"spettacolare per chi ama il genere, configurazione comandi da rividere","c":1791381341,"u":1,"b":1,"r":0},{"i":"237130344","s":"76561199554836858","g":0,"n":4,"p":1640,"f":1847,"l":"schinese","t":"海信\r\n","c":1791380904,"u":1,"b":0,"r":0},{"i":"237129751","s":"76561199845939252","g":0,"n":11,"p":406,"f":524,"l":"english","t":"nice game","c":1791380373,"u":1,"b":1,"r":0},{"i":"237129614","s":"76561198383605836","g":0,"n":1,"p":7807,"f":8401,"l":"english","t":"Very amazing gameplay, with the devs really listen to what the player community would like to be added and fixed. I would highly recommend this game to anyone that plays games, it's a game that will blow your mind with what all you are able to do, the fight mechanics, environment visuals, and the ability to interact with anyone is very impressive and cool. This game is solid 9.8/10.","c":1791380242,"u":1,"b":1,"r":0},{"i":"237127164","s":"76561198004761440","g":640,"n":14,"p":18133,"f":24616,"l":"russian","t":"Лучшее приключение, которое я пережил со времён «Ведьмака 3».\r\nГигантский мир с кучей механик и мини‑игр: от выращивания скота на ферме до инвестирования в золотые слитки и облигации.\r\nВ этом мире спокойно существуют драконы с работами, и выглядит это логично.","c":1791377952,"u":1,"b":0,"r":0},{"i":"237126221","s":"7656119
