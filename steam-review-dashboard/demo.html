97633192","g":21,"n":7,"p":355,"f":514,"l":"brazilian","t":"Desse estilo de jogo é o que eu mais gostei até agora, não consigo parar","c":1792099246,"u":1,"b":0,"r":0},{"i":"237805028","s":"76561198060574355","g":101,"n":43,"p":8861,"f":8861,"l":"french","t":".","c":1792098629,"u":1,"b":0,"r":0},{"i":"237804503","s":"76561199182730058","g":233,"n":4,"p":711,"f":711,"l":"english","t":"smack bang boom make brain happy","c":1792098138,"u":1,"b":1,"r":0},{"i":"237802929","s":"76561198156151320","g":0,"n":1,"p":1442,"f":1442,"l":"english","t":"big game","c":1792096731,"u":1,"b":0,"r":0},{"i":"237801692","s":"76561198048821614","g":68,"n":3,"p":4038,"f":4198,"l":"turkish","t":"Oyun her oynadığımda çöküyor kesinlikle çökmezse de mavi ekran verdiriyor pcye son güncellemelerden sonra böyle oldu. Sürekli güncelleme yapıyolar ama oyunu iyice bozuyolar zaten çok sağlıklı bi oyun değil","c":1792095594,"u":0,"b":0,"r":0},{"i":"237801358","s":"76561198749048953","g":0,"n":1,"p":23841,"f":23933,"l":"brazilian","t":"Crimson Desert se consolidou como uma verdadeira obra-prima da ação e exploração, alcançando seu potencial máximo após o trabalho impecável da equipe de desenvolvimento. As atualizações recentes transformaram a experiência do jogo, refinando o combate — que agora está muito mais fluido e responsivo — e otimizando a performance gráfica global. Graças ao compromisso contínuo dos desenvolvedores em ouvir a comunidade, os ajustes no equilíbrio e as melhorias de performance transformaram o vasto mundo.","c":1792095262,"u":1,"b":0,"r":0},{"i":"237799151","s":"76561199822908238","g":0,"n":2,"p":10743,"f":10835,"l":"english","t":"amazing game that may feel a bit slow at first. the world is truly immersive and has amazing graphics","c":1792093282,"u":1,"b":1,"r":0},{"i":"237798560","s":"76561199262647037","g":0,"n":4,"p":9652,"f":9652,"l":"russian","t":"нет мне этот геморой с получасовыми загадками разгадками , вообще не понравился , поэтому игра и такая длинная , где ты пол дня разгадываешь какие то головоломки , которые тебе вообще не интересны","c":1792092749,"u":0,"b":1,"r":0},{"i":"237798429","s":"76561198159563403","g":2058,"n":52,"p":5758,"f":6172,"l":"brazilian","t":"Certo, vamo lá... Preciso começar primeiro falando que eu torci muito o nariz pra esse jogo quando lançou, por um único e simples motivo:\nNão tem sistema de criação de personagem. Os personagens são fixos em uma história fixa... E até o momento dessa análise, isso não mudou. E quando eu vi isso, eu odiei esse jogo tanto, mas tanto, que eu achei que nunca iria colocar as mãos nele...\n\nENTRETANTO...\nE bota um entretanto bem gigante nisso...\n\nResolvi dar uma chance depois do lançamento do Enhanced, depois de ver alguns vídeos que mostram uma infinidade de features e, principalmente, após conversar com um amigo e ele me convencer com a seguinte frase: \"Tu curtiu pra krl o Shadow of Mordor/Shadow of War e ele tem um boneco fixo, então da uma chance, você não vai se arrepender!\" E eu vou te falar... Nunca ouvi uma frase tão certa!\n\nPrimeiro de tudo... Como eu vou explicar esse jogo?\n\nTu curte mundos fantásticos com temáticas medievais?\nTu curte aquela estética meio Final Fantasy que mistura magia e tecnologia?\nJa imaginou poder andar de trem em uma cidade steampunk?\nJa pensou ter um mecha pra poder aniquilar exércitos inteiros?\nJa pensou em ter um dragão como pet? E uma fênix? Ou que tal um gambá fedorento?\nJa pensou em matar uma aranha gigante com um lança chamas?\nJa imaginou possuir a espada do rei arthur, as hidden blades do AC, um canhão de mão igual do Megaman e a armadura do Sauron tudo ao mesmo tempo sem precisar usar nenhum mod?\nE que tal ser um fazendeiro, poder criar porco, vaca, bode e qualquer outro bicho que vc imaginar?\nOu mesmo poder investir ouro num banco e isso te proporcionar uma renda passiva, com flutuações no mercado e tudo mais?\nAchou pouco?\nQuer voar num balão?\nQuer tirar braço de ferro num buteco?\nOu quem sabe jogar uma imitação de poker com pauzinhos ao invés de cartas?\nQuer ter uma casa e decorar ela do jeito que você bem entender?\nQuer ser um campeão da arena?\nQuer ser um mercador próspero?\nOu quem sabe um ladrãozinho safado?\nUm caçador de recompensas?\nOu um criminoso procurado?\nAh mas campos e florestas não é muito sua praia? Que tal montanhas geladas? Desertos escaldantes? Planos intermediários entre o mundo físico e o mundo espiritual?\nOu até mesmo ir parar numa selva e encontrar um dinossauro? E mais, poder fazer dele sua montaria?\nTua vibe é mais de relaxar?\nQuer sentar na beira duma montanha e ver o horizonte?\nQuer pescar vários tipos de peixes, levar pra um lago na tua base e fazer criação?\nQuer só passear por aí sem nenhum tipo de limite ou bloqueio como se fosse um walking simulator? (em um mapa com mais de 100km de extensão e vários biomas diferentes, detalhe)\nQue tal sair voando com uma capa esquisita que te deixa planar e dar uns rasantes brabos?\nOu mesmo com uma mochila propulsora e pagar de Homem de Ferro por aí?\nTu pode fazer tudo isso e muito, mas muito mais mesmo!\n\nTudo isso não resume nem 20% desse jogo... E isso sinceramente me vendeu muito mais do que um sistema de criação de personagens.\nNão vou mentir, ainda queria poder criar um bonequinho com a minha cara e poder colocar uns companions personalizados igual Dragons Dogma, mas honestamente, isso não ta me fazendo tanta falta como eu achei que faria.\n\nSobre o jogo em si, se eu puder resumir ele em uma frase, seria \"TDAH: The Game\"\n\n\"Mas o que da pra fazer nesse jogo?\"\n\"Sim\"\n\nAlém de tudo que eu ja mencionei, você tem uma exploração absurda do mundo do jogo, e cada cantinho dele te guarda uma surpresa.\nFazer as missões principais vão te liberar recursos e features, mas o mundo inteiro do jogo é totalmente explorável a partir do momento que você coloca os pés nele (só vão ter certos lugares que não vão te receber com tanta alegria assim, então cuidado).\nA exploração é fortemente recompensadora e incentivada, mas você não tem ninguém segurando sua mão ou recebendo dicas do que tem ou não tem ali. Você descobre tudo praticamente por conta própria.\nAlgumas coisas você descobre através de lore (seja conversando com NPCs, lendo livros, vendo cartazes, etc), mas boa parte do conteúdo do jogo você descobre com experimentação e tentativa.\nPor exemplo, você pode fritar carne usando o reflexo da luz do sol da tua espada. O jogo te diz isso em algum momento? Não, mas se vc resolver testar, vai dar certo.\n\nFora todo o conteúdo excessivo que esse jogo possui, ele ainda tem um visual lindo (e muito bem otimizado por tudo que oferece).\nA movimentação do jogo é uma delicinha e os combates são impactantes. Da pra sentir cada pancada que teu personagem dá ou recebe.\nTem bugs? Tem. Da pra passar batido? Tranquilamente.\nSempre tá saindo novos updates, seja de conteúdo ou correção. Eu comprei o jogo agora, mas quem comprou no lançamento diz que o jogo ja ta muito diferente (pra melhor). Então o esperado é que continuem trabalhando nele com o tempo (inclusive com uma DLC prestes a sair logo logo, expandindo ainda mais o jogo).\n\n\"Pô, que daora! E a história, como que ta?\"\nEntão... Essa parte a gente ignora kkkkkk\n\nMas com o tanto de coisa que tem pra fazer nesse jogo, você nem vai lembrar que ele tem uma história... Mas a lore dele em si é muito boa! Um pouco genérica, mas boa...\nBrigas e intrigas entre reinos, lendas de criaturas misteriosas, antigos artefatos poderosos que foram usados por heróis lendários, agora perdidos por aí\n\nDesnecessário dizer que recomendo sim o jogo. Foi um baita tapa na minha cara por não ter dado uma chance pra ele antes, mas em minha defesa, digo que adquiri o jogo no melhor momento dele. E acredito ter muito mais coisa pra melhorar.\n\nSe o preço te assusta, comprei minha cópia na Nuuvem com 50% de desconto. Recomendo comprar por lá (isso não é uma publi, mas se a Nuuvem quiser me patrocinar, tamo junto Nuuvem kkkkkk).","c":1792092640,"u":1,"b":0,"r":0},{"i":"237793700","s":"76561197981095934","g":0,"n":1,"p":6756,"f":6818,"l":"english","t":"A fun and expansive experience. Some controls are difficult for keyboard and mouse, but overall easy to play.","c":1792088460,"u":1,"b":1,"r":0},{"i":"237793641","s":"76561198022802491","g":0,"n":6,"p":11865,"f":11865,"l":"portuguese","t":"Best Game to play!","c":1792088417,"u":1,"b":0,"r":0},{"i":"237793480","s":"76561199799513935","g":16,"n":7,"p":5304,"f":5304,"l":"turkish","t":"bitmeyen oyun amk","c":1792088271,"u":1,"b":1,"r":0},{"i":"237793353","s":"76561199807152042","g":0,"n":1,"p":9335,"f":9594,"l":"italian","t":"yes dude","c":1792088160,"u":1,"b":1,"r":0},{"i":"237793291","s":"76561198011993455","g":0,"n":73,"p":8832,"f":8832,"l":"dutch","t":"will steal your life!","c":1792088103,"u":1,"b":1,"r":0},{"i":"237793139","s":"76561198261785519","g":0,"n":2,"p":2656,"f":2728,"l":"english","t":"One of the most enjoyable open world games ever made. Can't wait for the dlc to come out. ;)","c":1792087956,"u":1,"b":0,"r":0},{"i":"237792623","s":"76561198104897738","g":119,"n":6,"p":5275,"f":5360,"l":"english","t":"plays great","c":1792087522,"u":1,"b":0,"r":0},{"i":"237791586","s":"76561198161091260","g":885,"n":10,"p":24023,"f":24023,"l":"english","t":"11/10 Big up the Korean Devs","c":1792086602,"u":1,"b":0,"r":0},{"i":"237791325","s":"76561198095551354","g":0,"n":7,"p":966,"f":1085,"l":"russian","t":"Лучший открытый мир в играх, как по мне. Сюжет тоже интересный. Вот производительность мне не нравится, особенно когда приходится перезагружать игру, потому что видеопамять постепенно забивается.","c":1792086382,"u":1,"b":0,"r":0},{"i":"237787555","s":"76561198120345272","g":45,"n":20,"p":5086,"f":5414,"l":"english","t":"hot dam","c":1792083107,"u":1,"b":1,"r":0},{"i":"237786774","s":"76561199044183714","g":62,"n":9,"p":630,"f":717,"l":"english","t":"Been waiting for a game like this for so long.","c":1792082447,"u":1,"b":1,"r":0},{"i":"237786100","s":"76561198272558389","g":0,"n":3,"p":2681,"f":2681,"l":"russian","t":"Дроп после 40 часов, просто не выдержал...куча  раздражающих навязанных механик, и одна из них надоедливые головоломки, даже в сюжетных квестах. \nАльтернативы этим головоломкам нет, ты просто должен! \nПо сюжету восстанови печи, что нужно?...правильно, это головоломка: закати шары, собери лего, собери 3 в ряд...\nТут же, недалеко попадаешь в Институт, и первое же что от тебя просят?  правильно...нужно  решить головоломку!\nКуда бы ты не сунулся, то встань на плиту, то тут потри, то куб передвинь, то свечи зажги и деверь откроется...сколько можно? \nимя ей \"Puzzle Desert\"  \nЛут слабенький, специально не искал в инете, и за 40 часов не нашёл для себя ничего интересного.\nЭто всё такое же старенькое знакомое BDO, боёвка, модельки персонажа, города, лагеря, ландшафты, кони, повозки, торговцы, инвентарь, серьги, флаконы.\nСомневался перед покупкой, но красивая картинка подтолкнула купить, играл и ждал что вот вот, но чуда не произошло, и я не хочу в неё возвращаться.","c":1792081862,"u":0,"b":1,"r":0},{"i":"237782463","s":"76561199001309082","g":0,"n":2,"p":6678,"f":6776,"l":"latam","t":"Sin palabras con este juego...el mejor que jugué en años, desde que lo tengo no toqué ningun otro juego, impresionante.","c":1792078742,"u":1,"b":0,"r":0},{"i":"237782153","s":"76561197970263029","g":636,"n":31,"p":11584,"f":12009,"l":"spanish","t":"No esperaba mucho por los comentarios que habìa recibido. Pero me alegro de jugarlo, es genial en muchisimos aspectos. Tiene su mecanica y es de explorar mucho, pero una vez que le encontras la vuelta, es de lo mejor que jugue. es un stand alone sin posibilidad de coop o vs, pero con la cantidad de cheaters que hay hoy en el online se agradece.","c":1792078482,"u":1,"b":1,"r":0},{"i":"237781944","s":"76561198017033585","g":0,"n":2,"p":8632,"f":8638,"l":"polish","t":"Klasa","c":1792078295,"u":1,"b":1,"r":0},{"i":"237780659","s":"76561198385320191","g":119,"n":45,"p":2225,"f":2225,"l":"schinese","t":"剧情烂，画面也糊，但诚意十足，期待完全体","c":1792077203,"u":1,"b":0,"r":0},{"i":"237779999","s":"76561198203035082","g":0,"n":138,"p":632,"f":632,"l":"schinese","t":"前面有人概括得好，这游戏是单机化网游。主线剧情的确一般般，但我觉得比FF14和FF16的剧情要好，尤其是比FF14 7.0的剧情好得多。不过故事细节和设定做得非常好，探索时找的一些NPC事件残留影像，这些“平民日常”更好地补充了整个这个世界的细节。然后纸娃娃系统、家园系统，各种场景物品等等做得很细节。\n\n故事还不如简简单单，被货车撞到异世界，从零开始做世界之王得了，反正你loading界面的视觉特效就是穿越，游戏里也是超科技+中世纪，家园系统又做得那么细致，世界观背景设定等又做得很详细，DLC又准备进一步加强家园系统等等。简简单单的故事，再时不时恶搞下穿越剧，靠着现成的海量细节内容，不过不失的战斗系统，这不就好了","c":1792076670,"u":1,"b":0,"r":0},{"i":"237779279","s":"76561199003196967","g":0,"n":20,"p":1883,"f":2097,"l":"russian","t":"TOP","c":1792076074,"u":1,"b":1,"r":0},{"i":"237779164","s":"76561199265979672","g":0,"n":1,"p":5249,"f":5249,"l":"koreana","t":"첫게임으로 해봤는데 왜 인기가 많은지 알수있었습니다. 저의 첫게임이 붉은사막이여서 정말 의미가 있었고 즐기면서 할 수 있는 게임입니다.","c":1792075992,"u":1,"b":1,"r":0},{"i":"237778983","s":"76561198403685669","g":0,"n":4,"p":7705,"f":7705,"l":"schinese","t":"优化稀烂，不开光线重构玩不了，现在粒子特效关不掉了，位移贴图和lod切换也是突兀的很，画面还不如四五月时的版本","c":1792075818,"u":0,"b":0,"r":0},{"i":"237778901","s":"76561198101146627","g":299,"n":3,"p":17735,"f":17834,"l":"german","t":"Hallo zusammen,\n\nich habe inzwischen einige Stunden in Crimson Desert verbracht und kann viele der negativen Stimmen ehrlich gesagt nicht ganz nachvollziehen. Nach fast 300 Stunden habe ich weder die Story beendet, noch die Karte ganz erkundet.\n\nFür mich erinnert das Spiel in vielen Punkten an Skyrim: eine viel größere Fantasy-Welt, überall Tiere, versteckte Orte, Höhlen, Ruinen mit Rätseln und jede Menge Dinge zu entdecken. Oft nimmt man sich vor, einer Hauptquest zu folgen, und landet plötzlich wieder irgendwo am anderen Ende der Karte, weil eine interessante Nebenquest oder ein markanter Punkt auf der Karte/ der Skyline einen ablenkt. Genau dieses Gefühl von Abenteuer und Entdeckung macht für mich einen großen Teil des Spielspaßes aus.\n\nNach den Updates finde ich außerdem, dass auch die Story deutlich besser geworden ist, als manche Rezensionen vermuten lassen. \n\nVergleiche zu den neueren Assassin's-Creed-Teilen ab Origins drängen sich ebenfalls auf. Open World, Erkundung und Questdesign stehen klar im Mittelpunkt. Für meinen Geschmack macht Crimson Desert dabei allerdings einiges besser. Die Regionen wirken abwechslungsreicher, die Gegner sehen nicht ständig gleich aus und die Welt fühlt sich insgesamt weniger eintönig an. Es gibt unheimlich viele Systeme die man nutzen kann; aber eben auch nicht muss (Handel wie in Black Desert, Angeln, Temperaturunterschiede, zähmen von unterschiedlichen Reittieren oder Begleitern, Kopfgelder von anderen sammeln oder selbst welche bekommen). Dadurch bleibt die Entdeckungstour deutlich länger spannend.\n\nDie Steuerung wird häufig als kompliziert kritisiert. Das kann ich teilweise verstehen, wenn man wirklich jedes System und jede Kampfmechanik meistern möchte. Das muss man aber gar nicht. Man kann sich problemlos auf einen bevorzugten Kampfstil konzentrieren, ohne dadurch Nachteile zu haben. Nach einer gewissen Eingewöhnungszeit geht vieles ganz natürlich von der Hand.\n\nWas mir außerdem sehr gefällt, ist die Harmonie der Spielwelt. Die verschiedenen Gebiete wirken durchdacht, die Rätsel sind abwechslungsreich und fordern das Gehirn, ohne frustrierend zu werden. Dazu kommen schöne Landschaften, eine lebendige Tierwelt und viele kleine Details, die man erst beim Erkunden entdeckt.\n\nWas mir in diesem Spiel nicht ganz so gute gefällt ist der geringe \"Impact\" der Ausrüstung. Eigentlich kann man alles tragen. Ob Stoff, Leder oder Plattenrüstung - das macht kaum einen Unterschied. Es gibt sehr wenige Ausrüstung mit einzigartigen Effekten. Das sorgt aber eben im Stil eines Rollenspiels dafür, dass man immer so aussehen kann wie man möchte und sich nicht ärgert, weil der neue, hässliche Handschuh viel stärker ist als der eigene.\n\nUnterm Strich ist Crimson Desert für mich ein tolles Open-World-Fantasy-Spiel geworden. Wer gerne Welten wie Skyrim erkundet, Freude an Entdeckungen und Rätseln, Nebenquests und einer lebendigen Spielwelt hat, sollte dem Spiel definitiv eine Chance geben.\n\nFür alle anderen gilt: Karte aufmachen, losreiten und die Welt entdecken.\n\nViel Spaß und Liebe an euch ❤️","c":1792075757,"u":1,"b":1,"r":0},{"i":"237777900","s":"76561199081190194","g":72,"n":22,"p":8211,"f":8211,"l":"schinese","t":"好玩，，但前提是得看攻略并添加一些模组","c":1792074946,"u":1,"b":0,"r":0},{"i":"237777396","s":"76561198074572578","g":0,"n":15,"p":5369,"f":5384,"l":"german","t":"weird ♥♥♥♥ game","c":1792074515,"u":0,"b":1,"r":0},{"i":"237777160","s":"76561198347173784","g":0,"n":1,"p":1993,"f":2073,"l":"brazilian","t":"JOGO MUITO FODA!!!!! Jogo 3 horas por dia, pq trabalho e tudo mais. Cara eu fico ansioso já tem 2 meses pra chegar em casa e jogar, PQP jogo grande, bonito, divertido, com boss não tão dificeis, é a experiencia máxima de gameplay.","c":1792074321,"u":1,"b":0,"r":0},{"i":"237776881","s":"76561198741645458","g":0,"n":4,"p":985,"f":985,"l":"english","t":"10/10","c":1792074091,"u":1,"b":1,"r":0},{"i":"237774808","s":"76561198296555079","g":0,"n":1,"p":14795,"f":14898,"l":"english","t":"This is most addictive of games, I've played in years. Even after completion, you can sink hundred hours in it.","c":1792072146,"u":1,"b":1,"r":0},{"i":"237774706","s":"76561199022136596","g":0,"n":1,"p":54522,"f":54664,"l":"koreana","t":"재밌음 가끔 버그 있지만 괜찮음 새로키우기 세번째임\r\n","c":1792072058,"u":1,"b":1,"r":0},{"i":"237773288","s":"76561198367200122","g":50,"n":30,"p":468,"f":468,"l":"english","t":"I don't know how to play if game keep crashing. I tried all the fixes on Youtube and reddit but the game keeps crashing","c":1792070754,"u":0,"b":0,"r":0},{"i":"237771908","s":"76561198810004310","g":0,"n":1,"p":745,"f":882,"l":"schinese","t":"量大管饱的通马桶神作","c":1792069409,"u":0,"b":1,"r":0},{"i":"237771818","s":"76561199840357647","g":19,"n":3,"p":1835,"f":1911,"l":"english","t":"kinda slow start but it gets good really fast after the 10 hour mark","c":1792069329,"u":1,"b":1,"r":0},{"i":"237770550","s":"76561198123155286","g":508,"n":14,"p":10276,"f":10396,"l":"koreana","t":"기획자가 왜 중요한지 알려주는 게임","c":1792067997,"u":0,"b":0,"r":0},{"i":"237768081","s":"76561198264909634","g":22,"n":2,"p":985,"f":1356,"l":"schinese","t":"开放世界游戏好玩 景色也特别漂亮  缺点就是新手指导不够详细几乎没有  剧情没有深度内容","c":1792065216,"u":1,"b":0,"r":0},{"i":"237767454","s":"76561199422219100","g":0,"n":7,"p":8336,"f":8453,"l":"schinese","t":"首先，你要熬过前面很无聊的一段前置剧情，直到……第三章。","c":1792064429,"u":1,"b":1,"r":0},{"i":"237766964","s":"76561197978214705","g":0,"n":16,"p":199,"f":199,"l":"spanish","t":"bueno","c":1792063842,"u":1,"b":1,"r":0},{"i":"237766839","s":"76561198424605025","g":0,"n":30,"p":3920,"f":3943,"l":"schinese","t":"一款非常不错的游戏，要慢慢的去体验它!","c":1792063695,"u":1,"b":1,"r":0},{"i":"237765813","s":"76561198114613514","g":0,"n":19,"p":7477,"f":7506,"l":"brazilian","t":"Neste momento tenho 124 horas de jogo e não zerei ele, não cheguei nem na metade das coisas que dá pra fazer...\r\n\r\nÉ um jogo definitivo pra quem gosta de fantasia épica. Não tem como, é o GOAT","c":1792062353,"u":1,"b":0,"r":0},{"i":"237764878","s":"76561199193914202","g":65,"n":5,"p":2835,"f":2835,"l":"schinese","t":"毫无沉浸感的开放世界，充斥着神人解密和狗屎剧情，回去玩了大表哥2越发觉得这是坨屎","c":1792061147,"u":0,"b":1,"r":0},{"i":"237764662","s":"76561198019525262","g":0,"n":20,"p":13701,"f":13701,"l":"french","t":"Crimson desert\n\nprobablement le jeu le plus enervant et frustrant que je connaisse.\net pourtant, j'y joue. mais cela me met parfois autant en rage qu'un ado boutoneux germanique.^^\n\nalors pourquoi? eh bien c'est compliqué... \nnous avons la un exemplaire de rpg particulier (anciennement projet mmorpg) puisqu'il est coréen. avec des codes un peu differents du rpg occidentale. \n\n\ncommencons gentiment.\n\nparlons de ce qui ne fache pas : la carte. il y avait longtemps qu'un monde ouvert n'avait été aussi beau. cela est du niveau d'un Witcher 3 ou d'un rdr2. c'est beau et c'est grand ! on se perdrait presque ! et c'est un véritable generateur de fonds d'écran tellement ca claque! j'ai souvent mon doigt sur f12! ^^\nun énorme monde ouvert mais... pas tant que cela puisque la progression des quetes est etriqué. oui, on peut aller a peu pres partout mais il vaut mieux tout faire dans l'ordre. sinon c'est la deception assurée. un puzzle ne peut etre resolu car ce n'est juste pas le moment. mouaiche. \nmais la carte est incroyable. on sent le soin apporté et la fillialité avec le projet originel du mmorpg. cela m'a fait parfois pensé a world of warcraft. plusieurs type de régions, toutes spectaculaires.\nautre point positif, les scene cinématiques sont fabuleuses. attention! pas toutes. la réalisation sur les scenes joués sont assez mauvaises, c'est surjoué et ridicule. mais les séquences integrées aux combat sont elles, particulierement reussies et spectaculaires, même si elles cassent souvent le rythme d'un combat de boss.\non peut également dire un mot sur le doublage français car c'est cela qui a decidé a mon achat. il est correcte, sans plus. loin de certaines reussites passées comme dans The Witcher 3. mais c'est tout de même bien agréable de ne pas subir l'anglais et ses sous titres.\n\n\net la, c'est le drame.\n\ncar on se remet de cette bonne premiere impression assez vite avec l'histoire. l'action débute et... on meurt! \nDEJA????!!!\noui mais c'est le scénar! alala!!! et le scénar... fâche, tellement il est convenu et du niveau maternelle. les dialogues sont ineptes et mal rythmés et on a droit a une intro/tuto assez plate pour nous mettre dans les rails. et ce sont de GROS rails! \net deja, les premiers problémes de commandes mal expliqués commencent. et ce n'est que le début! vous allez avoir ce probléme tout du long. surtout si vous jouez au clavier. enfin non! je m'exprime mal. vous aurez des soucis de commandes quelque soit votre controleur. \nle soucis vient principalement du nombre d'action pouvant être effectué. que ce soit en combat, ou non. exemple : lors de puzzle/énigme, on doit pousser une sorte de gros piedestal. certains ne peuvent être poussés avec les bras, il faut effectuer une attaque d'estoc avec une arme a deux mains et la planter dans le bidule qui contient une fente \"prevue a cet effet\"... \net ce n'est pas l'enigme en elle même qui est compliquée. non non! c'est vraiment la façon de la résoudre! autre exemple : une image a reconstituer sur plusieurs pierre carrés. un puzzle quoi. c'est tout con a faire! mais voila, il faut un moment pour deplacer les grosses pierres et dans ce type de jeu cela doit aller vite. la, au bout de 15 mn d'essais. on lache l'affaire et on va chercher une pierre abyssale (des points de compétence ou d'amélioration d'équipement) AILLEURS ! \nbref, je n'avais jamais vu un degrés pareil de connerie dans une ergonomie de jeu! et des exemples comme cela, il y en a pléthore.\nbeaucoup, BEAUCOUP trop de choses sont inutilement complexe et brouillent l'experience de jeu.\n\nun mot sur les elements presents qui sont des Classiques des rpg et même surtout des mmorpg. nous avons des familliers, du housing et des montures. ces dernieres sont assez ratées. au debut, on vole un cheval qui sera notre premier compagnon de voyage. puis on apprend a dompter d'autres animaux (pas d'achats possibles) allant de la chevre a l'ours, j'ajoute que la methode de domptage a base de qte est assez immonde. mais bon!... \n...et puis il y a les montures volantes. enfin deux seulement. un dragon, qui s'optient via l'histoire principale et un wyverne que j'ai d'abord obtenu en tombeant sur un oeuf. outre le fait que c'est assez fabuleux de voir le paysage vu d'en haut, je suis regulierement tres agacé par la maniabilité merdique de la bestiole surtout quand je souhaite me poser. si vous avez connu world of warcraft, vous regreterez vite que pearl abyss n'est pas pris exemple sur le boulot de Blizzard. ah et une petite precision : le dragon appelé étoile noire (!) ne peux pas survoler les villes ! il vous ejecte si vous essayez. \na la poubelle le dragon! ^^\n\n\nc'est l'heure du beta test. ou du testeur bête?\n\nmais il y a pire ! si si !\nj'avais esperé avoir attendu suffisament pour avoir un jeu fini six mois apres sa sortie. et bah non! vu la longueur et la profondeur du bousin, va falloir attendre encore. comptez sur le rapport des joueurs et un sacré volume de patch! \net puis ce n'est pas du bug graphique. c'est du bug bien relou de script qui gâche le rythme, l'histoire, l'action. \nexemples : on est bloqué devant un bouton qui fonctionne mais ne déclenche pas l'action qui dois suivre. obligeant a redemarer et a charger une sauvegarde plus ancienne. ou alors quand j'essaye le systeme du commerce, je charge mon cheval d'une marchandise et je choisis un endroit ou je peut le vendre. en cours de chemin, le cheval m'ejecte et m'interdis de continuer avec lui. obligé de le rappeler d'une ecurie, perdant ainsi la moitié de mon chargement. en me renseignant, je constate que c'est un bug parmi tant d'autre. \nnon vraiment, c'est insuportable. vendre cela est scandaleux. j'ai l'impression d'avoir acheté une voiture sans roues.\n\n\nconclusion : vous avez un petit suisse? c'est pour me petit suicider!\n\ntrop buggué pour être passionnant, mais prenant tout de même grace a sa carte et sa profondeur, crimson desert souffle le chaud et le froid. il est fortement handicapé par son ergonomie indigeste, ses bugs et son scénar bricolé sans enjeux. \nil est assez rageant de devoir evoluer dans ce monde imparfait qui singe les grand rpg sans en atteindre le genoux. c'est le plaisir qui devrait nous guider. \net cela vaut un pouce rouge. \ns'il etait vendu moins cher, je serais plus tolérant. car la, on achete plein pot une oeuvre non finie. une béta. un accés anticipé.\nnon, c'est malhonnete. et je regrette mon achat.\nce jeu, c'est un peu comme si vous rencontriez un top model avec un bras, un oeil et une jambe en moins. cela reste atrayant mais vous sentez bien que cela va etre compliqué! ^^\nun jour, peut être, crimson desert sera un grand rpg.\npeut être.","c":1792060870,"u":0,"b":1,"r":0},{"i":"237762876","s":"76561198072074663","g":0,"n":9,"p":7451,"f":7451,"l":"english","t":"GOTY easy","c":1792058586,"u":1,"b":1,"r":0},{"i":"237761525","s":"76561198983189205","g":0,"n":11,"p":776,"f":776,"l":"schinese","t":"屎","c":1792056615,"u":0,"b":0,"r":0},{"i":"237761518","s":"76561199108693534","g":16,"n":1,"p":29,"f":29,"l":"spanish","t":"GODD\n","c":1792056607,"u":1,"b":0,"r":0},{"i":"237761063","s":"76561198012234593","g":0,"n":26,"p":786,"f":786,"l":"english","t":"Disappointed! \n\nCrimson Desert has a massive world, countless mechanics, and endless activities but none of it feels particularly deep or meaningful. There’s plenty to do, but quantity doesn’t equal quality. \nBeneath the impressive visuals and spectacle, the experience feels bloated, lacking the depth and polish needed to make it truly engaging. Wide as an ocean, deep as a puddle.","c":1792055955,"u":0,"b":0,"r":0},{"i":"237758853","s":"76561198623885794","g":0,"n":1,"p":346,"f":419,"l":"schinese","t":"这游戏适合那种闲的无聊，大把时间没地方花的人。","c":1792052897,"u":1,"b":1,"r":0},{"i":"237757613","s":"76561197975781625","g":0,"n":49,"p":8357,"f":8357,"l":"english","t":"Playing version 2.0 I can say this is an awesome open world game. So much content. Great open world, graphics and features. Fighting and crafting system also great.","c":1792051202,"u":1,"b":1,"r":0},{"i":"237755773","s":"76561199228775111","g":0,"n":2,"p":839,"f":934,"l":"english","t":"Not for me","c":1792048330,"u":0,"b":1,"r":0},{"i":"237754291","s":"76561198124707264","g":0,"n":7,"p":14121,"f":14121,"l":"english","t":"Crimson Desert is a fantastic adventure for anyone who enjoys exploring a massive open world, I ended up sinking way more hours into this game than I thought I had so be expected to do the same if this game sinks its hooks into you XD.\n\nOne of the biggest highlights I enjoyed is the world itself. There's so much to see and explore at your own pace, luckily (And thankfully) there is a fast travel system which does help a lot when you need to jump around the world to get to places.\n\nThe combat is another fun highlight. Between the many different random encounters out in the wilderness and the boss fights. Some of the Boss battles are particularly are quite interesting in relation to the world and lore, though I did hit a wall early on with one of the bosses it wasn’t until I spent some time gathering better armour, weapons and Abyss gear that the fights became much more easier.\n\nThe story is rather good and done in a interesting manner to nudge the player towards each region on the world map little by little when progressing through the main story though when it came to the characters I felt like the extra two you unlock through progressing the story felt kinda added on at some point during development, as I barely used them outside of their respective quests when required.\n\nThen there's the sheer amount of content that’s introduced to the player at a good pace as to not overwhelm you with so much stuff at once. From managing the camp and sending people out to gather resources, doing trading to buy and sell items all over the map, liberating locations, to solving clues and some mysteries related to the Lore of the game itself.\n\n\nThough One of the few things I disliked with Crimson desert was the criminal investigation quests that you come across in each of the major towns/cities: feeling more like a chore than anything else, though I’m not gonna deduct any points from Crimson desert because of this.\n\nOverall, Crimson Desert feels like a game of the Year for me personally, and I’m looking forward to diving back in and exploring the DLC that’s coming soon for this game to see what has been added to it.","c":1792045831,"u":1,"b":1,"r":0},{"i":"237753129","s":"76561198738104866","g":0,"n":2,"p":5943,"f":5943,"l":"english","t":"fav game ev","c":1792044049,"u":1,"b":1,"r":0},{"i":"237752754","s":"76561199802071088","g":0,"n":1,"p":315,"f":988,"l":"schinese","t":"还可以哒","c":1792043442,"u":1,"b":1,"r":0},{"i":"237752026","s":"76561198751590681","g":40,"n":1,"p":5139,"f":5233,"l":"russian","t":"One of the best games that actually makes exploring an open world fun.","c":1792042235,"u":1,"b":0,"r":0},{"i":"237751890","s":"76561198862577989","g":0,"n":14,"p":5190,"f":5547,"l":"schinese","t":"我愿称之为游戏界的臭豆腐，又臭又香的。臭的部分已经成了一部分趣味性了","c":1792042047,"u":1,"b":1,"r":0},{"i":"237751621","s":"76561198118026774","g":0,"n":38,"p":6263,"f":6263,"l":"english","t":"Good game.","c":1792041536,"u":1,"b":1,"r":0},{"i":"237750567","s":"76561199043698589","g":54,"n":6,"p":4383,"f":4511,"l":"schinese","t":"好玩爱玩，就是有些解密太恶心人了","c":1792039920,"u":1,"b":0,"r":0},{"i":"237750118","s":"76561199706646982","g":16,"n":2,"p":1642,"f":1704,"l":"schinese","t":"首先，游戏的剧情很烂，对话非常的没有必要，像白开水一样，主线是不得补推进才去推进。其次，战斗系统看着多实际上能体验的就几种，按键方面非常难受，交互非常的慢，非常的卡，boos战基本就是靠喝药打，索敌太难受了，含有主线营地一大堆小兵，真的诗人么，就主角一个人打，其他人呢，没了主角就输了么，很奇怪，我感觉这游戏玩的久很大一部分原因是因为他的基本的游戏设置很屎，导致你不得不浪费时间。再次是画面，我承认，白天的画面非常精美，探索的时候非常爽，但是黑夜非常的胡，基本啥都看不清，你只能回去睡觉，这是最烦的，非常影响游戏体验。总的来说，这游戏只能算是个探索游戏，体验体验白天的美术，基本的游戏框架太屎了，但是拿到一些帅装备真的很开心，交互的卡顿和战斗系统的设计，让你很难身临其境的探索","c":1792039225,"u":0,"b":0,"r":0},{"i":"237749563","s":"76561198041283360","g":0,"n":5,"p":904,"f":904,"l":"french","t":":","c":1792038354,"u":1,"b":0,"r":0},{"i":"237747598","s":"76561198799414778","g":0,"n":1,"p":10446,"f":10456,"l":"english","t":"really good  game would buy again","c":1792035262,"u":1,"b":1,"r":0},{"i":"237747203","s":"76561198448172498","g":0,"n":8,"p":10586,"f":10586,"l":"brazilian","t":"masterpiece","c":1792034690,"u":1,"b":0,"r":0},{"i":"237746001","s":"76561197994388091","g":0,"n":27,"p":3568,"f":3765,"l":"finnish","t":"GOTC & GOTY hands down!","c":1792032986,"u":1,"b":0,"r":0},{"i":"237744274","s":"76561198004431222","g":0,"n":66,"p":53,"f":53,"l":"english","t":"Game crashes after the main menu regardless of video settings or windows troubleshooting.  Steam also refuses to give me a refund.  Does not work on my PC or on my updated Steam Deck.  A 60$ scam disguised as a game.  Someday it might be patched to work and hopefully be on sale.  Then you can buy it as a $45 scam.","c":1792030558,"u":0,"b":1,"r":0},{"i":"237742503","s":"76561198168460046","g":0,"n":5,"p":7699,"f":8045,"l":"spanish","t":"Muy entretenido, mundo hermoso y atrapante","c":1792028058,"u":1,"b":0,"r":0},{"i":"237741671","s":"76561199403169356","g":0,"n":17,"p":1218,"f":1757,"l":"english","t":"HELL YEAHHHHHH","c":1792026938,"u":1,"b":1,"r":0},{"i":"237741460","s":"76561199164080728","g":0,"n":10,"p":4852,"f":4852,"l":"japanese","t":"[h1] クソゲーと良ゲーの行ったり来たりで疲れる[/h1]\n度重なるアプデと日本語音声が追加されてたので数ヶ月振りにやったがそれでも「なんかなぁ…」といった所が多かった、発売当初の体験も交えて話すので直っている所があったら申し訳ない。\n\nストーリー\n・強制的にパズルをやらされる場面がありクリア出来ないと進めない、パズルがたまにバグる事があり正解だったとしても反応が無くセーブ&ロードする必要が有る。\n・登場人物や組織が多く名前や役割や敵か味方なのかを覚えきれない\n・物語の背景や説明が少なく感情移入や理解しにくい\n・主人公の受け答えがはい・いいえしか喋らないタイプの無口主人公並に機械的過ぎる\n\n戦闘\n・暗殺とジャンプボタンが一緒なので暗殺しようとしたらジャンプする事が多く暗殺が不発する事が多い\n・戦闘が単調で面白みがない\n・キャラによって使える武器種が異なる\n・盾持ちのガードが硬すぎて盾を剥がすのに時間が掛かる\n・ガードを崩す為だけに掌底を多用することになり掌底ゲーになってしまう\n・攻撃を回避やガードし続けていざ反撃するという時に精神力を回避でほとんど消費している為精神力を使った攻撃が出来ない\n・特定のボスは特定のアクションをした後にのみ攻撃する事が出来るようになる仕様なので特定のアクションは何なのかを自力で探る必要がある\n・ボス戦では雑魚も普通にいる事があるので一対一の真剣勝負ではなく一対多の乱戦になりボスに集中できない\n・ストーリーでも一対一のボス戦があるのだが取り巻きに近づき過ぎると攻撃を受けこちらの攻撃は全く通らない理不尽\n・ボスが連続ガー不、回避やガードを多用して来る為泥臭い戦いになり時間がかかる\n・ボスを倒してもカタルシスよりもようやく終わった…という疲労に近い感覚になる\n\nその他にも落ちてるアイテムは一つ一つ手動で拾わなくてはいけない、一人称じゃないと取れない小さな物がある、森や山が多く木にぶつかりまくってスムーズに進めない、しゃがんでいる状態で視界に入っていないのに見つかる、スキル上げに使うアーティファクトも装備強化に必要なので好き放題に使えない、ミニマップに表示されている本やアイテムが何処の階層にあるのかが不明で探すのに時間が掛かる、気球等の召喚乗り物にクールタイムがあって使い辛い、パズルの難易度が高い物がある、マップが広く色々な所に行けるが少しでも道から外れたり近道しようとすると壁を登らないと行けない事が多くロッククライミングシュミレーターになる等と色々ある。\n\nアプデでファストトラベル地点が増えたり等したがそれでも人を選びまくるゲームである事は変わらなく、やれる事等が多過ぎるとかえってつまらないゲームになってしまうんだなぁ…と思った。","c":1792026632,"u":0,"b":1,"r":0},{"i":"237740949","s":"76561198196842002","g":329,"n":29,"p":6516,"f":6516,"l":"brazilian","t":"Resolvi dar uma segunda chance pro jogo antes mesmo do update 2.0, e é um jogo que você tem que jogar sem pressa de nada, o foco é a exploração, combate e quebra cabeças, a história não é tão forte assim para te prender, mas as mecânicas e possibilidades são.","c":1792025916,"u":1,"b":0,"r":0},{"i":"237740205","s":"76561198054293561","g":0,"n":11,"p":17776,"f":17897,"l":"english","t":"Amazing game. Graphics, optimization, combat, quality of life improvements since launch any many other additions makes this, in my opinion, GOTY. The story was lack luster and I have not replayed through it since \"Enhanced\" was released but judging by others who have it's much better. If you have not played the game it's an absolute must and should be considered one of the all time greats.","c":1792024824,"u":1,"b":1,"r":0},{"i":"237740029","s":"76561198170038811","g":61,"n":10,"p":2500,"f":3011,"l":"italian","t":"Dopo 20 anni di gaming in generale posso dire di non aver mai visto una cosa simile","c":1792024581,"u":1,"b":0,"r":0},{"i":"237739716","s":"76561198209412321","g":0,"n":10,"p":87,"f":87,"l":"english","t":"I’ve spent the vast majority of my gaming time on this lately, and it has completely sucked me in. I honestly haven’t felt this invested in a world since Skyrim. My only advice to new players is to stick with it: the opening can be a bit jarring, but it pays off massively.\nI've been playing this mostly on my Xbox , just easier to do at the moment.","c":1792024151,"u":1,"b":1,"r":0},{"i":"237738859","s":"76561198083559678","g":0,"n":11,"p":4777,"f":4777,"l":"english","t":"This game promises so much, but unfortunately, extremely frustrating and laggy controls make it nearly impossible to play. I am giving up trying to force this game to be playable when any success I've had is really more of an accident than any sort of aptitude for the game. The controls are infuriatingly inconsistent. Dodge doesn't dodge when you want it to, only when you don't need to. Same with parry. There also seems to be a delay in how the controls even register what the action is supposed to be. \n\nThis is extremely sloppy and poor game design.","c":1792022966,"u":0,"b":1,"r":0},{"i":"237737706","s":"76561198058176582","g":0,"n":5,"p":20999,"f":21392,"l":"english","t":"good game","c":1792021465,"u":1,"b":1,"r":0},{"i":"237737569","s":"76561198028145901","g":0,"n":7,"p":1481,"f":1642,"l":"english","t":"Combat in the game is like Witcher 3. The world makes me think of a blend of Tears of the Kingdom, Hogwarts Legacy, and Skyrim, but it feels populated, unlike those games. There's an element of base building I haven't really got into yet, but the game feels huge. This is one of those games you play for years. Based on my play/lifestyle, I might have been better off getting this for a console, not PC, because the game feels more natural with a game controller than keyboard/mouse. It can do both, but WASD keys for combat feel clunky to me. That, and the option to sit back on the couch to play this for hours at a time is more appealing. My dog would prefer this, too. Despite that I'm enjoying the game on PC and would recommend it to anyone with my hardware or better if they like adventure/medieval games.\r\n\r\nMy PC stats could be way better, it's crashed on me a couple times but the game is still playable without modifying the default settings.","c":1792021282,"u":1,"b":1,"r":0},{"i":"237736116","s":"76561198381940695","g":100,"n":2,"p":5941,"f":6067,"l":"french","t":"bien mais ca crash trop ca donne envie d'arreter","c":1792019459,"u":0,"b":0,"r":0},{"i":"237735935","s":"76561198244627598","g":0,"n":3,"p":109,"f":124,"l":"english","t":"Can't get this game to run. It will crash constantly when opening the map, which seems to be a common bug that was supposedly fixed a while ago. I reinstalled my Nvidia drivers, deleted cached shaders, and tried every work around on the internet for several hours. I've never had a problem getting a game to run. My system is a 4090 with a 7800x3d and 32 gigs of ram.","c":1792019227,"u":0,"b":0,"r":0},{"i":"237732577","s":"76561198127574333","g":82,"n":76,"p":55,"f":55,"l":"schinese","t":"实际游玩30分钟就已经开始产生浓厚的便意……说不上来的诡异，就横竖不觉得自己在玩一个成品游戏。50小时后开始精彩一类的说法，我是不可能尝试的，也不建议任何人尝试，毕竟赌博有害。","c":1792015017,"u":0,"b":1,"r":0},{"i":"237731699","s":"76561198040383653","g":0,"n":16,"p":1842,"f":1842,"l":"russian","t":"На 30 часах у меня кончилось терпение уже играть в эту тягомотину поэтому дропнул.\nКоротко и по делу:\nКому важен СЮЖЕТ проходите мимо, чтобы не говорили всякие обзорщики и прочие бакланы, эта такая бессвязная фигня. \nГГ - это не наёмник, это просто пустой мужичок, болванчик, который не вызывает никаких эмоций (как и все серогривые), на все реагирует сухо, уныло, эмоций почти нет кроме хмурости и послушного выполнения всякой чепухи.\nОстальные персонажи тоже не далеко от него ушли такие же болванчики, их разговоры в рамках сюжета эта унылая скукота и безсмыслица. Сюжет глобально как цель - да нормальный, но реализация полная фигня, по факту просто шакалишь по карте и выполняешь почти бессмысленную несвязанную работу. Но если по началу это было терпимо то когда начались штурмы крепостей и поселений то я понял это все, видимо так и будет продолжаться остальная часть игры.  Кстати про штурмы, не ждите здесь каких-то даже малейших тактических проявлений от разрабов или хотя бы имитации поэтапности сражений. Тут все намного проще: враги и союзники тупо спавнятся везде по всей осаждающей части карты (даже там где по логике не должны быть а именно в замке с закрытыми воротами) и декоративно дерутся друг с другом любезно дожидаясь вас. Ваша задачи в штурмах это: то 4 флага поставить, то вышку деревянную сломать (можно просто пару раз мечом резануть и она упадет) или банально убить 300 врагов итд в таком духе.\nОбычные кветы от НПС максимально унылы (принеси-убей) даже рассказывать не буду\nЧто касательно всего остального по типу графона, визуала, мира, механика итд то это выполнено очень хорошо, местами просто великолепно.\nВот прям вспоминаю сюжет и прям не хочется в игру заходить, но если все же зашёл в неё то все остальное заставляет тебя там остаться. \nоптимизация отличная, на моем стареньком 7-летнем компике идет в 75 фпс\nКак бродилка с с исследованиями и четкими драками то да ТОП, а как сюжетка то это дроп. \nВозможно допройду позже, все таки потенциал у игры и разрабов есть и он огромный.","c":1792014007,"u":0,"b":1,"r":0},{"i":"237730228","s":"76561198081086572","g":0,"n":3,"p":8147,"f":8147,"l":"latam","t":"Muy bueno y divertido","c":1792012363,"u":1,"b":1,"r":0},{"i":"237728823","s":"76561198351299342","g":0,"n":3,"p":14682,"f":14682,"l":"english","t":"It is just a great game, played it for over 200 hours now and although I cleared the main story line there is still so much to do.","c":1792010749,"u":1,"b":0,"r":0},{"i":"237728698","s":"76561198052286643","g":0,"n":4,"p":3169,"f":3303,"l":"german","t":"Eines der bester Spiele der letzten Jahre. Einzigartig! Andere Publisher sollten sich an diesem Werk ein Beispiel nehmen.","c":1792010621,"u":1,"b":1,"r":0},{"i":"237727602","s":"76561198118130506","g":0,"n":7,"p":1053,"f":1650,"l":"italian","t":"I befriend a pigeon","c":1792009498,"u":1,"b":0,"r":0},{"i":"237727261","s":"76561199275153598","g":288,"n":70,"p":388,"f":537,"l":"turkish","t":"Efsane","c":1792009152,"u":1,"b":0,"r":0},{"i":"237727003","s":"76561198862706021","g":0,"n":6,"p":4610,"f":4610,"l":"russian","t":"Эта игра просто потрясающая. Я очень давно не получал такое удовольствие от игр, а когда узнал что выходит крупное обновление то взял и без сожаления удалил свои сохранения даже не закончив игру чтобы заново погрузится в этот мир, уже с доработанным сюжетом и новым контентом.\n К этой игре есть только один минус я очень неплохо знаю английский и диалоги не совпадают с русскими субтитрами очень сильно. Поэтому просьба к разработчикам проработайте хорошенько перевод на русский язык.","c":1792008894,"u":1,"b":1,"r":0},{"i":"237726900","s":"76561198970470552","g":0,"n":4,"p":4943,"f":4943,"l":"english","t":"The game has become bricked since last update, do not get this game.","c":1792008799,"u":0,"b":1,"r":0},{"i":"237725929","s":"76561198117234159","g":304,"n":9,"p":2007,"f":2007,"l":"russian","t":"Почему это вообще любят? \nМир скучный хоть и живописный. В мире нет ни глубины ни лора за которым бы хотелось следить. Персонажей как таковых вообще нету, ибо разрабы видимо по привычке наклепали стандартных мморпгшных квестгиверов без характера (да, есть 3 доходяги из лагеря серогривых но одна черта характера не является характером). \nБоевка однокнопочная и никакие гравировки не меняют ваш бесконечный спам левой или правой кнопкой мыши.\nСюжета как такового нету, первые 15 часов игры гг просто шатается без дела по Эрнанду, а потом случайно спасает золотой лист и строит свой лагерь, а потом вовсе главы превращаются в дейли победу злодея дня. \"Блин там злой чел убивает людей\" -> ты идешь к челу -> встречаешься с челом в крутой катсцене -> мы убили злого чела.\n\nЕсли это улучшенная версия, мне грустно за тех кто играл на релизе.","c":1792007858,"u":0,"b":1,"r":0},{"i":"237723286","s":"76561197963539327","g":36,"n":6,"p":13185,"f":13185,"l":"swedish","t":"Amazing game!","c":1792005288,"u":1,"b":1,"r":0},{"i":"237720884","s":"76561198365741775","g":1601,"n":15,"p":6463,"f":6869,"l":"english","t":"Without any spoilers: An absolutely stunning game that I can't get myself to hate. I don't understand all the hate towards the storyline, it's actually not bad at all.\n\nAnyway to hell with the main story, that's not why you're gonna sink hundreds of hours. The beautiful & glamorous sceneries. That's what'll get ya! Not to mention, I play on an ultrawide screen. 10/10 immersion.  \n\nAlready preordered the DLC. Unfortunately, I absolutely hate THE cooldown. Again, without any spoilers, DEVS, you know what cooldown I'm talking about. Absolutely disgusting. Despite that, I still can't recommend this game enough. It's THAT beautiful. Just fix this please.\n\nBanger game.","c":1792003019,"u":1,"b":1,"r":0},{"i":"237720241","s":"76561198034070835","g":0,"n":30,"p":10768,"f":10768,"l":"russian","t":"Игра пушка. Только один большой минус - это бездна. Лучше бы ее ваще не было","c":1792002411,"u":1,"b":1,"r":0},{"i":"237717821","s":"76561197962624598","g":4854,"n":41,"p":521,"f":1040,"l":"english","t":"Toss a coin to your Greymane","c":1792000182,"u":1,"b":0,"r":0},{"i":"237715765","s":"76561198065639684","g":724,"n":117,"p":800,"f":800,"l":"english","t":"What can I say... I guess it's a solid game.\nIf something, it certainly has a ton of content.","c":1791999202,"u":1,"b":0,"r":0},{"i":"237711825","s":"76561198406156239","g":0,"n":1,"p":13433,"f":13638,"l":"english","t":"just all i could hope for and more, not without flaws but amazing regardless.\r\n","c":1791996470,"u":1,"b":1,"r":0},{"i":"237711010","s":"76561198886046416","g":106,"n":8,"p":1455,"f":1581,"l":"english","t":"tree go boinggg 5\\5","c":1791995707,"u":1,"b":0,"r":0},{"i":"237710484","s":"76561199832638410","g":0,"n":2,"p":2129,"f":2316,"l":"german","t":"20h einspielen und dann wird´s geil! :D","c":1791995240,"u":1,"b":1,"r":0},{"i":"237709423","s":"76561197961347740","g":0,"n":14,"p":13566,"f":13566,"l":"english","t":"Wait until all issues have been fixed. \r\n\r\nAs of update 2.0.3, there are still BIG problems with this game, even if it does do amazing things.\r\n\r\nI'm so tired of walking around and trying to understand what the game wants of me that it has affected my enjoyment of other games that ask even a little bit of exploration and problem solving. \r\n\r\n","c":1791994200,"u":0,"b":1,"r":0},{"i":"237708730","s":"76561199874351017","g":0,"n":1,"p":9065,"f":9235,"l":"koreana","t":"갓겜","c":1791993569,"u":1,"b":1,"r":0},{"i":"237707536","s":"76561198648748024","g":7,"n":1,"p":2068,"f":2068,"l":"schinese","t":"可以就是bug多","c":1791992487,"u":1,"b":1,"r":0},{"i":"237706899","s":"76561199134989960","g":143,"n":10,"p":656,"f":682,"l":"polish","t":"To najgorsza gra na rynku. Jesli ktos ja poleca, nie sluchaj. Nie warta kupna. Nic w niej nie dziala.","c":1791991927,"u":0,"b":1,"r":0},{"i":"237706097","s":"76561198375803454","g":0,"n":4,"p":613,"f":613,"l":"schinese","t":"画面太模糊","c":1791991211,"u":0,"b":0,"r":0},{"i":"237704968","s":"76561199479834946","g":110,"n":19,"p":3611,"f":3659,"l":"english","t":"It’s hard to describe this game because it’s really multiple games in one. You can do practically everything: fight, solve puzzles, hunt, trade, fly, mine, cook, and even visit a bar to play cards or arm wrestle.\r\n\r\nThe first 10 hours are rough—there are so many mechanics to learn, and it isn't very fun at first. I almost quit, but I'm so glad I didn't.\r\n\r\nThe sheer amount of freedom you have with your playstyle, build, and exploration is huge—bigger than you can imagine. On top of that, the scenery is incredible. It has the best visuals I’ve ever seen in a video game; just exploring the world is enjoyable on its own.\r\n\r\nIt’s an absolute masterpiece. It might not be for everyone, but as a complete package—from the gameplay and graphics to the overall feeling it gives you—it’s the best game I’ve ever played.\r\n\r\nOverall Rating: 10/10","c":1791990164,"u":1,"b":0,"r":0},{"i":"237704483","s":"76561199858984291","g":0,"n":3,"p":1275,"f":1525,"l":"thai","t":"เล่นเพลินภาพสวย","c":1791989733,"u":1,"b":0,"r":0},{"i":"237704078","s":"76561198732621672","g":0,"n":1,"p":8676,"f":8676,"l":"russian","t":"Масштаб мира впечатляет. Самый красивый открытый мир.","c":1791989368,"u":1,"b":0,"r":0},{"i":"237703841","s":"76561198203533712","g":0,"n":42,"p":6585,"f":6651,"l":"koreana","t":"최대 플레이타임을 기록한 게임. 판타지 시뮬레이터라고 보아야 한다.","c":1791989163,"u":1,"b":1,"r":0},{"i":"237703838","s":"76561199871411193","g":0,"n":1,"p":4437,"f":4751,"l":"english","t":"9 out of 10 without puzzles \n\n3 out of 10 with puzzles \n\nPlease dont ever make a game with puzzles again. Extremely boring no meaning just waste of time. I even like searching things up but these puzzles are just boooringgg","c":1791989161,"u":1,"b":1,"r":0},{"i":"237703774","s":"76561199523030243","g":92,"n":1,"p":4098,"f":4696,"l":"schinese","t":"交互系统一坨.想开个地窖门都开不开根本没有交互按钮。一直在干我不想干的事","c":1791989103,"u":0,"b":0,"r":0},{"i":"237703502","s":"76561198417963739","g":0,"n":2,"p":7260,"f":7662,"l":"koreana","t":"그냥 세상이다.","c":1791988856,"u":1,"b":1,"r":0},{"i":"237703220","s":"76561198118777479","g":0,"n":2,"p":3488,"f":3694,"l":"koreana","t":"그래픽: 좋음\n스토리: 좋음\n액션성: 좋음\n퍼즐: 좇같다 플탐늘리기용 같은데 게임 몰입만 방해하고 아무 쓰잘데기없는 요소임","c":1791988603,"u":1,"b":1,"r":0},{"i":"237701721","s":"76561199214640087","g":0,"n":12,"p":13822,"f":14240,"l":"english","t":"I enjoy the game,mind you there are still some issues, like sound, sometimes it would cut out and get nothing,this would last thru the whole playthru,mind you still get back ground noise, sometimes Kliff loses his voice and the flying , theres no sound. Hopefully they can fix it in the future.","c":1791987244,"u":1,"b":1,"r":0},{"i":"237700604","s":"76561198008415661","g":140,"n":12,"p":3270,"f":3270,"l":"french","t":"Crimson Desert est une véritable claque ! Le monde ouvert est magnifique, immense et incroyablement immersif. La direction artistique est superbe, les environnements sont variés et chaque exploration donne envie d'aller toujours plus loin pour découvrir ce que le jeu nous réserve.\r\n\r\nLe système de combat est excellent, avec des affrontements dynamiques, spectaculaires et vraiment satisfaisants. La richesse des activités, le souci du détail et la liberté offerte au joueur rendent l'aventure extrêmement prenante. On sent l'ambition des développeurs et l'énorme travail derrière ce projet.\r\n\r\nCrimson Desert est une expérience grandiose, généreuse et mémorable, qui donne constamment envie d'y retourner. Un jeu dans lequel on peut facilement se perdre pendant des centaines d'heures sans voir le temps passer. Une excellente surprise et une vraie réussite que je recommande vivement aux amateurs d'action, d'aventure et de monde ouvert !","c":1791986160,"u":1,"b":0,"r":0},{"i":"237699359","s":"76561199087342018","g":0,"n":2,"p":8465,"f":8484,"l":"koreana","t":"좆같은 게임 미로숲 최적화나 해라 병신 같이 안개 존나 자욱하게하고 최적화도 안되서 시발 떨어질때마다 다시 해야되는거 좆같네","c":1791984965,"u":0,"b":1,"r":0},{"i":"237698634","s":"76561198621716222","g":0,"n":1,"p":594,"f":1236,"l":"koreana","t":"재밌어","c":1791984215,"u":1,"b":1,"r":0},{"i":"237698236","s":"76561199579211200","g":0,"n":2,"p":5331,"f":5604,"l":"german","t":"Über all die Dinge wie Spielewelt, Grafik, Sound, Story etc. haben andere Zocker schon genug geschrieben, deshalb beschränke ich mich auf meine absoluten Negativ-Kritikpunkte, die mich dermaßen stören, dass ich das Spiel schon etliche male beendet habe und nur dann weiterspielen konnte, nach dem ich mich wieder etwas beruhigt habe.\r\n1. Die Steuerung ist dermaßen misslungen und schlecht, dass ein flüssiges Spielen selbst unter einfachsten Bedingungen nicht möglich ist. Man läuft in der Spielewelt herum und gelangt vor irgendeinem Hindernis. Das kommt öfter vor, als man beim Laufen atmet! Dann wird nicht nur das Laufen unterbrochen, sondern auch alles andere. Selbst Ziegen und Schafe, die ansonsten an einem Vorbeilaufen, machen hier den Eindruck, als würden sie dann den Spieler absichtlich blocken. Und selbst dann, wenn man irgendwie an einem Hindernis vorbei ist, läuft der Charakter nicht weiter und man muss nochmals die Taste fürs laufen betätigen.\r\n2. Ständig bleibt die Spielfigur beim Klettern an den kleinesten Steinen stehen und unterbricht somit das Klettern. Dann muss man das Klettern erneut per Tastendruck betätigen. Das kommt aber so oft vor, eigentlich ununterbrochen und immer wieder nach nur 1-2 Sekunden, dass das irgendwann unglaublich nervt! Wieso klettert der Penner nicht einfach weiter? Wieso läuft er nicht einfach weiter? Wieso muss ich nach jedem kleinen Strohhalm immer und immer wieder Laufen betätigen?\r\n3. Die Steuerung ist dermaßen überladen und solch eine Katastrophe, dass man mind. 50% der Fälle Dinge tut, die man gar nicht beabsichtigt hatte. Man springt, obwohl man schlagen wollte, man schlägt, obwohl man ausweichen wollte, man knallt auf den Bauch, obwohl man springen oder gleiten wollte...\r\n\r\nOkay, das Spiel ist wirklich faszinierend und man möchte auch immer weiter spielen.\r\nDoch kaum hat man sich dazu aufgerappelt, es wieder zu spielen, steht man wieder und wieder vor irgendeiner völlig bekloppten Steuerungsoption.\r\nIch stehe vor einer Wand, die glänzt, kann diese bescheuerte Wand aber weder mit Waffen noch mit Fäusten zerstören. Ich muss irgendeinen dämlichen Lichtstrahl darauf lenken und dann im richtigen Moment dies und das tun.\r\nDas ist keine durchdachte Steuerung, das ist eine extrem nervige Störung des Spielflusses. Und das immer und immer wieder.\r\nIch glaube, das größte Problem bei der Entwicklung dieses Spiels waren die Entwickler selbst, die es während der Progammierphase immer wieder selbst getestet haben.\r\nLiebe Entwickler, stellt Leute als Tester vor eure Rechner, die nicht in die Entwicklung selbst involviert waren und nicht genau wissen, was sie selbst wie beabsichtigt haben.\r\nLasst eure Spiele von Leuten testen, die nichts mit der Entwicklung selbst zu tun hatten und das Spiel spielen, wie jeder gewöhnliche Zocker auch.\r\nDann merkt ihr vielleicht auch, dass es mit die schlechteste Idee ist, Leuten euer Projekt testen zu lassen, das sie selbst programmieren!\r\n\r\nOhne all diese, wirklich unfassbar oft vorkommenden und extrem nervigen Steuerungsprobleme wäre das Spiel eine reine 9/10. So aber kriegt es von mir nicht mehr als eine 4/10! \r\nWieso?\r\nWieso sollte ich einem Spiel mehr Punkte verleihen, wenn es mich am Spielen selbst und das ständig und ununterbrochen hindert?","c":1791983820,"u":0,"b":0,"r":0},{"i":"237697382","s":"76561198132066311","g":497,"n":21,"p":3340,"f":3831,"l":"brazilian","t":"O ponto mais fraco de crimson desert é a história, que diga-se de passagem, foi até melhor do que eu esperava. mas nao deixa de ser o ponto mais fraco.\nPorem no quesito graficos, ambientação, atmosfera e imersão, é excepcional.\nCom certeza, não é um jogo pra todo mundo.\nMas pra quem souber aproveitar o que tem a oferecer, SEM PRESSA, vai gastar mts horas ai.\n\nA muito tempo desde de the witcher 3 um jogo não me fazia ficar sentado so aproveitando a paisagem.","c":1791982980,"u":1,"b":0,"r":0},{"i":"237694434","s":"76561198074925191","g":109,"n":39,"p":5802,"f":5802,"l":"schinese","t":"只能说制作组还要再好好研究下开放世界，不是光缝合就能缝出来3A大作，需要改进的地方实在太多了，空洞的开放世界，零分的人物塑造，稀烂的操作手感，无聊的战斗，莫名其妙的解密。你问我剧情怎么样，神马，这游戏居然有剧情吗？？","c":1791979673,"u":0,"b":1,"r":0},{"i":"237693594","s":"76561198017335719","g":0,"n":2,"p":10923,"f":12704,"l":"english","t":"Wide as an ocean, deep as a puddle. It's easy to get lost in this game for long hours. Well made, regularly updated. Plays very well on my specs.","c":1791978640,"u":1,"b":1,"r":0},{"i":"237692058","s":"76561199204482611","g":42,"n":2,"p":694,"f":780,"l":"schinese","t":"henduokewan","c":1791976721,"u":1,"b":0,"r":0},{"i":"237691195","s":"76561198161226256","g":31,"n":1,"p":32198,"f":33662,"l":"brazilian","t":"Marcar um ponto do mapa, um pouco distante e no meio do caminho encontrar dezenas de situações interessantes é um dos prazeres deste jogo. Uma quantidade absurda de surpresas... claro que se a história fosse mais conectada seria bem melhor, mas é um detalhe. Outro ponto, o jogo desafia o tempo inteiro, não é o desafio de apertar um monte de tecla, mas pede para vc pensar um pouco, me lembra os jogos antigos.","c":1791975568,"u":1,"b":1,"r":0},{"i":"237690990","s":"76561199235345234","g":145,"n":3,"p":8093,"f":8093,"l":"turkish","t":"ömürlük oyun. Keşke hikaye bu kadar bölünmese.","c":1791975264,"u":1,"b":0,"r":0},{"i":"237690973","s":"76561198302146579","g":0,"n":6,"p":6259,"f":6259,"l":"english","t":"Probably the most \"Mid game\" I have ever played, a solid 6/10 on a good day. The main issues with the game is quite simply how unintuitive everything is and how piss poor the story is. One notable example is how stupid the wagon system is , if at any point you wanted to take your wagon and fast travel to the nearest city to sell your goods, you will lose around 75% of your inventory. Like okay? so my choices are to either spend 30 to 40 minutes driving a wagon that barely works with how awful the controls are and how awful the map is designed, or waste my time by buying hundreds of silver of inventory trying to sell it and lose it all for the hell of it. \r\n\r\nNow imagine this exact scenario but tied to every aspect of the game from inventory management, to the \"Combat\", to the puzzles everything is super unintutive and you will spend half the time looking on youtube how to do basic stuff since nothing is explained. The combat literally is just you one shotting mobs, or bosses stun locking you while you ragdoll around. \r\n\r\nThe worst part of the game is easily the story, you play as Kliff a literal lobotomized idiot who only responds in yes, all right or grunts. Apparently this was done on purpose and not for the lack of talent on the writing team. The entire story can be summarized as people telling the lobotomy victim  to go clean a chimney or go fight an entire army over the hill or go to town and tell someone something for me. That is what you will do for 99% of quests and nothing will ever be different. \r\n\r\nI put over 100 hours into this game, and while it has its fun moments, this is just one of those games that exists to waste your time, mind you this story review was after the rewrite that apparently happened but I cant imagine how bad it was if this is the improved version.","c":1791975236,"u":0,"b":1,"r":0},{"i":"237690742","s":"76561199758367686","g":89,"n":5,"p":333,"f":337,"l":"schinese","t":"发布到steam上却和steam有冲突，也不知道什么时候修复，建议过两年解决完bug再玩\r\n","c":1791974959,"u":0,"b":0,"r":0},{"i":"237690473","s":"76561198400520137","g":42,"n":2,"p":3696,"f":4444,"l":"schinese","t":"近些年最美的开放世界作品，除了解密一坨狗屎，其他可以说是小瑕疵。","c":1791974600,"u":1,"b":1,"r":0},{"i":"237688944","s":"76561199554868252","g":0,"n":2,"p":13813,"f":14868,"l":"english","t":"The controls are unnecessary complicated (e.g., why can't it be just one button for interaction?), game also feels a bit unfinished in terms of quests. Did anyone actually test all of them before release? There's a lot of jumping and holding on to things but the mechanics are weirdly clunky. I don't need holding hands, but would be nice to have at least SOME clues how to finish the puzzles etc. I would call this overall a very frustrating experience. I've had to watch countless YouTube videos of how to do things in precise order, because I do not want to waste hours of my time trying to figure it out. I do have a lot of hours in regardless of being annoyed most of the time, I am just very stubborn to get through it hence I bought it. It has it's moments of course, game is pretty and there are also enjoyable quests. The best part is just wandering around.","c":1791972552,"u":0,"b":1,"r":0},{"i":"237688470","s":"76561198437268397","g":0,"n":1,"p":2158,"f":3350,"l":"schinese","t":"量大管饱,直接玩的增强版体感还行","c":1791971939,"u":1,"b":0,"r":0},{"i":"237687688","s":"76561198408966604","g":98,"n":9,"p":563,"f":1097,"l":"russian","t":"Не любитель сюжетных игр. Проходил разве, что с удовольствием РДР2. Долго не мог найти во что поиграть и тут попалась данная игра. Изначально, мне друг ее советовал, но после 10 мин я вышел. Решился снова и на данный момент я просто не могу оторваться, данная игра по моему мнению даже переплюнула РДР2.  Я сам фанат РДР2 и мне нравится графон у РДР. Но тут я просто в восторге, да и квесты и сюжет интересен, очень много механик. Играю в 2к на ультрах. Картинка нравится. С трассировкой лучей и длсс 4.5л фпс примерно 50-55. С генерацией кадров фпс на много выше, в принципе даже хватает 2х. Рекомендую данную игру. По моему мнению цена сильно кусается, но живем один раз.","c":1791970788,"u":1,"b":0,"r":0},{"i":"237687170","s":"76561198353992608","g":0,"n":1,"p":3066,"f":3464,"l":"polish","t":"goated","c":1791970073,"u":1,"b":0,"r":0},{"i":"237687150","s":"76561198847205950","g":626,"n":79,"p":80,"f":80,"l":"russian","t":"Для Енхенсд версии это кал без RTX на максимум нет смысла играть ибо броня за делюкс выглядит либо как мыльный пластик либо как фольга с прыгающими на ней квадратиками теней-света да и другие железки тоже типы сидят вдвоём на одном стуле дрыгающийся текст в настройках потому что не влезают а сократить не доумились огонь и дым это просто кал на кинематографичных настройках в 2к про минюинг  вообще молчу","c":1791970045,"u":0,"b":1,"r":0},{"i":"237687132","s":"76561198125401532","g":51,"n":3,"p":2124,"f":2750,"l":"schinese","t":"like","c":1791970008,"u":1,"b":1,"r":0},{"i":"237686994","s":"76561199127379910","g":0,"n":6,"p":7892,"f":8111,"l":"english","t":"didn't disappoint","c":1791969816,"u":1,"b":0,"r":0},{"i":"237685625","s":"76561199007273216","g":0,"n":10,"p":731,"f":782,"l":"english","t":"I will keep it short and simple.\r\n\r\nI initially played roughly 500 hours of crimson desert on ps5, later on I had a friend nice enough to share the game with me via xbox store, after I sold my ps5 for a good pc since crimson desert suffers in performance on ps5/ps5 pro.  On the xbox store via my pc, I spent an additional 119 hours on the game after finally purchasing crimson desert on steam and getting my entire save file via cross save, over to steam.\r\n\r\nTo sum it up, thats how good this game is, thats how content rich this game is and thats how good its combat and visuals are. And this isnt even the end, the DLC is coming in a matter of 2 weeks as I write this review.\r\n\r\n9/10, a new industry standard for an open world game, making games like rdr2 and elden ring look like small children (I do not exaggerate, I have finished both those games).","c":1791967744,"u":1,"b":0,"r":0},{"i":"237685160","s":"76561199887160056","g":25,"n":1,"p":738,"f":938,"l":"schinese","t":"这游戏出来这么久了
