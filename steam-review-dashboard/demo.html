"i":"237661904","s":"76561198087620643","g":0,"n":4,"p":2339,"f":2486,"l":"english","t":"SOOOOOOOOOOOOOOOOOOOOOOO MUCHHHHHHHHHHHHH TO DOOOOOOOOOOOO. Really good game. However this will require you to stop playing anything else and focus but there is nothing you cannot do in this game","c":1791932266,"u":1,"b":0,"r":0},{"i":"237660922","s":"76561198039541230","g":0,"n":24,"p":2368,"f":2368,"l":"english","t":"Absolutely amazing beyond words. Should win GOTY.","c":1791931035,"u":1,"b":1,"r":0},{"i":"237660211","s":"76561197970477239","g":0,"n":126,"p":12252,"f":12601,"l":"english","t":"Instantly one of my favourite games of all time. \nI have not been as completely immersed in an open world like this since I stepped off the boat in Seyda Neen in Morrowind back in 2002. I can't believe that I have finished the story and not even touched the desert. \nNo ten hours with this game are the same as the last - it's just a blast.\nTip - spend as much time as you can in first-person, just soaking in the world, there are not many as detailed and beautiful as this.","c":1791930236,"u":1,"b":0,"r":0},{"i":"237657636","s":"76561198006554885","g":0,"n":41,"p":916,"f":916,"l":"brazilian","t":"After playing for 15 hours, I can't see the game's appeal\r\nFor me, the combat is shallow and way too linear: keep a button pressed and watch you destroy every enemy, everytime \r\n\r\nVisuals are gorgeous and the world is big but not enough to keep me playing it","c":1791927285,"u":0,"b":0,"r":0},{"i":"237655571","s":"76561199273808611","g":0,"n":18,"p":1107,"f":2031,"l":"koreana","t":"일단 퍼즐은 엿 같은데 그걸 제외하면 재미있네요. 그렇지만 NPC 로딩으로 인해 투명 상태로 길이 막히는 버그, 클리프(주인공)의 목소리 파일이 깨져 어느 순간 부터 클리프의 목소리 출력이 나오지 않는 것 같은 문제가 있습니다.\n우선적으로 저런 버그가 고쳐지는게 우선 되어야 봅니다. 아 추가로 맵 로딩 덜 되면 안 이동되는것도 있네요","c":1791925300,"u":1,"b":1,"r":0},{"i":"237655315","s":"76561198316226082","g":0,"n":4,"p":257,"f":1379,"l":"koreana","t":"좀 더 성인이 즐길만한 성인 컨텐츠좀 있었음 싶음...너무 게임이 온라인 게임 같음...레데리 보면 디테일이 살아 있는 성인용 컨텐츠 많은데 참고좀 해봐요 ㅋㅋ","c":1791925102,"u":1,"b":0,"r":0},{"i":"237655218","s":"76561199219248118","g":0,"n":3,"p":8237,"f":8237,"l":"german","t":"mega geiles Openworld game","c":1791925010,"u":1,"b":0,"r":0},{"i":"237653969","s":"76561198015228239","g":0,"n":3,"p":6223,"f":6223,"l":"german","t":"Das Spiel ist einfach Großartig!!! Es hat einfach alles was ein Open World RPG haben muss. Eine super Story ein Haufen Beschäftigungen, der Schwerpunkt liegt ganz klar bei der Erkundung der Welt. Die Grafik ist so ziemlich die beste die ich in letzter Zeit gesehen habe, es sieht einfach wow aus ich habe das vergnügen das Spiel auf Cinematic Einstellungen in Ultra Wide spielen zu können (Ihr könnt gern die Screenshots auf meinem Profil anschauen) die Weitsicht und der Detailgrad ist atemberaubend lasst euch nicht von den schlechten Bewertungen hier davon abbringen. Wer ein echt gutes RPG such ist hier genau richtig!!!","c":1791923780,"u":1,"b":1,"r":0},{"i":"237653376","s":"76561198195863723","g":0,"n":2,"p":1492,"f":2027,"l":"english","t":"Absolutely incredible game! Stunning graphics, an immersive open world, satisfying combat, and endless things to discover. The freedom and attention to detail are impressive. Every time I play, I lose track of time. One of the best gaming experiences I’ve had in years. Highly recommended!","c":1791923243,"u":1,"b":1,"r":0},{"i":"237653302","s":"76561199277975888","g":41,"n":19,"p":669,"f":1957,"l":"turkish","t":"ii","c":1791923177,"u":1,"b":1,"r":0},{"i":"237652490","s":"76561198240819146","g":114,"n":14,"p":3340,"f":3870,"l":"english","t":"One of the best Single Player RGB of all time! I'm impressed. And it works so smoothly without any issues, bugs, crashes or glitches.\r\n10+","c":1791922425,"u":1,"b":0,"r":0},{"i":"237651264","s":"76561198299304588","g":183,"n":42,"p":3175,"f":3175,"l":"english","t":"GOTY","c":1791921188,"u":1,"b":0,"r":0},{"i":"237651263","s":"76561198015508421","g":0,"n":4,"p":11986,"f":11986,"l":"german","t":"Still in Hernand but 10/10","c":1791921187,"u":1,"b":1,"r":0},{"i":"237650649","s":"76561199013004934","g":0,"n":6,"p":6304,"f":6762,"l":"english","t":"it fun","c":1791920588,"u":1,"b":0,"r":0},{"i":"237650137","s":"76561198625073648","g":0,"n":1,"p":299,"f":299,"l":"english","t":"probably wont get bored of this game ever","c":1791920104,"u":1,"b":1,"r":0},{"i":"237649601","s":"76561198131888601","g":0,"n":522,"p":400,"f":400,"l":"english","t":"Everything about Crimson Desert is just \"perfectly average\" in a way I couldn't care less about.","c":1791919628,"u":0,"b":1,"r":0},{"i":"237649368","s":"76561199214409492","g":0,"n":1,"p":1635,"f":2484,"l":"english","t":"very fun","c":1791919434,"u":1,"b":0,"r":0},{"i":"237648375","s":"76561198137321181","g":654,"n":14,"p":3616,"f":3616,"l":"english","t":"Really glad I waited for a sale, not because of the quality, but because I got to feel like I got an incredible game at a deal.  I bought this during a 20% off sale right when the 2.0 update released, and it immediately grabbed me, and I put in 60 hours in 2 weeks.  While other game releases (Fire Emblem Fortune's Weave) pulled me away, I absolutely intend to jump back into this crazy world once the DLC drops at the end of October.  Highly recommend.  It's not without quirks though, just be aware, you'll probably have to play with settings to get it to run smoothly no matter what you're playing on, and it is a little clunky and janky, like most big open world fantasy rpgs tend to be, but it has some very strong identity, and some incredibly cool set pieces and locations.  The world is gorgeous, the enemies are actually pretty damn cool, and there's a lot of wild stuff you can find just wandering around.  And if you love walking around a huge world and finding secrets and free loot and things hidden (spoiler-not-spoiler since there are so many) behind literal waterfalls or deep in caves or other cool locales, this game will absolutely speak to your inner loot goblin.  The controller movement took me a minute to get used to, haven't had anything make me use R1/RB to run in a very long time, but once I got the hang of it, it doesn't feel that bad.   Still occasionally crouch instead of sprinting because I forgot and clicked the stick, but other than that it feels pretty good.  Combat is simple enough to jump in but nuanced enough to have some depth, so that's good, and you do have some potential to \"get good\" with parries and things, but they're not mandatory.  I'm not nearly as far into the story at 60 hours as I should be, I spent a LOT of time just wandering across the map looking for random cool drops I saw in youtube videos.  Just an absolute ton of content, even if the story is a little weird.  The exploration and mechanics more than make up for the slightly rough story presentation, and I'm hoping that it will continue to improve with future updates and maybe even more dlc.  Highly recommend, probably one of the best open world games I've played in a very long time.  Also, it plays on EVERYTHING, even natively on MacBook Pro M5, I've had it running on my AMD desktop, and my Nvidia/Intel laptop.  Like I said, it takes some tinkering, but it does work, and there is something huge to be said about that.  Check it out, I don't think you'll be disappointed if you like this type of game.  Might wait for a sale or bundle at this point with the dlc though, save a little extra cash, but definitely don't skip this one!","c":1791918566,"u":1,"b":1,"r":0},{"i":"237647500","s":"76561199008389942","g":0,"n":1,"p":13264,"f":14184,"l":"english","t":"one of the best games currently on the market, graphic are second to none gameplay and story line are brilliant and the open world map which allows for exploration in the early stages of the game what more can you ask for","c":1791917769,"u":1,"b":1,"r":0},{"i":"237646505","s":"76561198831429824","g":250,"n":25,"p":9016,"f":9082,"l":"english","t":"Solid game. The gameplay and the exploration is amazing, and the visual fidelity can be beautiful, but ugly at some times of day or usually anywhere indoors. It can only be fixed by using either ray reconstruction or ray regeneration, which can cut performance in half, so its a hit or miss. The story was definitely a second thought from the developers, as it didn't really leave much of an impression imo. The soundtrack is pretty good too, very Witcher-esque.","c":1791916903,"u":1,"b":1,"r":0},{"i":"237646200","s":"76561199278161854","g":0,"n":6,"p":3402,"f":3402,"l":"russian","t":"Мир большой, в мире ничего не происходит, совсем.\nСюжет на коленке написан.\nБоевка не ощущается совсем, просто 0, можно, конечно, выкрутить сложность, но это только даст хп и урон противнику и все.\nСкука одним словом.\nМб кто то подумает, что не за боевкой пришли, тоже так думал, огромный мир, действительно огромный, есть лисы, кролики, рыба там всякая, дракон, люди, а что с этим делать?\nУ меня недалеко от дома растет дерево, могу срубить, что то построить чувствуя при этом многообразие эмоций.\nВ игру захожу ради интересной истории, вызова, новых ощущений.\nТут нет ничего из этого, совсем.","c":1791916628,"u":0,"b":1,"r":0},{"i":"237644122","s":"76561198138586737","g":0,"n":16,"p":5767,"f":6037,"l":"russian","t":"Игра большое обучение. Наверное, только к концу поймешь, что игра началась. Столько мелочей и деталей, от общего к частному, сначала видишь огромную пёструю непонятную картину, и только спустя сто часов начинаешь замечать мелочи. Сумбурная поначалу, игра из хаоса начинает складывать некий порядок песочницы, где каждая песчинка имеет смысл. Сделано с любовью к играм вообще.","c":1791914875,"u":1,"b":0,"r":0},{"i":"237643532","s":"76561197992643081","g":0,"n":12,"p":7341,"f":7762,"l":"english","t":"Insane graphics, amazing gameplay, A medieval GTA 6 :)","c":1791914385,"u":1,"b":1,"r":0},{"i":"237642625","s":"76561198032807248","g":177,"n":62,"p":9082,"f":9084,"l":"english","t":"Crimson Desert is a game full of contradictions for me.\r\n\r\nOn one hand it has a lot of things I adore: exploration, intricate mechanics and a sense of wonder… On the other hand, it has a lot, and I really mean A LOT, of stuff that I absolutely hate in video games. After playing for a longer time one realises that the game underwent a radical change in design - which is correct, if we are to believe the internet - the game was first pitched as a MMO and only later became a single player RPG. There is nothing inherently wrong with that - I myself enjoyed Where Winds Meet very much, this game is similar to this one, with several caveats: WWM has better writing, story and more attractive world for me (Wuxia setting set during Song dynasty period).\r\n\r\nYou likely see that a lot - Crimson Desert has bad writing - and it is not without reason. The dialogues, characters etc. really are atrocious. They never have more than one or two traits, INCLUDING 3 main characters! Literally, one of the dialogues in the game went like this:\r\n\r\nNPC: “I heard there was some magic involved, how was it?”\r\nKliff: “There was.”\r\nNPC: “I suspected as much, I will have to send my men (...).”\r\n\r\nAND THAT IS ALMOST WORD TO WORD TRANSCRIPT. Kliff, the main hero, is horrible…\r\n\r\nOk Vuko, but you gave the game a thumb up, what’s the deal with it?\r\n\r\nWell my friend, after 150 hours on the clock I can say that I saw Crimson Desert for what it is, good and bad. I saw its flaws, but is the game really so bad if it drew me in for such a long time? The core gameplay is fine - even if the controls are overloaded. The exploration is fun, I enjoy the puzzles…\r\n\r\nIt is a fun game if you are there for the world and vistas. Story…? Find it in something better - like Clair Obscure: Expedition 33 or Baldur’s Gate 3.\r\n","c":1791913546,"u":1,"b":1,"r":0},{"i":"237642176","s":"76561198823198913","g":23,"n":2,"p":140,"f":209,"l":"russian","t":"Постоянно вылетает!","c":1791913146,"u":0,"b":1,"r":0},{"i":"237642090","s":"76561198198013717","g":0,"n":10,"p":1030,"f":1245,"l":"french","t":"top","c":1791913065,"u":1,"b":0,"r":0},{"i":"237641130","s":"76561198082427894","g":90,"n":5,"p":1158,"f":1465,"l":"russian","t":"11\\10\nВедьмак берёт защеку.\n","c":1791912209,"u":1,"b":0,"r":0},{"i":"237639832","s":"76561198892593900","g":82,"n":8,"p":3146,"f":3487,"l":"english","t":"So much stuff","c":1791911075,"u":1,"b":1,"r":0},{"i":"237639758","s":"76561199075322969","g":0,"n":1,"p":2933,"f":3315,"l":"english","t":"Amazing game! Best open world I've played since Elden Ring","c":1791911008,"u":1,"b":0,"r":0},{"i":"237639282","s":"76561198380607638","g":0,"n":7,"p":4500,"f":4500,"l":"brazilian","t":"Se você curte ficar horas e horas explorando, esse é o jogo ideal para você. Tenho 75 horas de jogo, e não estou nem perto de zerar o game.","c":1791910600,"u":1,"b":1,"r":0},{"i":"237639087","s":"76561199113353088","g":0,"n":6,"p":4863,"f":5003,"l":"french","t":"!","c":1791910421,"u":1,"b":0,"r":0},{"i":"237638542","s":"76561199088575610","g":78,"n":7,"p":9570,"f":9570,"l":"schinese","t":"唯一一个玩玩着玩着经常破口大骂的游戏","c":1791909942,"u":0,"b":0,"r":0},{"i":"237638162","s":"76561199122292478","g":0,"n":13,"p":8054,"f":8531,"l":"english","t":"Good game.\n\nWhat I want changed or updated\n\nTrade routes. If its just about money, bank gold is the far better option. Do something else with it. Like allow towns to be ransacked or pillaged. Then you do a wagon quest to get them materials. Add timed siege missions. If you don't deliver the materials in X amount of days, a siege quest will be harder. You get less defensive help. Idk but do something else with these trade routes. Don't take them away but change or add to what exist.\n\nFood system and potions\nPotions should heal. Food should buff. Basically just copy or improve from what Valhiem did. No one is making potions because its useless and tedious. Eating that much should be making you a fatass. I love food craft in games but they're all pretty much generic and the same. Do something better. Like create a food meter where you can over eat, be full, or under eat. Depending on where the meter lands, there's buff or debuff attached to it. You have all these food options but they just heal. Now you can make you recipes matter. 3 food can be eaten at one time and you're trying to hit the \"full\". Oh, go ahead and add a thirst meter too. Do something creative with it too.\n\nOk that's it for now. Make it happen lol","c":1791909618,"u":1,"b":1,"r":0},{"i":"237636958","s":"76561198069080492","g":0,"n":35,"p":20082,"f":20173,"l":"brazilian","t":"Jogão do cacete, fazia tempo que um jogo n me prendia por tanto tempo (sdds Skyrim). Enfim, você vai zerar ele rapidinho... E agora, esperar a DLC, enquanto tem \"algumas\" coisas ainda pra fazer.","c":1791908616,"u":1,"b":0,"r":0},{"i":"237635818","s":"76561198082851866","g":392,"n":207,"p":362,"f":1413,"l":"english","t":"","c":1791907574,"u":1,"b":0,"r":0},{"i":"237634670","s":"76561199241339629","g":126,"n":16,"p":4610,"f":4753,"l":"french","t":"Points forts : De superbes graphismes, un gameplay solide et une grande richesse d'actions.\nPoints faibles : Une progression atrocement lente et peu gratifiante, illustrée par ces 77 heures de jeu sans accès aux coiffeurs, ainsi qu'une histoire banale et impersonnelle.\nEn résumé : une belle vitrine, mais sans saveur. 6/10.","c":1791906607,"u":1,"b":0,"r":0},{"i":"237634588","s":"76561198411448913","g":0,"n":3,"p":26118,"f":26703,"l":"koreana","t":"굿","c":1791906537,"u":1,"b":1,"r":0},{"i":"237634383","s":"76561199092664895","g":81,"n":4,"p":980,"f":980,"l":"english","t":"I cannot, for the life of me, get into this game.\n\nGame is still boring as ♥♥♥♥. The optimization sucks too. It may run at 60 fps at mid settings but it looks so ♥♥♥♥. genuine Eyecancer. Gameplay is mediocre at best. Way too many features and all pretty shallow. Story is pretty much non-existant. Character just goes somewhere and does something unpromted the whole time. Feels over-all like Red dead combined with Genshin Impact, in the worst way possible. I have heard that it \"gets good after X hours\" If you can wait that long, go ahead and play this, its just not for me. I´d rather play Dragons Dogma.\n\n(If you´re going to comment something dumb like \"Well actually, its well optimized and runs well\" or \"it has good gameplay\", note that idgaf)","c":1791906353,"u":0,"b":0,"r":0},{"i":"237633073","s":"76561199802384953","g":27,"n":3,"p":9384,"f":9384,"l":"russian","t":"Ну что сказать, игра достойна внимания. Любители больших миров и фентази добро пожаловать. А так же рай для графодрочеров","c":1791905274,"u":1,"b":1,"r":0},{"i":"237632027","s":"76561197968852851","g":812,"n":39,"p":6754,"f":6754,"l":"english","t":"Actually enjoyed the story for this one.\r\n\r\nAnd you have to hand it to the devs, super responsive and tons of free content and positive changes.\r\n\r\nOne of the best single player games i had the pleasure of playing this year.","c":1791904298,"u":1,"b":1,"r":0},{"i":"237629886","s":"76561199023962604","g":41,"n":1,"p":2853,"f":2853,"l":"koreana","t":"불친절한 진행에 노잼 스토리 아쉽지만 압도적 재미 하나만큼은 인정. 특히 어디든 탐험 가능한 광활한 월드는 탑급 수준이다.","c":1791902399,"u":1,"b":1,"r":0},{"i":"237628539","s":"76561198012084246","g":0,"n":6,"p":3632,"f":3632,"l":"koreana","t":"그래픽도 훌륭하고 재미있게 엔딩 봤습니다.\n\n대응 패치를 너무 잘해줘서 좋습니다 재밌게했네요!","c":1791901166,"u":1,"b":0,"r":0},{"i":"237628524","s":"76561198131587451","g":0,"n":2,"p":31684,"f":31838,"l":"english","t":"love this game","c":1791901155,"u":1,"b":0,"r":0},{"i":"237628327","s":"76561198732373352","g":0,"n":1,"p":1601,"f":1804,"l":"schinese","t":"好玩","c":1791900971,"u":1,"b":1,"r":0},{"i":"237627003","s":"76561199175397711","g":22,"n":1,"p":2551,"f":2973,"l":"schinese","t":"最接近我理想中的剑与魔法世界的游戏，内容非常丰富，战斗爽快，武器派生花样繁多，厂商态度很好，值得鼓励","c":1791899672,"u":1,"b":0,"r":0},{"i":"237626150","s":"76561198990331967","g":0,"n":4,"p":1339,"f":1339,"l":"thai","t":"เกมดี เล่นสนุก บัคจุกจิกเยอะ แต่ ติดที ต้องกดปิดเกม ทันที อย่างเช่นคุยกะหม้อ แล้ว ออกไม่ได้","c":1791898803,"u":1,"b":1,"r":0},{"i":"237625745","s":"76561198076074153","g":0,"n":54,"p":535,"f":535,"l":"english","t":"I been reading all those positive comment and this is no way near what i'm expecting. \r\n\r\nThis game is CLUNKY. \r\n\r\nThe story just giving me crumbs and barely make any sense\r\nThe inventory management almost made me refund the game. Luckily i manage to savage it with mod. \r\nSo many useless items in the game with limited space\r\nAll those extra unnessary step like manual aim to pick up bounty, have to press 2-3 button to read the bounty, then sell the bounty paper because it is count as another inventory item\r\nThen you have all those useless clickable item. Every box can be pickup, every lattern can be turn on and off, hundreds of cheap item to pick up in every square meter. Most of them are useless.\r\n\r\nI play better open world game than this. I played for 8 hours and barely felt any enjoyment. Gameplay is not the focus of this game, it loaded with inconvienence to make life tedious.","c":1791898389,"u":0,"b":1,"r":0},{"i":"237625294","s":"76561198364889129","g":105,"n":18,"p":220,"f":220,"l":"schinese","t":"很喜欢 虽然不知道为什么 但是画面观感渲染出来就是顶尖 。美术是韩国MMO集大成。故事现在玩起来也问题不大。","c":1791897904,"u":1,"b":0,"r":0},{"i":"237624745","s":"76561199500908511","g":103,"n":7,"p":4295,"f":4390,"l":"turkish","t":"Oyun iyi ama çok eksiği var gibi atın sürekli yüksek yerlere zıplayamamsı beni kanser ediyor mesela hikaye aşırı boktan inanılmaz kötü hikayesi için alıcaksanız almayın puzzler çok karmaşık yorucu  puzzle sevmıyorsanız almayın optimizasyonu çok iyi hiç problem yaşamadım nerdeyse onun dışında dediklerim oyunu sıkıcı yapan kısımlar alamnızı önermem ya bi 2 senesi var oyunun daha iyi olması için ozaman belki ucuzlar hem","c":1791897286,"u":0,"b":0,"r":0},{"i":"237624529","s":"76561197992537061","g":0,"n":10,"p":12602,"f":12638,"l":"english","t":"+++++","c":1791897052,"u":1,"b":1,"r":0},{"i":"237622159","s":"76561198260531180","g":0,"n":1,"p":3013,"f":4007,"l":"english","t":"goty","c":1791894397,"u":1,"b":0,"r":0},{"i":"237621496","s":"76561198069754493","g":718,"n":37,"p":102723,"f":102723,"l":"english","t":"This is the most hours I have invested for a single player game. Subpar story but the exploration makes it worth playing for a long long time specially if you have a high-end PC.","c":1791893561,"u":1,"b":1,"r":0},{"i":"237620361","s":"76561198430970875","g":0,"n":3,"p":11073,"f":11139,"l":"koreana","t":"사라","c":1791892056,"u":1,"b":1,"r":0},{"i":"237619578","s":"76561198176952355","g":1006,"n":17,"p":1663,"f":1663,"l":"english","t":"The best way to describe this game would be doing work, sometimes you like doing what you do, sometimes you don't feel like it and that's this game. \n\nSome elements feel too forced. Horse taming, suddenly you must fight a boss with no prep - stunlocks - no proper dodge/parry. Oh and did I mention the skill three you basically need to google how to build your character. \n\nYou are forced to play Kliff, which makes no sense, they got loads of room to make the story so you can use the other 2, but they decide against it. \n\nThey do work a lot on this game so it may be better in the future, for now, I can't enjoy it sadly.","c":1791891021,"u":0,"b":0,"r":0},{"i":"237618972","s":"76561198055820498","g":156,"n":28,"p":3291,"f":3291,"l":"german","t":"Das Game sieht wirklich atemberaubend schön aus aber leider fühlt sich alles in diesem Game an wie halbgarer \"Filler-Content\". Anfangs kann man es in Hernand noch ertragen, aber wenn man in der Hauptstory weiter fortschreitet wird es, zumindest für mich, irgendwann unerträglich repetitiv und die Hauptstory macht absolut keinen Sinn.","c":1791890095,"u":0,"b":1,"r":0},{"i":"237618626","s":"76561197966596021","g":0,"n":5,"p":15517,"f":16101,"l":"english","t":"Great game, so much different things thrown into it that all work so well.","c":1791889605,"u":1,"b":0,"r":0},{"i":"237618300","s":"76561199002575223","g":0,"n":24,"p":2971,"f":3608,"l":"turkish","t":"50 saatin ardından bitirdim benim için 10/10'luk bir deneyimdi","c":1791889080,"u":1,"b":1,"r":0},{"i":"237616623","s":"76561198070177574","g":517,"n":94,"p":8752,"f":8752,"l":"schinese","t":"首先，是画面吸引到了我，山景，城景，林景，村景，都是那么的鲜艳美丽，npc的装备也是帅的夸张，质感很是到位，但是也仅此而已。在深入游玩一两章节后，却被深深吸引，发现整个世界都充满了各种内容，而且是不尽相同的手工内容，不是传统的罐头开放世界，这世界突然显得非常庞大！有种在想去探险整个世界的欲望。\r\n但同样的，如此庞大的内容却没有足够人力维持下去，在游戏的后期地图，明显会发现整体内容量飞速下降，前期一个小城，就充斥着大量玩法，而在后期繁华先进的大城市和广阔的沙漠地带却只有剩下不多的东西","c":1791886450,"u":1,"b":0,"r":0},{"i":"237616334","s":"76561198693536446","g":0,"n":1,"p":3173,"f":3767,"l":"koreana","t":"잼잇음","c":1791886013,"u":1,"b":1,"r":0},{"i":"237615454","s":"76561198014817594","g":537,"n":14,"p":7356,"f":8457,"l":"english","t":"Great game, I've spent 115hrs and barely got out of Hernand.\n\nNow with enhanced edition I've restarted my progress, the experience is even better than on the release!","c":1791884657,"u":1,"b":0,"r":0},{"i":"237614957","s":"76561199758953459","g":0,"n":1,"p":1088,"f":2024,"l":"french","t":"Quel poulet il n'y a rien d'autre à dire","c":1791883876,"u":1,"b":0,"r":0},{"i":"237614212","s":"76561198315987779","g":246,"n":21,"p":3789,"f":3967,"l":"schinese","t":"即便有很多缺点，依然是值得花时间去玩的好游戏","c":1791882744,"u":1,"b":0,"r":0},{"i":"237613753","s":"76561199004815374","g":59,"n":14,"p":1253,"f":2676,"l":"russian","t":"Релакс","c":1791881991,"u":1,"b":1,"r":0},{"i":"237611163","s":"76561198071585276","g":0,"n":2,"p":7300,"f":7638,"l":"turkish","t":"Güzel oyun çok oynanıyo. :thumbsup:","c":1791877355,"u":1,"b":1,"r":0},{"i":"237610853","s":"76561198275108627","g":0,"n":3,"p":6728,"f":7254,"l":"schinese","t":"世界很大，可玩性丰富，但是任务引导很差，而且个别任务完全就是来折磨人的，特指雅恩 奈拉，明明可以用别的方法去讲述朋友间的剧情，但是就是一直用繁琐来拖延时间，最让我受不了的就是机器人召唤BUG，我在ATAG召唤还剩一半的时候使用了紧急动力，结果直接变成灰色的了，无论过了多久，都是一直灰色，我的存档也无法回到之前了，辛辛苦苦做的机器人就这样没了","c":1791876809,"u":1,"b":0,"r":0},{"i":"237609541","s":"76561198383272130","g":0,"n":4,"p":2092,"f":3116,"l":"schinese","t":"OK","c":1791874412,"u":1,"b":1,"r":0},{"i":"237609077","s":"76561198013509028","g":174,"n":4,"p":11683,"f":11683,"l":"polish","t":"Polecam grę. Gra ma dużo możliwości zabawy na wiele godzin.","c":1791873543,"u":1,"b":1,"r":0},{"i":"237608337","s":"76561199048207998","g":0,"n":1,"p":10108,"f":10628,"l":"spanish","t":"juegazo","c":1791872140,"u":1,"b":1,"r":0},{"i":"237607923","s":"76561199123288569","g":150,"n":11,"p":463,"f":749,"l":"english","t":"Extremely fun game, I had this on xbox app but was experiencing horrible lag on that launcher (I had 70 hours on that), and I just wanted to share some thoughts.\n\nDo NOT go into this game expecting some great storytelling and superb writing. That is simply not what this game is. Go into this game expecting a sprawling open world RPG sandbox. The continent of Pywel is insanely massive in scale and density, the freedom this game offers is my absolute favorite part about it how the pacing is entirely dictated by curiosity and the means to simply explore. The combat feels extremely polished and I've seen plenty other people saying it's the highlight, and I 100% agree. The feeling swinging around dual wield swords or even a massive war-axe with the insane combos this game has is unmatched. Now I'm sadly going to have to talk about the one and only major problem I have with this game. Pearl Abyss has done an incredible job of adding quality to life improvements since launch. Actually I had previously hated the game when it first came out. I thought it was boring, and too much of a slow burn. The main complaint that has stuck with me is the fact that the performance is still pretty bad. I've seen myself having to heavily rely on frame generation to even be able to play this at the most immersive way that they had intended. I know that they have the abilities to fix this issue and I have full faith in them. Crimson Desert besides that one issue is an absolute powerhouse of dopamine and exploration. I would absolutely recommend this game to anyone wanting to get lost in a world full of unique side content, fun bounties, and one of the most immersive open worlds I personally have ever seen in a game. \n","c":1791871376,"u":1,"b":0,"r":0},{"i":"237607868","s":"76561198094937144","g":0,"n":25,"p":1512,"f":2307,"l":"english","t":"Controls in certain aspects are terrible. You can't change basic bindings like the cycle camera button, so I constantly cycle the camera if I don't hold it long enough to open the map.\r\n\r\nMany quests are time-wasters to an intolerable degree. Characters, I swear, legit walk SLOWER than an average NPC to just WASTE YOUR TIME during pointless \"follow\" elements of quests. There is just way too much bloat and finicky stuff. Follow segments should be skippable, same with cutscenes. Speeding them up is useful, but I find myself having to hold the speed-up button for ages somehow.\r\n\r\nYour guy often climbs when you're just trying to walk past something, for instance. You have to lantern things to examine them or target them, causing harm in immersion when trying to talk to people. There are redundant things like the lantern revealing hidden things but also the L1+R1 combo, which basically does the same thing but also sometimes other things, generally which aren't that useful. It's really frustrating. It's insanely easy to accidentally block or swing your weapon when trying to do the L1+R1 combo to reveal things in your view. It's just insanely tedious and clunky.\r\n\r\nThere are quests that you are FORCED to do, which are impossibly dull or frustrating or drag out needlessly. There are so many things that are totally misleading as well. They'll introduce a new mechanic in a puzzle or boss fight that you presume you NEED in order to win, but using those literally DOES NOT WORK, so you die over and over, only to realize you can just attack normally or do it a simpler way that is more fun.\r\n\r\nThe menus and a mixed bag as well. They are almost good but are REALLY SLOW to load and transition, due to trying to be extra fancy. This just drags the experience overall. All these things add up really quick. There are so many lop-sided systems and concepts that it's just baffling. I need to get bullets and gunpowder to used the ranged weapon of the girl character at all, but the guy character has infinite arrows somehow. Why?\r\n\r\nWhy is the girl character even here if switching causes you to respawn across the map rather than just switching were you are? Or only switching at camps or something? And she needs the same upgrade resource the main guy needs so suddenly you can only upgrade one or have both at low upgrades/skills. WTF? And she can't do any of the main guy's missions, far as I can tell, only fetch quests and such. So you have to once again switch to the guy every 5 seconds, which respawns you 100 miles away like it's GTA5! What scenario do I want to go FAR AWAY FROM MY CURRENT LOCATION in a TOTALLY RANDOM DIRECTION for NO REASON when I switch characters? There's almost no scenario where anyone would desire that!\r\n\r\nThere are systems for investing money, caravaning, provisions and camp upgrades, etc., but a lot of those are overly complex and tedious. Even if you like one element, the other handful are just a slog or ignored. And still, the stupid \"provisions\" or \"unpackaged goods\" and so on litter your inventory but are totally useless for anything beyond their intended purposes, basically. So they just cause clutter for no reason and extra tedium. The game is already packed full of stuff, don't stenose the inventory of actually useful goods that you use IN THE NORMAL GAMEPLAY with pointless items that most people won't make use of. And you LITTERally get this stuff before you can even caravan or put them to use at all, leaving it dead weight in your very narrow inventory, especially at the beginning of the game. But to get more inventory space, you have to do REALLY TEDIOUS SLOG quests, like finding missing sheep and so on. PAIN!!!\r\n\r\nThere are a lot of issues with the game presuming your intent wrongly. I mentioned climbing spontaneously, but another is looting. You can hold X, thankfully, to continue to pick up loot or search bodies, but this isn't category-limited. Thus you will spontaneously use an anvil to smith your armor in the middle of picking up loot! If I HOLD DOWN X, aiming at a loot item, then KEEP IT HELD DOWN, it should ONLY COLLECT LOOT. Not decide to use a random anvil or pick up furnature! I should have to LET GO of X, then aim at a different target in a different category (eg. an anvil), THEN my X press should activate the anvil.\r\n\r\nThere are really good elements to this game but so much frustration that it legit is not worth the time. The good parts cease to matter if there are basic issues that prevent it from being fun or otherwise contaminate the experience. And these things are fairly basic to fix, so it's baffling that they haven't since it came out! It doesn't matter if it's got a ton of content or a big diversity of creatures or experiences or whatever (presuming it does) if it's just painful 80% of the time to play it.","c":1791871298,"u":0,"b":1,"r":0},{"i":"237606942","s":"76561198988389538","g":0,"n":2,"p":1730,"f":2183,"l":"koreana","t":"good","c":1791869671,"u":1,"b":1,"r":0},{"i":"237606714","s":"76561198193582721","g":0,"n":36,"p":11550,"f":12158,"l":"schinese","t":"玩了190个小时，磨磨唧唧的推完主线。来评论一下\n1，手柄不清楚我键鼠玩的，玩这款游戏需要自主改键，我推荐键鼠玩家把光辉反射，蓄力刺击，旋风斩这类重要的技能改成1个键按。\n2，推荐前期就去搞一个龙蛋孵化出来骑龙开图，能帮你绕过很多纵深很高的山丘。\n3，推荐适量打点MOD，强烈推荐DMM，因为DMM自带装备幻化，宠物幻化和一些基础MOD（比如堆叠，装备技能无CD，增大背包容量，机器人和暗星龙无CD等等不影响平衡的MOD），以下是我认为必打MOD：\n    一，MinimapTweaks 2.01 这个MOD是把你小地图可以放大，并且能显示一些NPC和可互动物品\n    二，Faster Vanilla Load-In 这个MOD能让你标题页面加载速度变快\n    三，LET ME SLEEP 这个MOD是能让你没有CD的去睡觉等待，我觉得必打是因为游戏本身也有任务可以等待然后去睡觉这样跳过时间，也就是说不作弊也有办法疯狂跳过时间但是这个MOD让你省去跑来跑去的步骤罢了\n    四，Crimson Route 这个MOD能让你拥有导航系统，但注意，有些任务给的追踪提示跟这个MOD的追踪提示会有重叠，需要自己辨别\n    五，CalmerDynamicWind 这个MOD能让你屏幕的风速降低到10%这样画面背后的树啊草啊什么的被吹的瞎眼睛\n4，玩这款游戏肯定必不可免的查攻略，以下是我推荐的2个网站：\nhttps://www.gamersky.com/tools/map/cd/?ref=seo   这个网站是游侠的可互动网页，点位一般都有评论和一些解密的解法，中间下方还能直接搜索你要找的物品和任务，但缺点是不是100%全\nhttps://crimsondb.gg/zh-Hans   这个网站相当于WIKI，一些装备属性和任务过程可以在这里找，包括宠物喂什么涨最多好感度等等之类一些杂七杂八的东西都能查到\n5，技能加点方面，体力＞勇气＞血量。\n跑图方面推荐优先法则之力点出来2级可以钩住跳跃，前期翻山越岭方便；接着往下点飞鸦凌空（在飞行状态下用凝视+空格直接喷射）。\n战斗方面推荐左边绿色的幻影击风之帷幕早点点满，蓝色的疾风斩，旋风斩（释放时有无敌帧不包括蓄力）优先点满，刺击（满级后单手剑和双持单手能用一闪，神技之一，能一下加很高的韧性条，并且能秒接搏击+跳跃使用指令投），搏击（满级后可使用指令投，搏击+跳跃使用），摔跤（大回环可以抓很多人型BOSS把他丢到墙角摔他，能造成多次判定增加韧性条），左下角的感知也推荐点满（点了感知才有完美闪避和打康，触发完美闪避能恢复体力和勇气）\n还有就是游戏困难难度以下翻滚无敌帧非常长，长到能无脑翻滚躲招，推荐去设置-控制-辅助闪避操作方式改成长按翻滚\n如果是困难模式下，侧身闪避比翻滚好用，因为在困难模式下翻滚无敌帧被削的太多，几乎在翻滚后就被抓后摇连死。所以这时候推荐设置-控制-辅助闪避方式改成连续点按，并且下面的单次输入时基本闪避动作改成闪避冲刺。\n如果对视角不喜欢还能去设置-辅助功能那里修改视角范围和位置，推荐把粒子表现程度开最低。\n\n这游戏剧情演出和文字剧情确实挺差的，差的无可厚非，想辩解我甚至都找不出词来，但是他堆料堆出的质变，也算是游戏史上的一朵奇葩。我从来没玩过内容如此丰富的ARPG的开放世界游戏，而且他这个游戏我感觉更像是秀肌肉，LOD帧稳定的离谱，即使是骑龙喷火同时把多个建筑破坏摧毁也依旧稳定，战斗系统方面也做得确实有意思，比较有深度，比如一闪可以侧身闪避2次用出来，左键轻击一下也能接一闪，这游戏得战斗系统很多机制都是要自己试出来。而且这款游戏可以说做到了真正的无缝大世界，从地上解密阿比斯飞上去天上的阿比斯他居然能全程无缝，我当时都惊了，我站在那个方块上面美景尽收眼底真是挺震撼的。\n最后再附上我的改键键位。\n法则之力：Tab  搏击：Q   刺击：T   旋风斩：鼠标侧键5   摔跤：鼠标侧键4   跳跃：alt  闪避/翻滚：空格     劲法：CapsLock（大写键） \n瞄准：G   凝神：F   取消/放下：X    锁定：鼠标中键   使用装备技能：B    抓握投掷：Q+鼠标侧键4   元素强化：V\n打开装备栏：F1   打开佣兵快捷栏：F2     召唤马匹：H      取出收起武器：Y     吃饭：5    打开食品快捷栏：6   \n没改的就是默认的了","c":1791869302,"u":1,"b":0,"r":0},{"i":"237606504","s":"76561198087604477","g":94,"n":12,"p":3342,"f":3511,"l":"russian","t":"1111111111111111111","c":1791868891,"u":0,"b":1,"r":0},{"i":"237606011","s":"76561198342400250","g":118,"n":12,"p":5223,"f":5408,"l":"schinese","t":"很自由的开放世界","c":1791867960,"u":1,"b":0,"r":0},{"i":"237605232","s":"76561198120060020","g":0,"n":7,"p":6053,"f":6349,"l":"koreana","t":"Price = Time to have fun!","c":1791866655,"u":1,"b":1,"r":0},{"i":"237604025","s":"76561198906118768","g":0,"n":2,"p":2157,"f":2282,"l":"english","t":"Beautiful game","c":1791864731,"u":1,"b":1,"r":0},{"i":"237603014","s":"76561199007085937","g":0,"n":7,"p":2183,"f":2425,"l":"english","t":"so peak","c":1791863150,"u":1,"b":1,"r":0},{"i":"237602207","s":"76561198092967892","g":0,"n":40,"p":8708,"f":8858,"l":"brazilian","t":"Um dos melhores jogos de mundo aberto que já joguei! Recomendo","c":1791861939,"u":1,"b":0,"r":0},{"i":"237601714","s":"76561199025784277","g":85,"n":6,"p":2380,"f":2429,"l":"schinese","t":"不能随便杀人，希望以后可以改善这一点。","c":1791861240,"u":1,"b":0,"r":0},{"i":"237601327","s":"76561198019983025","g":0,"n":11,"p":5219,"f":5219,"l":"russian","t":"Это потрясающая игра. В ней я провел 86 часов, но даже не прошел половину сюжета. Каждый раз запуская её она меня удивляла. В ней бесконечное количество механик. Мир игры приятно исследовать.  Постоянно находишь что-то новое. графика красивая, красивые женские персонажи, нет повесточки. Игре я ставлю твердую 9.","c":1791860617,"u":1,"b":0,"r":0},{"i":"237600615","s":"76561198168646016","g":96,"n":9,"p":957,"f":2345,"l":"french","t":"Incroyable je le dis","c":1791859676,"u":1,"b":0,"r":0},{"i":"237599963","s":"76561198836072208","g":69,"n":18,"p":2774,"f":2945,"l":"brazilian","t":"Gostei.","c":1791858762,"u":1,"b":0,"r":0},{"i":"237599625","s":"76561198977761431","g":0,"n":6,"p":9642,"f":10370,"l":"schinese","t":"好玩，但是需要强行玩20个小时先玩进去，新人看看攻略吧，会上手好多","c":1791858277,"u":1,"b":1,"r":0},{"i":"237598644","s":"76561198408702989","g":0,"n":48,"p":5867,"f":5867,"l":"brazilian","t":"O jogo é daora, cheio de coisas pra fazer, porém, excessivamente grande e algumas vezes desconexo.\r\n\r\nPontos positivos:\r\n* Gráficos lindos e relativamente pesados, porém, uma obra de arte.\r\n* Imersão muito forte (diferente de alguns jogos atuais), a qual pode render boas horas de gameplay.\r\n* Combate simples e direto, com grande variedade.\r\n* Mapa cheio de coisas pra fazer, embora fique bem repetitivo.\r\n* Diversas montarias diferentes e com utilidades diferentes.\r\n\r\nPontos negativos:\r\n* Desconectividade entre atividades gerais, por exemplo: uma hora você está coletando um minério específico pra forjar um item, na outra está lutando com um dragão e na outra está limpando uma chaminé...\r\n* Ausência de tutorial ou dica em diversas partes, o que torna o jogo o famoso \"vou ver no youtube porque já to a uma hora tentando resolver um puzzle\".\r\n* A história é até boa, porém a progressão é lenta demais.\r\n* Repetitivo em diversos aspectos, como diversas missões iguais com personagens diferentes e recompensas que você ignora e só faz a missão para tirar ela da lista.\r\n","c":1791856953,"u":1,"b":0,"r":0},{"i":"237597753","s":"76561198101992731","g":391,"n":41,"p":2524,"f":2524,"l":"english","t":"goty","c":1791855752,"u":1,"b":1,"r":0},{"i":"237597499","s":"76561199082561657","g":0,"n":2,"p":8656,"f":10313,"l":"spanish","t":"Lo mejor que jugue en mis 25 años de gamer!","c":1791855400,"u":1,"b":1,"r":0},{"i":"237596505","s":"76561198088649023","g":0,"n":6,"p":435,"f":1101,"l":"english","t":"im rock hard","c":1791853972,"u":1,"b":1,"r":0},{"i":"237596322","s":"76561199435949854","g":65,"n":2,"p":15739,"f":15739,"l":"english","t":"from a 10 id say 6.\n\n the game has AMAZING combat system, exploration is so fun and versatile, amazing graphics. but mostly thats it. the game`s story is so... bland. good, but bland. the open world is huge yes but its mostly empty landscapes and FULL OF WASTED OPPURITNITIES!!!!!!!!!!!!.\n\n\n its also full bugs. the mainline quests feels too linear to the point you are not even interested in doing and rather explore, which what i personally did. some quests are done poorly in a stupid way for example, they expect you to use a mechanic they introduced in the tutorial after 120 hours of play for THE FIRST TIME\n\n\nthe main characters, especially Kliff, lacks personality. literally. kinda reminded of a cheap knock-off less thought of Geralt. i understand some might say its because of the story and the CYCLE (dont want to spoil), but that doesnt make sense as Kilff himself doesnt know anything about it until much later\n\n\nsome puzzles are also quite weird? its not really thinkable what it needs to be done and whats the mechanic needed to be used in order to complete it. and from someone who doesnt like going to youtube to solve puzzles, most of the game`s puzzles i had to go to youtube cuz genuinely it was stupidly done.\n\n\n\n\nMOST of the side/world quests are fillers. little to no story behind them and is simply you get a task, finish it, report back. its a good style of quests, but to be the ONLY style is unhinged.\n\n\n\nMain bosses and world bosses. this game offers such an utterly disappointing designing of bosses. most of the bosses are cheese-able by doing nothing which baffled me. some bosses one shots you even with high level kit, some bosses die of one shot, and some bosses are just copy-pasted with different clothes. \n\n\n\nAND DONT GET ME STARTED ON THE FINAL BOSS BATTLE OMFG.\n\none of the aspects that i also made me sad is how re-playable the game is. there is nothing worth of re-experiencing.\n\n\nand this is why this game had a 6 IMO. it had immense protentional but turns out its unfortunately wasted","c":1791853729,"u":1,"b":0,"r":0},{"i":"237595451","s":"76561198842606446","g":0,"n":7,"p":6072,"f":6072,"l":"english","t":"Ok so a game this size will take a second to type out. Welcome to Elden scrolls and the creed of the Dark soul. \n\nIt's basically a let's grab popular mechanics from a bunch of popular past games and see if we can slightly improve some aspects while cramming as much as we can into the game so it fits everyone to some aspect. You start out in a typical revenge / good guy saga trying to avenge your fallen brothers while saving the world from darkness. The story isn't terrible but they drag it out to fit the total play time. No choice matters kinda content as some other games.\n\nThe npcs are nothing but filler and you won't grow close to almost any of them. Your companions at camp have a few that are memorable but they are for cut scenes and filler with most being added to facilitate the camp experience and that's about it. Honestly besides working in your camp 80% of them are not mentioned apart from a personal errand quest or two.  Really the story revolves around you and you alone. Everything else is there for typical story filler or to push your hero saga along.\n\nYou have 2 extra chars to switch between which are randomly locked during story progression and if you never use them you don't have too cause your main char is the only one that is needed or matters really. Most of the story you have to play as Kliff to progress. \n\nThe bosses have the Elden Ring / Dark soul mechanics but on a much easier level of skill. Some offer armor , weapons, or other unique items. Some not as much. All in all the combat is ok but if you can play most RPG style games the skill level isn't going to be a problem.  The random enemies throughout the game are fodder for you to cut down at your discretion as most have no chance of doing much to you unless you randomly hit buttons through the world in a drunken rampage.\n\nThe gear is plentiful ,though armor is mostly cosmetic and most are comparable. Weapons vary slightly more but there are a lot of similar variants to those to so no one gear set rules all. Which is not a bad thing i guess. You also are not locked into class specific setups which is good and bad. Good that you can play how you want , but bad as it lowers the need to replay to get a fresh char type. \n\nSome mechanics like pickpocketing and climbing are fun but horrible at the same time. Very clunky in some parts and the gliding gets annoying when it turns super slow if you fall off a wall or such. Mounts are plentiful and there are a lot of side missions although they feel very mundane even more so then the main missions. \n\nIt's a fun game to kill time and still enjoyable but don't expect anything game changing.  The world and graphics are beautiful but beyond that it's a pretty normal RPG game that makes you really want to play till it peaks then you realize your repeating a lot of the same things like most games. For $70 i don't think it's worth it especially with the DLC  being around $30. But that has become the new norm. \n","c":1791852778,"u":1,"b":1,"r":0},{"i":"237594990","s":"76561198349102600","g":74,"n":2,"p":2066,"f":2321,"l":"koreana","t":"재밌다..쉬었다가 이번에 다시하는데 이렇게 재미있을줄이야..","c":1791852322,"u":1,"b":1,"r":0},{"i":"237594352","s":"76561198829709378","g":27,"n":1,"p":7512,"f":7856,"l":"brazilian","t":"Peak","c":1791851635,"u":1,"b":0,"r":0},{"i":"237592775","s":"76561199237344997","g":0,"n":5,"p":7096,"f":7456,"l":"english","t":"Greatest game with the absolute stupidest puzzle system ever.","c":1791849605,"u":0,"b":1,"r":0},{"i":"237592438","s":"76561199096183567","g":0,"n":1,"p":436,"f":1321,"l":"brazilian","t":"ainda estou no comecokkkkk, mas e goat\r\n","c":1791849162,"u":1,"b":0,"r":0},{"i":"237592388","s":"76561198016339923","g":0,"n":19,"p":5143,"f":5623,"l":"polish","t":"spoko gra\r\nmarnuje czas gracza.\r\nprzeciaga mechaniki  jak tylko morze \r\nqrwa mam watpliwosci ale i tak w nai gram","c":1791849096,"u":1,"b":1,"r":0},{"i":"237592250","s":"76561197994811634","g":0,"n":15,"p":487,"f":619,"l":"english","t":"I need more time to evaluate, but so far so good. Something new and exciting.","c":1791848940,"u":1,"b":0,"r":0},{"i":"237591724","s":"76561197962225747","g":176,"n":3,"p":12934,"f":12934,"l":"english","t":"So far I been enjoying this game. If you have played a lot of Skyrim and like to explore and get easily distracted doing random stuff instead of focusing on the main story like I am. This game could be for you.\n\nThe equipment in this game is a bit different. instead of having one gear that is better stats than the others. All gear is about close to the same. it's the Abyss Gears that you socket into your equipment that makes a different. Pretty much they made it so you can style your character whatever equipment without much having to go what's best. Want to look like a Crusader? go for it and slap some Abyss Gears on it.\n\nI have yet to explore the whole game just yet. I have been mostly stuck around Hernand running into more side missions one after another. some around areas outside Hernand, but Hernand keeps pulling me back lmao.\n\nThe performance is actually surprisingly good, but the game does have one problem when it comes to graphics. I tried both with raytracing & ray reconstruction and also without out and other settings. I can't for the life of me stop the shadow effects bugging out inside buildings. That is so far only problem I know of.\n\nI give the game about 4/5. Story not their strongest side, but there is so much everything else can do.","c":1791848473,"u":1,"b":1,"r":0},{"i":"237590302","s":"76561199814348811","g":0,"n":1,"p":6054,"f":7989,"l":"english","t":"i love this game \r\n","c":1791847195,"u":1,"b":1,"r":0},{"i":"237589460","s":"76561198150451021","g":0,"n":3,"p":77,"f":319,"l":"german","t":"1. Stunde mit dem Spiel: Starte Spiel ewige loading screens > stürzt ab\n2. Stunde mit dem Spiel: BIOS update> Spiel Startet> gehe zwei schritte Stürzt ab\nStunde Prolog geht ohne Absturz 1 Stunde gespielt.\nGehe neben Sebastian nach dem ich die zwei Tölpel verdroschen habe> Absturz\n> versuche zu laden ladebildschirm> Kliff sitzt> Spiel Stürzt ab> gehe auf niedrigste Grafikqualität\n>Kliff steht auf geht in ner Cyberwelt anmutenden Dimension > Spiel Stürzt ab\n>versuche nochmal Kliff geht zwei meter diesmal weiter > Spiel Stürzt ab....\n>frustriert  und Sauer> schreibe Review. \n>Fix the Game so we can enjoy it..... Bis dahin ein KLARES NEIN VON MIR!!!!\n","c":1791846110,"u":0,"b":1,"r":0},{"i":"237587827","s":"76561199024120846","g":0,"n":32,"p":6057,"f":6057,"l":"latam","t":"Hace rato que no tengo tantos conflictos con un juego...me costó un montón decidir entre una reseña positiva con mucho contenido negativo o vice versa.\nMe inclino por dejar una reseña positiva ya que el juego tiene bastante contenido y variado, el combate es bueno (menos las boss fights que son todas horribles) y el mundo se siente vivo. El problema es que parece que hay demasiadas mecanicas hechas a medias, a veces el juego te pide que hagas algo que no te hizo hacer en 70 horas, etc. Igual creo que lo peor son los puzzles: o la solución es super estúpida o tiene un nivel de complejidad que ni buscando la solución en internet te parece que hiciste algo mal. \nEs un juego dificil de recomendar...si estas en la duda te diria que pases de largo, ahora bien si ves gameplay y te interesa podes llegar a meterle cientos de hora. Pero de nuevo, si estas dudando, no te lo recomiendo porque puede llegar a ser muy frustrante. Incluso te diría que es un juego que para pasarla medianamente bien tenes que estar consultando bastante en youtube.","c":1791844227,"u":1,"b":0,"r":0},{"i":"237586866","s":"76561198322879877","g":41,"n":15,"p":1978,"f":1978,"l":"brazilian","t":"sinistro de bom","c":1791843130,"u":1,"b":1,"r":0},{"i":"237586582","s":"76561197967625918","g":0,"n":28,"p":7473,"f":7473,"l":"english","t":"Great game world, amazing visuals, combat is pretty good, they put a lot of work into this. Everything else is just meh, you get overloaded with quests, the itemization is boring, the quests are boring, the puzzles are boring. TLDR, gameplay just isn't that great, but as  walking simulator it is awesome.","c":1791842856,"u":0,"b":1,"r":0},{"i":"237586490","s":"76561197990285818","g":280,"n":1,"p":3126,"f":3129,"l":"brazilian","t":"O jogo pra recuperar o senso de deslumbre da sua criança interior. Não pense, não analise, só aproveite e seja livre!","c":1791842779,"u":1,"b":1,"r":0},{"i":"237586184","s":"76561199589195447","g":13,"n":6,"p":8332,"f":8477,"l":"english","t":"Love it, not for everyone, really interesting weird at times with controls on keyboard (custom binds recommended) great with controller. story is good but sometimes can be confusing but you will understand. exploration is a core function to level up and progress the story, a lot to do. graphical bugs like noise and ghosting with dlss 4.0, dlss 4.5 has less ghosting, 4.5 preset L is good but takes more. Ray reconstruction is heavy.","c":1791842525,"u":1,"b":1,"r":0},{"i":"237585039","s":"76561198325586874","g":0,"n":7,"p":878,"f":1562,"l":"english","t":"good graphics version of zelda: botw","c":1791841372,"u":1,"b":1,"r":0},{"i":"237583763","s":"76561198140557723","g":0,"n":2,"p":11188,"f":11188,"l":"german","t":"[h1] 186h Spielzeit und trotzdem schlecht bewertet? [/h1]\n\n[h3] Crimson Desert - beworben als die eierlegende Wollmilchsau,[/h3]\n\nMein letztes Spiel war Cyberpunk 2077 (grandioses Spiel) aber ich hatte auf jeden Fall bock auf ein anderes Setting. Crimson desert bietet das - es bietet ungefähr 10 verschiedene Settings.\nund genau da liegt die Größte Stärke und gleichzeitig größte Schwäche des Spiels.\nEs versucht einem alles zu bieten. Vom mittelalterlichen Ritterkampf über Abenteuer im Wilden Westen bis hin zum Steampunkerlebnis. Alles verbunden durch ein Sci Fi/ Fantasy \"Elysium\"- und es greift überraschend gut ineinander. Zumindest auf den ersten Blick. Spielerisch wird man so durch einen Zeitstrahl der Entwicklung geleitet, verbunden durch den Abyss als roten Faden. Prinzipiell ein gutes System, es macht Spaß zu wissen, dass die Regionen sich unterscheiden und man immer etwas besseres erreichen kann. \n\n\n[h3] Hauptstory 2/10 [/h3]\n\nDie Story des Games besticht eher nicht. auch wenn in der enhanced Version angeblich mehr Zwischensequenzen und Story Elemente hinzugefügt wurden ( ich habe leider keinen vergleich zum Start), habe ich dies als neuer Spieler nicht wirklich gemerkt. Der Hauptcharakter des Spiels wirkt nicht nahbar und es ist mir bis zum ende der Story nicht möglich gewesen eine Beziehung aufzubauen. Er wirkt oft einfach echt flach geschrieben - Der tragische Held (der wirklich nicht tragisch ist)- handelt ideal und ist einfach eine der langweiligsten Persönlichkeiten die ich bisher in der Gameswelt erlebt habe. Durch die Vielzahl an Nebenquest verschwimmt die Hauptstory auch immer wieder im Hintergrund und wirkt manchmal eher verwirrend als leitend. Das kommt auch von fehlender Handlung - es passiert gefühlt oft einfach nichts wirklich Bewegendes, klar das ein oder andere Boss battle hier und da, oft eine neue Gegend in die man kommt, ab und zu eine neue Mechanik oder Feature aber alles in allem fühlt es sich nie nach einer zusammenhängenden oder intensiven Charakterentwicklung oder Geschichte an. Tatsächlich hatte ich oft das Gefühl man hätte einfach eine KI eine Geschichte ausspucken lassen und diese immer wieder in Fetzen dem Spieler zukommen lassen. \n\n[h3] Nebenquests 3/10 [/h3]\n\nwobei wir auch schon bei den Nebenquests angelangt wären. Diese waren zu Beginn wirklich zahlreich und bieten eine wirklich überwältigende Fülle an Aktivitäten und Beschäftigungsmöglichkeiten. Ich habe bestimmt nach 50 Spielstunden immer noch das Startgebiet erkundet.\nAllerdings merkt man schon hier, dass Quests vor allem auf dem Ubisoft Modell beruhen. Auftraggeber: gehe hierhin, mache das, hole dies etc. Vor allem bei der Erkundung der anderen Gebiete wiederholen sich diese quests teilweise einfach nur frech, hier hat man immer wieder nur Thema und das Questobjet getauscht aber der Aufbau der Quests ist 1 zu 1 gleich. \n\n[h3] Erkundung 7/10 [/h3]\n\nhier kann Crimson desert definitiv punkten - Die Erkundung macht Spaß und hält einen auf Trab, die map ist riesig und es gibt immer irgendwas neues zu Entdecken\n\n[h3] Grafik und Details 8/10 [/h3]\n\nGrafik war bis auf einen teilweise auftretenden Bug der Beleuchtung wirklich ansprechend, und schön zu spielen.\nDas Spiel ist stellenweise wirklich detailverliebt, vollgepackt mit Dingen, die einem erst nach vielen Stunden auffallen(gilt leider auch für Spielmechaniken), gleichzeitig laufen manchmal aber gefühlt nur 3 unterschiedlich gekleidete NPCs über die Karte\n\n[h3] Spielmechaniken und Spielqualtät 5/10 [/h3]\n\nDas Spiel bietet nach einiger Zeit in der Story immer wieder die Möglichkeit mit anderen Charakteren zu spielen. Das ist aber so schlecht umgesetzt, da diese immer wieder durch unsinnige Story Einschränkungen gesperrt sind etc., dass ich dann, als diese permanent freigeschaltet waren, so weit im Game vorangeschritten war, gar keine Lust mehr hatte diese zu testen bzw. oft auch einfach vergessen habe. \n\nOft hatte ich das Gefühl, Mechaniken wurden schnell implementiert, aber sind einfach nicht gut umgesetzt. Das beziehe ich sowohl auf die Spieleentwicklung und die clunky Steuerung durch den Spieler aber auch auf die Sinnhaftigkeit an manchen Stellen im Spiel. Generell hat mich die Fortbewegung (bei der zweifelsohne auch einige geniale Ansätze enthalten sind) auch oft an den rande der Verzweiflung gebracht, weil man wo hängenbleibt, etwas nicht erwischt etc. ( Ein großer Teil, das Handelssystem, war für mich beispielsweise unspielbar, da es furchtbar war den mit Waren beladenen Wagen über die Karte zu manövrieren. Dabei waren nicht nur die Steuerung, die schlecht gemachte Führung durch fehlendes Navi in der Minimap) sondern auch die schlichte Langeweile und Dauer dieser Quests eine Qual. Dabei haben sie eigentlich ein spannendes System eingeführt, das sogar schwankende Kurse etc. enthält. Wieder ein Beispiel dafür, wie detailliert die Entwickler stellenweise arbeiten, das Ergebnis aber einfach keine Spielfreude bereitet.\n\nWeitere Punkte sind bspw. das Inventar, das dauernd voll ist (teilweise durch nicht ablegbare Storyitems), Super teure Waffen Upgrades auf 100000 verschiedene Outfits, bei denen man sich nie traut etwas zu verbessern, da man ja immer etwas anderes finden könnte, die immergleichen oder viel zu schlecht erklärten Rätsel und Spielmechaniken - ich glaube ich musste noch nie so oft etwas Googlen, wie für dieses Spiel\n[hr][/hr]\n\n[h2] Fazit 4/10 [/h2]\nCrimson desert hinterlässt bei mir nach 186h Spielzeit ein fades Gefühl. Die Hauptstory abgeschlossen und einen Großteil der Karte aufgedeckt.\nEs catcht einen mit der Hoffnung auf Erlebnis und bindet einen durch kurzweilige Erkundung und Vielzahl an Aktivitäten, aber auch durch mühsamen Grind repetitiver Elemente - immer angetrieben durch die Hoffnung auf bessere Items, neue Erlebnisse und Entdeckungen.\nSchwache Story und nicht vorhandener Bezug zu Characteren schaffen bei mir keine wirklich bleibenden Erinnerungen an das Spiel. Es bleibt eher Frustration durch Ausbleiben dieser Erlebnisse und den aufgebauten Frust durch Grind, Steuerungsproblemen und fragwürdigen Entscheidungen der Entwickler in bestimmten Gameplaysituationen. \nzusammengefasst; zeitintensive Beschäftigungstherapie mit schöner Aussicht über neue Horizonte","c":1791840225,"u":0,"b":0,"r":0},{"i":"237581172","s":"76561199680099788","g":0,"n":1,"p":14335,"f":14335,"l":"english","t":"If you like exploring HUGE maps, this game is for you. Basically Fantasy GTA","c":1791839436,"u":1,"b":1,"r":0},{"i":"237573931","s":"76561198050088485","g":0,"n":5,"p":12827,"f":13615,"l":"spanish","t":"excelente juego","c":1791837218,"u":1,"b":1,"r":0},{"i":"237573576","s":"76561199496237254","g":0,"n":1,"p":7327,"f":7327,"l":"english","t":"Game of the Year,  sorry GTA.","c":1791836904,"u":1,"b":1,"r":0},{"i":"237573299","s":"76561198089198336","g":386,"n":19,"p":4707,"f":4831,"l":"english","t":"Brilliant world, lack of interesting characters, boring story. Wish steam had a neutral score.","c":1791836654,"u":1,"b":1,"r":0},{"i":"237573109","s":"76561198073824789","g":365,"n":24,"p":9690,"f":10266,"l":"russian","t":"Lyselia softlock dialogue after clear all 4 sanctuary","c":1791836479,"u":0,"b":0,"r":0},{"i":"237572192","s":"76561198343404993","g":118,"n":3,"p":3535,"f":3540,"l":"spanish","t":"El juego resulta bastante divertido y en ocasiones relajante por la cantidad de opciones de simulador de vida, pero esto cambia cuando decides continuar la historia principal y te encuentras con jefes principales, ahí el juego se torna en un dolor de cabeza pues los jefes son realmente injustos en algunas ocasiones por lo que tendrás que hacer un farmeo bastante exaustivo y mejorar bastante tu equipamiento, afortunadamente esto se realiza de una manera bastante divertida, en cuanto a optimización es realmente destacable, sólo me gustaría no depender de Ray Reconstruction para poder solucionar la imagen tan pixelada que se genera en la hierva o en las zonas iluminadas durante la noche","c":1791835662,"u":1,"b":0,"r":0},{"i":"237571002","s":"76561198031876231","g":0,"n":2,"p":8366,"f":8476,"l":"german","t":"Echte Überraschung wer The Witcher Reihe auf Speed möchte wird es lieben. Schöne Welt mit viel zu entdecken.","c":1791834663,"u":1,"b":1,"r":0},{"i":"237570576","s":"76561198126244850","g":2563,"n":31,"p":7640,"f":7981,"l":"spanish","t":"El mejor juego que he jugado en mucho tiempo. Increíble, brutal, lo mejor.","c":1791834317,"u":1,"b":0,"r":0},{"i":"237570077","s":"76561199232364047","g":0,"n":1,"p":1851,"f":2090,"l":"english","t":"a little slow with progression but i love everything else","c":1791833865,"u":1,"b":1,"r":0},{"i":"237566190","s":"76561198207052243","g":0,"n":8,"p":3873,"f":3880,"l":"english","t":"too many bugs and many unnecessary side missions that doesn't make any sense","c":1791830668,"u":0,"b":1,"r":0},{"i":"237566129","s":"76561198117920451","g":98,"n":7,"p":18917,"f":18917,"l":"english","t":"dragon go BRRRRRRRRRRRRRRRRRR","c":1791830614,"u":1,"b":1,"r":0},{"i":"237565730","s":"76561198002451456","g":0,"n":6,"p":17609,"f":18160,"l":"spanish","t":"Grandísimo juego.","c":1791830275,"u":1,"b":1,"r":0},{"i":"237563673","s":"76561198039388300","g":0,"n":2,"p":8849,"f":8970,"l":"brazilian","t":"ótimo jogo , único problema que TUDO que você vai fazer , você precisa procurar no youtube !!","c":1791828561,"u":1,"b":0,"r":0},{"i":"237563283","s":"76561198145642818","g":33,"n":5,"p":6948,"f":7226,"l":"spanish","t":"IMPRESIONANTE","c":1791828259,"u":1,"b":0,"r":0},{"i":"237562909","s":"76561198054091020","g":0,"n":11,"p":7623,"f":8267,"l":"brazilian","t":"Bão","c":179182794 zilian","t":"O jogo mais bonito de todos.\n\nAté o presente momento, não encontrei outro jogo com uma ambientação e direção de arte tão incríveis quanto o Crimson Desert. Máximo respeito a desenvolvedora por criar uma atmosfera tão brilhante quanto grandes nomes como: Red Dead e Zelda. \n\nEscrevo poucas palavras, por enquanto, devido o game me despertar um interesse enorme em explorar, fazia tempo que algo não me despertava a curiosidade e o interesse em procurar itens e desvendar mistérios.\n\nAfirmo que apenas o interesse foi o suficiente para justificar os 180 reais gastos na nuuvem. Portanto, considerando o dito, afirmo com todas as letras que o jogo é incrível e um dos melhores que ja joguei. Voltarei a analisar quando zerar e platinar (talvez rs).","c":1791818546,"u":1,"b":0,"r":0},{"i":"237549962","s":"76561198064610549","g":0,"n":1,"p":4728,"f":4728,"l":"koreana","t":"갓겜 메인 스토리만 빠르게 밀었는데 할게 아직 많다 해금 안된 템도 많아서 아직 할게 너무 많다 콘텐츠는 진짜 많은 거 같음","c":1791816863,"u":1,"b":1,"r":0},{"i":"237548971","s":"76561198836226675","g":0,"n":19,"p":563,"f":991,"l":"koreana","t":"GOAT!","c":1791816010,"u":1,"b":1,"r":0},{"i":"237547042","s":"76561199383097569","g":0,"n":6,"p":4102,"f":4990,"l":"latam","t":"LLEVO 60 HORAS Y TENGO QUE DECIR QUE ES UNA MALDITA OBRA MAESTRA  10/10","c":1791814302,"u":1,"b":0,"r":0},{"i":"237546751","s":"76561198957562669","g":219,"n":30,"p":4772,"f":5664,"l":"turkish","t":"Metacritic’e Aldanmayın, Oyuna Şans Verin!\n\nAslında oyunu 20. saatimdeyken incelemeyi planlıyordum; fakat oyunun sunduğu açık dünya çeşitliliği ve zenginliği yüzünden acele etmeyip ana hikayeyi bitirdikten sonra yazmaya karar verdim.\n\nOyuna 'hikayesi geri planda' diyenler var. İlk başlarda gerçekten öyle gelebilir hatta ben de başlardaki hikaye anlatımını sıkıcı bulmuştum. Ancak hikaye ilerledikçe tüm taşlar yerine oturuyor. Başlarda hissettiğim sıkıcılık ile ortalarından sonlarına doğru yaşadığım deneyim arasında uçurum fark vardı.\n\nAyrıca oyun sadece hikayeden ibaret değil; ejderha evcilleştirmekten tapınaklardaki simya bulmacalarına, açık dünyadaki irili ufaklı etkileşimlerden aksiyon dolu dövüş koreografilerine kadar açık dünyası hissettirmeden saatlerinizi alıyor.\n\nOptimizasyon tarafında ise RTX 4060 ve i5-14400F sistemimde gayet akıcı ve sorunsuz bir performans aldım. Sadece Ray Reconstruction ayarı açık değilken Su birikintisinde, yoğun ışık bulunan ortamlarda tek tük karıncalanma olayı yaşadım ekran kartımdan ötürü mü bilmiyorum ama. Onun dışında Sinematik ayarlarda 80-90 fps aldım.\n\nYaklaşık 80 saatlik deneyimime dayanarak söylüyorum; ön yargılarınızı ve Metacritic puanlarını bir kenara bırakın. Kesinlikle oynayın, oynattırın.","c":1791814034,"u":1,"b":0,"r":0},{"i":"237546486","s":"76561198219470507","g":558,"n":204,"p":41645,"f":42044,"l":"english","t":"I’d like to see a detailed character creation system. Just like the one in Black Desert Online.\n........................................................................................................................................................................................","c":1791813777,"u":1,"b":1,"r":0},{"i":"237546081","s":"76561198082299099","g":0,"n":5,"p":6926,"f":6926,"l":"italian","t":"AIUTO VI PREGO AIUTATEMI","c":1791813401,"u":1,"b":0,"r":0},{"i":"237545780","s":"76561199856830942","g":0,"n":2,"p":478,"f":479,"l":"english","t":"","c":1791813104,"u":1,"b":1,"r":0},{"i":"237545630","s":"76561198036492438","g":0,"n":5,"p":34306,"f":34306,"l":"english","t":"This game was an absolute masterpiece. It should be the standard by which all open world games should be judged. The story and characters were amazing. I choked up many times. It has every system you can imagine, but it is flexible enough that you can play it however you like to play. The gear was incredibly diverse and customizable. The mounts and pets were so much fun. The puzzles were satisfying. Every vista in the game was fantastic. I played with native 4k full ray traced lighting locked at 60fps, and there are zero loading screens. The fluid dynamics simulations are super interactive. I cannot recommend this game enough!","c":1791812964,"u":1,"b":0,"r":1},{"i":"237545611","s":"76561198266841107","g":104,"n":6,"p":344,"f":444,"l":"english","t":"DO NOT WASTE YOUR MONEY, THE GAME WILL NOT LAUNCH, I HAVE TRIED EVERYTHING COMPARED TO RELEASE THE GAME RAN FINE, AFTER MULTIPLE DRIVER UPDATES AND ROLL BACK REINSTALLS AND MULTIPLE FILE DELETES THE GAME DOESN'T MAKE IT PASSED THE LAUCH SCREEN","c":1791812952,"u":0,"b":1,"r":0},{"i":"237544478","s":"76561198292853117","g":0,"n":24,"p":1095,"f":1234,"l":"japanese","t":"ダイヤモンドの原石をそのまま出したようなゲーム\nまず説明が基本的にない。全部自分で確かめて行くしかない。\nあと操作感死ぬほど悪い。思った操作ができないことが多々起きる。\n色んな要素詰め込みすぎて余りにも全てがごちゃごちゃしてる。何かしらの要素消してもいいと思う。\nこれいる？って要素結構ある。世界観凄い混ざってる。\n全てのアイテム拾えるけどアイテムがありすぎて拾いたいアイテムが拾えないのがマジで多発する。\nストレス凄い、マジでモニター殴りかけたよ\n加点式で行くと150点はあるけど減点式で行くとー200点くらい。\n死ぬほど面白くもあり、死ぬほどゴミという意見が成立するゲームと思った。\nハマる人にはハマると思う。\nほかのゲームの名前出すのは申し訳ないけど TheWitcher3の下位互換。","c":1791811838,"u":1,"b":0,"r":0},{"i":"237543087","s":"76561198132954145","g":0,"n":7,"p":5100,"f":5100,"l":"english","t":"Good!","c":1791810425,"u":1,"b":1,"r":0},{"i":"237542059","s":"76561198103526543","g":68,"n":7,"p":7374,"f":7374,"l":"schinese","t":"适合不急躁之后没什么事情做的时候慢慢的去探索去解谜 目之所及皆可去很爽\r\n路人npc还是太僵硬 缺少活人感 三个主角也缺少互动和羁绊","c":1791809348,"u":1,"b":0,"r":0},{"i":"237541969","s":"76561198181087671","g":199,"n":17,"p":761,"f":761,"l":"schinese","t":"平时很少在 Steam 写评价，这游戏算是把我气活了。\n\n画面细节差得离谱，满屏大果粒，4K 分辨率都救不回来。光影调校更是一塌糊涂，不开光线重构就辣眼睛；低配 PC 扛不住光追，就只能看马赛克。剧情烂到极点，解谜全是谜语人级别，纯折磨。更新看似勤快，细看大多是在修 bug，只是把游戏从“没法玩”修成“勉强能玩”。\n\n总而言之，这是我近几年玩过最恶心、最不堪入目的游戏。","c":1791809243,"u":0,"b":0,"r":0},{"i":"237541561","s":"76561198206532308","g":0,"n":38,"p":421,"f":2203,"l":"english","t":"Crimson desert first impressions\n\n**Story**\nUnimpressed by the story so far, pretty high fantasy chosen one storyline, nothing too novel, coming from gothic one it kinda ticks me off how everyone is so eager to accommodate you without actually earning everything, everyone seems to be dying to give you ♥♥♥♥ for no reason and the main character is such goody two shoes is jarring ngl. At first i didnt really care about the graymanes since the game doesnt give you a reason to give a ♥♥♥♥ abou them but after getting the camp i am starting to warm up to them a little bit.\n\n**Combat**\nPretty easy ngl, i like it tho and it has a fair amount of moves, fluid and fun to do. Wish there was more AOE or magic stuff, loving the force palm\n**Puzzles**\nKinda garbage, never was one for puzzles and they seem a little out of place for this game. The movement does not have the fluidity and precision of a platformer for it to feel good doing the little air moving platforms, feels like id fall at any moment.\n\n**Dialogue**\nEveryone talks so…. Stiff, like unnatural idk how to explain it, like they're talking to an audience more than to myself, or just tryharding it too much idk, not feeling the dialogue at all.\n\n**Graphics**\nThis game is beautiful, I love the art direction, vibrant colors and landscapes they came up with, not much to complain about here.\n\n**Performance**\n\nPretty solid, especially for a new AAA game, no real complaints here, of course I wish it was better but my rig is getting a little old so I'll take what I can get.\n\n\nCPU | Intel Core i7-11700F\nGPU | NVIDIA GeForce RTX 3070 (8 GB VRAM)\nRAM | 32 GB DDR4 3200MHZ USING X.M.P\nMotherboard | Gigabyte B560 DS3H AC-Y1\n Operating System Windows 11 \nResolution  2560 × 1440 (1440p) \nI run the graphics on medium with FSR instead of dlss, i prefer the sharper image, dlss a little to smooth for my eyes\n\n**Crashing**\nThis game crashed a lot for me at the start, i did a bunch of recommended stuff and what ultimately fixed it was to regress to old nvidia drivers, now everything is smooth. \n\nDriver 610.88 from the Nvidia website. \n\nWould i recommend? yeah sure, its fun enough.\n","c":1791808782,"u":1,"b":1,"r":0},{"i":"237541348","s":"7656119800611410  you to gameplay mechanics, but I guess Pearl Abyss has done something with Crimson Desert Enhanced to make this awful part more bearable, as what I heard with people who played this much earlier than me.\n2. PLEASE USE A CONTROLLER WHEN PLAYING THIS. The combat and mechanics are just too awful and clunky, and apparently playing this with either an Xbox or a PS5 controller will alleviate some of those frustrations. Even so, with a controller, the combat feels clunky and I was seriously raging over some bosses and felt I had some skill issue when the main issue was that I'm too overwhelmed with how convoluted the combat system is, and that the awful camera panning isn't helping with the combat too. I had to lower down difficulty at some parts of the game, and even when lowering it it felt like the game is punishing me despite of my efforts because the mechanics and the camera panning is extremely awful.\n3. Playing with upscaling and FG might make things worse. I don't know if it's my graphics card or my system, but I experience some ghosting and artifacting sometimes. Reducing FG to x2 quite solved it but not completely.\n\nNow for the good things.\n1. Open world exploration is awesome. Like pure awesome. I personally like exploration in games and the way it is put in this game entices me a lot.\n2. I felt engaged with the plot. Although the earlier parts were a stretch, I gradually learned to love it. Hopefully it stays until the end.\n\nThis might change as time passes by, but so far this is what I feel about the game.","c":1791791002,"u":1,"b":1,"r":0},{"i":"237526907","s":"76561198110724682","g":0,"n":1,"p":4424,"f":4424,"l":"brazilian","t":"Crimson Desert tá simplesmente absurdo! Os gráficos são lindos, o combate é insano e o mundo aberto é cheio de detalhes. Dá pra ver o capricho em cada parte do jogo. É aquele tipo de jogo que você começa a jogar e perde a noção do tempo. Os caras realmente entregaram demais!","c":1791786696,"u":1,"b":0,"r":0},{"i":"237526678","s":"76561198092244087","g":0,"n":2,"p":1468,"f":1963,"l":"english","t":"its every game\r\n","c":1791786333,"u":1,"b":1,"r":0},{"i":"237526024","s":"76561198415678266","g":0,"n":2,"p":4028,"f":4028,"l":"spanish","t":"el gotyyyy del año","c":1791785234,"u":1,"b":0,"r":0},{"i":"237525861","s":"76561198286382131","g":0,"n":8,"p":9077,"f":9077,"l":"english","t":"Y","c":1791784996,"u":1,"b":1,"r":0},{"i":"237525402","s":"76561198431744754","g":0,"n":10,"p":6931,"f":7939,"l":"english","t":"Game of the year plzzz!","c":1791784223,"u":1,"b":1,"r":0},{"i":"237525121","s":"76561198338664340","g":9,"n":1,"p":4088,"f":4811,"l":"english","t":"just give it some time i am in 69 hours still half way through the chapter 4,\r\nthere is so much to do in the game. just give it some time \r\n","c":1791783786,"u":1,"b":1,"r":0},{"i":"237524096","s":"76561198336302684","g":0,"n":7,"p":5376,"f":5770,"l":"latam","t":"Tengo un poco mas  84 hr de juego y hasta ahora llevo solo 3 logros y voy en el capitulo 7, el juego es increiblemente largo y la cantidad de bosses es impresionante, un millar de armas, combinaciones de pelea, monturas, y ni hablar de las maquinas que porfin logre descubrir como craftear un robot que dispare rayos lazer, compratelo, vale cada centavo","c":1791782143,"u":1,"b":1,"r":0},{"i":"237523061","s":"76561198078290507","g":765,"n":218,"p":1976,"f":2063,"l":"english","t":"Highly Frustrating Game ,  Frustrating Gameplay , Frustrating Puzzle , Clunky Mechanic\nFull of bugs that stray me away from enjoying the game\n6 times the game bugged on me that forced me to reload an old save\nugly graphic shimmering even tho on ultra ,  basicly forcing you to use ray recontruct, which drops my frame like crazy\nThe story  is so bad, exploration and puzzle make you wanna pulls your hair\nIf you wanna A good Action adventure rpg open world , The Witcher 3 does it better,  A 2015 Game does it BETTER\nThis game is highly giving me frustrating experienced and time wasting consuming bug that doesnt let me enjoy it\nI rarely giving a bad reviews , but this is it \n5/10 final score","c":1791780535,"u":0,"b":1,"r":0},{"i":"237521979","s":"76561199573599357","g":0,"n":10,"p":5177,"f":6391,"l":"russian","t":"отличная игра","c":1791778934,"u":1,"b":1,"r":0},{"i":"237521844","s":"76561198218487809","g":0,"n":4,"p":235,"f":3660,"l":"french","t":"Excellent!!! Je le recommande vivement","c":1791778723,"u":1,"b":0,"r":0},{"i":"237521440","s":"76561199076734289","g":9,"n":1,"p":2619,"f":3268,"l":"latam","t":"cuando pensaba que nada me quitaria rr2 aparece este juegazo un tremendo mundo y una maravillosa aventura","c":1791778136,"u":1,"b":1,"r":0},{"i":"237520410","s":"76561198332653466","g":81,"n":10,"p":5662,"f":6460,"l":"brazilian","t":"Com exceção da historia, o jogo é perfeito em praticamente todos aspectos.","c":1791776607,"u":1,"b":1,"r":0},{"i":"237520165","s":"76561199388372222","g":8,"n":1,"p":27651,"f":30792,"l":"latam","t":"Me encanto","c":1791776263,"u":1,"b":0,"r":0},{"i":"237520069","s":"76561197967066304","g":0,"n":3,"p":8421,"f":8549,"l":"english","t":"It's literally one of the best games I've ever played. It's number 6 on my Top 10 list. It's GOTY 2026 - GTA6 being the only thing that could change that - and it has it's work cut out for it. You can go into any building, only some need keys. Some need special keys. Every NPC has their own schedule. Every NPC is of a certain class or station in life. There are different cultures and creeds of people scattered throughout the land. There are elves, dwarves, orcs, and dragons. There are entire societies of forest children, sentient machines, and witches. There are multiple schools of magic, and different forms of magi, sorcerers, and wizards. You yourself, the player, are a warrior of a clan of warriors, that dies and is brought back to life by a clandestine group of wizards and witches. Your very nature is what they're interested in - Kliff has a certain virtue of goodness and bravery that they need in order to defeat a new magical threat. This is the plot, and the world and graphics match such a setup. Buy it. Play it. Sell a kidney if you have to (you don't have to, it's like $60) just play it for the love of god and everything holy.","c":1791776116,"u":1,"b":0,"r":0},{"i":"237519679","s":"76561198987754713","g":0,"n":5,"p":3392,"f":3852,"l":"english","t":"If you like Skyrim and games like it where you go off on your own adventure in a massive detailed world, this game is basically Skyrim on steroids.\r\n\r\nPeople with no imagination, people expecting RDR2 quality story, people who want a linear experience, people without the gamer drive to learn and grow and immerse themselves into another world\r\n\r\nThis game is going to be mediocre at best for yall. I am not trying to insult anyone, Crimson Desert is just genuinely not the best for that kind of content. The story isn't bad but it's not historic, and you could take it mostly linearly, but it's not going to be game of the year or decade by those standards.\r\n\r\nFor everyone else who enjoyed games like Skyrim, sandbox games, this is a generational game that will be remembered historically.\r\n\r\nIt's absolutely amazing, right from the get-go for myself. No 40 hours needed to enjoy it from my perspective. \r\n\r\nI spent an hour alone fiddling with the controls and testing the basic combat to see what's up. I played for 56 hours and still did not even start the main quest at all yet (I really should go into that tavern...)\r\n\r\nEven though I recommend you should at least progress the main story a decent bit, I heard you get a ton of features like a house, Axiom, a green force punch? I knew of them online but wanted to see how much I could get away with by completely ignoring the main story completely like I did in Skyrim. \r\n\r\nI have grown with only basic combat to the point I could fight the entire horde of Demeniss soldiers (neighboring country) with difficulty (~7 to 10 soldiers at once is my limit with only the basic kit that not doing the main story AT ALL gives, fist is the best for fighting hordes so far in my experience, because it is fast enough that you can dodge away after a sprint-punch barrage that knocks the enemy into the crowd doing further damage, the range of the longsword doesn't matter if you run out of stamina and/or get stabbed 50x by 3 other dudes when you're swinging in the crowd). \r\n\r\nI traveled across the continent just to (successfully) get a shiny laser helmet I heard about online, and I didn't get instantly one-shot by the enemies there like I thought I would (although they did one-shot comboes and the such).\r\n\r\nBut by this point, I want to gain more storage space than my tent, and I heard the story progress gives me a house for MUCH more storage. \r\nSo I am starting my adventure in proper force, 56 hours, ~32 unique pets, 5 horses, and a completely full camp chest of only resources later.\r\n\r\nLet's have some fun","c":1791775592,"u":1,"b":1,"r":0},{"i":"237518956","s":"76561198178854413","g":154,"n":1,"p":6971,"f":7330,"l":"russian","t":"Respect","c":1791774631,"u":1,"b":1,"r":0},{"i":"237518001","s":"76561198146485382","g":0,"n":2,"p":5423,"f":7043,"l":"schinese","t":"我举一个实际的例子：山顶上一个叫格温克莱伯的boss\n\n这个boss，近战起手极快，必须出招之前就举盾，不然来不及，一定会挨打。boss的近战攻击一般打两下，有时打四下，打四下的时候，是先打两下再打两下，中间间隔极长，非常容易抓玩家闪避后摇，非常贱。距离远了就会召唤分身一起冲刺攻击，冲之前离玩家很远，冲完了也距离很远，你没有进攻机会，boss完全是无风险揍你，可以说只要boss一直出这招，你绝对打不赢。不仅如此，分身还会抓你闪避的后摇，而且本体冲刺能直接秒杀你，没有秒杀就会冰冻你，然后分身同样秒杀你\n\n同时还有小怪，复活后要重打小怪，小怪刷新的位置还不固定。你打boss的时候，四周好多小怪全都拿枪打你，打中就大硬直。你有没有突进手段，靠近小怪他就往后跑，然后boss在屏幕外边就开始蓄力冲锋了。然后即使你没锁定敌人，视角也一直往boss身上粘，同时你不打小怪小怪就一直干扰你，你打小怪小怪就跑，你又不好追，你想追小怪但视角一直往boss身上挪，你看不见boss她就冲过来秒杀你。你打死了全部小怪，然后你来时的路上会莫名其妙刷出更多小怪来揍你\n\n最后呢，复活后还要恶心你，因为复活后视角默认是盯着身后的，直接开始跑就会越跑越远，还得把视角挪回前边\n\n我完全认同，这个游戏确实有挺多做的好的地方，真的很了不起。但是这个战斗真的是太拉跨了，烂到足以拖垮所有优点，我真的无法推荐","c":1791773325,"u":0,"b":1,"r":0},{"i":"237517902","s":"76561198189349390","g":0,"n":48,"p":38,"f":38,"l":"english","t":"Crashing/freezing on the same early cut scene, plus shares data with advertising partners.","c":1791773185,"u":0,"b":1,"r":0},{"i":"237517133","s":"76561198313539537","g":140,"n":32,"p":699,"f":3327,"l":"schinese","t":"喜欢滑板鞋吗？这游戏的闪避唐完了。艾尔登法环真好玩。","c":1791772186,"u":0,"b":0,"r":0},{"i":"237517038","s":"76561199854679128","g":314,"n":19,"p":1240,"f":1240,"l":"english","t":"One of the most densely packed and insanely detailed open worlds I've ever seen in a game. The amount of things you can do is staggering but the game does not hold your hand, instead it wants you to find stuff on your own, which creates such a great sense of discovery and awe. The controls are not that hard once you get used to them, people who keep whining that the controls are too complicated might be genuinely retarded cause it ain't that hard. My biggest gripe with the game is that Kliff is such a dull, uninteresting character. But other than that I'm loving this game.","c":1791772050,"u":1,"b":1,"r":0},{"i":"237514761","s":"76561198741462054","g":0,"n":1,"p":37959,"f":38156,"l":"english","t":"the devs are the best to ever do it this is what the video game community can look like if other companies devs were anything close to pear abys.","c":1791769070,"u":1,"b":1,"r":0},{"i":"237514648","s":"76561198185611578","g":0,"n":20,"p":815,"f":977,"l":"english","t":"The game is absolutely beautiful and amazing. The enhanced edition made all the difference. There may be a slight learning curve, but once you gain you're footing, you're in for a very expansive and fun adventure. The graphics are stunning, the world feels alive. Since the update, the story flows and progresses much more smoothly and intuitively. the side quests are fun overall. My only suggestion would be to add more task based quests.","c":1791768939,"u":1,"b":1,"r":0},{"i":"237514169","s":"76561197960536542","g":290,"n":1,"p":2526,"f":3485,"l":"english","t":"Gorgeous game, much better narrative flow since the 2.0 major update.","c":1791768362,"u":1,"b":1,"r":0},{"i":"237514071","s":"76561198962636855","g":83,"n":12,"p":26618,"f":26618,"l":"english","t":"I love this game. Has its flaws, yes but at 450hrs deep I've not discovered everything. I need 500 more hours to be a 100 percent complete. Beautiful game, if i could only play 1 game for the rest of my life, this would be it. This is as close to perfect as a single player game can be. Simply AMAZING and worth every penny.","c":1791768232,"u":1,"b":1,"r":0},{"i":"237513737","s":"76561198887271653","g":0,"n":1,"p":634,"f":634,"l":"english","t":"I'm having fun playing the game so far","c":1791767832,"u":1,"b":1,"r":0},{"i":"237513153","s":"76561198071640147","g":301,"n":9,"p":6067,"f":6737,"l":"english","t":"I'm still in Hernand...  10/10","c":1791767000,"u":1,"b":1,"r":0},{"i":"237511652","s":"76561198339989947","g":112,"n":12,"p":6567,"f":6971,"l":"english","t":"sonion im only just now bouta leave deminnis LMFAO","c":1791765085,"u":1,"b":1,"r":0},{"i":"237510406","s":"76561198067749022","g":92,"n":2,"p":9328,"f":10427,"l":"turkish","t":"150 li saatlerdeyim halen yeni yeni şeyler çıkıyor. Bir oyun hiç mi yavaşlamaz arkadaş, oyun sonuna geldim halen skilinden, bineğine keyifli şeyler buluyorum. Bu değerli oyunu Türkçe çıkaran Pearl Abyss e de teşekkürü borç bilirim.\n\n\n\nSPOİLERRR ALERT\n\n\n\n\nMağarada ejderha yumurtasına denk gelince internetten araştırıp büyüttüm artık ejderham var lan bekle beni Pywelll. (Oyunun başlarında bunu edinebiliyor muyduk lan acaba? Acaip rahatlatırdı.)","c":1791763489,"u":1,"b":1,"r":0},{"i":"237510292","s":"76561199058693948","g":14,"n":2,"p":9455,"f":9483,"l":"spanish","t":"goty","c":1791763363,"u":1,"b":0,"r":0},{"i":"237510228","s":"76561198880649925","g":111,"n":14,"p":28262,"f":29102,"l":"brazilian","t":"— Estou pausando o jogo no exato momento em que enfrento o último chefe. Pela segunda vez. Digo-lhes que deve ser a PIOR boss battle de todas. Você joga um jogo divertido, repetitivo as vezes, mas divertido com possibilidades que vão até onde vai sua habi
